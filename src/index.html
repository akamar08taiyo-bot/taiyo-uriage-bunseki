const saveStorage = (key, data) => {

// アンマウント時とタブを閉じる直前には即時書き出して、待機中の変更を取りこぼさない。
function useDebouncedSave(key, value, onQuotaError) {
  const valRef = useRef(value);
  valRef.current = value;
  const cbRef = useRef(onQuotaError);
  cbRef.current = onQuotaError;
  const flush = useCallback(() => {
    if (!saveStorage(key, valRef.current) && cbRef.current) cbRef.current(QUOTA_MSG, 'error', 9000);
  }, [key]);
  // 入力が止まってから書く。値が変わるたびタイマーを張り直すだけで、ここでは保存しない
  useEffect(() => { const t = setTimeout(flush, 500); return () => clearTimeout(t); }, [value, flush]);
  // タブを閉じる直前とアンマウント時は、待機中の変更を取りこぼさないよう即時書き出す
  useEffect(() => {
    window.addEventListener('beforeunload', flush);
    return () => { window.removeEventListener('beforeunload', flush); flush(); };

}

const DEFAULT_SETTINGS = { redPct: -50, yellowPct: -25, bufferDays: 7, stockMonths: 1, alertMinBase: 3000, office: null, reps: [], tabLabels: {} };
const defaultMasters = () => ({
  customers: {}, catOverrides: {}, catRules: [], priceOverrides: {}, itemHandling: {},

const normalizeMasters = (m) => {
  if (!m || typeof m !== 'object') return defaultMasters();
  const obj = (v) => (v && typeof v === 'object' && !Array.isArray(v) ? v : {});
  // 扱いは「在庫品／受注発注」の2種類（旧「直送品」は受注発注へ統合。既存データの互換のため変換して残す）
  const HANDLING_VALUES = new Set(['stock', 'order']);
  const normHandlingValue = (v) => (v === 'direct' ? 'order' : v);
  const normItemHandling = (v) => {
    const src = obj(v), out = {};
    for (const prod in src) { const h = normHandlingValue(src[prod]); if (HANDLING_VALUES.has(h)) out[prod] = h; }
    return out;
  };
  // 商品→施設→扱い のネストしたマップを検証（不正値は落として安全なオブジェクトだけ残す）

      for (const fac in facMap) { const h = normHandlingValue(facMap[fac]); if (HANDLING_VALUES.has(h)) cleaned[fac] = h; }

/* ============================================================

============================================================ */
// 年は2桁(26/07/31)・4桁(2026/7/31)どちらの表記も許容する（販売管理システムの出力形式が変わることがあるため）
// 区切りは / - . 年月 を許容（販売管理システムが「2026.7.3」形式を出すことがある）
const DATE_RE = /^(\d{2,4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/;
// 実在する日付かを、年月日を生成して往復一致するかで判定する。
// 月1-12・日1-31の範囲確認だけでは 2026/2/31 や 2026/4/31、非うるう年の
// 2月29日を通してしまい、月次・年度集計の期間判定と並び順が汚染される。
const isRealDate = (y, mo, d) => {
  const probe = new Date(Date.UTC(y, mo - 1, d));
  return probe.getUTCFullYear() === y && probe.getUTCMonth() + 1 === mo && probe.getUTCDate() === d;
};
const _dateCache = new Map();
const parseDateStr = (s) => {
  const key = String(s ?? '');
  if (_dateCache.has(key)) return _dateCache.get(key);
  let v = null;
  // NFKC で全角数字・全角スラッシュ（２０２６／７／３）も受け付ける
  const m = DATE_RE.exec(key.normalize('NFKC').trim());
  if (m) {
    let y = +m[1];
    if (m[1].length === 2) y += (y <= 68 ? 2000 : 1900);   // 2桁年: 00-68→20xx, 69-99→19xx
    const mo = +m[2], d = +m[3];
    // 未来日の上限は「翌年まで」。2026→2062 のような打ち間違いを1行でも取り込むと、
    // その行が最新月と判定されて基準月が飛び、ダッシュボードの数字が軒並み¥0になる。
    const maxY = todayParts().y + 1;
    if (y >= 2000 && y <= maxY && mo >= 1 && mo <= 12 && d >= 1 && d <= 31 && isRealDate(y, mo, d)) {
      v = { y, mo, d, idx: y * 12 + mo - 1, sort: y * 10000 + mo * 100 + d };
    }
  }
  _dateCache.set(key, v);
  return v;
};
// 年度は4月始まり。その月が属する年度の「4月」の月インデックスを返す
const fiscalStartIdx = (idx) => {
  const y = Math.floor(idx / 12), mo = (idx % 12) + 1;
  return (mo >= 4 ? y : y - 1) * 12 + 3;
};
const idxKey = (idx) => Math.floor(idx / 12) + '/' + ((idx % 12) + 1);
const idxLabel = (idx) => Math.floor(idx / 12) + '年' + ((idx % 12) + 1) + '月';
const idxShort = (idx) => String(Math.floor(idx / 12)).slice(2) + '/' + ((idx % 12) + 1);
const todayParts = () => { const t = new Date(); return { y: t.getFullYear(), mo: t.getMonth() + 1, d: t.getDate() }; };
const todayLabel = () => { const t = todayParts(); return t.y + '年' + t.mo + '月' + t.d + '日'; };
const todayCompact = () => { const t = todayParts(); return '' + t.y + String(t.mo).padStart(2, '0') + String(t.d).padStart(2, '0'); };
const todayISO = () => { const t = todayParts(); return t.y + '-' + String(t.mo).padStart(2, '0') + '-' + String(t.d).padStart(2, '0'); };
const daysInMonthIdx = (idx) => new Date(Math.floor(idx / 12), (idx % 12) + 1, 0).getDate();
const dateLabel = (idx, d) => Math.floor(idx / 12) + '/' + ((idx % 12) + 1) + '/' + d;
// cutoff（{idx, d}）までに入る日付か。cutoff がなければ常に true
const withinCut = (d, cutoff) => !cutoff || d.idx < cutoff.idx || (d.idx === cutoff.idx && d.d <= cutoff.d);
// 増減率（％）。比較対象が0以下（実績なし・返品超過）のときは算出しない
const pctChange = (now, base) => (base > 0 ? Math.round((now - base) / base * 100) : null);
// 当期と前年同期の比較条件をそろえる。
// ・今日の月を含む期間は月途中。当期は取り込んだ最終売上日まで、前年も同じ月・同じ日までで比べる
//   （前年の月全体と比べると、まだ注文が来ていないだけの得意先が減少に見える）。
//   前年に同じ日がない（2/29）ときは前年の月末にそろえ、dayAdjusted で知らせる
// ・前年の期間が取込範囲（最初の売上日の月）より前なら prevCovered=false（前年データ未取得。0円とは区別する）
// ・opts.months（明細のある月の一覧）を渡すと、営業所全体で明細が1件もない月を取り込み漏れとみなす。
//   前年同期にそういう月があれば prevCovered=false（prevMissing に月を入れる）、当期にあれば curMissing に入れる
//   （取り込みは何度かに分けて行うため、途中の月だけ抜けることがある。抜けた月を0円として比べない）
// ・締まった期間なのに最終売上日が期間末より4日以上前なら short=true（取得不足の可能性）
function comparisonWindow(fromIdx, toIdx, latest, first, opts = {}) {
  if (!latest) return null;
  const today = opts.today || todayParts();
  const months = opts.months ? (opts.months instanceof Set ? opts.months : new Set(opts.months)) : null;
  const missingIn = (a, b) => { const out = []; if (months) for (let i = a; i <= b; i++) if (!months.has(i)) out.push(i); return out; };
  const inProgress = toIdx >= today.y * 12 + today.mo - 1;
  let curCut = null, prevCut = null, dayAdjusted = false;
  if (inProgress && latest.idx >= fromIdx && latest.idx <= toIdx) {
    curCut = { idx: latest.idx, d: latest.d };
    const pIdx = latest.idx - 12, pd = Math.min(latest.d, daysInMonthIdx(latest.idx - 12));
    dayAdjusted = pd !== latest.d;
    prevCut = { idx: pIdx, d: pd };
  }
  const curEnd = curCut || { idx: toIdx, d: daysInMonthIdx(toIdx) };
  const prevEnd = prevCut || { idx: toIdx - 12, d: daysInMonthIdx(toIdx - 12) };
  const toDate = (e) => new Date(Math.floor(e.idx / 12), e.idx % 12, e.d);
  const gapDays = Math.round((toDate(curEnd) - toDate(latest)) / 86400000);
  const prevBeforeData = !first || fromIdx - 12 < first.idx;
  const prevMissing = prevBeforeData ? [] : missingIn(fromIdx - 12, prevEnd.idx);
  return {
    inProgress, short: !inProgress && gapDays > 3, dayAdjusted, asOf: latest,
    curMissing: missingIn(fromIdx, Math.min(curEnd.idx, latest.idx)), prevMissing, prevBeforeData,
    cur: { from: fromIdx, to: toIdx, cutoff: curCut },
    prev: { from: fromIdx - 12, to: toIdx - 12, cutoff: prevCut },
    curRange: dateLabel(fromIdx, 1) + '〜' + dateLabel(curEnd.idx, curEnd.d),
    prevRange: dateLabel(fromIdx - 12, 1) + '〜' + dateLabel(prevEnd.idx, prevEnd.d),
    prevCovered: !prevBeforeData && prevMissing.length === 0,
  };
}
// 保存日時は new Date().toISOString()（UTC）で持っている。これを先頭10文字で切ると
// 日本時間の朝9時前が前日付で表示されてしまうため、ローカル日付に直してから表示する。
// （CSVの日付文字列と違い自分で作ったISO-8601なので new Date() で解釈して問題ない）
const stampToLocalDate = (iso) => {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso ?? '').slice(0, 10);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
};

// 全角数字・カンマ・円記号を許容して数値化。数値にならなければ null
// 返品(赤伝)のマイナス表記は会計系の出力で △1,200 / ▲1,200 / (1,200) もあり、
// これを弾くと返品行だけが「不正な行」として捨てられ売上が過大計上になる。
const toNum = (s) => {
  if (typeof s === 'number') return isFinite(s) ? s : null;
  if (s == null) return null;
  let t = String(s).normalize('NFKC').replace(/[,¥\s円]/g, '');
  if (t === '' || t === '-') return null;
  let neg = false;
  if (/^[△▲]/.test(t)) { neg = true; t = t.slice(1); }
  else if (/^\(.*\)$/.test(t)) { neg = true; t = t.slice(1, -1); }
  if (t === '') return null;
  const n = Number(t);
  if (!isFinite(n)) return null;
  return neg ? -Math.abs(n) : n;
};

/* ============================================================
   CSV / TSV パーサー（引用符・改行・"" エスケープ対応）
============================================================ */
function parseDelimited(text, delim) {
  const rows = [];
  let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === delim) { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); field = ''; rows.push(row); row = []; }
    else if (c === '\r') { if (text[i + 1] !== '\n') { row.push(field); field = ''; rows.push(row); row = []; } }
    else field += c;
  }
  if (field !== '' || row.length > 0) { row.push(field); rows.push(row); }
  return rows;
}

// 文字コード自動判別: UTF-8(fatal) を試し、失敗したら Shift-JIS
function decodeCsvBuffer(buf) {
  try { return { text: new TextDecoder('utf-8', { fatal: true }).decode(buf), encoding: 'UTF-8' }; }
  catch { return { text: new TextDecoder('shift_jis').decode(buf), encoding: 'Shift-JIS' }; }
}

/* 列名マッピング（位置は信用しない・列名で対応付け）。
   2番目の要素は候補名の配列 — 販売管理システムの出力で列名が変わることがあるため複数許容する */
const REQUIRED_COLS = [
  ['saleNo', ['売上番号', '伝票番号']], ['date', ['売上日', '伝票日付', '出荷日']], ['customer', ['お客様名', '得意先名', '顧客名']],
  ['product', ['商品名', '品名']], ['qty', ['数量', '出荷数量']], ['amount', ['金額', '売上金額']],
];
// 任意列が見つからないと 0 が入るだけで取込は成功してしまう（例: 粗利額が拾えないと
// 粗利率が全て0%になり、低粗利リストに全商品が並ぶ）。列名が変わっても拾えるよう
// 実際に出力されうる別名を広めに登録しておく。
const OPTIONAL_COLS = [
  ['gross', ['粗利額', '粗利金額', '粗利', '荒利額', '荒利金額']],
  ['unit', ['単位名', '単位']],
  ['price', ['単価', '販売単価', '売単価', '売上単価']],
  ['supplier', ['仕入先名', '仕入先', '仕入先名称']],
  ['cost', ['仕入単価', '仕入価格', '原価', '原価単価']],
  ['rep', ['担当者', '営業担当名', '営業担当', '担当']],
];
const colLabel = (names) => names[0];

// 明細行スキーマ: [売上番号, 売上日, お客様名, 商品名, 数量, 単位名, 単価, 金額, 粗利額, 仕入先名, 仕入単価, 売上時点の担当者]
// 粗利額・仕入単価は不明なら null（確認済みの0円と区別する）。売上時点の担当者は担当者列のあるCSVから取り込んだ明細だけが持つ
const rowKey = (a) => a[0] + '' + a[3] + '' + a[4] + '' + a[7];

// 同一キーの出現回数マップ。同じ売上番号内に正当な同一明細が複数ある場合があるため、
// 重複スキップは「保存済みの出現回数まで」に留める（再取込では全行スキップされる）
const rowKeyCounts = (rowsArr) => {
  const m = new Map();
  for (let i = 0; i < rowsArr.length; i++) {
    const k = rowKey(rowsArr[i]);
    m.set(k, (m.get(k) || 0) + 1);
  }
  return m;
};

// 取込の重複処理。保存済みの明細をキーごとに並べ、同じキーは「保存済みの出現回数まで」スキップする
// （同じ売上番号内に正当な同一明細が複数ある場合があるため）。スキップした明細に売上時点の担当者がなく、
// 今回のCSVにあれば担当者だけ補う（金額などは変えない）。同じCSVを何度取り込んでも売上は増えない。
function mergeImportRows(existing, parsed) {
  const idxByKey = new Map();
  existing.forEach((r, i) => { const k = rowKey(r); const a = idxByKey.get(k); if (a) a.push(i); else idxByKey.set(k, [i]); });
  const repFill = new Map();
  const added = [];
  let skipped = 0, addedTotal = 0, skippedTotal = 0;
  for (const pr of parsed) {
    const same = idxByKey.get(rowKey(pr.arr));
    if (same && same.length) {
      const j = same.shift();
      skipped++; skippedTotal += pr.arr[7];
      if (pr.rep && !existing[j][11]) repFill.set(j, pr.rep);
      continue;
    }
    added.push(pr.arr);
    addedTotal += pr.arr[7];
  }
  const base = repFill.size ? existing.map((r, i) => (repFill.has(i) ? [...r.slice(0, 11), repFill.get(i)] : r)) : existing;
  return { next: added.length ? [...base, ...added] : base, added, skipped, addedTotal, skippedTotal, repFilled: repFill.size };
}

function analyzeCsv(rawText, fileName, encoding) {
  const text = String(rawText || '').replace(/^﻿/, '');
  if (!text.trim()) return { fatal: 'データが空です' };
  const nl = text.indexOf('\n');
  const firstLine = nl < 0 ? text : text.slice(0, nl);
  const delim = firstLine.includes('\t') ? '\t' : ',';
  const grid = parseDelimited(text, delim);
  let hi = 0;
  while (hi < grid.length && grid[hi].every(c => String(c).trim() === '')) hi++;
  if (hi >= grid.length) return { fatal: 'データが空です' };
  const header = grid[hi].map(c => String(c).trim().replace(/^﻿/, ''));
  const col = {}, found = {};
  [...REQUIRED_COLS, ...OPTIONAL_COLS].forEach(([key, names]) => {
    let i = -1;
    for (let j = 0; j < names.length; j++) { i = header.indexOf(names[j]); if (i >= 0) break; }
    col[key] = i;
    found[key] = i >= 0;
  });
  const missing = REQUIRED_COLS.filter(([k]) => col[k] < 0).map(([, names]) => colLabel(names));
  if (missing.length) {
    return { fatal: '必須列が見つからないため取込を中止しました： ' + missing.join(' ／ '), header, missing };
  }
  const rowsParsed = [], badRows = [];
  let minD = null, maxD = null;
  // 照合用：取り込める行の金額合計と、読み飛ばす行のうち金額が読めたものの合計
  let fileTotal = 0, badTotal = 0, grossUnknown = 0, grossFromCost = 0;
  for (let i = hi + 1; i < grid.length; i++) {
    const g = grid[i];
    if (g.every(c => String(c).trim() === '')) continue;
    const line = i + 1;
    const cell = (k) => (col[k] >= 0 && col[k] < g.length ? String(g[col[k]]).trim() : '');
    const saleNo = cell('saleNo'), dateS = cell('date'), customer = cell('customer'), product = cell('product');
    const d = parseDateStr(dateS);
    const qty = toNum(cell('qty')), amount = toNum(cell('amount'));
    let reason = '';
    if (!saleNo) reason = '売上番号が空';
    else if (!d) reason = '売上日が不正（' + (dateS || '空') + '）';
    else if (!customer) reason = 'お客様名が空';
    else if (!product) reason = '商品名が空';
    else if (qty === null) reason = '数量が数値でない（' + cell('qty') + '）';
    else if (amount === null) reason = '金額が数値でない（' + cell('amount') + '）';
    if (reason) { badRows.push({ line, reason }); if (amount !== null) badTotal += amount; continue; }
    // 粗利は販売管理システムの粗利額（その明細の売上－売れた数量の原価）をそのまま使う。粗利額が空で
    // 仕入単価があれば 金額－仕入単価×数量 で求め、どちらもなければ不明（null）。不明を0円にすると
    // 粗利・粗利率が実際と違う数字になるため、確認済みの0円とは区別して持つ。
    const grossV = toNum(cell('gross')), costV = toNum(cell('cost'));
    let gross = grossV;
    if (gross === null) {
      if (costV !== null) { gross = Math.round((amount - costV * qty) * 100) / 100; grossFromCost++; }
      else grossUnknown++;
    }
    const rep = cell('rep');
    const arr = [saleNo, d.y + '/' + d.mo + '/' + d.d, customer, product, qty,
      cell('unit'), toNum(cell('price')) ?? 0, amount, gross,
      cell('supplier'), costV, rep];
    rowsParsed.push({ arr, rep, sort: d.sort });
    fileTotal += amount;
    if (!minD || d.sort < minD.sort) minD = d;
    if (!maxD || d.sort > maxD.sort) maxD = d;
  }
  return {
    fileName, encoding: encoding || '—', delim, header, col, found, rowsParsed, badRows,
    fileTotal, badTotal, grossUnknown, grossFromCost,
    period: minD ? minD.y + '/' + minD.mo + '/' + minD.d + ' 〜 ' + maxD.y + '/' + maxD.mo + '/' + maxD.d : '—',
  };
}

/* ============================================================
   施設 / 個人の自動判定
============================================================ */
// 強いキーワード: 含まれていたら確実に施設
const FACILITY_KEYWORDS_STRONG = [
  'ホーム', 'センター', 'センタ', '事業所', 'ステーション', 'デイ', 'ケア', 'クリニック',
  '病院', '医院', '診療所', '薬局', '薬店', '法人', '介護', '支援', 'サービス', 'ショート',
  'グループ', 'ハウス', '工務店', '株式会社', '有限会社', '合同会社', '(株)', '(有)',
  '福祉', '施設', '居宅', '包括', '保育', '幼稚', '学園', '学校', '大学', '協会', '組合',
  '訪問', 'リハビリ', 'ヘルパー', 'レジデンス', 'ヴィラ', 'プラザ', 'ライフ', 'クラブ',
  'ステイ', 'の里', 'の家', 'の郷', '商店', '商事', '興業', '産業', '建設', '営業所', '売店',
];
// 弱いキーワード: 施設らしいが人名にも現れうる一文字
const FACILITY_KEYWORDS_WEAK = ['苑', '園', '荘', '館', '会', '庵', '寮', '亭', '堂', '院', '店', '屋'];
const KANJI_NAME_RE = /^[一-龥々〆ヶ]{2,5}$/;
const HAS_KANJI_RE = /[一-龥々〆ヶ]/;

function classifyCustomerName(rawName) {
  const name = String(rawName || '').normalize('NFKC').trim();
  for (let i = 0; i < FACILITY_KEYWORDS_STRONG.length; i++) {
    if (name.includes(FACILITY_KEYWORDS_STRONG[i])) return { type: 'facility', uncertain: false };
  }
  const tokens = name.split(/\s+/).filter(Boolean);
  // 「姓 名」形の個人名は、実在の日本人の姓がほぼ必ず漢字を含む点で判定する。
  // 「あさがお 新田原」のようにひらがなだけの単語（施設の愛称に多い）+ 地名は姓名ではないため対象外。
  if (tokens.length === 2 && tokens[0].length <= 5 && tokens[1].length <= 6 &&
      HAS_KANJI_RE.test(tokens[0]) &&
      !FACILITY_KEYWORDS_WEAK.some(k => name.includes(k))) {
    return { type: 'person', uncertain: false };  // 「姓 名」形
  }
  for (let i = 0; i < FACILITY_KEYWORDS_WEAK.length; i++) {
    if (name.includes(FACILITY_KEYWORDS_WEAK[i])) {
      return { type: 'facility', uncertain: KANJI_NAME_RE.test(name) }; // 漢字だけの短い名前は要確認
    }
  }
  if (KANJI_NAME_RE.test(name)) return { type: 'person', uncertain: true };
  return { type: 'facility', uncertain: true };
}

// 「消耗品のみ」集計から除外する対象の判定。
// 地域包括支援センター経由の個人名（例:「築上町包括　水ノ江」）や、姓名のみの表記（例:「水ノ江」「熊本　千佳」）は
// 住宅改修など個人向け取引であることが多いため対象外とする。○○工務店・株式会社等の実事業者名は除外しない。
const PERSON_TOKEN_RE = /^[一-鿿゠-ヿー々〆ヶ]{1,6}$/;
function looksLikeIndividualRecipient(rawName) {
  const name = String(rawName || '').normalize('NFKC').trim();
  if (!name) return false;
  if (name.includes('包括')) return true;
  for (let i = 0; i < FACILITY_KEYWORDS_STRONG.length; i++) {
    if (FACILITY_KEYWORDS_STRONG[i] !== '包括' && name.includes(FACILITY_KEYWORDS_STRONG[i])) return false;
  }
  const tokens = name.split(/\s+/).filter(Boolean);
  if (tokens.length === 1) return PERSON_TOKEN_RE.test(tokens[0]);
  if (tokens.length === 2) return PERSON_TOKEN_RE.test(tokens[0]) && PERSON_TOKEN_RE.test(tokens[1]);
  return false;
}

// 依頼元（居宅介護支援事業所・地域包括支援センター）をお客様名から取り出す。
// 実データでは包括・居宅経由の個人が「築上町包括　水ノ江」のように「依頼元＋個人名」で登録されている。
// ・空白で区切られ、最後の語が人名らしければ（漢字・カタカナ6文字以内）それより前を依頼元にする
// ・空白がなければ「センター」「包括」などの区切りの言葉の後ろが人名らしいときに分ける（例：○○地域包括支援センター大場）
// ・依頼元の言葉を含まない名前（「水ノ江」「熊本　千佳」など）は依頼元なし
// overrides（masters.referralOverrides）に登録があればそれを優先する（'' は依頼元なし）
const REFERRAL_KWS = ['包括', '居宅', 'ケアプラン', 'ケアマネ', '介護支援', '支援センター', '支援事業所'];
const REFERRAL_SPLIT = ['支援センター', 'センター', '事業所', 'ケアプラン', 'ケアマネ', '包括', '居宅', 'オフィス', 'ステーション'];
function parseReferral(rawName, overrides) {
  const name = String(rawName || '').normalize('NFKC').replace(/\s+/g, ' ').trim();
  const isSourceWord = (t) => REFERRAL_KWS.some(k => t.includes(k)) || REFERRAL_SPLIT.some(k => t.includes(k));
  const auto = (() => {
    if (!REFERRAL_KWS.some(k => name.includes(k))) return { source: '', person: name };
    const tokens = name.split(' ');
    if (tokens.length >= 2) {
      // 依頼元の言葉を含む最後のかたまりまでが依頼元。その後ろがすべて人名らしければ個人名（「田中 花子」のように空白入りも可）
      let at = -1;
      tokens.forEach((t, i) => { if (isSourceWord(t)) at = i; });
      const rest = tokens.slice(at + 1);
      if (at >= 0 && rest.length && rest.every(t => PERSON_TOKEN_RE.test(t))) return { source: tokens.slice(0, at + 1).join(' '), person: rest.join(' ') };
      return { source: name, person: '' };
    }
    let cut = -1;
    for (const k of REFERRAL_SPLIT) { const i = name.lastIndexOf(k); if (i >= 0) cut = Math.max(cut, i + k.length); }
    if (cut > 0 && cut < name.length && PERSON_TOKEN_RE.test(name.slice(cut))) return { source: name.slice(0, cut), person: name.slice(cut) };
    return { source: name, person: '' };
  })();
  if (overrides && Object.prototype.hasOwnProperty.call(overrides, rawName)) {
    const src = String(overrides[rawName] || '').trim();
    return { source: src, person: auto.person || name, manual: true };
  }
  return { ...auto, manual: false };
}

/* ============================================================
   商品分類辞書（キーワード自動分類。手直し catOverrides が常に優先）
============================================================ */
const CATEGORY_NAMES = [

  // 衛生用品: 手指消毒・除菌・アルコール類・ハンドソープ（洗剤・清拭用品とは別に分離）
  // 「清拭・入浴」の"ソープ"より先に評価し、ハンドソープを確実に衛生用品として拾う
  ['衛生用品', ['ハンドスキッシュ', 'サンマルチ', '手指消毒', '手指消毒剤', '除菌', '消毒', 'アルコール', '抗菌', 'ウェットティッシュ', 'ウェットワイパー', '除菌シート', 'ケアマイルド', 'ハンドソープ']],

  ['台所用品', ['食器', 'スポンジ', 'たわし', 'アルミホイル', 'クッキングペーパー', 'まな板', '台所用品', 'キッチン用品', '保存容器']],
  ['ゴミ袋・ポリ袋', ['ゴミ袋', 'ポリ袋', 'レジ袋', '規格袋']],

  ['マット・モップ', ['マット', 'モップ', 'マイクロクロス']],
  ['リハビリ・福祉用具', ['杖', 'ステッキ', '手すり', 'スロープ', 'クッション', 'ポジショニング', 'リハビリ', '福祉', 'スプーン', '自助', '徘徊', 'センサー', '体位', '入れ歯', '補聴']],
];
// 「消耗品のみ」表示で除外する分類（住宅改修・器具本体・部材など、日々使い切る消耗品ではないもの）
const NON_CONSUMABLE_CATS = new Set(['住宅改修', '特定福祉用具', 'ベッド・車いす・歩行器', 'リハビリ・福祉用具', '部材']);
const _catCache = new Map();
function autoCategory(rawName) {
  if (_catCache.has(rawName)) return _catCache.get(rawName);
  const n = String(rawName || '').normalize('NFKC');
  let cat = 'その他';
  outer:
  for (let i = 0; i < CAT_RULES.length; i++) {
    const kws = CAT_RULES[i][1], excl = CAT_RULES[i][2];
    if (excl && excl.some(k => n.includes(k))) continue;
    for (let j = 0; j < kws.length; j++) {
      if (n.includes(kws[j])) { cat = CAT_RULES[i][0]; break outer; }
    }
  }
  _catCache.set(rawName, cat);
  return cat;
}
// 分類の決まり方: ①商品ごとの手直し ②ユーザーが登録したキーワード学習ルール ③内蔵辞書
function resolveCategory(name, catOverrides, catRules) {
  if (catOverrides && catOverrides[name]) return { cat: catOverrides[name], src: '手動' };
  if (catRules && catRules.length) {
    const n = String(name || '').normalize('NFKC');
    for (let i = 0; i < catRules.length; i++) {
      const r = catRules[i];
      if (r.kw && n.includes(String(r.kw).normalize('NFKC'))) return { cat: r.cat, src: '学習', kw: r.kw };
    }
  }
  return { cat: autoCategory(name), src: '自動' };
}
const categoryOf = (name, catOverrides, catRules) => resolveCategory(name, catOverrides, catRules).cat;

/* 商品の扱い分類は2種類のみ：在庫品（営業所で在庫を持つ）／受注発注（注文が来てから仕入れる・デフォルト） */
const HANDLING_TYPES = ['stock', 'order'];
const HANDLING_LABELS = { stock: '在庫品', order: '受注発注' };
const HANDLING_DEFAULT = 'order';
const handlingOf = (name, itemHandling) => itemHandling[name] || HANDLING_DEFAULT;

/* ============================================================
   集計エンジン: 明細を1パス走査して全画面用の索引を構築
============================================================ */
function buildAnalytics(rows, masters, baseSel) {
  const custs = masters.customers, catOv = masters.catOverrides, catRules = masters.catRules, st = masters.settings;

  // 顧客サマリー（rows が空でも設定画面で使う）
  let facCount = 0, perCount = 0, uncertain = 0, unassigned = 0;
  for (const n in custs) {
    const c = custs[n];
    if (c.type === 'facility') { facCount++; if (!c.rep) unassigned++; } else perCount++;
    if (c.uncertain) uncertain++;
  }
  const custStats = { facCount, perCount, uncertain, unassigned };

  // 月インデックス収集
  const monthSet = new Set();
  const monthRows = new Map(), monthCusts = new Map(), monthSales = new Map();
  let maxIdx = -1, latest = null, first = null;
  for (let i = 0; i < rows.length; i++) {
    const d = parseDateStr(rows[i][1]);
    if (d) {
      monthSet.add(d.idx); if (d.idx > maxIdx) maxIdx = d.idx;
      if (!latest || d.sort > latest.sort) latest = d;
      if (!first || d.sort < first.sort) first = d;
      monthRows.set(d.idx, (monthRows.get(d.idx) || 0) + 1);
      monthSales.set(d.idx, (monthSales.get(d.idx) || 0) + (+rows[i][7] || 0));
      let cs = monthCusts.get(d.idx);
      if (!cs) { cs = new Set(); monthCusts.set(d.idx, cs); }
      cs.add(rows[i][2]);
    }
  }
  const monthsAll = [...monthSet].sort((a, b) => a - b);
  if (monthsAll.length === 0) {
    return {
      empty: true, monthsAll: [], baseIdx: null, maxIdx: null, baseLabel: '', win: [], winShort: [], winKeys: [],
      totals: zeros12(), totalsGross: zeros12(), facilities: [], facByName: new Map(),
      products: [], prodByName: new Map(), categories: [],
      growth: [], dead: [], deadTotal: 0, lowMargin: [], lowMarginTotal: 0, reps: [], custStats, settings: st,
      fyLabel: '', fyRangeLabel: '', hasYoy: false, hasFyPrev: false,
      latestDate: null, firstDate: null, cmp: null, fyCmp: null, repsSale: [], repSaleRows: 0, others: null, thinLatest: null,
    };
  }
  // 一番新しい月の明細が、経過日数に比べて極端に少ないか（売上を月末にまとめて入力している、
  // 先の日付の伝票が1件だけ入っている、CSVが途中まで、など）。直前の最大12か月の行数の中央値に
  // 経過日数の割合をかけた目安の2割に届かなければ「明細わずか」とし、基準月を自動で選ぶときは前の月にする。
  // （明細がほとんどない月を最初に見せると、売上が急に減ったように見えるため）
  let thinLatest = null;
  if (monthsAll.length >= 4) {
    const prevCounts = monthsAll.slice(-13, -1).map(i => monthRows.get(i)).sort((a, b) => a - b);
    const median = prevCounts[Math.floor(prevCounts.length / 2)];
    const expected = median * latest.d / daysInMonthIdx(maxIdx);
    const n = monthRows.get(maxIdx);
    if (n < expected * 0.2) {
      thinLatest = { idx: maxIdx, rows: n, customers: monthCusts.get(maxIdx).size, sales: monthSales.get(maxIdx),
        expectedRows: Math.round(expected), medianRows: median, prevIdx: monthsAll[monthsAll.length - 2] };
    }
  }
  const autoBase = thinLatest ? thinLatest.prevIdx : maxIdx;
  const baseIdx = (baseSel != null && monthSet.has(baseSel)) ? baseSel : autoBase;
  // 基準月が月途中なら、前月・前年同月も同じ日までの明細で比べる（inCmp）
  const cmp = comparisonWindow(baseIdx, baseIdx, latest, first, { months: monthSet });
  const cutDay = cmp.cur.cutoff ? cmp.cur.cutoff.d : null;
  const inCmp = (d, monthIdx) => d.idx === monthIdx && (cutDay === null || d.d <= Math.min(cutDay, daysInMonthIdx(monthIdx)));
  const fyStart = fiscalStartIdx(baseIdx);
  // 前年度同期：前年度の4月〜前年同月の前月は全部、前年同月は同じ日まで
  const inFyPrev = (d) => (d.idx >= fyStart - 12 && d.idx < baseIdx - 12) || inCmp(d, baseIdx - 12);
  const gKnownOf = (r) => r[8] !== null && r[8] !== undefined && r[8] !== '';
  // 施設以外（個人など）の売上。担当別の合計をダッシュボードの売上と突き合わせるために持つ
  const others = { sales: 0, prev: 0, yoy: 0, fy: 0, fyPrev: 0 };
  // 売上時点の担当者（明細の12列目）での集計
  const repSaleMap = new Map();
  let repSaleRows = 0;
  const winStart = baseIdx - 11;
  const win = [];
  for (let i = 0; i < 12; i++) win.push(winStart + i);

  const facMap = new Map(), prodMap = new Map(), pairMap = new Map();
  const totals = zeros12(), totalsGross = zeros12();

  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    const name = r[2];
    const c = custs[name] || classifyCustomerName(name);
    const d = parseDateStr(r[1]);
    if (!d) continue;
    const qty = +r[4] || 0, amt = +r[7] || 0, gross = +r[8] || 0;
    const gKnown = gKnownOf(r);
    if (c.type !== 'facility') {                      // 集計対象は施設のみ（個人は除外）。合計の突き合わせ用に額だけ持つ
      if (d.idx === baseIdx) others.sales += amt;
      if (inCmp(d, baseIdx - 1)) others.prev += amt;
      if (inCmp(d, baseIdx - 12)) others.yoy += amt;
      if (d.idx >= fyStart && d.idx <= baseIdx) others.fy += amt;
      if (inFyPrev(d)) others.fyPrev += amt;
      continue;
    }

    let f = facMap.get(name);
    if (!f) {
      f = { name, rep: c.rep || '', repName: c.rep || '未設定', direct: !!c.direct,
            monthly: zeros12(), gross12: zeros12(), byMonth: new Map(), rows: [], pairs: [], returns3: 0, orderNos: new Set(),
            prevCmp: 0, yoyCmp: 0, yoyCmpGross: 0, fyPrevCmp: 0, guWin: 0, guBase: 0, guYoy: 0 };
      facMap.set(name, f);
    }
    f.rows.push(r);
    const price = +r[6] || 0, cost = +r[10] || 0;
    if (inCmp(d, baseIdx - 1)) f.prevCmp += amt;
    if (inCmp(d, baseIdx - 12)) { f.yoyCmp += amt; f.yoyCmpGross += gross; if (!gKnown) f.guYoy++; }
    if (inFyPrev(d)) f.fyPrevCmp += amt;
    if (!gKnown && d.idx === baseIdx) f.guBase++;
    if (r[11]) repSaleRows++;
    {
      const key = r[11] || '';
      let rs = repSaleMap.get(key);
      if (!rs) { rs = { rep: key || '担当不明（明細に担当者なし）', unknown: !key, facs: new Set(), sales: 0, prev: 0, yoy: 0, fy: 0, fyPrev: 0, gross: 0, gu: 0 }; repSaleMap.set(key, rs); }
      if (d.idx === baseIdx) { rs.sales += amt; rs.gross += gross; rs.facs.add(name); if (!gKnown) rs.gu++; }
      if (inCmp(d, baseIdx - 1)) rs.prev += amt;
      if (inCmp(d, baseIdx - 12)) rs.yoy += amt;
      if (d.idx >= fyStart && d.idx <= baseIdx) rs.fy += amt;
      if (inFyPrev(d)) rs.fyPrev += amt;
    }
    // 全期間の月別（CSV出力の期間選択で使う）
    const bm = f.byMonth.get(d.idx);
    if (bm) { bm.sales += amt; bm.gross += gross; if (!gKnown) bm.gu++; }
    else f.byMonth.set(d.idx, { sales: amt, gross, gu: gKnown ? 0 : 1 });

    const slot = d.idx - winStart;
    const inWin = slot >= 0 && slot <= 11;
    if (inWin) { f.monthly[slot] += amt; f.gross12[slot] += gross; totals[slot] += amt; totalsGross[slot] += gross; f.orderNos.add(r[0]); if (!gKnown) f.guWin++; }
    if (amt < 0 && d.idx >= baseIdx - 2) f.returns3++;

    const pname = r[3];
    let p = prodMap.get(pname);
    if (!p) {
      p = { name: pname, unit: '', unitSort: -1, units: new Set(), supplier: '', supSort: -1, cost: 0, costSort: -1,
            lastPrice: 0, lpSort: -1, momCmp: 0, guWin: 0, guBase: 0,
            qty12: zeros12(), qtyND12: zeros12(), sales12: zeros12(), gross12: zeros12(), lastSale: null, pairs: [] };
      prodMap.set(pname, p);
    }
    if (price > 0 && d.sort > p.lpSort) { p.lastPrice = price; p.lpSort = d.sort; }
    if (r[5] && d.sort > p.unitSort) { p.unit = r[5]; p.unitSort = d.sort; }
    if (r[9] && d.sort > p.supSort) { p.supplier = r[9]; p.supSort = d.sort; }
    if (cost > 0 && d.sort > p.costSort) { p.cost = cost; p.costSort = d.sort; }
    if (!p.lastSale || d.sort > p.lastSale.sort) p.lastSale = d;
    if (inCmp(d, baseIdx - 1)) p.momCmp += amt;
    if (inWin) {
      p.units.add(r[5] || '');
      if (!gKnown) { p.guWin++; if (slot === 11) p.guBase++; }
      p.qty12[slot] += qty; p.sales12[slot] += amt; p.gross12[slot] += gross;
      if (!f.direct) p.qtyND12[slot] += qty;
    }

    const pkey = name + '' + pname;
    let pair = pairMap.get(pkey);
    if (!pair) {
      pair = { fac: name, prod: pname, direct: f.direct, qty12: zeros12(), sales12: zeros12(), units: new Set(),
               lastDate: null, lastPrice: 0, priceSort: -1, unit: '', unitSort: -1, baseAmt: 0, baseGross: 0,
               lastQty: 0, lastAmt: 0, lastCostTotal: 0, guBase: 0,
               orders: [] };
      pairMap.set(pkey, pair);
      f.pairs.push(pair);
      p.pairs.push(pair);
    }
    if (inWin) {
      pair.units.add(r[5] || '');
      pair.qty12[slot] += qty; pair.sales12[slot] += amt;
      if (slot === 11) { pair.baseAmt += amt; pair.baseGross += gross; if (!gKnown) pair.guBase++; }
      pair.orders.push({ idx: d.idx, no: r[0] });
    }
    // 「最終売上」の実績（同日に複数明細があれば合算）。1回の取引としての数量・金額を
    // 12ヶ月累計とは別に見せるため、最終日と同じ日付の行だけを集計する。
    if (!pair.lastDate || d.sort > pair.lastDate.sort) {
      pair.lastDate = d; pair.lastQty = qty; pair.lastAmt = amt; pair.lastCostTotal = cost * qty;
    } else if (d.sort === pair.lastDate.sort) {
      pair.lastQty += qty; pair.lastAmt += amt; pair.lastCostTotal += cost * qty;
    }
    if (price > 0 && d.sort > pair.priceSort) { pair.lastPrice = price; pair.priceSort = d.sort; }
    if (r[5] && d.sort > pair.unitSort) { pair.unit = r[5]; pair.unitSort = d.sort; }
  }

  // 施設ごとの派生値。比較先の月が取込範囲より前なら「前年データ未取得」として null（0円とは区別）
  // 月の明細が1件もなければ取り込み漏れとみなして比べない（comparisonWindow と同じ考え方）
  const hasPrevMonth = baseIdx - 1 >= first.idx && monthSet.has(baseIdx - 1);
  const hasYoyMonth = cmp.prevCovered;
  const facilities = [...facMap.values()];
  for (const f of facilities) {
    f.winSum = sum12(f.monthly);
    f.avg = f.winSum / 12;
    const gsum = sum12(f.gross12);
    f.margin = f.winSum > 0 ? Math.round(gsum / f.winSum * 1000) / 10 : 0;
    f.last = f.monthly[11];
    f.prev3 = (f.monthly[8] + f.monthly[9] + f.monthly[10]) / 3;
    f.pct = f.prev3 > 0 ? Math.round((f.last - f.prev3) / f.prev3 * 100) : 0;
    f.ordersPerMonth = f.orderNos.size / 12;
    // 粗利額が不明な明細を含む施設は粗利率を出さない（marginOk=false）
    f.marginOk = f.winSum > 0 && f.guWin === 0;
    f.mom = hasPrevMonth ? pctChange(f.last, f.prevCmp) : null;
    f.yoyBase = hasYoyMonth ? f.yoyCmp : null;
    f.yoyDiff = hasYoyMonth ? f.last - f.yoyCmp : null;
    f.yoyPct = hasYoyMonth ? pctChange(f.last, f.yoyCmp) : null;
    f.yoyGrossDiff = hasYoyMonth && f.guBase === 0 && f.guYoy === 0 ? f.gross12[11] - f.yoyCmpGross : null;
  }

  // 商品 → 分類
  const products = [...prodMap.values()];
  for (const p of products) {
    const rc = resolveCategory(p.name, catOv, catRules);
    p.cat = rc.cat;
    p.catSrc = rc.src;
    p.winQty = sum12(p.qty12);
    p.winSales = sum12(p.sales12);
    p.mixedUnit = p.units.size > 1;
    p.winGross = sum12(p.gross12);
  }

  // 分類別サマリー
  const catAgg = new Map();
  for (const p of products) {
    let c = catAgg.get(p.cat);
    if (!c) { c = { name: p.cat, sales12: zeros12(), gross12: zeros12(), momCmp: 0, guBase: 0, items: [] }; catAgg.set(p.cat, c); }
    for (let i = 0; i < 12; i++) { c.sales12[i] += p.sales12[i]; c.gross12[i] += p.gross12[i]; }
    c.momCmp += p.momCmp; c.guBase += p.guBase;
    c.items.push(p);
  }
  const categories = [...catAgg.values()].map(c => {
    const s = c.sales12[11], g = c.gross12[11];
    const sales = totals[11];
    return {
      name: c.name, sales: s,
      // マイナス分類(返品が売上を上回った分類)を0%に潰すと、他分類は純額で割られたままなので
      // 構成比の合計が100%を超える。実態どおりマイナスで出す。
      share: sales > 0 ? Math.round(s / sales * 100) : 0,
      // 前月比（基準月が月途中なら前月も同じ日まで）。前月が0以下なら出さない
      mom: hasPrevMonth ? pctChange(s, c.momCmp) : null,
      margin: s !== 0 ? Math.round(g / s * 1000) / 10 : 0,
      marginOk: s > 0 && c.guBase === 0,   // 粗利額が不明な明細を含む分類は粗利率を出さない
      top: c.items.slice().sort((a, b) => b.winSales - a.winSales).slice(0, 6).map(p => p.name),
    };
    // 「その他」は売上に関係なく常に一番下に表示する
  }).sort((a, b) => (a.name === 'その他') - (b.name === 'その他') || b.sales - a.sales);

  // 売れ筋: 基準月数量 vs 直近3ヶ月平均の伸び率
  // 単位が混在する商品は数量を比べられないので対象外
  const growth = products.map(p => {
    if (p.units.size > 1) return null;
    const base = p.qty12[11], prev3 = (p.qty12[8] + p.qty12[9] + p.qty12[10]) / 3;
    if (!(prev3 > 0) || base <= 0) return null;
    const g = Math.round((base - prev3) / prev3 * 100);
    return g > 0 ? { product: p.name, category: p.cat, qty: base, unit: p.unit, growth: g } : null;
  }).filter(Boolean).sort((a, b) => b.growth - a.growth || b.qty - a.qty).slice(0, 5);

  // 死に筋: 過去に販売あり＆直近3ヶ月（基準月含む）ゼロ
  const deadAll = products
    .filter(p => p.lastSale && p.lastSale.idx <= baseIdx - 3)
    .sort((a, b) => b.lastSale.sort - a.lastSale.sort)
    .map(p => ({ product: p.name, category: p.cat, last: p.lastSale.y + '/' + p.lastSale.mo + '/' + p.lastSale.d }));

  // 粗利率チェック: 基準月の施設×商品で 15% 未満
  const lowAll = [];
  pairMap.forEach(pair => {
    if (pair.baseAmt <= 0 || pair.guBase > 0) return;   // 粗利額が不明な明細を含む組み合わせは判定しない
    const m = pair.baseGross / pair.baseAmt * 100;
    if (m >= 15) return;
    const q = pair.qty12[11];
    lowAll.push({
      facility: pair.fac, product: pair.prod,
      price: pair.lastPrice > 0 ? pair.lastPrice : (q > 0 ? pair.baseAmt / q : 0),
      margin: Math.round(m * 10) / 10,
    });
  });
  lowAll.sort((a, b) => a.margin - b.margin);

  // 担当別（前月比・前年同月差・今年度累計とその前年度同期差）。基準月が月途中なら比較先も同じ日まで
  // 前年度同期が丸ごと取り込まれているときだけ比較する（途中の月が抜けていても比べない）
  const fyCmp = comparisonWindow(fyStart, baseIdx, latest, first, { months: monthSet });
  const hasFyPrev = fyCmp.prevCovered;
  const repAgg = new Map();
  for (const f of facilities) {
    let r = repAgg.get(f.repName);
    if (!r) { r = { rep: f.repName, unknown: f.repName === '未設定', count: 0, sales: 0, prev: 0, yoy: 0, fy: 0, fyPrev: 0, avg: 0, gross: 0, gu: 0 }; repAgg.set(f.repName, r); }
    r.count++; r.avg += f.avg; r.gross += f.gross12[11]; r.gu += f.guBase;
    r.sales += f.monthly[11];
    r.prev += f.prevCmp;
    r.yoy += f.yoyCmp;
    for (let i = fyStart; i <= baseIdx; i++) { const m = f.byMonth.get(i); if (m) r.fy += m.sales; }
    r.fyPrev += f.fyPrevCmp;
  }
  const finishRep = (r) => ({
    ...r,
    rateOk: r.sales > 0 && r.gu === 0,
    rate: r.sales !== 0 ? (r.gross / r.sales * 100).toFixed(1) : '0.0',
    mom: hasPrevMonth ? pctChange(r.sales, r.prev) : null,
    yoyDiff: hasYoyMonth ? r.sales - r.yoy : null,
    yoyPct: hasYoyMonth ? pctChange(r.sales, r.yoy) : null,
    fyDiff: hasFyPrev ? r.fy - r.fyPrev : null,
    fyPct: hasFyPrev ? pctChange(r.fy, r.fyPrev) : null,
  });
  // 不明行（担当未設定・担当不明）は消さずに一番下へ
  const repOrder = (a, b) => (a.unknown - b.unknown) || b.sales - a.sales;
  const reps = [...repAgg.values()].map(finishRep).sort(repOrder);
  const repsSale = [...repSaleMap.values()].map(r => finishRep({ ...r, count: r.facs.size, avg: 0 })).sort(repOrder);
  const othersOut = finishRep({ ...others, gross: 0, gu: 0 });
  const fyLabel = Math.floor(fyStart / 12) + '年度';
  const fyRangeLabel = idxLabel(fyStart) + '〜' + idxLabel(baseIdx);

  return {
    empty: false, monthsAll, baseIdx, maxIdx, baseLabel: idxLabel(baseIdx),
    win, winShort: win.map(idxShort), winKeys: win.map(idxKey),
    totals, totalsGross, facilities, facByName: facMap,
    products, prodByName: prodMap, categories, growth,
    dead: deadAll.slice(0, 30), deadTotal: deadAll.length,
    lowMargin: lowAll.slice(0, 30), lowMarginTotal: lowAll.length,
    reps, repsSale, repSaleRows, others: othersOut, custStats, settings: st,
    fyLabel, fyRangeLabel, hasYoy: hasYoyMonth, hasFyPrev,
    latestDate: latest, firstDate: first, cmp, fyCmp, thinLatest,
  };
}

/* ============================================================
   任意期間のレポート集計（明細を範囲で走査。12ヶ月窓に依存しない）
============================================================ */
// cutoff（{idx, d}）を渡すと、その日までの明細だけを集計する（月途中の前年同期比較用）。
// 粗利は明細の粗利額の合計。粗利額が不明（null）の明細は grossUnknown に数え、0円としては足さない。
function buildPeriodReport(rows, masters, fromIdx, toIdx, consumableOnly, cutoff) {
  const custs = masters.customers, catOv = masters.catOverrides, catRules = masters.catRules;
  const facMap = new Map(), prodMap = new Map(), monMap = new Map(), custMap = new Map();
  let sales = 0, gross = 0, grossUnknown = 0, grossUnknownSales = 0;
  let returnAmt = 0, returnCount = 0, discountAmt = 0, discountCount = 0;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    const name = r[2];
    const c = custs[name] || classifyCustomerName(name);
    const d = parseDateStr(r[1]);
    if (!d || d.idx < fromIdx || d.idx > toIdx || !withinCut(d, cutoff)) continue;
    const pn = r[3];
    const cat = categoryOf(pn, catOv, catRules);
    // 正確な売上把握のため施設・個人・事業者を問わず集計する。
    // 「消耗品のみ」表示のときだけ、消耗品以外の分類と、個人受給者向けとみられる売上を除外する。
    if (consumableOnly && (NON_CONSUMABLE_CATS.has(cat) || looksLikeIndividualRecipient(name))) continue;
    const amt = +r[7] || 0, qty = +r[4] || 0;
    const gKnown = r[8] !== null && r[8] !== undefined && r[8] !== '';
    const g = gKnown ? (+r[8] || 0) : 0;
    sales += amt; gross += g;
    if (!gKnown) { grossUnknown++; grossUnknownSales += amt; }
    // 区分列がないため符号で分ける：数量マイナス＝返品、数量0以上で金額マイナス＝値引き等
    if (amt < 0) { if (qty < 0) { returnAmt += amt; returnCount++; } else { discountAmt += amt; discountCount++; } }

    let cu = custMap.get(name);
    if (!cu) { cu = { name, type: c.type, sales: 0, gross: 0 }; custMap.set(name, cu); }
    cu.sales += amt; cu.gross += g;

    // 施設別ランキング等が個人客で長くならないよう、施設のみに限定する
    if (c.type === 'facility') {
      let f = facMap.get(name);
      if (!f) { f = { name, repName: c.rep || '未設定', sales: 0, gross: 0, grossUnknown: 0, months: new Set() }; facMap.set(name, f); }
      f.sales += amt; f.gross += g; f.months.add(d.idx);
      if (!gKnown) f.grossUnknown++;
    }

    let p = prodMap.get(pn);
    if (!p) { p = { name: pn, cat, unit: r[5] || '', unitSort: -1, units: new Set(), qty: 0, sales: 0, gross: 0, grossUnknown: 0 }; prodMap.set(pn, p); }
    if (r[5] && d.sort > p.unitSort) { p.unit = r[5]; p.unitSort = d.sort; }
    p.units.add(r[5] || '');
    p.qty += qty; p.sales += amt; p.gross += g;
    if (!gKnown) p.grossUnknown++;

    let mo = monMap.get(d.idx);
    if (!mo) { mo = { idx: d.idx, sales: 0, gross: 0, grossUnknown: 0, facs: new Set() }; monMap.set(d.idx, mo); }
    mo.sales += amt; mo.gross += g; mo.facs.add(name);
    if (!gKnown) mo.grossUnknown++;
  }
  const rate = (g2, s2) => (s2 !== 0 ? Math.round(g2 / s2 * 1000) / 10 : 0);
  const catAgg = new Map();
  prodMap.forEach(p => {
    let c = catAgg.get(p.cat);
    if (!c) { c = { name: p.cat, sales: 0, gross: 0, grossUnknown: 0 }; catAgg.set(p.cat, c); }
    c.sales += p.sales; c.gross += p.gross; c.grossUnknown += p.grossUnknown;
  });
  const monthly = [...monMap.values()].sort((a, b) => a.idx - b.idx)
    .map(m => ({ idx: m.idx, label: idxLabel(m.idx), sales: m.sales, gross: m.gross, grossUnknown: m.grossUnknown, rate: rate(m.gross, m.sales), count: m.facs.size }));
  // 月平均は「売上のあった月数」ではなく「対象期間の月数」で割る。
  // 前者だと、期間内に売上ゼロの月があるとその月が分母から抜けて平均が過大になり、
  // 見出しの期間（例: 4月〜8月の5ヶ月）と計算が食い違う。
  const nMonths = Math.max(1, toIdx - fromIdx + 1);
  const customers = [...custMap.values()];
  const buyers = customers.filter(c => c.sales > 0);
  // 単位が2種類以上ある商品（ケースと袋など）は数量を合計しない（mixedUnit）
  const prodOut = (p) => ({ name: p.name, cat: p.cat, qty: p.qty, unit: p.unit, units: [...p.units], mixedUnit: p.units.size > 1,
    sales: p.sales, gross: p.gross, grossUnknown: p.grossUnknown, margin: rate(p.gross, p.sales) });
  return {
    kpi: {
      sales, gross, rate: rate(gross, sales).toFixed(1), count: facMap.size, months: monthly.length,
      grossUnknown, grossUnknownSales,
      // 粗利率は売上が正で、粗利額の不明な明細がないときだけ出す
      rateOk: sales > 0 && grossUnknown === 0,
      buyers: buyers.length, buyersFacility: buyers.filter(c => c.type === 'facility').length,
      returnAmt, returnCount, discountAmt, discountCount,
    },
    monthly,
    customers,
    categories: [...catAgg.values()].sort((a, b) => (a.name === 'その他') - (b.name === 'その他') || b.sales - a.sales)
      // 上と同じ理由でマイナスを潰さない（潰すと印刷帳票の構成比が合計100%を超える）
      .map(c => ({ name: c.name, sales: c.sales, share: sales > 0 ? Math.round(c.sales / sales * 100) : 0, margin: rate(c.gross, c.sales), grossUnknown: c.grossUnknown })),
    topProducts: [...prodMap.values()].filter(p => p.sales > 0).sort((a, b) => b.sales - a.sales).slice(0, 10).map(prodOut),
    topProductsGross: [...prodMap.values()].filter(p => p.gross > 0).sort((a, b) => b.gross - a.gross).slice(0, 10).map(prodOut),
    ranking: [...facMap.values()].sort((a, b) => b.sales - a.sales)
      .map(f => ({ name: f.name, repName: f.repName, sales: f.sales, gross: f.gross, grossUnknown: f.grossUnknown, avg: f.sales / nMonths, margin: rate(f.gross, f.sales) })),
  };
}

// 前年同期との売上差を、数量・価格・商品の入れ替わり・返品等に分ける（同じ得意先の明細どうしで使う）。
// ・比較の単位は「商品名＋単位」。同じ商品でも単位が違えば別物として扱い、数量・単価を混ぜない
// ・金額がマイナスの明細（返品・値引き等）は「返品・値引き等」にまとめ、数量・価格には配分しない
// ・両期間に販売がある商品：数量分＝(当期数量－前年数量)×前年平均単価、
//   価格分＝その商品の売上差－数量分＝(当期平均単価－前年平均単価)×当期数量（交差項は価格分に含める）
// ・当期だけ／前年だけの商品は「前年同期になかった商品」「当期に販売のない商品」
// ・どちらかの期間の数量が0以下で単価が出せない商品は「比較できない明細」
// 各区分の合計は売上差額と一致する（check=true）。一致しなければ計算の誤りとして画面に出す
function decomposeSalesChange(curRows, prevRows) {
  const agg = (list) => {
    const m = new Map();
    let adj = 0, total = 0;
    for (const r of list) {
      const amt = +r[7] || 0, qty = +r[4] || 0;
      total += amt;
      if (amt < 0) { adj += amt; continue; }
      const key = r[3] + '\u0001' + (r[5] || '');
      let e = m.get(key);
      if (!e) { e = { name: r[3], unit: r[5] || '', qty: 0, sales: 0 }; m.set(key, e); }
      e.qty += qty; e.sales += amt;
    }
    return { m, adj, total };
  };
  const c = agg(curRows), p = agg(prevRows);
  let volume = 0, price = 0, added = 0, ended = 0, other = 0;
  const items = [];
  for (const key of new Set([...c.m.keys(), ...p.m.keys()])) {
    const a = c.m.get(key), b = p.m.get(key);
    const base = a || b;
    const it = { name: base.name, unit: base.unit, cur: a ? a.sales : 0, prev: b ? b.sales : 0, q1: a ? a.qty : 0, q0: b ? b.qty : 0 };
    it.diff = it.cur - it.prev;
    if (a && b && a.qty > 0 && b.qty > 0) {
      it.kind = 'both';
      it.volume = (a.qty - b.qty) * (b.sales / b.qty);
      it.price = it.diff - it.volume;
      volume += it.volume; price += it.price;
    } else if (a && !b) { it.kind = 'new'; added += it.diff; }
    else if (!a && b) { it.kind = 'ended'; ended += it.diff; }
    else { it.kind = 'other'; other += it.diff; }
    items.push(it);
  }
  const adj = c.adj - p.adj, diff = c.total - p.total;
  return {
    cur: c.total, prev: p.total, diff, volume, price, added, ended, adj, other,
    check: Math.abs(diff - (volume + price + added + ended + adj + other)) < 0.5,
    items: items.sort((x, y) => Math.abs(y.diff) - Math.abs(x.diff)),
  };
}

// 住宅改修・特定福祉用具販売の集計（明細を期間で走査）。
// ・住宅改修＝分類「住宅改修」「部材」の明細と、住宅改修（工事・改修）と同じ伝票に載った「リハビリ・福祉用具」（手すりなど）
// ・特定福祉用具＝分類「特定福祉用具」の明細
// ・scope 'person'：個人（依頼元経由を含む）だけ。依頼元が取り出せたお客様と、施設/個人判定が個人のお客様
//   scope 'all'：施設を含むすべてのお客様
// ・件数＝期間内に購入があったお客様の数（同じお客様の複数の伝票は1件）。伝票数は slips
// ・opts.months（明細が1行でもある月）を渡すと、明細のない月に noData を付ける（0円と取り込み漏れを区別するため）
const REFORM_KINDS = [['reform', '住宅改修'], ['welfare', '特定福祉用具']];
function buildReformReport(rows, masters, fromIdx, toIdx, scope, opts = {}) {
  const custs = masters.customers, catOv = masters.catOverrides, catRules = masters.catRules, refOv = masters.referralOverrides || {};
  const inRange = [];
  const reformSlips = new Set();
  for (const r of rows) {
    const d = parseDateStr(r[1]);
    if (!d || d.idx < fromIdx || d.idx > toIdx) continue;
    const cat = categoryOf(r[3], catOv, catRules);
    inRange.push({ r, d, cat });
    if (cat === '住宅改修') reformSlips.add(r[0] + '\u0001' + r[2]);
  }
  const parseCache = new Map();
  const refOf = (name) => { if (!parseCache.has(name)) parseCache.set(name, parseReferral(name, refOv)); return parseCache.get(name); };
  const zero = () => ({ reform: 0, welfare: 0 });
  const kpi = { reform: { sales: 0, gross: 0, gu: 0, cust: new Set(), slips: new Set() }, welfare: { sales: 0, gross: 0, gu: 0, cust: new Set(), slips: new Set() } };
  const monMap = new Map(), srcMap = new Map(), custMap = new Map(), prodMap = new Map();
  for (const { r, d, cat } of inRange) {
    const kind = (cat === '住宅改修' || cat === '部材' || (cat === 'リハビリ・福祉用具' && reformSlips.has(r[0] + '\u0001' + r[2]))) ? 'reform'
      : cat === '特定福祉用具' ? 'welfare' : null;
    if (!kind) continue;
    const name = r[2];
    const ref = refOf(name);
    const c = custs[name] || classifyCustomerName(name);
    const personal = !!ref.source || c.type === 'person';
    if (scope === 'person' && !personal) continue;
    const amt = +r[7] || 0, qty = +r[4] || 0;
    const gKnown = r[8] !== null && r[8] !== undefined && r[8] !== '';
    const k = kpi[kind];
    k.sales += amt; k.gross += gKnown ? (+r[8] || 0) : 0; if (!gKnown) k.gu++;
    k.cust.add(name); k.slips.add(r[0]);
    let mo = monMap.get(d.idx);
    if (!mo) { mo = { ...zero(), cust: { reform: new Set(), welfare: new Set() } }; monMap.set(d.idx, mo); }
    mo[kind] += amt; mo.cust[kind].add(name);
    const srcKey = ref.source || '';
    let sg = srcMap.get(srcKey);
    if (!sg) { sg = { source: srcKey, none: !srcKey, ...zero(), sales: 0, cust: new Map(), slips: new Set() }; srcMap.set(srcKey, sg); }
    sg[kind] += amt; sg.sales += amt; sg.slips.add(r[0]);
    let cu = custMap.get(name);
    if (!cu) { cu = { name, source: srcKey, person: ref.person || name, manual: ref.manual, personal, ...zero(), sales: 0, slips: new Set(), last: null, products: new Map() }; custMap.set(name, cu); }
    cu[kind] += amt; cu.sales += amt; cu.slips.add(r[0]);
    if (!cu.last || d.sort > cu.last.sort) cu.last = d;
    cu.products.set(r[3], (cu.products.get(r[3]) || 0) + amt);
    sg.cust.set(name, cu);
    let pr = prodMap.get(r[3]);
    if (!pr) { pr = { name: r[3], kind, cat, sales: 0, qty: 0, units: new Set(), cust: new Set() }; prodMap.set(r[3], pr); }
    pr.sales += amt; pr.qty += qty; pr.units.add(r[5] || ''); pr.cust.add(name);
  }
  const haveMonths = opts.months ? new Set(opts.months) : null;
  const months = [];
  for (let i = fromIdx; i <= toIdx; i++) {
    const m = monMap.get(i);
    months.push({ idx: i, reform: m ? m.reform : 0, welfare: m ? m.welfare : 0,
      reformCases: m ? m.cust.reform.size : 0, welfareCases: m ? m.cust.welfare.size : 0,
      noData: haveMonths ? !haveMonths.has(i) : false });
  }
  const custOut = (cu) => ({ ...cu, slips: cu.slips.size, cases: 1,
    topProducts: [...cu.products.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3).map(x => x[0]) });
  const sources = [...srcMap.values()].map(sg => {
    const list = [...sg.cust.values()].map(custOut).sort((a, b) => b.sales - a.sales);
    return { source: sg.source, none: sg.none, reform: sg.reform, welfare: sg.welfare, sales: sg.sales, slips: sg.slips.size,
      cases: list.length, reformCases: list.filter(x => x.reform !== 0).length, welfareCases: list.filter(x => x.welfare !== 0).length, customers: list };
  });
  const total = kpi.reform.sales + kpi.welfare.sales;
  const kOut = (k) => ({ sales: k.sales, gross: k.gross, grossUnknown: k.gu, cases: k.cust.size, slips: k.slips.size });
  return {
    kpi: { reform: kOut(kpi.reform), welfare: kOut(kpi.welfare), total,
      cases: custMap.size, sources: sources.filter(x => !x.none).length,
      viaReferral: sources.filter(x => !x.none).reduce((t, x) => t + x.sales, 0) },
    months, sources,
    customers: [...custMap.values()].map(custOut).sort((a, b) => b.sales - a.sales),
    products: [...prodMap.values()].map(p => ({ name: p.name, kind: p.kind, cat: p.cat, sales: p.sales, qty: p.qty,
      units: [...p.units], mixedUnit: p.units.size > 1, cases: p.cust.size })).sort((a, b) => b.sales - a.sales),
  };
}

/* 帳票の発行元ブロック（会社名→営業所→住所→TEL/FAX→担当）*/
function officeBlockHtml(office, repName) {
  const o = officeByName(office);
  return `<div style="margin-top:3mm;border:1px solid #93c5fd;background:#f0f7ff;padding:2.5mm;">
    <div style="font-weight:bold;color:#1e3a8a;font-size:9.5pt;">太陽シルバーサービス株式会社</div>
    <div style="font-weight:bold;">${escapeHTML(o ? o.name : '営業本部')}</div>
    ${o ? `<div style="margin-top:0.5mm;">〒${escapeHTML(o.zip)}</div>
    <div>${escapeHTML(o.addr)}</div>
    <div style="margin-top:1mm;" class="editable" contenteditable="true">TEL：${escapeHTML(o.tel)}</div>
    <div class="editable" contenteditable="true">FAX：${escapeHTML(o.fax)}</div>` : `<div style="margin-top:1mm;" class="editable" contenteditable="true">TEL：　　　　　</div><div class="editable" contenteditable="true">FAX：　　　　　</div>`}
