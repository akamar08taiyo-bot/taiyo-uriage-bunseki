// 年は2桁(26/07/31)・4桁(2026/7/31)どちらの表記も許容する（販売管理システムの出力形式が変わることがあるため）
const DATE_RE = /^(\d{2,4})[\/\-年](\d{1,2})[\/\-月](\d{1,2})/;
const _dateCache = new Map();
const parseDateStr = (s) => {
  const key = String(s ?? '');
  if (_dateCache.has(key)) return _dateCache.get(key);
  let v = null;
  const m = DATE_RE.exec(key.trim());
  if (m) {
    let y = +m[1];
    if (m[1].length === 2) y += (y <= 68 ? 2000 : 1900);   // 2桁年: 00-68→20xx, 69-99→19xx
    const mo = +m[2], d = +m[3];
    if (y >= 2000 && y <= 2100 && mo >= 1 && mo <= 12 && d >= 1 && d <= 31) {
      v = { y, mo, d, idx: y * 12 + mo - 1, sort: y * 10000 + mo * 100 + d };
    }
  }
  _dateCache.set(key, v);
  return v;
};
// 年度は4月始まり。その月が属する年度の「4月」の月インデックスを返す
const fiscalStartIdx = (idx) => {
  const y = Math.floor(idx / 12), mo = (idx % 12) + 1;
  return (mo >= 4 ? y : y - 1) * 12 + 3;
};
const idxKey = (idx) => Math.floor(idx / 12) + '/' + ((idx % 12) + 1);
const idxLabel = (idx) => Math.floor(idx / 12) + '年' + ((idx % 12) + 1) + '月';
const idxShort = (idx) => String(Math.floor(idx / 12)).slice(2) + '/' + ((idx % 12) + 1);
const todayParts = () => { const t = new Date(); return { y: t.getFullYear(), mo: t.getMonth() + 1, d: t.getDate() }; };
const todayLabel = () => { const t = todayParts(); return t.y + '年' + t.mo + '月' + t.d + '日'; };
const todayCompact = () => { const t = todayParts(); return '' + t.y + String(t.mo).padStart(2, '0') + String(t.d).padStart(2, '0'); };
const todayISO = () => { const t = todayParts(); return t.y + '-' + String(t.mo).padStart(2, '0') + '-' + String(t.d).padStart(2, '0'); };

// 全角数字・カンマ・円記号を許容して数値化。数値にならなければ null
const toNum = (s) => {
  if (typeof s === 'number') return isFinite(s) ? s : null;
  if (s == null) return null;
  const t = String(s).normalize('NFKC').replace(/[,¥\s円]/g, '');
  if (t === '' || t === '-') return null;
  const n = Number(t);
  return isFinite(n) ? n : null;
};

/* ============================================================
   CSV / TSV パーサー（引用符・改行・"" エスケープ対応）
============================================================ */
function parseDelimited(text, delim) {
  const rows = [];
  let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === delim) { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); field = ''; rows.push(row); row = []; }
    else if (c === '\r') { if (text[i + 1] !== '\n') { row.push(field); field = ''; rows.push(row); row = []; } }
    else field += c;
  }
  if (field !== '' || row.length > 0) { row.push(field); rows.push(row); }
  return rows;
}

// 文字コード自動判別: UTF-8(fatal) を試し、失敗したら Shift-JIS
function decodeCsvBuffer(buf) {
  try { return { text: new TextDecoder('utf-8', { fatal: true }).decode(buf), encoding: 'UTF-8' }; }
  catch { return { text: new TextDecoder('shift_jis').decode(buf), encoding: 'Shift-JIS' }; }
}

/* 列名マッピング（位置は信用しない・列名で対応付け）。
   2番目の要素は候補名の配列 — 販売管理システムの出力で列名が変わることがあるため複数許容する */
const REQUIRED_COLS = [
  ['saleNo', ['売上番号']], ['date', ['売上日']], ['customer', ['お客様名']],
  ['product', ['商品名']], ['qty', ['数量']], ['amount', ['金額']],
];
const OPTIONAL_COLS = [
  ['gross', ['粗利額']], ['unit', ['単位名']], ['price', ['単価']],
  ['supplier', ['仕入先名']], ['cost', ['仕入単価']], ['rep', ['担当者', '営業担当名', '営業担当', '担当']],
];
const colLabel = (names) => names[0];

// 明細行スキーマ: [売上番号, 売上日, お客様名, 商品名, 数量, 単位名, 単価, 金額, 粗利額, 仕入先名, 仕入単価]
const rowKey = (a) => a[0] + '' + a[3] + '' + a[4] + '' + a[7];

// 同一キーの出現回数マップ。同じ売上番号内に正当な同一明細が複数ある場合があるため、
// 重複スキップは「保存済みの出現回数まで」に留める（再取込では全行スキップされる）
const rowKeyCounts = (rowsArr) => {
  const m = new Map();
  for (let i = 0; i < rowsArr.length; i++) {
    const k = rowKey(rowsArr[i]);
    m.set(k, (m.get(k) || 0) + 1);
  }
  return m;
};

function analyzeCsv(rawText, fileName, encoding) {
  const text = String(rawText || '').replace(/^﻿/, '');
  if (!text.trim()) return { fatal: 'データが空です' };
  const nl = text.indexOf('\n');
  const firstLine = nl < 0 ? text : text.slice(0, nl);
  const delim = firstLine.includes('\t') ? '\t' : ',';
  const grid = parseDelimited(text, delim);
  let hi = 0;
  while (hi < grid.length && grid[hi].every(c => String(c).trim() === '')) hi++;
  if (hi >= grid.length) return { fatal: 'データが空です' };
  const header = grid[hi].map(c => String(c).trim().replace(/^﻿/, ''));
  const col = {}, found = {};
  [...REQUIRED_COLS, ...OPTIONAL_COLS].forEach(([key, names]) => {
    let i = -1;
    for (let j = 0; j < names.length; j++) { i = header.indexOf(names[j]); if (i >= 0) break; }
    col[key] = i;
    found[key] = i >= 0;
  });
  const missing = REQUIRED_COLS.filter(([k]) => col[k] < 0).map(([, names]) => colLabel(names));
  if (missing.length) {
    return { fatal: '必須列が見つからないため取込を中止しました： ' + missing.join(' ／ '), header, missing };
  }
  const rowsParsed = [], badRows = [];
  let minD = null, maxD = null;
  for (let i = hi + 1; i < grid.length; i++) {
    const g = grid[i];
    if (g.every(c => String(c).trim() === '')) continue;
    const line = i + 1;
    const cell = (k) => (col[k] >= 0 && col[k] < g.length ? String(g[col[k]]).trim() : '');
    const saleNo = cell('saleNo'), dateS = cell('date'), customer = cell('customer'), product = cell('product');
    const d = parseDateStr(dateS);
    const qty = toNum(cell('qty')), amount = toNum(cell('amount'));
    let reason = '';
    if (!saleNo) reason = '売上番号が空';
    else if (!d) reason = '売上日が不正（' + (dateS || '空') + '）';
    else if (!customer) reason = 'お客様名が空';
    else if (!product) reason = '商品名が空';
    else if (qty === null) reason = '数量が数値でない（' + cell('qty') + '）';
    else if (amount === null) reason = '金額が数値でない（' + cell('amount') + '）';
    if (reason) { badRows.push({ line, reason }); continue; }
    const arr = [saleNo, d.y + '/' + d.mo + '/' + d.d, customer, product, qty,
      cell('unit'), toNum(cell('price')) ?? 0, amount, toNum(cell('gross')) ?? 0,
      cell('supplier'), toNum(cell('cost')) ?? 0];
    rowsParsed.push({ arr, rep: cell('rep'), sort: d.sort });
    if (!minD || d.sort < minD.sort) minD = d;
    if (!maxD || d.sort > maxD.sort) maxD = d;
  }
  return {
    fileName, encoding: encoding || '—', delim, header, col, found, rowsParsed, badRows,
    period: minD ? minD.y + '/' + minD.mo + '/' + minD.d + ' 〜 ' + maxD.y + '/' + maxD.mo + '/' + maxD.d : '—',
  };
}

/* ============================================================
   施設 / 個人の自動判定
============================================================ */
// 強いキーワード: 含まれていたら確実に施設
const FACILITY_KEYWORDS_STRONG = [
  'ホーム', 'センター', 'センタ', '事業所', 'ステーション', 'デイ', 'ケア', 'クリニック',
  '病院', '医院', '診療所', '薬局', '薬店', '法人', '介護', '支援', 'サービス', 'ショート',
  'グループ', 'ハウス', '工務店', '株式会社', '有限会社', '合同会社', '(株)', '(有)',
  '福祉', '施設', '居宅', '包括', '保育', '幼稚', '学園', '学校', '大学', '協会', '組合',
  '訪問', 'リハビリ', 'ヘルパー', 'レジデンス', 'ヴィラ', 'プラザ', 'ライフ', 'クラブ',
  'ステイ', 'の里', 'の家', 'の郷', '商店', '商事', '興業', '産業', '建設', '営業所', '売店',
];
// 弱いキーワード: 施設らしいが人名にも現れうる一文字
const FACILITY_KEYWORDS_WEAK = ['苑', '園', '荘', '館', '会', '庵', '寮', '亭', '堂', '院', '店', '屋'];
const KANJI_NAME_RE = /^[一-龥々〆ヶ]{2,5}$/;
const HAS_KANJI_RE = /[一-龥々〆ヶ]/;

function classifyCustomerName(rawName) {
  const name = String(rawName || '').normalize('NFKC').trim();
  for (let i = 0; i < FACILITY_KEYWORDS_STRONG.length; i++) {
    if (name.includes(FACILITY_KEYWORDS_STRONG[i])) return { type: 'facility', uncertain: false };
  }
  const tokens = name.split(/\s+/).filter(Boolean);
  // 「姓 名」形の個人名は、実在の日本人の姓がほぼ必ず漢字を含む点で判定する。
  // 「あさがお 新田原」のようにひらがなだけの単語（施設の愛称に多い）+ 地名は姓名ではないため対象外。
  if (tokens.length === 2 && tokens[0].length <= 5 && tokens[1].length <= 6 &&
      HAS_KANJI_RE.test(tokens[0]) &&
      !FACILITY_KEYWORDS_WEAK.some(k => name.includes(k))) {
    return { type: 'person', uncertain: false };  // 「姓 名」形
  }
  for (let i = 0; i < FACILITY_KEYWORDS_WEAK.length; i++) {
    if (name.includes(FACILITY_KEYWORDS_WEAK[i])) {
      return { type: 'facility', uncertain: KANJI_NAME_RE.test(name) }; // 漢字だけの短い名前は要確認
    }
  }
  if (KANJI_NAME_RE.test(name)) return { type: 'person', uncertain: true };
  return { type: 'facility', uncertain: true };
}

// 「消耗品のみ」集計から除外する対象の判定。
// 地域包括支援センター経由の個人名（例:「築上町包括　水ノ江」）や、姓名のみの表記（例:「水ノ江」「熊本　千佳」）は
// 住宅改修など個人向け取引であることが多いため対象外とする。○○工務店・株式会社等の実事業者名は除外しない。
const PERSON_TOKEN_RE = /^[一-鿿゠-ヿー々〆ヶ]{1,6}$/;
function looksLikeIndividualRecipient(rawName) {
  const name = String(rawName || '').normalize('NFKC').trim();
  if (!name) return false;
  if (name.includes('包括')) return true;
  for (let i = 0; i < FACILITY_KEYWORDS_STRONG.length; i++) {
    if (FACILITY_KEYWORDS_STRONG[i] !== '包括' && name.includes(FACILITY_KEYWORDS_STRONG[i])) return false;
  }
  const tokens = name.split(/\s+/).filter(Boolean);
  if (tokens.length === 1) return PERSON_TOKEN_RE.test(tokens[0]);
  if (tokens.length === 2) return PERSON_TOKEN_RE.test(tokens[0]) && PERSON_TOKEN_RE.test(tokens[1]);
  return false;
}

// 「消耗品のみ」表示で除外する分類（住宅改修・器具本体・部材など、日々使い切る消耗品ではないもの）
const NON_CONSUMABLE_CATS = new Set(['住宅改修', 'ベッド・車いす・歩行器', 'リハビリ・福祉用具', '部材']);
const _catCache = new Map();
function autoCategory(rawName) {
  if (_catCache.has(rawName)) return _catCache.get(rawName);
  const n = String(rawName || '').normalize('NFKC');
  let cat = 'その他';
  outer:
  for (let i = 0; i < CAT_RULES.length; i++) {
    const kws = CAT_RULES[i][1];
    for (let j = 0; j < kws.length; j++) {
      if (n.includes(kws[j])) { cat = CAT_RULES[i][0]; break outer; }
    }
  }
  _catCache.set(rawName, cat);
  return cat;
}
// 分類の決まり方: ①商品ごとの手直し ②ユーザーが登録したキーワード学習ルール ③内蔵辞書
function resolveCategory(name, catOverrides, catRules) {
  if (catOverrides && catOverrides[name]) return { cat: catOverrides[name], src: '手動' };
  if (catRules && catRules.length) {
    const n = String(name || '').normalize('NFKC');
    for (let i = 0; i < catRules.length; i++) {
      const r = catRules[i];
      if (r.kw && n.includes(String(r.kw).normalize('NFKC'))) return { cat: r.cat, src: '学習', kw: r.kw };
    }
  }
  return { cat: autoCategory(name), src: '自動' };
}
const categoryOf = (name, catOverrides, catRules) => resolveCategory(name, catOverrides, catRules).cat;

/* 商品の扱い分類は2種類のみ：在庫品（営業所で在庫を持つ）／受注発注（注文が来てから仕入れる・デフォルト） */
const HANDLING_TYPES = ['stock', 'order'];
const HANDLING_LABELS = { stock: '在庫品', order: '受注発注' };
const HANDLING_DEFAULT = 'order';
const handlingOf = (name, itemHandling) => itemHandling[name] || HANDLING_DEFAULT;

/* ============================================================
   集計エンジン: 明細を1パス走査して全画面用の索引を構築
============================================================ */
function buildAnalytics(rows, masters, baseSel) {
  const custs = masters.customers, catOv = masters.catOverrides, catRules = masters.catRules, st = masters.settings;

  // 顧客サマリー（rows が空でも設定画面で使う）
  let facCount = 0, perCount = 0, uncertain = 0, unassigned = 0;
  for (const n in custs) {
    const c = custs[n];
    if (c.type === 'facility') { facCount++; if (!c.rep) unassigned++; } else perCount++;
    if (c.uncertain) uncertain++;
  }
  const custStats = { facCount, perCount, uncertain, unassigned };

  const emptyKpi = { sales: 0, gross: 0, rate: '0.0', ratePrev: '0.0', momSales: null, momGross: null, count: 0,
    yoySales: 0, hasYoy: false, yoyPctSales: null, fySales: 0, fyPrevSales: 0, hasFyPrev: false, fyPct: null };
  // 月インデックス収集
  const monthSet = new Set();
  let maxIdx = -1;
  for (let i = 0; i < rows.length; i++) {
    const d = parseDateStr(rows[i][1]);
    if (d) { monthSet.add(d.idx); if (d.idx > maxIdx) maxIdx = d.idx; }
  }
  const monthsAll = [...monthSet].sort((a, b) => a - b);
  if (monthsAll.length === 0) {
    return {
      empty: true, monthsAll: [], baseIdx: null, maxIdx: null, baseLabel: '', win: [], winShort: [], winKeys: [],
      totals: zeros12(), totalsGross: zeros12(), kpi: emptyKpi, facilities: [], facByName: new Map(),
      products: [], prodByName: new Map(), categories: [],
      growth: [], dead: [], deadTotal: 0, lowMargin: [], lowMarginTotal: 0, reps: [], custStats, settings: st,
      fyLabel: '', fyRangeLabel: '', hasYoy: false, hasFyPrev: false,
    };
  }
  const baseIdx = (baseSel != null && monthSet.has(baseSel)) ? baseSel : maxIdx;
  const winStart = baseIdx - 11;
  const win = [];
  for (let i = 0; i < 12; i++) win.push(winStart + i);

  const facMap = new Map(), prodMap = new Map(), pairMap = new Map();
  const totals = zeros12(), totalsGross = zeros12();

  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    const name = r[2];
    const c = custs[name] || classifyCustomerName(name);
    if (c.type !== 'facility') continue;              // 集計対象は施設のみ（個人は除外）
    const d = parseDateStr(r[1]);
    if (!d) continue;

    let f = facMap.get(name);
    if (!f) {
      f = { name, rep: c.rep || '', repName: c.rep || '未設定', direct: !!c.direct,
            monthly: zeros12(), gross12: zeros12(), byMonth: new Map(), rows: [], pairs: [], returns3: 0, orderNos: new Set() };
      facMap.set(name, f);
    }
    f.rows.push(r);
    const qty = +r[4] || 0, amt = +r[7] || 0, gross = +r[8] || 0;
    const price = +r[6] || 0, cost = +r[10] || 0;
    // 全期間の月別（CSV出力の期間選択で使う）
    const bm = f.byMonth.get(d.idx);
    if (bm) { bm.sales += amt; bm.gross += gross; }
    else f.byMonth.set(d.idx, { sales: amt, gross });

    const slot = d.idx - winStart;
    const inWin = slot >= 0 && slot <= 11;
    if (inWin) { f.monthly[slot] += amt; f.gross12[slot] += gross; totals[slot] += amt; totalsGross[slot] += gross; f.orderNos.add(r[0]); }
    if (amt < 0 && d.idx >= baseIdx - 2) f.returns3++;

    const pname = r[3];
    let p = prodMap.get(pname);
    if (!p) {
      p = { name: pname, unit: '', unitSort: -1, supplier: '', supSort: -1, cost: 0, costSort: -1,
            lastPrice: 0, lpSort: -1,
            qty12: zeros12(), qtyND12: zeros12(), sales12: zeros12(), gross12: zeros12(), lastSale: null, pairs: [] };
      prodMap.set(pname, p);
    }
    if (price > 0 && d.sort > p.lpSort) { p.lastPrice = price; p.lpSort = d.sort; }
    if (r[5] && d.sort > p.unitSort) { p.unit = r[5]; p.unitSort = d.sort; }
    if (r[9] && d.sort > p.supSort) { p.supplier = r[9]; p.supSort = d.sort; }
    if (cost > 0 && d.sort > p.costSort) { p.cost = cost; p.costSort = d.sort; }
    if (!p.lastSale || d.sort > p.lastSale.sort) p.lastSale = d;
    if (inWin) {
      p.qty12[slot] += qty; p.sales12[slot] += amt; p.gross12[slot] += gross;
      if (!f.direct) p.qtyND12[slot] += qty;
    }

    const pkey = name + '' + pname;
    let pair = pairMap.get(pkey);
    if (!pair) {
      pair = { fac: name, prod: pname, direct: f.direct, qty12: zeros12(), sales12: zeros12(),
               lastDate: null, lastPrice: 0, priceSort: -1, unit: '', unitSort: -1, baseAmt: 0, baseGross: 0,
               orders: [] };
      pairMap.set(pkey, pair);
      f.pairs.push(pair);
      p.pairs.push(pair);
    }
    if (inWin) {
      pair.qty12[slot] += qty; pair.sales12[slot] += amt;
      if (slot === 11) { pair.baseAmt += amt; pair.baseGross += gross; }
      pair.orders.push({ idx: d.idx, no: r[0] });
    }
    if (!pair.lastDate || d.sort > pair.lastDate.sort) pair.lastDate = d;
    if (price > 0 && d.sort > pair.priceSort) { pair.lastPrice = price; pair.priceSort = d.sort; }
    if (r[5] && d.sort > pair.unitSort) { pair.unit = r[5]; pair.unitSort = d.sort; }
  }

  // 施設ごとの派生値（減少アラート等）
  const hasPrevMonth = monthSet.has(baseIdx - 1);
  const hasYoyMonth = monthSet.has(baseIdx - 12);
  const pctDelta = (now, base, ok) => (ok && base !== 0 ? Math.round((now - base) / Math.abs(base) * 100) : null);
  const facilities = [...facMap.values()];
  for (const f of facilities) {
    f.winSum = sum12(f.monthly);
    f.avg = f.winSum / 12;
    const gsum = sum12(f.gross12);
    f.margin = f.winSum > 0 ? Math.round(gsum / f.winSum * 1000) / 10 : 0;
    f.last = f.monthly[11];
    f.prev3 = (f.monthly[8] + f.monthly[9] + f.monthly[10]) / 3;
    f.pct = f.prev3 > 0 ? Math.round((f.last - f.prev3) / f.prev3 * 100) : 0;
    f.ordersPerMonth = f.orderNos.size / 12;
    const yoyM = f.byMonth.get(baseIdx - 12);
    f.mom = pctDelta(f.last, f.monthly[10], hasPrevMonth);
    f.yoyPct = pctDelta(f.last, yoyM ? yoyM.sales : 0, hasYoyMonth);
  }

  // 全体の前年同月比・年度内前年比較（例: 2026年度4〜7月 と 2025年度4〜7月）
  const fyStartForKpi = fiscalStartIdx(baseIdx);
  let yoySales = 0, yoyGross = 0, fySales = 0, fyPrevSales = 0;
  let hasFyPrevMonth = false;
  for (let i = fyStartForKpi - 12; i <= baseIdx - 12; i++) if (monthSet.has(i)) { hasFyPrevMonth = true; break; }
  for (const f of facilities) {
    const yoyM = f.byMonth.get(baseIdx - 12);
    if (yoyM) { yoySales += yoyM.sales; yoyGross += yoyM.gross; }
    for (let i = fyStartForKpi; i <= baseIdx; i++) { const m = f.byMonth.get(i); if (m) fySales += m.sales; }
    for (let i = fyStartForKpi - 12; i <= baseIdx - 12; i++) { const m = f.byMonth.get(i); if (m) fyPrevSales += m.sales; }
  }

  // KPI
  const sales = totals[11], prev = totals[10];
  const grossB = totalsGross[11], grossPrev = totalsGross[10];
  const kpi = {
    sales, gross: grossB,
    rate: sales !== 0 ? (grossB / sales * 100).toFixed(1) : '0.0',
    ratePrev: prev !== 0 ? (grossPrev / prev * 100).toFixed(1) : '0.0',
    momSales: prev !== 0 ? Math.round((sales - prev) / Math.abs(prev) * 100) : null,
    momGross: grossPrev !== 0 ? Math.round((grossB - grossPrev) / Math.abs(grossPrev) * 100) : null,
    count: facilities.reduce((s, f) => s + (f.monthly[11] !== 0 ? 1 : 0), 0),
    // 前年同月比（例: 2026年8月 vs 2025年8月）
    yoySales, hasYoy: hasYoyMonth,
    yoyPctSales: hasYoyMonth && yoySales !== 0 ? Math.round((sales - yoySales) / Math.abs(yoySales) * 100) : null,
    // 年度内前年比較（例: 2026年度4〜8月 vs 2025年度4〜8月）
    fySales, fyPrevSales, hasFyPrev: hasFyPrevMonth,
    fyPct: hasFyPrevMonth && fyPrevSales !== 0 ? Math.round((fySales - fyPrevSales) / Math.abs(fyPrevSales) * 100) : null,
  };

  // 商品 → 分類
  const products = [...prodMap.values()];
  for (const p of products) {
    const rc = resolveCategory(p.name, catOv, catRules);
    p.cat = rc.cat;
    p.catSrc = rc.src;
    p.winQty = sum12(p.qty12);
    p.winSales = sum12(p.sales12);
  }

  // 分類別サマリー
  const catAgg = new Map();
  for (const p of products) {
    let c = catAgg.get(p.cat);
    if (!c) { c = { name: p.cat, sales12: zeros12(), gross12: zeros12(), items: [] }; catAgg.set(p.cat, c); }
    for (let i = 0; i < 12; i++) { c.sales12[i] += p.sales12[i]; c.gross12[i] += p.gross12[i]; }
    c.items.push(p);
  }
  const categories = [...catAgg.values()].map(c => {
    const s = c.sales12[11], pv = c.sales12[10], g = c.gross12[11];
    return {
      name: c.name, sales: s,
      share: sales > 0 ? Math.round(Math.max(0, s) / sales * 100) : 0,
      mom: pv !== 0 ? Math.round((s - pv) / Math.abs(pv) * 100) : 0,
      margin: s !== 0 ? Math.round(g / s * 1000) / 10 : 0,
      top: c.items.slice().sort((a, b) => b.winSales - a.winSales).slice(0, 6).map(p => p.name),
    };
    // 「その他」は売上に関係なく常に一番下に表示する
  }).sort((a, b) => (a.name === 'その他') - (b.name === 'その他') || b.sales - a.sales);

  // 売れ筋: 基準月数量 vs 直近3ヶ月平均の伸び率
  const growth = products.map(p => {
    const base = p.qty12[11], prev3 = (p.qty12[8] + p.qty12[9] + p.qty12[10]) / 3;
    if (!(prev3 > 0) || base <= 0) return null;
    const g = Math.round((base - prev3) / prev3 * 100);
    return g > 0 ? { product: p.name, category: p.cat, qty: base, unit: p.unit, growth: g } : null;
  }).filter(Boolean).sort((a, b) => b.growth - a.growth || b.qty - a.qty).slice(0, 5);

  // 死に筋: 過去に販売あり＆直近3ヶ月（基準月含む）ゼロ
  const deadAll = products
    .filter(p => p.lastSale && p.lastSale.idx <= baseIdx - 3)
    .sort((a, b) => b.lastSale.sort - a.lastSale.sort)
    .map(p => ({ product: p.name, category: p.cat, last: p.lastSale.y + '/' + p.lastSale.mo + '/' + p.lastSale.d }));

  // 粗利率チェック: 基準月の施設×商品で 15% 未満
  const lowAll = [];
  pairMap.forEach(pair => {
    if (pair.baseAmt <= 0) return;
    const m = pair.baseGross / pair.baseAmt * 100;
    if (m >= 15) return;
    const q = pair.qty12[11];
    lowAll.push({
      facility: pair.fac, product: pair.prod,
      price: pair.lastPrice > 0 ? pair.lastPrice : (q > 0 ? pair.baseAmt / q : 0),
      margin: Math.round(m * 10) / 10,
    });
  });
  lowAll.sort((a, b) => a.margin - b.margin);

  // 担当別（前月比・前年同月比・今年度累計とその前年度同期比）
  const fyStart = fiscalStartIdx(baseIdx);
  const hasPrev = monthSet.has(baseIdx - 1);
  const hasYoy = monthSet.has(baseIdx - 12);
  let hasFyPrev = false;
  for (let i = fyStart - 12; i <= baseIdx - 12; i++) if (monthSet.has(i)) { hasFyPrev = true; break; }
  const repAgg = new Map();
  for (const f of facilities) {
    let r = repAgg.get(f.repName);
    if (!r) { r = { rep: f.repName, count: 0, sales: 0, prev: 0, yoy: 0, fy: 0, fyPrev: 0, avg: 0, gross: 0 }; repAgg.set(f.repName, r); }
    const at = (i) => { const m = f.byMonth.get(i); return m ? m.sales : 0; };
    r.count++; r.avg += f.avg; r.gross += f.gross12[11];
    r.sales += f.monthly[11];
    r.prev += f.monthly[10];
    r.yoy += at(baseIdx - 12);
    for (let i = fyStart; i <= baseIdx; i++) r.fy += at(i);
    for (let i = fyStart - 12; i <= baseIdx - 12; i++) r.fyPrev += at(i);
  }
  const pctOf = (now, base, ok) => (ok && base !== 0 ? Math.round((now - base) / Math.abs(base) * 100) : null);
  const reps = [...repAgg.values()]
    .map(r => ({
      ...r,
      rate: r.sales !== 0 ? (r.gross / r.sales * 100).toFixed(1) : '0.0',
      mom: pctOf(r.sales, r.prev, hasPrev),
      yoyPct: pctOf(r.sales, r.yoy, hasYoy),
      fyPct: pctOf(r.fy, r.fyPrev, hasFyPrev),
    }))
    .sort((a, b) => b.sales - a.sales);
  const fyLabel = Math.floor(fyStart / 12) + '年度';
  const fyRangeLabel = idxLabel(fyStart) + '〜' + idxLabel(baseIdx);

  return {
    empty: false, monthsAll, baseIdx, maxIdx, baseLabel: idxLabel(baseIdx),
    win, winShort: win.map(idxShort), winKeys: win.map(idxKey),
    totals, totalsGross, kpi, facilities, facByName: facMap,
    products, prodByName: prodMap, categories, growth,
    dead: deadAll.slice(0, 30), deadTotal: deadAll.length,
    lowMargin: lowAll.slice(0, 30), lowMarginTotal: lowAll.length,
    reps, custStats, settings: st,
    fyLabel, fyRangeLabel, hasYoy, hasFyPrev,
  };
}

/* ============================================================
   任意期間のレポート集計（明細を範囲で走査。12ヶ月窓に依存しない）
============================================================ */
function buildPeriodReport(rows, masters, fromIdx, toIdx, consumableOnly) {
  const custs = masters.customers, catOv = masters.catOverrides, catRules = masters.catRules;
  const facMap = new Map(), prodMap = new Map(), monMap = new Map();
  let sales = 0, gross = 0;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    const name = r[2];
    const c = custs[name] || classifyCustomerName(name);
    const d = parseDateStr(r[1]);
    if (!d || d.idx < fromIdx || d.idx > toIdx) continue;
    const pn = r[3];
    const cat = categoryOf(pn, catOv, catRules);
    // 正確な売上把握のため施設・個人・事業者を問わず集計する。
    // 「消耗品のみ」表示のときだけ、消耗品以外の分類と、個人受給者向けとみられる売上を除外する。
    if (consumableOnly && (NON_CONSUMABLE_CATS.has(cat) || looksLikeIndividualRecipient(name))) continue;
    const amt = +r[7] || 0, g = +r[8] || 0, qty = +r[4] || 0;
    sales += amt; gross += g;

    // 施設別ランキング等が個人客で長くならないよう、施設のみに限定する
    if (c.type === 'facility') {
      let f = facMap.get(name);
      if (!f) { f = { name, repName: c.rep || '未設定', sales: 0, gross: 0, months: new Set() }; facMap.set(name, f); }
      f.sales += amt; f.gross += g; f.months.add(d.idx);
    }

    let p = prodMap.get(pn);
    if (!p) { p = { name: pn, cat, unit: r[5] || '', unitSort: -1, qty: 0, sales: 0, gross: 0 }; prodMap.set(pn, p); }
    if (r[5] && d.sort > p.unitSort) { p.unit = r[5]; p.unitSort = d.sort; }
    p.qty += qty; p.sales += amt; p.gross += g;

    let mo = monMap.get(d.idx);
    if (!mo) { mo = { idx: d.idx, sales: 0, gross: 0, facs: new Set() }; monMap.set(d.idx, mo); }
    mo.sales += amt; mo.gross += g; mo.facs.add(name);
  }
  const rate = (g2, s2) => (s2 !== 0 ? Math.round(g2 / s2 * 1000) / 10 : 0);
  const catAgg = new Map();
  prodMap.forEach(p => {
    let c = catAgg.get(p.cat);
    if (!c) { c = { name: p.cat, sales: 0, gross: 0 }; catAgg.set(p.cat, c); }
    c.sales += p.sales; c.gross += p.gross;
  });
  const monthly = [...monMap.values()].sort((a, b) => a.idx - b.idx)
    .map(m => ({ idx: m.idx, label: idxLabel(m.idx), sales: m.sales, gross: m.gross, rate: rate(m.gross, m.sales), count: m.facs.size }));
  const nMonths = Math.max(1, monthly.length);
  return {
    kpi: { sales, gross, rate: rate(gross, sales).toFixed(1), count: facMap.size, months: monthly.length },
    monthly,
    categories: [...catAgg.values()].sort((a, b) => (a.name === 'その他') - (b.name === 'その他') || b.sales - a.sales)
      .map(c => ({ name: c.name, sales: c.sales, share: sales > 0 ? Math.round(Math.max(0, c.sales) / sales * 100) : 0, margin: rate(c.gross, c.sales) })),
    topProducts: [...prodMap.values()].filter(p => p.sales > 0).sort((a, b) => b.sales - a.sales).slice(0, 10)
      .map(p => ({ name: p.name, cat: p.cat, qty: p.qty, unit: p.unit, sales: p.sales })),
    ranking: [...facMap.values()].sort((a, b) => b.sales - a.sales)
      .map(f => ({ name: f.name, repName: f.repName, sales: f.sales, avg: f.sales / nMonths, margin: rate(f.gross, f.sales) })),
  };
}

/* ============================================================
   出力: CSV(UTF-8+BOM) / JSONダウンロード
============================================================ */
const csvEsc = (v) => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const buildCsv = (rows2d) => '﻿' + rows2d.map(r => r.map(csvEsc).join(',')).join('\r\n');
// 印刷用HTMLをそのままA4のPDFにする（画面外に実寸で描画 → html2canvas → jsPDF）
async function exportPdf(html, fileName) {
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-10000px;top:0;width:210mm;background:#fff;z-index:-1;';
  holder.innerHTML = html;
  document.body.appendChild(holder);
  try {
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    const docs = holder.querySelectorAll('.doc');
    const targets = docs.length ? docs : [holder];
    let first = true;
    for (let i = 0; i < targets.length; i++) {
      const canvas = await html2canvas(targets[i], { scale: 2, backgroundColor: '#ffffff', logging: false });
      const pageHpx = canvas.width * 297 / 210;   // 1ページ分の高さ(px)
      for (let y = 0; y < canvas.height - 2; y += pageHpx) {
        const h = Math.min(pageHpx, canvas.height - y);
        const slice = document.createElement('canvas');
        slice.width = canvas.width;
        slice.height = h;
        slice.getContext('2d').drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
        if (!first) pdf.addPage();
        first = false;
        pdf.addImage(slice.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, h * 210 / canvas.width);
      }
    }
    pdf.save(fileName);
  } finally {
    document.body.removeChild(holder);
  }
}

function downloadText(fileName, text, mime) {
  const blob = new Blob([text], { type: mime || 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ============================================================
   印刷: 御見積書（taiyo-mitsumori の書式に準拠）
============================================================ */
function buildQuoteHtml(m) {
  const th = 'background:#dbeafe;color:#1e3a8a;font-size:8.5pt;padding:1.6mm 2mm;border:1px solid #93c5fd;font-weight:bold;';

  const sp = m.showPrices;
  const sc = m.showCaseSize !== false;
  const st = m.showTotal !== false;   // 合計金額の表示（単価・明細金額とは独立したトグル）
  const qn = (q) => (Number(q) || 0);
  const ed = 'class="editable" contenteditable="true"';
  const rows = m.items.map((it, i) => `
    <tr style="background:${i % 2 === 1 ? '#f8fbff' : '#fff'}">
      <td style="${td}overflow-wrap:anywhere;">
        ${it.cat ? `<div style="font-size:7pt;color:#2563eb;font-weight:bold;">${escapeHTML(it.cat)}</div>` : ''}
        <div ${ed}>${escapeHTML(it.name)}</div>
        ${it.note ? `<div style="margin-top:0.5mm;font-size:7.5pt;color:#6b7280;" ${ed}>${escapeHTML(it.note)}</div>` : ''}
      </td>
      ${sc ? `<td style="${td}text-align:center;" ${ed}>${escapeHTML(it.caseSize || '')}</td>` : ''}
      <td style="${tdR}" ${ed}>${it.qty === '' ? '' : num(it.qty)}</td>
      <td style="${td}text-align:center;" ${ed}>${escapeHTML(it.unit)}</td>
      ${sp ? `<td style="${tdR}" ${ed}>${yen(it.price)}</td><td style="${tdR}" ${ed}>${yen(qn(it.qty) * it.price)}</td>` : ''}
    </tr>`).join('');
  const sub = m.items.reduce((s, it) => s + qn(it.qty) * it.price, 0);
  const tax = Math.floor(sub * 0.1);

  const colgroup = sp
    ? (sc ? '<colgroup><col style="width:42%"><col style="width:8%"><col style="width:9%"><col style="width:7%"><col style="width:16%"><col style="width:18%"></colgroup>'

  const totalColspan = (sp ? 4 : 2) + (sc ? 1 : 0);
  return `
  <style>.editable{outline:1px dashed transparent;outline-offset:1px;cursor:text;}.editable:hover,.editable:focus{outline-color:#93c5fd;background:rgba(219,234,254,.35);}</style>
  <div class="doc" style="width:210mm;min-height:297mm;padding:14mm 13mm;background:#fff;box-sizing:border-box;font-family:'BIZ UDPMincho','Yu Mincho','Hiragino Mincho ProN',serif;color:#1f2937;font-size:9.5pt;line-height:1.6;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div style="flex:1;">
        <div style="font-size:22pt;letter-spacing:0.5em;color:#1e3a8a;border-bottom:1.5px solid #3b82f6;padding-bottom:2mm;display:inline-block;">御　見　積　書</div>
        <div style="margin-top:5mm;font-size:15pt;color:#1f2937;border-bottom:1px solid #93c5fd;display:inline-block;padding-right:10mm;padding-bottom:1mm;" ${ed}>${escapeHTML(m.facilityName)} <span style="font-size:10.5pt;color:#2563eb;">御中</span></div>
        <div style="margin-top:3mm;font-size:8.5pt;color:#4b5563;">下記の通りお見積り申し上げます。</div>
        ${st ? `
        <div style="margin-top:4mm;display:inline-block;border:1.5px solid #1e3a8a;background:#f0f7ff;padding:2mm 6mm;">
          <span style="font-size:9pt;color:#1e3a8a;font-weight:bold;">御見積金額</span>
          <span style="font-size:15pt;color:#1e3a8a;font-weight:bold;margin-left:5mm;font-variant-numeric:tabular-nums;">${yen(m.taxIncluded ? total : sub)}</span>
          <span style="font-size:8.5pt;color:#4b5563;">（${m.taxIncluded ? '税込' : '税抜'}）</span>
        </div>` : ''}
      </div>
      <div style="width:70mm;font-size:8.5pt;color:#4b5563;">
        <div style="text-align:right;" ${ed}>発行日：${escapeHTML(m.issued)}</div>
        <div style="text-align:right;" ${ed}>見積番号：${escapeHTML(m.quoteNo)}</div>
        <div style="text-align:right;">有効期限：お見積日より30日間</div>
        ${officeBlockHtml(m.office, m.repName)}

    </div>

    <table style="width:100%;border-collapse:collapse;margin-top:7mm;table-layout:fixed;">
      ${colgroup}
      <thead><tr><th style="${th}">品目</th>${sc ? `<th style="${th}">入数</th>` : ''}<th style="${th}">数量</th><th style="${th}">単位</th>${sp ? `<th style="${th}">単価（税抜）</th><th style="${th}">金額（税抜）</th>` : ''}</tr></thead>
      <tbody>
      ${rows}
      ${st ? `
      <tr>
        <td colspan="${totalColspan}" style="${td}text-align:right;font-weight:bold;color:#1e3a8a;background:#eff6ff;">小計（税抜）</td>
        <td style="${tdR}font-weight:bold;background:#eff6ff;">${yen(sub)}</td>
      </tr>
      <tr>
        <td colspan="${totalColspan}" style="${td}text-align:right;font-weight:bold;color:#1e3a8a;background:#eff6ff;">消費税（10%）</td>
        <td style="${tdR}font-weight:bold;background:#eff6ff;">${yen(tax)}</td>
      </tr>
      <tr>
        <td colspan="${totalColspan}" style="${td}text-align:right;font-weight:bold;color:#1e3a8a;background:#eff6ff;">合計（税込）</td>
        <td style="${tdR}font-weight:bold;font-size:11pt;background:#eff6ff;">${yen(total)}</td>
      </tr>` : ''}

    </table>

    <div style="margin-top:8mm;border:1px solid #bfdbfe;background:#eff6ff;padding:3mm;font-size:8.5pt;color:#4b5563;">
      【備考】<br>
      <div ${ed}>${String(m.note || '').split('\n').map(l => escapeHTML(l)).join('<br>')}</div>
    </div>
  </div>`;
}

/* ============================================================
   印刷: 価格改定のご案内
============================================================ */
function buildPriceRevisionHtml(m) {
  const th = 'background:#dbeafe;color:#1e3a8a;font-size:8pt;padding:1.4mm 2mm;border:1px solid #93c5fd;font-weight:bold;';
  const td = 'padding:1.5mm 2mm;border:1px solid #bfdbfe;font-size:9pt;';
  const tdR = td + 'text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;';
  const sc = m.showCaseSize === true;    // 入数（デフォルト非表示）
  const sa = m.showAmounts !== false;    // 現状価格・改定価格・価格差
  const sr = sa && m.showRate !== false; // 変動率（金額表示中のみ意味を持つ）
  const o = officeByName(m.office);
  // 表示する列に応じて列幅を再配分（商品名は非表示になった分を吸収して広がる）
  const cols = [
    { w: 6 }, // No.
    { w: 30 + (sc ? 0 : 9) + (sa ? 0 : 40.5) + (sr ? 0 : 9.5) }, // 商品名
    ...(sc ? [{ w: 9 }] : []), // 入数
    { w: 9 }, // 単位
    ...(sa ? [{ w: 13 }, { w: 13 }, { w: 9.5 }] : []), // 現状/改定/価格差
    ...(sr ? [{ w: 9.5 }] : []), // 変動率
  ];
  const colgroup = '<colgroup>' + cols.map(c => `<col style="width:${c.w}%">`).join('') + '</colgroup>';
  const headCells = ['No.', '商品名', sc ? '入数' : null, '単位', sa ? '現状価格（税抜）' : null, sa ? '改定価格（税抜）' : null, sa ? '価格差' : null, sr ? '変動率' : null]
    .filter((v) => v !== null).map((label) => `<th style="${th}">${label}</th>`).join('');
  const rows = m.items.map((it, i) => {
    const diff = it.newPrice - it.currentPrice;
    const rate = it.currentPrice > 0 ? Math.round(diff / it.currentPrice * 1000) / 10 : 0;
    const diffSign = diff > 0 ? '+' : diff < 0 ? '−' : '';
    return `
    <tr style="background:${i % 2 === 1 ? '#f8fbff' : '#fff'}">
      <td style="${tdR}">${i + 1}</td>
      <td style="${td}overflow-wrap:anywhere;">
        ${it.cat ? `<div style="font-size:6.5pt;color:#2563eb;font-weight:bold;">${escapeHTML(it.cat)}</div>` : ''}
        <div>${escapeHTML(it.name)}</div>
      </td>
      ${sc ? `<td style="${td}text-align:center;">${escapeHTML(it.caseSize || '')}</td>` : ''}
      <td style="${td}text-align:center;">${escapeHTML(it.unit || '')}</td>
      ${sa ? `<td style="${tdR}">${yen(it.currentPrice)}</td>` : ''}
      ${sa ? `<td style="${tdR}font-weight:bold;">${yen(it.newPrice)}</td>` : ''}
      ${sa ? `<td style="${tdR}font-weight:bold;">${diff === 0 ? '―' : diffSign + yen(Math.abs(diff))}</td>` : ''}
      ${sr ? `<td style="${tdR}font-weight:bold;">${diff === 0 ? '―' : diffSign + Math.abs(rate) + '%'}</td>` : ''}
    </tr>`;
  }).join('');
  return `
  <div class="doc" style="width:210mm;min-height:297mm;padding:11mm 13mm;background:#fff;box-sizing:border-box;font-family:'BIZ UDPMincho','Yu Mincho','Hiragino Mincho ProN',serif;color:#1f2937;font-size:9pt;line-height:1.5;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div style="flex:1;">

// 施設別ランキング(buildPeriodReportのranking)2本を突き合わせ、当期・前期・差分を施設ごとに算出する。
// metric: 'sales' | 'gross' | 'margin'。取引施設カード用に新規/離脱施設も判定できるようnameのSetも返す。
function buildFacilityComparison(curRanking, prevRanking, metric) {
  const curMap = new Map((curRanking || []).map(f => [f.name, f]));
  const prevMap = new Map((prevRanking || []).map(f => [f.name, f]));
  const names = new Set([...curMap.keys(), ...prevMap.keys()]);
  let rows = [...names].map(name => {
    const c = curMap.get(name), p = prevMap.get(name);
    const curVal = c ? (c[metric] ?? 0) : 0;
    const prevVal = p ? (p[metric] ?? 0) : 0;
    return {
      name,
      repName: (c || p).repName,
      curVal, prevVal,
      diff: curVal - prevVal,
      isNew: !!c && !p,
      isGone: !c && !!p,
    };
  });
  // 粗利率は片方の期間に実績がない施設を除外する（存在しない側が便宜上0%扱いになり、
  // 「0%→20%」のような取引実態のない変化が紛れ込んでしまうため。前年度・今年度の
  // 両方に数字がある施設のみを比較対象とする）。
  if (metric === 'margin') {
    rows = rows.filter(r => !r.isNew && !r.isGone);
  }
  rows.sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff));
  return rows;
}

function KpiDrilldownModal({ title, curLabel, prevLabel, curRanking, prevRanking, metric, unit, onClose }) {
  const rows = React.useMemo(() => buildFacilityComparison(curRanking, prevRanking, metric), [curRanking, prevRanking, metric]);
  const fmt = (v) => unit === '%' ? v.toFixed(1) + '%' : yen(v);
  const fmtDiff = (v) => unit === '%' ? (v > 0 ? '+' : '') + v.toFixed(1) + 'pt' : (v > 0 ? '+' : '') + yen(v);
  const increased = rows.filter(r => r.diff > 0).length;
  const decreased = rows.filter(r => r.diff < 0).length;
  return (
    <div className="fixed inset-0 z-40 bg-slate-600/50 backdrop-blur-sm overflow-auto py-8 px-4 no-print" onClick={onClose}>
      <div className="max-w-2xl mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden" onClick={e => e.stopPropagation()}>
        <div className="px-6 py-4 border-b border-slate-100 flex items-center gap-3 bg-gradient-to-r from-sky-50 to-blue-50">
          <span className="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-sky-100 text-sky-600"><Building2 size={17} /></span>
          <div className="flex-1 min-w-0">
            <div className="font-extrabold text-slate-800">{title}：施設別の増減</div>

        <div className="px-6 pt-4 flex gap-4 text-xs text-slate-600 font-bold">
          <span className="text-emerald-600">増加 {increased}施設</span>
          <span className="text-rose-600">減少 {decreased}施設</span>
        </div>
        <div className="max-h-[60vh] overflow-auto px-6 py-4">
          {rows.length === 0 ? (
            <div className="text-sm text-slate-600 text-center py-6">比較できるデータがありません。</div>
          ) : (
            <table className="w-full text-xs">
              <thead>
                <tr className="text-slate-600 border-b border-slate-200">
                  <th className="text-left font-bold py-2">施設名</th>
                  <th className="text-right font-bold py-2">{prevLabel}</th>
                  <th className="text-right font-bold py-2">{curLabel}</th>
                  <th className="text-right font-bold py-2">増減</th>
                </tr>
              </thead>
              <tbody>
                {rows.map(r => (
                  <tr key={r.name} className="border-b border-slate-100">
                    <td className="py-2 text-slate-800 font-bold">
                      {r.name}
                      {r.isNew && <span className="ml-1.5 text-[10px] text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded-full font-bold">新規</span>}
                      {r.isGone && <span className="ml-1.5 text-[10px] text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded-full font-bold">離脱</span>}
                    </td>
                    <td className="py-2 text-right text-slate-600 tabular-nums">{fmt(r.prevVal)}</td>
                    <td className="py-2 text-right text-slate-800 tabular-nums font-bold">{fmt(r.curVal)}</td>
                    <td className={"py-2 text-right tabular-nums font-bold " + (r.diff > 0 ? 'text-emerald-600' : r.diff < 0 ? 'text-rose-600' : 'text-slate-500')}>{fmtDiff(r.diff)}</td>
                  </tr>

          )}
        </div>

          <button onClick={onClose} className="bg-slate-100 hover:bg-slate-200 active:scale-[.98] text-slate-700 px-4 py-2.5 rounded-xl text-sm font-bold transition">閉じる</button>
        </div>
      </div>
    </div>

function MiniBars({ values, height = 40, barW = 10, gap = 3, color = '#38bdf8', highlightLast = true }) {
  const max = Math.max(...values, 1);
  const w = values.length * (barW + gap);
  return (
    <svg width={w} height={height} className="block">
      {values.map((v, i) => {
        const h = Math.max(2, (v / max) * (height - 4));
        const isLast = i === values.length - 1;
        return <rect key={i} x={i * (barW + gap)} y={height - h} width={barW} height={h} rx={barW / 3}
          fill={highlightLast && isLast ? '#f59e0b' : color} opacity={highlightLast && isLast ? 1 : 0.6} />;
      })}
    </svg>
  );
}

function AreaChart({ values, labels, height = 190, prevValues }) {
  const stepX = 60, padL = 14, padR = 26, padT = 30, padB = 24;
  const w = padL + padR + stepX * (values.length - 1);
  const prevKnown = (prevValues || []).filter(v => v != null);
  const allValues = prevKnown.length ? values.concat(prevKnown) : values;
  const min = Math.min(...allValues), max = Math.max(...allValues);
  const range = Math.max(max - min, 1);
  const X = (i) => padL + i * stepX;
  const Y = (v) => padT + (height - padT - padB) * (1 - (v - min) / range);
  const line = values.map((v, i) => (i ? 'L' : 'M') + X(i) + ',' + Y(v)).join(' ');
  const area = line + ` L${X(values.length - 1)},${height - padB} L${X(0)},${height - padB} Z`;
  // 前年同月の線: データが連続している区間だけをつなぐ（欠測月で線を切る）
  const prevSegments = [];
  if (prevValues) {
    let seg = [];
    prevValues.forEach((v, i) => {
      if (v == null) { if (seg.length > 1) prevSegments.push(seg); seg = []; return; }
      seg.push([i, v]);
    });
    if (seg.length > 1) prevSegments.push(seg);
  }
  return (
    <div className="overflow-x-auto">
      <svg width={w} height={height} className="block">
        <defs>
          <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#0ea5e9" stopOpacity="0.22" />
            <stop offset="100%" stopColor="#0ea5e9" stopOpacity="0" />
          </linearGradient>
        </defs>
        {[0.25, 0.5, 0.75].map((t, i) => (
          <line key={i} x1={padL} x2={w - padR} y1={padT + (height - padT - padB) * t} y2={padT + (height - padT - padB) * t}
            stroke="#e2e8f0" strokeDasharray="3 4" strokeWidth="1" />
        ))}
        <path d={area} fill="url(#areaGrad)" />
        {prevSegments.map((seg, si) => (
          <path key={si} d={seg.map(([i, v], j) => (j ? 'L' : 'M') + X(i) + ',' + Y(v)).join(' ')}
            fill="none" stroke="#cbd5e1" strokeWidth="2" strokeDasharray="4 3" strokeLinecap="round" strokeLinejoin="round" />
        ))}
        <path d={line} fill="none" stroke="#0ea5e9" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
        {values.map((v, i) => {
          const isLast = i === values.length - 1;
          return (
            <g key={i}>
              <circle cx={X(i)} cy={Y(v)} r={isLast ? 5 : 3.5} fill={isLast ? '#f59e0b' : '#fff'}
                stroke={isLast ? '#fff' : '#0ea5e9'} strokeWidth={isLast ? 2 : 2} />
              <text x={X(i)} y={Y(v) - 10} textAnchor="middle" fontSize="10" fontWeight="bold"
                fill={isLast ? '#b45309' : '#94a3b8'} style={{ fontVariantNumeric: 'tabular-nums' }}>
                {Math.round(v / 1000)}k
              </text>
              <text x={X(i)} y={height - 6} textAnchor="middle" fontSize="10" fill="#94a3b8">{labels[i]}</text>
            </g>
          );
        })}
        {prevValues && prevValues.some(v => v != null) && (
          <g transform={`translate(${w - padR - 96}, ${padT - 20})`}>
            <line x1="0" y1="0" x2="16" y2="0" stroke="#cbd5e1" strokeWidth="2" strokeDasharray="4 3" />
            <text x="20" y="3.5" fontSize="10" fill="#64748b" fontWeight="bold">前年同月</text>
          </g>
        )}
      </svg>
    </div>
  );
}

function DeclineBadge({ pct, level }) {

/* ============================================================
   簡易電卓（見積書・発注書・価格改定の作成画面の余白に設置）
   単価×数量や入数換算など、その場の暗算をなくすための補助ツール
============================================================ */
function CalcPad() {
  const [display, setDisplay] = useState('0');
  const [prevVal, setPrevVal] = useState(null);
  const [op, setOp] = useState(null);
  const [resetNext, setResetNext] = useState(false);

  const round = (n) => Math.round(n * 1e6) / 1e6;
  const compute = (a, b, o) => {
    switch (o) {
      case '+': return a + b;
      case '-': return a - b;
      case '×': return a * b;
      case '÷': return b !== 0 ? a / b : 0;
      default: return b;
    }
  };
  const inputDigit = (d) => setDisplay(v => {
    if (resetNext) { setResetNext(false); return d === '.' ? '0.' : d; }
    if (v === '0' && d !== '.') return d;
    if (d === '.' && v.includes('.')) return v;
    if (v.replace('-', '').replace('.', '').length >= 12) return v;
    return v + d;
  });
  const clear = () => { setDisplay('0'); setPrevVal(null); setOp(null); setResetNext(false); };
  const backspace = () => setDisplay(v => (v.length > 1 ? v.slice(0, -1) : '0'));
  const toggleSign = () => setDisplay(v => (v === '0' ? v : (v.startsWith('-') ? v.slice(1) : '-' + v)));
  const chooseOp = (o) => {
    const cur = parseFloat(display) || 0;
    if (prevVal !== null && op && !resetNext) {
      const result = round(compute(prevVal, cur, op));
      setPrevVal(result); setDisplay(String(result));
    } else {
      setPrevVal(cur);
    }
    setOp(o);
    setResetNext(true);
  };
  const equals = () => {
    if (prevVal === null || op === null) return;
    const cur = parseFloat(display) || 0;
    const result = round(compute(prevVal, cur, op));
    setDisplay(String(result));
    setPrevVal(null); setOp(null); setResetNext(true);
  };

  const numBtn = "h-11 rounded-lg text-sm font-bold bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 active:scale-95 transition tabular-nums";
  const opBtn = "h-11 rounded-lg text-sm font-bold bg-sky-50 text-sky-600 hover:bg-sky-100 active:scale-95 transition";
  return (
    <Card className="p-3 sticky top-20 min-w-0 max-w-full lg:max-w-[280px]">
      <div className="flex items-center gap-1.5 mb-2.5 text-xs font-bold text-slate-600">
        <Calculator size={14} className="text-slate-400" /> 電卓
      </div>
      <div className="bg-slate-900 rounded-xl px-3 py-3 mb-2.5">
        {op && <div className="text-slate-400 text-[10px] tabular-nums text-right truncate">{num(prevVal)} {op}</div>}
        <div className="text-white text-xl font-bold tabular-nums text-right truncate">{display}</div>
      </div>
      <div className="grid grid-cols-4 gap-1.5">
        <button type="button" onClick={clear} className={numBtn + " col-span-2 bg-rose-50 border-rose-100 text-rose-600 hover:bg-rose-100"}>C</button>
        <button type="button" onClick={backspace} className={numBtn + " inline-flex items-center justify-center"}><Delete size={15} /></button>
        <button type="button" onClick={() => chooseOp('÷')} className={opBtn}>÷</button>
        {[7, 8, 9].map(n => <button type="button" key={n} onClick={() => inputDigit(String(n))} className={numBtn}>{n}</button>)}
        <button type="button" onClick={() => chooseOp('×')} className={opBtn}>×</button>
        {[4, 5, 6].map(n => <button type="button" key={n} onClick={() => inputDigit(String(n))} className={numBtn}>{n}</button>)}
        <button type="button" onClick={() => chooseOp('-')} className={opBtn}>−</button>
        {[1, 2, 3].map(n => <button type="button" key={n} onClick={() => inputDigit(String(n))} className={numBtn}>{n}</button>)}
        <button type="button" onClick={() => chooseOp('+')} className={opBtn}>＋</button>
        <button type="button" onClick={toggleSign} className={numBtn}>±</button>
        <button type="button" onClick={() => inputDigit('0')} className={numBtn}>0</button>
        <button type="button" onClick={() => inputDigit('.')} className={numBtn}>.</button>
        <button type="button" onClick={equals} className="h-11 rounded-lg text-sm font-bold bg-emerald-500 text-white hover:bg-emerald-600 active:scale-95 transition">＝</button>
      </div>
    </Card>
  );
}

function DashboardView({ data, rows, masters, jumpToFacility, openPrint, office, showToast }) {
  const [repType, setRepType] = useState('month');
  const [consumableOnly, setConsumableOnly] = useState(false);
  const [drilldown, setDrilldown] = useState(null); // KPIカードの施設別内訳モーダル
  const [repMonth, setRepMonth] = useState(data.baseIdx);
  const [repFy, setRepFy] = useState(Math.floor(fiscalStartIdx(data.baseIdx) / 12));
  const [customFrom, setCustomFrom] = useState(data.monthsAll[0] ?? data.baseIdx);
  const [customTo, setCustomTo] = useState(data.baseIdx);
  const [repBusy, setRepBusy] = useState(false);
  useEffect(() => {
    setRepMonth(data.baseIdx);
    setRepFy(Math.floor(fiscalStartIdx(data.baseIdx) / 12));
    setCustomFrom(data.monthsAll[0] ?? data.baseIdx);
    setCustomTo(data.baseIdx);
  }, [data.baseIdx]);

  // データに含まれる年度の一覧
  const fiscalYears = useMemo(() =>
    [...new Set(data.monthsAll.map(i => Math.floor(fiscalStartIdx(i) / 12)))].sort((a, b) => b - a), [data]);

  // 選んだ期間と、その1つ前の期間（前期比の計算用）
  const spec = useMemo(() => {
    if (repType === 'fy') {
      return { from: repFy * 12 + 3, to: repFy * 12 + 14, prevFrom: (repFy - 1) * 12 + 3, prevTo: (repFy - 1) * 12 + 14,
        title: '年度売上レポート', label: repFy + '年度（' + repFy + '年4月〜' + (repFy + 1) + '年3月）', short: repFy + '年度', file: repFy + '年度', prevName: '前年度' };
    }
    if (repType === 'trend') {
      const a = data.monthsAll[0] ?? 0, b = data.monthsAll[data.monthsAll.length - 1] ?? 0;
      return { from: a, to: b, prevFrom: null, prevTo: null,
        title: '月別推移レポート', label: idxLabel(a) + ' 〜 ' + idxLabel(b) + '（全期間）', short: '全期間', file: '全期間', prevName: '' };
    }
    if (repType === 'custom') {
      const from = Math.min(customFrom, customTo), to = Math.max(customFrom, customTo);
      const span = to - from + 1;
      return { from, to, prevFrom: from - span, prevTo: from - 1,
        title: '期間指定レポート', label: idxLabel(from) + ' 〜 ' + idxLabel(to), short: idxLabel(from) + '〜' + idxLabel(to),
        file: idxLabel(from) + '-' + idxLabel(to), prevName: '前期' };
    }
    return { from: repMonth, to: repMonth, prevFrom: repMonth - 1, prevTo: repMonth - 1,
      title: '月次売上レポート', label: idxLabel(repMonth), short: idxLabel(repMonth), file: idxLabel(repMonth), prevName: '前月' };
  }, [repType, repMonth, repFy, customFrom, customTo, data]);

  // 画面表示・帳票の両方がこの集計を参照する
  const rep = useMemo(() => buildPeriodReport(rows, masters, spec.from, spec.to, consumableOnly), [rows, masters, spec, consumableOnly]);
  const prevRep = useMemo(() => (spec.prevFrom === null ? null : buildPeriodReport(rows, masters, spec.prevFrom, spec.prevTo, consumableOnly)), [rows, masters, spec, consumableOnly]);
  const hasPrev = !!(prevRep && prevRep.kpi.count > 0);
  const pct = (now, base) => (hasPrev && base !== 0 ? Math.round((now - base) / Math.abs(base) * 100) : null);
  const momSales = prevRep ? pct(rep.kpi.sales, prevRep.kpi.sales) : null;
  const momGross = prevRep ? pct(rep.kpi.gross, prevRep.kpi.gross) : null;

  // 前年同月比（月次モードのときだけ意味を持つ）
  const yoyRep = useMemo(() => (repType === 'month' ? buildPeriodReport(rows, masters, repMonth - 12, repMonth - 12, consumableOnly) : null), [repType, repMonth, rows, masters, consumableOnly]);
  const hasYoy = !!(yoyRep && yoyRep.kpi.count > 0);
  const pctYoy = (now, base) => (hasYoy && base !== 0 ? Math.round((now - base) / Math.abs(base) * 100) : null);
  const yoyPctSales = yoyRep ? pctYoy(rep.kpi.sales, yoyRep.kpi.sales) : null;
  const yoyPctGross = yoyRep ? pctYoy(rep.kpi.gross, yoyRep.kpi.gross) : null;
  const yoyLabel = repType === 'month' ? idxLabel(repMonth - 12) : '';
  // KPIカードの施設別ドリルダウン用：月次モードは前年同月、それ以外は選択期間の直前と比較する
  const compareRep = repType === 'month' ? yoyRep : prevRep;

  // 推移グラフ: 月次は選んだ月までの12ヶ月、それ以外は期間内の各月
  const chartRep = useMemo(() => (repType === 'month' ? buildPeriodReport(rows, masters, repMonth - 11, repMonth, consumableOnly) : rep),
    [repType, repMonth, rows, masters, rep, consumableOnly]);

    const m = chartRep.monthly;
    return { values: m.map(x => x.sales), labels: m.map(x => idxShort(x.idx)) };
  }, [chartRep]);

  const facTop = rep.ranking.filter(f => f.sales > 0).slice(0, 10);

  const topProducts = rep.topProducts;

  // 今年度累計（期間の選択とは別に、常に4月〜基準月で表示）。全売上ベースなので data.reps（施設のみ）ではなく

    buildPeriodReport(rows, masters, fiscalStartIdx(data.baseIdx), data.baseIdx, consumableOnly)), [rows, masters, data.baseIdx, consumableOnly]);

    buildPeriodReport(rows, masters, fiscalStartIdx(data.baseIdx) - 12, data.baseIdx - 12, consumableOnly)), [rows, masters, data.baseIdx, consumableOnly]);
  const fyHasPrev = !!(fyRepPrev && fyRepPrev.monthly.length > 0);
  const fyTotal = useMemo(() => {
    const s = fyRepCur ? fyRepCur.kpi.sales : 0, p = fyRepPrev ? fyRepPrev.kpi.sales : 0;
    return { sales: s, prevSales: p, pct: fyHasPrev && p !== 0 ? Math.round((s - p) / Math.abs(p) * 100) : null };
  }, [fyRepCur, fyRepPrev, fyHasPrev]);
  const fyPrevLabel = data.fyLabel ? (parseInt(data.fyLabel, 10) - 1) + '年度' : '';
  const fyPrevRangeLabel = useMemo(() => {
    if (data.baseIdx == null) return '';
    const fyStart = fiscalStartIdx(data.baseIdx);
    return idxLabel(fyStart - 12) + '〜' + idxLabel(data.baseIdx - 12);
  }, [data.baseIdx]);

  const buildHtml = () => {
    if (rep.kpi.count === 0) return null;
    return buildReportHtml({ ...rep, title: spec.title, periodLabel: spec.label, issued: todayLabel(), office });
  };
  const handlePrint = () => {
    const html = buildHtml();
    if (!html) { showToast('その期間にはデータがありません', 'error'); return; }
    openPrint(html);   // プレビューを閉じてもこの画面の状態はそのまま
  };
  const handleReportPdf = async () => {
    const html = buildHtml();
    if (!html) { showToast('その期間にはデータがありません', 'error'); return; }
    setRepBusy(true);
    showToast('PDFを作成しています…', 'info');

    } finally { setRepBusy(false); }

  const selCls = 'h-10 w-full px-3 rounded-xl border border-slate-200 bg-white text-sm shadow-sm font-bold text-slate-600';

  return (
    <div className="space-y-5">

          <div className={repType === 'custom' ? 'flex items-center gap-2 shrink-0' : 'w-40 shrink-0'}>

              </select>

            {repType === 'fy' && (
              <select value={repFy} onChange={e => setRepFy(+e.target.value)} className={selCls}>

            {repType === 'custom' && (
              <>
                <select value={customFrom} onChange={e => setCustomFrom(+e.target.value)} className="h-10 w-36 px-3 rounded-xl border border-slate-200 bg-white text-sm shadow-sm font-bold text-slate-600">
                  {data.monthsAll.map(i => <option key={i} value={i}>{idxLabel(i)}</option>)}

      {drilldown && <KpiDrilldownModal {...drilldown} onClose={() => setDrilldown(null)} />}

      {/* ランキング2枚 */}
      <div className="grid lg:grid-cols-2 gap-4">
        <Card>
          <div className="px-5 py-3.5 border-b border-slate-100 flex items-center gap-2.5">
            <span className="inline-flex items-center justify-center w-8 h-8 rounded-xl bg-sky-50 text-sky-500"><Building2 size={16} /></span>
            <div className="flex-1">
              <div className="font-bold text-sm text-slate-800">施設別売上 TOP10</div>
              <div className="text-[11px] text-slate-600">{spec.short} ・ クリックで施設の詳細分析へ</div>
            </div>
          </div>
          <div className="divide-y divide-slate-50">
            {facTop.map((f, i) => (
              <button key={f.name} onClick={() => jumpToFacility(f.name)}
                className="w-full text-left px-5 py-2.5 hover:bg-slate-50 transition flex items-center gap-3 group">
                <span className={"w-7 h-7 rounded-lg text-xs font-bold inline-flex items-center justify-center shrink-0 " +
                  (i < 3 ? 'bg-sky-500 text-white' : 'bg-sky-50 text-sky-600')}>{i + 1}</span>
                <div className="flex-1 min-w-0">
                  <div className="font-bold text-xs text-slate-700 truncate">{f.name}</div>
                  <div className="mt-1 bg-slate-100 rounded-full h-1.5 overflow-hidden">
                    <div className="bg-sky-400 h-1.5 rounded-full" style={{ width: Math.max(3, Math.round(f.sales / facMax * 100)) + '%' }} />
                  </div>
                </div>
                <span className="text-xs font-extrabold tabular-nums text-slate-700 shrink-0">{yen(f.sales)}</span>
                <ChevronRight size={16} className="text-slate-400 group-hover:text-slate-700 group-hover:translate-x-0.5 transition shrink-0" />
              </button>
            ))}
            {facTop.length === 0 && (
              <div className="px-5 py-8 text-center text-xs text-slate-600">この期間の売上データがありません</div>
            )}
          </div>
        </Card>

        <Card>
          <div className="px-5 py-3.5 border-b border-slate-100 flex items-center gap-2.5">
            <span className="inline-flex items-center justify-center w-8 h-8 rounded-xl bg-emerald-50 text-emerald-500"><Package size={16} /></span>
            <div className="flex-1">
              <div className="font-bold text-sm text-slate-800">商品別売上 TOP10</div>
              <div className="text-[11px] text-slate-600">{spec.short} ・ 数量と売上金額</div>
            </div>
          </div>
          <div className="divide-y divide-slate-50">
            {topProducts.map((p, i) => (
              <div key={p.name} className="px-5 py-2.5 flex items-center gap-3">
                <span className={"w-7 h-7 rounded-lg text-xs font-bold inline-flex items-center justify-center shrink-0 " +
                  (i < 3 ? 'bg-emerald-500 text-white' : 'bg-emerald-50 text-emerald-600')}>{i + 1}</span>
                <div className="flex-1 min-w-0">
                  <div className="font-bold text-xs text-slate-700 truncate">{p.name}</div>
                  <div className="text-[10px] text-slate-600">{p.cat}</div>
                </div>
                <span className="text-[11px] text-slate-700 tabular-nums shrink-0">{fmtQty(p.qty)}{p.unit || ''}</span>
                <span className="text-xs font-extrabold tabular-nums text-slate-700 shrink-0 w-20 text-right">{yen(p.sales)}</span>
              </div>
            ))}
            {topProducts.length === 0 && (
              <div className="px-5 py-8 text-center text-xs text-slate-600">この期間の売上データがありません</div>
            )}
          </div>
        </Card>
      </div>

      {/* 分類別売上 */}
      <Card className="overflow-x-auto">
        <div className="px-5 py-3.5 border-b border-slate-100">
          <div className="font-bold text-sm text-slate-800">分類別売上</div>
          <div className="text-[11px] text-slate-600">{spec.short}</div>
        </div>
        <div className="overflow-x-auto">
        <table className="w-full text-sm min-w-[560px]">
          <thead>
            <tr className="text-[11px] uppercase tracking-wide text-slate-600 border-b border-slate-100">
              <th className="text-left font-bold px-5 py-2.5">分類</th>
              <th className="text-right font-bold px-2 py-2.5 pr-4">売上</th>
              <th className="text-left font-bold px-2 py-2.5 w-40">構成比</th>
              <th className="text-right font-bold px-5 py-2.5">粗利率</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-50">
            {rep.categories.map(c => (
              <tr key={c.name} className="hover:bg-slate-50 transition">
                <td className="px-5 py-2.5 font-bold text-slate-700">{c.name}</td>
                <td className="px-2 py-2.5 pr-4 text-right tabular-nums font-bold text-slate-800">{yen(c.sales)}</td>
                <td className="px-2 py-2.5">
                  <div className="flex items-center gap-2">
                    <div className="flex-1 bg-slate-100 rounded-full h-1.5 overflow-hidden">
                      <div className="bg-sky-400 h-1.5 rounded-full" style={{ width: Math.min(100, c.share) + '%' }} />
                    </div>
                    <span className="text-[11px] text-slate-700 tabular-nums font-bold w-8 text-right">{c.share}%</span>
                  </div>
                </td>
                <td className="px-5 py-2.5 text-right tabular-nums text-slate-700">{c.margin}%</td>
              </tr>
            ))}
            {rep.categories.length === 0 && (
              <tr><td colSpan={4} className="px-5 py-8 text-center text-xs text-slate-600">この期間の売上データがありません</td></tr>
            )}
          </tbody>
        </table>
        </div>
      </Card>

      {/* 月別売上推移 */}
      <Card className="p-5">
        <div className="flex items-center justify-between mb-2">
          <div className="font-bold text-sm text-slate-800">月別売上推移</div>
          <span className="text-[11px] text-slate-600 font-bold">
            {repType === 'month' ? '選んだ月までの12ヶ月' : spec.short} ・ 単位: 千円
          </span>
        </div>
        {chart.values.length > 1
          ? <AreaChart values={chart.values} labels={chart.labels} />
          : <div className="py-8 text-center text-xs text-slate-600">推移を表示するには2ヶ月以上のデータが必要です</div>}
      </Card>
    </div>
  );
}

/* ============================================================
   画面2: 施設別
============================================================ */
/* 増減率順で並べるときの対象条件（小さい取引の％は振れが大きく参考にならないため） */
const DECLINE_MIN_BASE = 50000;   // 直近3ヶ月平均がこの金額以上の施設だけを見る

/* CSV出力の対象期間 */
const CSV_PERIODS = [['all', '全期間'], ['fy', '今年度'], ['month', '月を選ぶ']];

function FacilitiesView({ data, openId, setOpenId, repFilter, setRepFilter, showToast, openPrint, startDoc, office }) {
  const [search, setSearch] = useState('');
  const [suggestOpen, setSuggestOpen] = useState(false);
  const [sortKey, setSortKey] = useState('sales');
  const [csvPeriod, setCsvPeriod] = useState('all');
  const [csvMonth, setCsvMonth] = useState(data.baseIdx);
  const boxRef = useRef(null);

  useEffect(() => { setCsvMonth(data.baseIdx); }, [data.baseIdx]);
  // 候補リストの外側をクリックしたら閉じる
  useEffect(() => {
    if (!suggestOpen) return;
    const h = (e) => { if (boxRef.current && !boxRef.current.contains(e.target)) setSuggestOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [suggestOpen]);

  const rows = useMemo(() => {
    let list = data.facilities;
    if (repFilter !== null) list = list.filter(f => f.repName === repFilter);
    if (search.trim()) list = list.filter(f => f.name.includes(search.trim()));
    // 増減率順のときは、比較のもとが小さい施設（0円・少額）を除いて実質的な増減だけを見る
    if (sortKey === 'decline') list = list.filter(f => f.monthly[11] !== 0 && f.prev3 >= DECLINE_MIN_BASE);
    const sorters = {
      sales: (a, b) => b.monthly[11] - a.monthly[11],
      avg: (a, b) => b.avg - a.avg,
      decline: (a, b) => a.pct - b.pct,
      name: (a, b) => a.name.localeCompare(b.name, 'ja'),
    };
    return list.slice().sort(sorters[sortKey]);
  }, [data, search, sortKey, repFilter]);
  const declineHidden = sortKey === 'decline'
    ? data.facilities.filter(f => repFilter === null || f.repName === repFilter).length - rows.length : 0;

  // 検索候補（入力に応じて最大8件）
  const suggests = useMemo(() => {
    const q = normalizeSearchText(search.trim());
    if (!q) return [];
    return data.facilities.filter(f => normalizeSearchText(f.name).includes(q))
      .sort((a, b) => b.monthly[11] - a.monthly[11]).slice(0, 8);
  }, [data, search]);

  const selectFacility = (name) => {
    setOpenId(name);
    setSearch('');
    setSuggestOpen(false);
  };

  // 選択中の施設の詳細分析（推移・売上/個数ランキング・分類構成・明細）
  const detail = useMemo(() => {
    if (!openId) return null;
    const f = data.facByName.get(openId);
    if (!f) return null;
    const salesOf = (p) => sum12(p.sales12);
    const qtyOf = (p) => sum12(p.qty12);
    const salesRank = f.pairs.filter(p => salesOf(p) > 0)
      .sort((a, b) => salesOf(b) - salesOf(a)).slice(0, 10)
      .map(p => ({ prod: p.prod, sales: salesOf(p), qty: qtyOf(p), unit: p.unit || '' }));
    const salesMax = salesRank.length ? salesRank[0].sales : 1;
    const qtyRank = f.pairs.filter(p => qtyOf(p) > 0)
      .sort((a, b) => qtyOf(b) - qtyOf(a)).slice(0, 10)
      .map(p => ({ prod: p.prod, qty: qtyOf(p), unit: p.unit || '', sales: salesOf(p) }));
    const qtyMax = qtyRank.length ? qtyRank[0].qty : 1;
    const catAgg = new Map();
    f.pairs.forEach(p => {
      const s = salesOf(p);
      if (s <= 0) return;
      const prod = data.prodByName.get(p.prod);
      const cat = prod ? prod.cat : 'その他';
      catAgg.set(cat, (catAgg.get(cat) || 0) + s);
    });
    const cats = [...catAgg.entries()].sort((a, b) => b[1] - a[1]);
    const catTotal = cats.reduce((s, c) => s + c[1], 0) || 1;
    let lastD = null;
    for (const r of f.rows) { const d = parseDateStr(r[1]); if (d && (!lastD || d.sort > lastD.sort)) lastD = d; }
    const recent = f.rows.slice()
      .sort((a, b) => ((parseDateStr(b[1]) || {}).sort || 0) - ((parseDateStr(a[1]) || {}).sort || 0))
      .slice(0, 12)
      .map(r => [r[1], r[3], num(+r[4] || 0) + ' ' + (r[5] || ''), +r[7] || 0]);
    // 前年同月（月別売上推移グラフの比較線用）。データがない月は null にして線を切る
    const prevMonthly = data.win.map(idx => {
      const m = f.byMonth.get(idx - 12);
      return m ? m.sales : null;
    });
    return { f, salesRank, salesMax, qtyRank, qtyMax, cats, catTotal, lastD, recent, prevMonthly };
  }, [data, openId]);

  const handleFacPrint = (f) => {
    const prows = f.pairs.slice()
      .sort((a, b) => sum12(b.sales12) - sum12(a.sales12))
      .slice(0, 15)
      .map(p => {
        const prod = data.prodByName.get(p.prod);
        return {
          product: p.prod,
          cat: prod ? prod.cat : 'その他',
          qty: fmtQty(sum12(p.qty12) / 12),
          unit: p.unit || (prod ? prod.unit : '') || '',
          price: p.lastPrice,
          last: p.lastDate ? p.lastDate.y + '/' + p.lastDate.mo + '/' + p.lastDate.d : '—',
        };
      })
      .filter(r => r.qty > 0);
    openPrint(buildFacilitySalesHtml({
      name: f.name, repName: f.repName, rows: prows,
      monthly: f.monthly, labels: data.winShort, yearTotal: f.winSum,
      periodText: idxLabel(data.win[0]) + ' 〜 ' + idxLabel(data.win[11]) + '（12ヶ月）',
      issued: todayLabel(), office,
    }));
  };

  // 対象期間の月インデックス（CSV用）
  const csvMonthIdxs = useMemo(() => {
    if (csvPeriod === 'month') return [csvMonth];
    if (csvPeriod === 'fy') {
      const s = fiscalStartIdx(data.baseIdx);
      return data.monthsAll.filter(i => i >= s && i <= s + 11);
    }
    return data.monthsAll;
  }, [csvPeriod, csvMonth, data]);
  const csvPeriodLabel = useMemo(() => {
    if (csvPeriod === 'month') return idxLabel(csvMonth);
    if (csvPeriod === 'fy') return Math.floor(fiscalStartIdx(data.baseIdx) / 12) + '年度';
    return '全期間';
  }, [csvPeriod, csvMonth, data]);

  // 施設別CSV（月列は日本語表記。Excelが日付に変換しないように）
  const handleCsv = (only) => {
    const targets = only ? [only] : rows;
    const idxs = csvMonthIdxs;
    if (idxs.length === 0) { showToast('対象期間にデータがありません', 'error'); return; }
    const multi = idxs.length > 1;
    const head = ['施設名', '担当', '直送', '売上合計', '粗利額', '粗利率%'];
    if (multi) head.push('月平均');
    idxs.forEach(i => head.push(idxLabel(i)));
    const lines = targets.map(f => {
      let s = 0, g = 0;
      const cells = idxs.map(i => {
        const m = f.byMonth.get(i);
        const v = m ? m.sales : 0;
        s += v; g += m ? m.gross : 0;
        return Math.round(v);
      });
      const row = [f.name, f.repName, f.direct ? '直送' : '', Math.round(s), Math.round(g),
        s !== 0 ? Math.round(g / s * 1000) / 10 : 0];
      if (multi) row.push(Math.round(s / idxs.length));
      return row.concat(cells);
    });
    const name = (only ? only.name.replace(/[\\/:*?"<>|]/g, '') + '_' : '施設別売上_') + csvPeriodLabel + '_' + todayCompact() + '.csv';
    downloadText(name, buildCsv([head, ...lines]), 'text/csv');
    showToast(csvPeriodLabel + 'のCSVを出力しました（' + num(targets.length) + '施設）');
  };

  // 選択中の施設の商品別CSV（直近12ヶ月）
  const handleProdCsv = (f) => {
    const head = ['商品名', '分類', '単位', '数量合計', '売上合計', '直近単価', '最終購入日'];
    const lines = f.pairs
      .filter(p => sum12(p.sales12) !== 0 || sum12(p.qty12) !== 0)
      .sort((a, b) => sum12(b.sales12) - sum12(a.sales12))
      .map(p => {
        const prod = data.prodByName.get(p.prod);
        return [p.prod, prod ? prod.cat : 'その他', p.unit || (prod ? prod.unit : '') || '',
          fmtQty(sum12(p.qty12)), Math.round(sum12(p.sales12)), p.lastPrice,
          p.lastDate ? p.lastDate.y + '/' + p.lastDate.mo + '/' + p.lastDate.d : ''];
      });
    downloadText(f.name.replace(/[\\/:*?"<>|]/g, '') + '_商品別_' + todayCompact() + '.csv',
      buildCsv([head, ...lines]), 'text/csv');
    showToast('商品別CSVを出力しました（直近12ヶ月）');
  };

  const searchBoxJsx = (
    <div className="relative" ref={boxRef}>
      <Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-600" />
      <input value={search}
        onChange={e => { setSearch(e.target.value); setSuggestOpen(true); }}
        onFocus={() => setSuggestOpen(true)}
        onKeyDown={e => { if (e.key === 'Enter' && suggests.length > 0) selectFacility(suggests[0].name); if (e.key === 'Escape') setSuggestOpen(false); }}
        placeholder="施設名を入力して選ぶ（例: ひかり）"
        className="h-11 pl-10 pr-8 rounded-xl border-2 border-sky-200 text-sm w-72 bg-white shadow-sm focus:border-sky-400 focus:outline-none transition font-bold text-slate-700 placeholder:font-normal placeholder:text-slate-600" />
      {search && (
        <button onClick={() => { setSearch(''); setSuggestOpen(false); }}
          className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700"><X size={15} /></button>
      )}
      {suggestOpen && search.trim() && (
        <div className="absolute z-30 mt-1.5 w-full bg-white rounded-xl border border-slate-200 shadow-xl overflow-hidden">
          {suggests.map(f => (
            <button key={f.name} onMouseDown={e => e.preventDefault()} onClick={() => selectFacility(f.name)}
              className="w-full text-left px-4 py-2.5 hover:bg-sky-50 transition flex items-center gap-2 border-b border-slate-50 last:border-0">
              <Building2 size={14} className="text-sky-400 shrink-0" />
              <span className="flex-1 min-w-0 text-xs font-bold text-slate-700 truncate">{f.name}</span>
              <span className="text-[10px] text-slate-600 tabular-nums shrink-0">今月 {yen(f.monthly[11])}</span>
            </button>
          ))}
          {suggests.length === 0 && (
            <div className="px-4 py-3 text-xs text-slate-600">「{search}」に一致する施設はありません</div>
          )}
        </div>
      )}
    </div>
  );

  const csvControls = (only) => (
    <div className="flex items-center gap-2 flex-wrap">
      <select value={csvPeriod} onChange={e => setCsvPeriod(e.target.value)}
        className="h-10 px-3 rounded-xl border border-slate-200 bg-white text-sm shadow-sm font-bold text-slate-600">
        {CSV_PERIODS.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
      </select>
      {csvPeriod === 'month' && (
        <select value={csvMonth} onChange={e => setCsvMonth(+e.target.value)}
          className="h-10 px-3 rounded-xl border border-slate-200 bg-white text-sm shadow-sm font-bold text-slate-600">
          {data.monthsAll.slice().reverse().map(i => <option key={i} value={i}>{idxLabel(i)}</option>)}
        </select>
      )}
      <button onClick={() => handleCsv(only)}
        className="bg-teal-600 hover:bg-teal-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-teal-200 text-sm font-bold transition inline-flex items-center gap-1.5">
        <FileSpreadsheet size={15} /> CSV出力
      </button>
    </div>
  );

  /* ---------- 施設を1つ選んでいるとき: その施設だけを表示 ---------- */
  if (openId && detail) {
    const f = detail.f;
    return (
      <div className="space-y-4">
        <div className="flex items-center gap-2.5 flex-wrap">
          <button onClick={() => setOpenId(null)}
            className="bg-white border border-slate-200 hover:border-slate-300 active:scale-[.98] text-slate-600 px-3.5 py-2.5 rounded-xl shadow-sm text-sm font-bold transition inline-flex items-center gap-1.5">
            ← 施設一覧へ戻る
          </button>
          {searchBoxJsx}
          <div className="ml-auto">{csvControls(f)}</div>
        </div>

        <Card className="px-5 py-4">
          <div className="flex items-start justify-between gap-3 flex-wrap">
            <div className="flex items-center gap-3 min-w-0">
              <span className="inline-flex items-center justify-center w-11 h-11 rounded-2xl bg-sky-50 text-sky-500 shrink-0"><Building2 size={20} /></span>
              <div className="min-w-0">
                <div className="font-extrabold text-slate-800 text-lg leading-tight break-words">{f.name}</div>
                <div className="text-[11px] text-slate-600 mt-0.5">
                  担当: {f.repName}
                  {f.direct && <span className="ml-2 inline-flex items-center gap-0.5 bg-violet-50 text-violet-600 text-[10px] font-bold px-1.5 py-0.5 rounded-md"><Truck size={10} />直送</span>}
                  <span className="ml-2">対象期間: {idxLabel(data.win[0])} 〜 {idxLabel(data.win[11])}</span>
                </div>
              </div>
            </div>
            <div className="flex gap-2 flex-wrap shrink-0">
              <button onClick={() => handleProdCsv(f)}
                className="bg-white border border-teal-200 hover:border-teal-300 active:scale-[.98] text-teal-700 px-3.5 py-2 rounded-xl shadow-sm text-xs font-bold transition inline-flex items-center gap-1.5">
                <FileSpreadsheet size={13} /> 商品別CSV
              </button>
              <button onClick={() => handleFacPrint(f)}
                className="bg-sky-600 hover:bg-sky-700 active:scale-[.98] text-white px-3.5 py-2 rounded-xl shadow-sm shadow-sky-200 text-xs font-bold transition inline-flex items-center gap-1.5">
                <Printer size={13} /> 販売リストを印刷
              </button>
              <button onClick={() => startDoc('order', f.name)}
                className="bg-emerald-600 hover:bg-emerald-700 active:scale-[.98] text-white px-3.5 py-2 rounded-xl shadow-sm shadow-emerald-200 text-xs font-bold transition inline-flex items-center gap-1.5">
                <ClipboardList size={13} /> 発注書を作成
              </button>
              <button onClick={() => startDoc('quote', f.name)}
                className="bg-blue-600 hover:bg-blue-700 active:scale-[.98] text-white px-3.5 py-2 rounded-xl shadow-sm shadow-blue-200 text-xs font-bold transition inline-flex items-center gap-1.5">
                <FileSpreadsheet size={13} /> 見積書を作成
              </button>
            </div>
          </div>
        </Card>

        {/* 基本指標 */}
        <div className="flex gap-3 flex-wrap">
          <KpiCard icon={JapaneseYen} tint="bg-blue-50 text-blue-600" label="今月売上" value={yen(f.monthly[11])} delta={f.pct} deltaSuffix="%" note="直近3ヶ月平均比"
            extra={(
              <div className="flex items-center justify-between gap-2">
                <span className="text-[10px] text-slate-600 font-bold">前年同月比（{idxLabel(data.baseIdx - 12)}）</span>
                {f.yoyPct === null ? <span className="text-[10px] text-slate-400 font-bold">—</span> : <DeltaPill v={f.yoyPct} />}
              </div>
            )} />
          <KpiCard icon={Coins} tint="bg-emerald-50 text-emerald-600" label="月平均" value={yen(f.avg)} note="12ヶ月" />
