  </div>`;
}

/* ============================================================
   出力: CSV(UTF-8+BOM) / JSONダウンロード
============================================================ */
// = + - @ タブ で始まる値は Excel が数式として実行してしまう（CSVインジェクション）。
// 商品名や仕入先名は販売管理システムから来るのでこちらで内容を選べない。
// 数値そのものは対象外（マイナス金額を壊さないため）。
const csvEsc = (v) => {
  let s = String(v ?? '');
  if (/^[=+\-@\t\r]/.test(s) && !/^-?\d+(\.\d+)?$/.test(s)) s = "'" + s;
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};
const buildCsv = (rows2d) => '﻿' + rows2d.map(r => r.map(csvEsc).join(',')).join('\r\n');
// 分析CSVの先頭に集計条件（対象期間・金額の種類・絞り込み・集計時点）を入れ、1行空けて表を続ける
const buildCsvWithConditions = (conds, table) => buildCsv([...conds.filter(c => c && c[1] !== '' && c[1] != null), [], ...table]);
const dataRangeLabel = (data) => (data.firstDate ? dateLabel(data.firstDate.idx, data.firstDate.d) + '〜' + dateLabel(data.latestDate.idx, data.latestDate.d) : '—');
// 月インデックスの範囲を日付で（最終月が取込済みの最終売上日の月なら、その日まで）
const idxRangeDates = (fromIdx, toIdx, latest) => dateLabel(fromIdx, 1) + '〜' +
  (latest && latest.idx === toIdx ? dateLabel(toIdx, latest.d) : dateLabel(toIdx, daysInMonthIdx(toIdx)));
// 印刷用HTMLをそのままA4のPDFにする（画面外に実寸で描画 → html2canvas → jsPDF）
async function exportPdf(html, fileName) {
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-10000px;top:0;width:210mm;background:#fff;z-index:-1;';
  holder.innerHTML = html;
  document.body.appendChild(holder);
  try {
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    const docs = holder.querySelectorAll('.doc');
    const targets = docs.length ? docs : [holder];
    let first = true;
    for (let i = 0; i < targets.length; i++) {
      const canvas = await html2canvas(targets[i], { scale: 2, backgroundColor: '#ffffff', logging: false });
      const pageHpx = canvas.width * 297 / 210;   // 1ページ分の高さ(px)
      for (let y = 0; y < canvas.height - 2; y += pageHpx) {
        const h = Math.min(pageHpx, canvas.height - y);
        const slice = document.createElement('canvas');
        slice.width = canvas.width;
        slice.height = h;
        slice.getContext('2d').drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
        if (!first) pdf.addPage();
        first = false;
        pdf.addImage(slice.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, h * 210 / canvas.width);
      }
    }
    pdf.save(fileName);
  } finally {
    document.body.removeChild(holder);
  }
}

function downloadText(fileName, text, mime) {
  const blob = new Blob([text], { type: mime || 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ============================================================
   出力: Excel（.xlsx）— 見積書・発注書を、印刷・PDF と同じ形の Excel でも保存する
   ブラウザの中で xlsx を組み立てる（サーバーへは送らない）。zip 圧縮だけ fflate（jsPDF が使っているもの）を使い、
   書式・結合セル・計算式・A4 の印刷設定は Office Open XML を直接書く。見積・提案書作成（taiyo-mitsumori）の Excel 保存と同じ作り。
============================================================ */
const XL_MINCHO = 'BIZ UDP明朝 Medium'; // 印刷帳票の BIZ UDPMincho と同じ書体（Windows 10 以降に標準）。無い PC では Excel が近い明朝体で表示する
const XL_MDW = 10;                       // 標準フォント（BIZ UDP明朝 Medium 11pt）の数字1文字の幅(px)。列幅の mm → Excel の幅 の換算に使う
const XL_PX_MM = 96 / 25.4;
const XL_PT_MM = 72 / 25.4;
const XL_NS_MAIN = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
const XL_NS_R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
const XL_CT = 'application/vnd.openxmlformats-officedocument.';
const XL_XML_HEAD = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
const XL_MIME = XL_CT + 'spreadsheetml.sheet';
const XL_YEN = '"¥"#,##0;"¥"-#,##0'; // 印刷の yen()（四捨五入して ¥1,234／¥-1,500）と同じ見え方

// XML に書けない制御文字を除いてエスケープ
const xlEsc = (s) => String(s == null ? '' : s)
  .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F￾￿]/g, '')
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const xlColName = (c) => { let s = ''; let n = c + 1; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
// 0 始まりの行・列 → "A1"（abs=true で "$A$1"）
const xlRef = (r, c, abs) => abs ? `$${xlColName(c)}$${r + 1}` : `${xlColName(c)}${r + 1}`;
const xlRange = (r1, c1, r2, c2, abs) => `${xlRef(r1, c1, abs)}:${xlRef(r2, c2, abs)}`;
const xlArgb = (hex) => 'FF' + String(hex || '000000').replace('#', '').toUpperCase();
const xlNum = (n) => { const v = Number(n); return isFinite(v) ? String(Number(v.toPrecision(15))) : '0'; }; // Excel と同じ有効15桁
// mm → Excel の列幅（標準フォントの数字幅単位。パディング込みの値をそのまま書く）
const xlColWidth = (mm) => Math.max(0.5, Math.round(mm * XL_PX_MM / XL_MDW * 256) / 256);

// 文字幅（em）の見積り。列幅と行の高さ（折り返し行数）を決めるのに使う。
// 半角英数は BIZ UDP明朝 の実際の字幅（0x20〜0x7E、1/100 em）、かなは少し広めに見積もる
const XL_ASCII_EM = [33, 38, 49, 86, 68, 100, 87, 30, 47, 47, 50, 84, 33, 50, 33, 50, 68, 52, 68, 68, 68, 68, 68, 68, 68, 68, 33, 33, 84, 84, 84, 70, 98, 84, 74, 81, 80, 72, 66, 84, 80, 38, 50, 79, 63, 96, 84, 84, 70, 86, 75, 70, 70, 82, 76, 98, 80, 76, 72, 50, 50, 50, 50, 31, 50, 62, 64, 58, 63, 63, 46, 66, 67, 33, 40, 65, 33, 92, 66, 62, 65, 64, 46, 54, 42, 64, 61, 86, 66, 64, 55, 51, 44, 51, 50];
const xlTextEm = (s) => {
  let w = 0;
  for (const ch of String(s == null ? '' : s)) {
    const cp = ch.codePointAt(0);
    if (cp >= 0x20 && cp < 0x7f) w += XL_ASCII_EM[cp - 0x20] / 100;
    else if (cp === 0xa5) w += 0.68; // ¥
    else if (cp >= 0xff61 && cp <= 0xff9f) w += 0.5; // 半角カナ
    else if ('（）「」【】・：'.includes(ch)) w += 0.5;
    else if ('、。'.includes(ch)) w += 0.6;
    else if (ch === '　') w += 0.667; // 全角スペース（BIZ UDP明朝 は 2/3 em）
    else if ((cp >= 0x3041 && cp <= 0x30ff)) w += 0.95; // かな（プロポーショナル）
    else w += 1;
  }
  return w;
};
// 幅 widthMm のセルに sizePt の文字を折り返したときの行数。
// 書体が置き換わって列が少し狭く見える PC でも文字が切れないよう、使える幅は1割弱少なめに見積もる
const xlLineCount = (text, widthMm, sizePt) => {
  const usable = Math.max(4, (widthMm - 4) * 0.93); // セル内の左右余白・字下げ
  const emMm = sizePt / XL_PT_MM;
  return String(text == null ? '' : text).split('\n').reduce((n, line) => n + Math.max(1, Math.ceil(xlTextEm(line) * emMm / usable - 0.02)), 0);
};

function createXlsxBook() {
  const baseFont = { name: XL_MINCHO, sz: 11 }; // 標準スタイルの書体（列幅の単位もこの書体の数字幅になる）
  const familyOf = (name) => (/明朝|Mincho/i.test(name) ? 1 : 3);
  // --- スタイル（フォント・塗り・罫線・表示形式・配置）を重複なく登録 ---
  const fonts = [], fills = ['<fill><patternFill patternType="none"/></fill>', '<fill><patternFill patternType="gray125"/></fill>'];
  const borders = ['<border><left/><right/><top/><bottom/><diagonal/></border>'];
  const numFmts = [], xfs = [];
  const idx = { font: new Map(), fill: new Map(), border: new Map(), numFmt: new Map(), xf: new Map() };
  const intern = (map, list, key, make) => { if (map.has(key)) return map.get(key); list.push(make()); map.set(key, list.length - 1); return list.length - 1; };
  const fontBody = (f, tagName) => {
    const name = f.name || baseFont.name;
    return (f.b ? '<b/>' : '') + `<sz val="${xlNum(f.sz || baseFont.sz)}"/>` + `<color rgb="${xlArgb(f.color || '000000')}"/>`
      + `<${tagName} val="${xlEsc(name)}"/><family val="${familyOf(name)}"/><charset val="128"/>`;
  };
  const fontId = (f = {}) => intern(idx.font, fonts, JSON.stringify([f.name || '', f.sz || 0, !!f.b, f.color || '']), () => `<font>${fontBody(f, 'name')}</font>`);
  fontId({});
  const fillId = (hex) => (hex ? intern(idx.fill, fills, hex, () => `<fill><patternFill patternType="solid"><fgColor rgb="${xlArgb(hex)}"/><bgColor indexed="64"/></patternFill></fill>`) : 0);
  // 罫線は { l, r, t, b } に 'thin:93C5FD' のような「線種:色」を指定
  const edge = (tag, spec) => { if (!spec) return `<${tag}/>`; const [st, col] = String(spec).split(':'); return `<${tag} style="${st}"><color rgb="${xlArgb(col || '000000')}"/></${tag}>`; };
  const borderId = (b) => {
    if (!b || !(b.l || b.r || b.t || b.b)) return 0;
    return intern(idx.border, borders, [b.l, b.r, b.t, b.b].join('|'), () => `<border>${edge('left', b.l)}${edge('right', b.r)}${edge('top', b.t)}${edge('bottom', b.b)}<diagonal/></border>`);
  };
  const BUILTIN_FMT = { General: 0, '0': 1, '0.00': 2, '#,##0': 3, '#,##0.00': 4, '@': 49 };
  const numFmtId = (code) => {
    if (!code) return 0;
    if (BUILTIN_FMT[code] !== undefined) return BUILTIN_FMT[code];
    return 164 + intern(idx.numFmt, numFmts, code, () => code);
  };
  // st = { font:{name,sz,b,color}, fill:'RRGGBB', border:{l,r,t,b}, align:{h,v,wrap,indent,shrink}, fmt:'表示形式' }
  const style = (st = {}) => {
    const key = JSON.stringify(st);
    if (idx.xf.has(key)) return idx.xf.get(key);
    const f = fontId(st.font || {}), fl = fillId(st.fill), bd = borderId(st.border), nf = numFmtId(st.fmt);
    const al = st.align || {};
    const alignXml = (al.h || al.v || al.wrap || al.indent || al.shrink)
      ? `<alignment${al.h ? ` horizontal="${al.h}"` : ''}${al.v ? ` vertical="${al.v}"` : ''}${al.wrap ? ' wrapText="1"' : ''}${al.indent ? ` indent="${al.indent}"` : ''}${al.shrink && !al.wrap ? ' shrinkToFit="1"' : ''}/>` : '';
    xfs.push(`<xf numFmtId="${nf}" fontId="${f}" fillId="${fl}" borderId="${bd}" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1">${alignXml}</xf>`);
    idx.xf.set(key, xfs.length - 1);
    return xfs.length - 1;
  };
  style({}); // 0 番 = 既定

  // --- 共有文字列（リッチテキスト＝1セル内で大きさ・色を変える文字にも対応） ---
  const sst = [], sstIdx = new Map();
  let sstRefs = 0;
  // 先頭・末尾の空白や改行を残すときだけ xml:space="preserve" を付ける（Excel と同じ）
  const tXml = (t) => `<t${/^\s|\s$|[\n\t]/.test(String(t)) ? ' xml:space="preserve"' : ''}>${xlEsc(t)}</t>`;
  const runXml = (run) => `<r><rPr>${fontBody(run.font || {}, 'rFont')}</rPr>${tXml(run.t)}</r>`;
  const stringId = (v) => {
    sstRefs++;
    const key = typeof v === 'string' ? 's:' + v : 'r:' + JSON.stringify(v);
    if (sstIdx.has(key)) return sstIdx.get(key);
    const xml = typeof v === 'string' ? `<si>${tXml(v)}</si>` : `<si>${v.rich.filter(r => r.t !== '' && r.t != null).map(runXml).join('')}</si>`;
    sst.push(xml); sstIdx.set(key, sst.length - 1);
    return sst.length - 1;
  };

  const sheets = [];
  const addSheet = (name, pageOpts = {}) => {
    const ws = {
      name: (String(name || 'Sheet1').replace(/[\[\]:*?\/\\]/g, ' ').trim() || 'Sheet1').slice(0, 31), cols: [], rows: new Map(), merges: [],
      page: Object.assign({ orientation: 'portrait', paper: 9, margins: { l: 15, r: 15, t: 12, b: 12, h: 6, f: 6 }, fitWidth: 1, fitHeight: 0, hCenter: true, printArea: null, printTitles: null }, pageOpts),
    };
    const rowOf = (r) => { if (!ws.rows.has(r)) ws.rows.set(r, { ht: null, cells: new Map() }); return ws.rows.get(r); };
    // 列幅（mm 指定）
    ws.setCols = (mmList) => { ws.cols = mmList.map(xlColWidth); };
    ws.height = (r, pt) => { rowOf(r).ht = Math.min(409, Math.max(rowOf(r).ht || 0, Math.round(pt * 4) / 4)); }; // Excel の行の高さは 409pt まで
    // 値: 数値 / 文字列 / { rich:[{t,font}] } / { f:'式', v:キャッシュ値 } / null（書式だけ）
    ws.cell = (r, c, v, s) => { rowOf(r).cells.set(c, { v, s: s || 0 }); };
    ws.styleOnly = (r, c, s) => { const row = rowOf(r); const cur = row.cells.get(c); row.cells.set(c, { v: cur ? cur.v : null, s }); };
    // 結合セル：外枠の罫線を周囲のセルに振り分け、塗りは全セルに入れる
    ws.box = (r1, c1, r2, c2, v, st = {}) => {
      const b = st.border || {};
      for (let r = r1; r <= r2; r++) {
        for (let c = c1; c <= c2; c++) {
          const cs = Object.assign({}, st, { border: { l: c === c1 ? b.l : undefined, r: c === c2 ? b.r : undefined, t: r === r1 ? b.t : undefined, b: r === r2 ? b.b : undefined } });
          if (r === r1 && c === c1) ws.cell(r, c, v, style(cs));
          else ws.styleOnly(r, c, style(cs));
        }
      }
      if (r1 !== r2 || c1 !== c2) ws.merges.push(xlRange(r1, c1, r2, c2));
    };
    sheets.push(ws);
    return ws;
  };

  const sheetXml = (ws, sheetIndex) => {
    const rowsSorted = [...ws.rows.keys()].sort((a, b) => a - b);
    let maxR = 0, maxC = 0;
    const sd = rowsSorted.map(r => {
      const row = ws.rows.get(r);
      const cols = [...row.cells.keys()].sort((a, b) => a - b);
      maxR = Math.max(maxR, r);
      const cells = cols.map(c => {
        maxC = Math.max(maxC, c);
        const { v, s } = row.cells.get(c);
        const ref = xlRef(r, c);
        const sa = s ? ` s="${s}"` : '';
        if (v === null || v === undefined || v === '') return `<c r="${ref}"${sa}/>`;
        if (typeof v === 'number') return isFinite(v) ? `<c r="${ref}"${sa}><v>${xlNum(v)}</v></c>` : `<c r="${ref}"${sa}/>`;
        if (typeof v === 'object' && v.f) return `<c r="${ref}"${sa}><f>${xlEsc(v.f)}</f>${v.v === undefined || v.v === null || !isFinite(Number(v.v)) ? '' : `<v>${xlNum(v.v)}</v>`}</c>`;
        return `<c r="${ref}"${sa} t="s"><v>${stringId(v)}</v></c>`;
      }).join('');
      const ht = row.ht ? ` ht="${xlNum(row.ht)}" customHeight="1"` : '';
      return `<row r="${r + 1}"${ht}>${cells}</row>`;
    }).join('');
    const p = ws.page;
    const dim = `<dimension ref="A1:${xlRef(Math.max(0, maxR), Math.max(0, maxC, ws.cols.length - 1))}"/>`;
    const fit = p.fitWidth || p.fitHeight ? '<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>' : '';
    const views = `<sheetViews><sheetView showGridLines="0"${sheetIndex === 0 ? ' tabSelected="1"' : ''} zoomScale="100" zoomScaleNormal="100" workbookViewId="0"><selection activeCell="A1" sqref="A1"/></sheetView></sheetViews>`;
    const colsXml = ws.cols.length ? `<cols>${ws.cols.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${xlNum(w)}" customWidth="1"/>`).join('')}</cols>` : '';
    const merges = ws.merges.length ? `<mergeCells count="${ws.merges.length}">${ws.merges.map(m => `<mergeCell ref="${m}"/>`).join('')}</mergeCells>` : '';
    const mm2in = (mm) => xlNum(Math.round(mm / 25.4 * 1000) / 1000);
    const m = p.margins;
    const printOpts = p.hCenter ? '<printOptions horizontalCentered="1"/>' : '';
    const pageMargins = `<pageMargins left="${mm2in(m.l)}" right="${mm2in(m.r)}" top="${mm2in(m.t)}" bottom="${mm2in(m.b)}" header="${mm2in(m.h)}" footer="${mm2in(m.f)}"/>`;
    const pageSetup = `<pageSetup paperSize="${p.paper}" orientation="${p.orientation}"${p.fitWidth || p.fitHeight ? ` fitToWidth="${p.fitWidth || 0}" fitToHeight="${p.fitHeight || 0}"` : ''}/>`;
    return XL_XML_HEAD + `<worksheet xmlns="${XL_NS_MAIN}" xmlns:r="${XL_NS_R}">${fit}${dim}${views}<sheetFormatPr defaultRowHeight="15"/>${colsXml}<sheetData>${sd}</sheetData>${merges}${printOpts}${pageMargins}${pageSetup}</worksheet>`;
  };

  const toBytes = (meta = {}) => {
    const files = {};
    const enc = (s) => strToU8(s);
    const ct = [], wbRels = [];
    sheets.forEach((ws, i) => {
      const n = i + 1;
      files[`xl/worksheets/sheet${n}.xml`] = enc(sheetXml(ws, i));
      ct.push(`<Override PartName="/xl/worksheets/sheet${n}.xml" ContentType="${XL_CT}spreadsheetml.worksheet+xml"/>`);
      wbRels.push(`<Relationship Id="rId${n}" Type="${XL_NS_R}/worksheet" Target="worksheets/sheet${n}.xml"/>`);
    });
    const nS = sheets.length;
    wbRels.push(`<Relationship Id="rId${nS + 1}" Type="${XL_NS_R}/styles" Target="styles.xml"/>`);
    wbRels.push(`<Relationship Id="rId${nS + 2}" Type="${XL_NS_R}/sharedStrings" Target="sharedStrings.xml"/>`);
    // 印刷範囲・印刷タイトル（各ページに繰り返す見出し行）
    const names = [];
    sheets.forEach((ws, i) => {
      const p = ws.page, sh = `'${ws.name.replace(/'/g, "''")}'`;
      if (p.printArea) names.push(`<definedName name="_xlnm.Print_Area" localSheetId="${i}">${xlEsc(sh + '!' + xlRange(p.printArea[0], p.printArea[1], p.printArea[2], p.printArea[3], true))}</definedName>`);
      if (p.printTitles) names.push(`<definedName name="_xlnm.Print_Titles" localSheetId="${i}">${xlEsc(sh + `!$${p.printTitles[0] + 1}:$${p.printTitles[1] + 1}`)}</definedName>`);
    });
    // スタイル・共有文字列はシートの XML を作る途中で登録されるので、シートのあとに書き出す
    files['xl/styles.xml'] = enc(XL_XML_HEAD + `<styleSheet xmlns="${XL_NS_MAIN}">`
      + (numFmts.length ? `<numFmts count="${numFmts.length}">${numFmts.map((code, k) => `<numFmt numFmtId="${164 + k}" formatCode="${xlEsc(code)}"/>`).join('')}</numFmts>` : '')
      + `<fonts count="${fonts.length}">${fonts.join('')}</fonts>`
      + `<fills count="${fills.length}">${fills.join('')}</fills>`
      + `<borders count="${borders.length}">${borders.join('')}</borders>`
      + '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
      + `<cellXfs count="${xfs.length}">${xfs.join('')}</cellXfs>`
      + '<cellStyles count="1"><cellStyle name="標準" xfId="0" builtinId="0"/></cellStyles>'
      + '</styleSheet>');
    files['xl/sharedStrings.xml'] = enc(XL_XML_HEAD + `<sst xmlns="${XL_NS_MAIN}" count="${sstRefs}" uniqueCount="${sst.length}">${sst.join('')}</sst>`);
    files['xl/workbook.xml'] = enc(XL_XML_HEAD + `<workbook xmlns="${XL_NS_MAIN}" xmlns:r="${XL_NS_R}"><workbookPr/><bookViews><workbookView activeTab="0"/></bookViews>`
      + `<sheets>${sheets.map((ws, i) => `<sheet name="${xlEsc(ws.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets>`
      + (names.length ? `<definedNames>${names.join('')}</definedNames>` : '')
      + '<calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>');
    files['xl/_rels/workbook.xml.rels'] = enc(XL_XML_HEAD + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${wbRels.join('')}</Relationships>`);
    const now = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
    files['docProps/core.xml'] = enc(XL_XML_HEAD + '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:dcmitype="http://purl.org/dc/dcmitype/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">'
      + `<dc:title>${xlEsc(meta.title || '')}</dc:title><dc:creator>${xlEsc(meta.creator || '')}</dc:creator>`
      + `<dcterms:created xsi:type="dcterms:W3CDTF">${now}</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">${now}</dcterms:modified></cp:coreProperties>`);
    files['docProps/app.xml'] = enc(XL_XML_HEAD + '<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties" xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes"><Application>Microsoft Excel</Application></Properties>');
    files['_rels/.rels'] = enc(XL_XML_HEAD + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + `<Relationship Id="rId1" Type="${XL_NS_R}/officeDocument" Target="xl/workbook.xml"/>`
      + '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>'
      + `<Relationship Id="rId3" Type="${XL_NS_R}/extended-properties" Target="docProps/app.xml"/></Relationships>`);
    files['[Content_Types].xml'] = enc(XL_XML_HEAD + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
      + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>'
      + `<Override PartName="/xl/workbook.xml" ContentType="${XL_CT}spreadsheetml.sheet.main+xml"/>`
      + `<Override PartName="/xl/styles.xml" ContentType="${XL_CT}spreadsheetml.styles+xml"/>`
      + `<Override PartName="/xl/sharedStrings.xml" ContentType="${XL_CT}spreadsheetml.sharedStrings+xml"/>`
      + ct.join('')
      + '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>'
      + `<Override PartName="/docProps/app.xml" ContentType="${XL_CT}extended-properties+xml"/></Types>`);
    // [Content_Types].xml を先頭に置く（一部の読み込み側が先頭を期待するため）
    const ordered = { '[Content_Types].xml': files['[Content_Types].xml'] };
    Object.keys(files).forEach(k => { if (k !== '[Content_Types].xml') ordered[k] = files[k]; });
    return zipSync(ordered, { level: 6 });
  };

  return { style, addSheet, toBytes };
}

// 印刷の letter-spacing:0.5em の代わり。全角スペース（2/3 em）は「全角2つ＋半角1つ」にすると字の位置が印刷とそろい、
// 全角スペースのない字の間には半角スペースを挟む
const xlLetterSpace = (s) => {
  const ch = [...String(s || '')];
  return ch.map((c, i) => {
    if (c === '　') return '　　 ';
    const next = ch[i + 1];
    return next !== undefined && !/\s/.test(c) && !/\s/.test(next) ? c + ' ' : c;
  }).join('');
};

// 見積書（kind='quote'）・発注書（'order'）の Excel。印刷の buildQuoteHtml／buildFacilityOrderHtml と同じ m を受け取り、
// 同じ並び・大きさ・配色で書く。頭の部分（題名・宛名・御見積金額・右の枠）は印刷と同じ位置（横は mm・縦は pt）に置き、
// その境目と表の列の境目をあわせた行・列を作って、1つの枠は必要なセルをつなげて（結合して）作る。
// 金額・小計・消費税・合計は計算式（開いた時点の値は印刷と同じ。Excel で数量や単価を直すと計算し直される）。
function buildDocXlsx(kind, m) {
  const isQuote = kind === 'quote';
  const sp = !!m.showPrices, sc = m.showCaseSize !== false, scat = m.showCat !== false, sin = !!m.showItemNote;
  const st = isQuote && m.showTotal !== false;
  const o = officeByName(m.office);
  const PT = XL_PT_MM;
  const W = 184, RX = W - 70; // 本文の幅（A4 の 210mm − 左右の余白 13mm）と、右の枠（幅 70mm）の左端
  const C = {
    navy: '1E3A8A', blue: '2563EB', blue3: '3B82F6', blue4: '93C5FD', line: 'BFDBFE', head: 'DBEAFE', tint: 'F0F7FF', tint2: 'EFF6FF',
    zebra: 'F8FBFF', ink: '1F2937', sub: '4B5563', gray: '6B7280', mute: '9CA3AF', qty: 'FFFDF5',
  };
  const F = (sz, o2) => Object.assign({ name: XL_MINCHO, sz, color: C.ink }, o2);
  const mmOf = (text, pt, bold) => xlTextEm(text) * pt / PT * (bold ? 1.06 : 1); // 文字列の幅(mm)
  const oneLine = (s) => String(s || '').replace(/\s*\n\s*/g, ' ');             // 印刷では改行は空白になる
  const qn = (q) => (Number(q) || 0);
  const priceOf = (it) => Number(it.price) || 0;
  const sub = m.items.reduce((s, it) => it.isSpacer ? s : s + qn(it.qty) * priceOf(it), 0);
  const tax = Math.floor(sub * 0.1);
  const total = sub + tax;

  // --- 表の列（印刷の colgroup と同じ割合） ---
  const pct = isQuote ? { cat: 14, case: 9, qty: 10, unit: 8, price: 14, amount: 16 } : { cat: 15, case: 9, qty: 11, unit: 8, price: 13 };
  const cols = [];
  if (scat) cols.push({ key: 'cat', head: 'カテゴリ' });
  cols.push({ key: 'name', head: isQuote ? '品目' : '商品名' });
  if (sc) cols.push({ key: 'case', head: '入数' });
  cols.push({ key: 'qty', head: '数量' }, { key: 'unit', head: '単位' });
  if (sp) {
    cols.push({ key: 'price', head: '単価（税抜）' });
    if (isQuote) cols.push({ key: 'amount', head: '金額（税抜）' });
  }
  const namePct = 100 - cols.reduce((s, c) => s + (c.key === 'name' ? 0 : pct[c.key]), 0);
  let cx = 0;
  const col = {};
  cols.forEach(c => { c.x1 = cx; cx += W * (c.key === 'name' ? namePct : pct[c.key]) / 100; c.x2 = cx; col[c.key] = c; });

  // --- 頭の部分：印刷と同じ位置に枠を並べる（els）。値が関数のものは表を書いたあとで決まる式 ---
  const els = [];
  const put = (x1, x2, y1, y2, v, s) => els.push({ x1, x2: Math.min(x2, W), y1, y2, v, s });
  const ref = {};
  // 左：題名（字間 0.5em・下線）
  const title = isQuote ? '御　見　積　書' : (m.title || '発　注　書');
  let ly = 22 * 1.6 + 2 * PT; // 行の高さ（22pt×1.6）＋下の余白 2mm
  put(0, Math.min(RX, mmOf(title, 22) + [...title].length * 11 / PT + 1), 0, ly, xlLetterSpace(title),
    { font: F(22, { color: C.navy }), border: { b: 'medium:' + C.blue3 }, align: { v: 'center', shrink: true } });
  ly += 1.1;
  // 宛名（見積書＝施設名、発注書＝当社の営業所）＋「御中」。下線は文字の幅＋右の余白 10mm。
  // 1行に入らないときは、印刷と同じく右の余白 10mm を残して折り返す（少しだけ長いときは余白に入れて1行のままにする）
  const toName = isQuote ? oneLine(m.facilityName) : '太陽シルバーサービス株式会社' + (o ? '　' + o.name : '');
  const toPt = isQuote ? 15 : 14;
  const toTextW = mmOf(toName + ' ', toPt) + mmOf('御中', 10.5);
  const toWrap = toTextW > RX - 4;
  const toLines = toWrap ? Math.ceil(toTextW / ((RX - 10) * 0.93)) : 1;
  const toH = toLines * toPt * 1.6 + 1 * PT;
  const toLine = { b: 'thin:' + C.blue4 };
  ly += 5 * PT;
  put(0, toWrap ? RX - 10 : toTextW + 11, ly, ly + toH, { rich: [{ t: toName + ' ', font: F(toPt) }, { t: '御中', font: F(10.5, { color: C.blue }) }] },
    { font: F(toPt), border: toLine, align: { v: 'center', wrap: toWrap } });
  if (toWrap) put(RX - 10, RX, ly, ly + toH, null, { border: toLine });
  ly += toH + 0.75 + 3 * PT;
  put(0, RX, ly, ly + 13.6, isQuote ? '下記の通りお見積り申し上げます。' : '下記のとおり注文いたします。', { font: F(8.5, { color: C.sub }), align: { v: 'center' } });
  ly += 13.6;
  if (!isQuote && o) {
    ly += 2 * PT;
    put(0, RX, ly, ly + 13.6, 'TEL：' + o.tel, { font: F(8.5, { color: C.sub }), align: { v: 'center' } });
    put(0, RX, ly + 13.6, ly + 27.2, 'FAX：' + o.fax, { font: F(8.5, { b: true }), align: { v: 'center' } });
    ly += 27.2;
  }
  // 御見積金額の枠：見出し・金額・（税抜）の3つのセル。中の行の下端を字の下にそろえて、大きさの違う字の並びを印刷に近づける
  if (st) {
    ly += 4 * PT;
    const v = m.taxIncluded ? total : sub;
    const suffix = m.taxIncluded ? '（税込）' : '（税抜）';
    const x1 = 6 + mmOf('御見積金額', 9, true) + 0.5;     // 左の余白 6mm＋見出し
    const x2 = x1 + 5 + mmOf(yen(v), 15, true) + 2;        // 間 5mm＋金額（Excel で直して桁が増えたときの分を少し）
    const x3 = Math.min(RX, x2 + mmOf(suffix, 8.5) + 6.5); // （税抜）＋右の余白 6mm
    const bd = 'medium:' + C.navy, fill = C.tint, pad = 2 * PT + 1.1, mid = 21.5, boxH = 15 * 1.6 + 2 * pad;
    put(0, x3, ly, ly + pad, null, { fill, border: { l: bd, r: bd, t: bd } });
    put(0, x1, ly + pad, ly + pad + mid, '御見積金額', { font: F(9, { b: true, color: C.navy }), fill, border: { l: bd }, align: { h: 'right', v: 'bottom' } });
    put(x1, x2, ly + pad, ly + pad + mid, () => ({ f: m.taxIncluded ? ref.total : ref.sub, v }),
      { font: F(15, { b: true, color: C.navy }), fill, fmt: XL_YEN, align: { h: 'right', v: 'bottom', shrink: true } });
    put(x2, x3, ly + pad, ly + pad + mid, suffix, { font: F(8.5, { color: C.sub }), fill, border: { r: bd }, align: { v: 'bottom' } });
    put(0, x3, ly + pad + mid, ly + boxH, null, { fill, border: { l: bd, r: bd, b: bd } });
    ly += boxH;
  }
  // 右：日付などの行と、発行元（見積書）・発注元（発注書）の枠
  let ry = 0;
  const rline = (t) => { put(RX, W, ry, ry + 13.6, t, { font: F(8.5, { color: C.sub }), align: { h: 'right', v: 'center' } }); ry += 13.6; };
  // 枠（罫線・薄い青の塗り・内側の余白 2.5mm）。lines = [{ t, pt, b, color, mt（上のあき mm） }]
  const infoBox = (lines) => {
    const bd = 'thin:' + C.blue4, fill = C.tint, side = { l: bd, r: bd }, pad = 2.5 * PT + 0.75;
    ry += 3 * PT;
    put(RX, W, ry, ry + pad, null, { fill, border: Object.assign({ t: bd }, side) });
    ry += pad;
    lines.forEach(ln => {
      if (ln.mt) { put(RX, W, ry, ry + ln.mt * PT, null, { fill, border: side }); ry += ln.mt * PT; }
      const n = xlLineCount(ln.t, 70 - 5 + 4, ln.pt);
      const h = n * ln.pt * 1.6;
      put(RX, W, ry, ry + h, ln.t, { font: F(ln.pt, { b: !!ln.b, color: ln.color || C.sub }), fill, border: side, align: { h: 'left', v: 'center', wrap: n > 1, indent: 1 } });
      ry += h;
    });
    put(RX, W, ry, ry + pad, null, { fill, border: Object.assign({ b: bd }, side) });
    ry += pad;
  };
  if (isQuote) {
    rline('発行日：' + m.issued);
    rline('見積番号：' + m.quoteNo);
    rline('有効期限：お見積日より30日間');
    // officeBlockHtml と同じ並び
    const lines = [{ t: '太陽シルバーサービス株式会社', pt: 9.5, b: true, color: C.navy }, { t: o ? o.name : '営業本部', pt: 8.5, b: true }];
    if (o) lines.push({ t: '〒' + o.zip, pt: 8.5, mt: 0.5 }, { t: o.addr, pt: 8.5 }, { t: 'TEL：' + o.tel, pt: 8.5, mt: 1 }, { t: 'FAX：' + o.fax, pt: 8.5 });
    else lines.push({ t: 'TEL：　　　　　', pt: 8.5, mt: 1 }, { t: 'FAX：　　　　　', pt: 8.5 });
    if (m.repName) lines.push({ t: '担当：' + m.repName, pt: 8.5, mt: 1 });
    infoBox(lines);
  } else {
    rline('発注日：　　　　　　　　　（ご記入ください）');
    const lines = [{ t: '発注元', pt: 7.5, b: true, color: C.blue }, { t: oneLine(m.facilityName), pt: 10, b: true, color: C.navy }];
    if (String(m.facilityAddress || '').trim()) lines.push({ t: oneLine(m.facilityAddress), pt: 8, mt: 1 });
    if (String(m.facilityTel || '').trim()) lines.push({ t: 'TEL：' + m.facilityTel, pt: 8, mt: 1 });
    if (String(m.facilityFax || '').trim()) lines.push({ t: 'FAX：' + m.facilityFax, pt: 8, mt: 1 });
    lines.push({ t: 'ご担当者：　　　　　　　　　', pt: 8.5, mt: 1.5 });
    infoBox(lines);
  }

  // --- 列・行の境目：表の列の境目を優先し、近すぎる境目（横 2mm・縦 1pt 未満）はまとめる ---
  const xs = [0, ...cols.map(c => c.x2)];
  els.forEach(e => [e.x1, e.x2].forEach(v => { if (!xs.some(u => Math.abs(u - v) < 2)) xs.push(v); }));
  xs.sort((a, b) => a - b);
  const ys = [0, Math.max(ly, ry)];
  els.forEach(e => [e.y1, e.y2].forEach(v => { if (!ys.some(u => Math.abs(u - v) < 1)) ys.push(v); }));
  ys.sort((a, b) => a - b);
  const nearest = (list, v) => list.reduce((best, u, i) => (Math.abs(u - v) < Math.abs(list[best] - v) ? i : best), 0);
  const span = (x1, x2) => { const c1 = nearest(xs, x1); return [c1, Math.max(c1, nearest(xs, x2) - 1)]; };
  const last = xs.length - 2;

  const book = createXlsxBook();
  // 発注書は印刷と同じく A4 1枚に収める（印刷は data-fit-page で縮小している）
  const ws = book.addSheet(isQuote ? '御見積書' : '発注書', { margins: { l: 13, r: 13, t: 14, b: 14, h: 6, f: 6 }, fitWidth: 1, fitHeight: isQuote ? 0 : 1 });
  ws.setCols(xs.slice(1).map((v, i) => v - xs[i]));
  ys.slice(1).forEach((v, i) => ws.height(i, v - ys[i]));

  // --- 表 ---
  let r = ys.length - 1;
  ws.height(r, 7 * PT); r++; // 表の上のあき 7mm
  const BL = 'thin:' + C.line, BH = 'thin:' + C.blue4;
  const thRow = r;
  cols.forEach(c => {
    const [c1, c2] = span(c.x1, c.x2);
    ws.box(r, c1, r, c2, c.head, { font: F(8.5, { b: true, color: C.navy }), fill: C.head, border: { l: BH, r: BH, t: BH, b: BH }, align: { h: 'center', v: 'center' } });
  });
  ws.height(r, 8.5 * 1.6 + 2 * 1.6 * PT + 0.75); r++;
  const padY = (isQuote ? 1.8 : 2.2) * PT;
  const firstItem = r;
  const at = (key) => span(col[key].x1, col[key].x2)[0];
  m.items.forEach((it, i) => {
    if (it.isSpacer) { // 行と行の間の空き（上下の罫線だけ）
      ws.box(r, 0, r, last, null, { border: { t: BL, b: BL } });
      ws.height(r, 6 * PT); r++;
      return;
    }
    const fill = i % 2 === 1 ? C.zebra : undefined;
    const put2 = (key, v, s) => { const [c1, c2] = span(col[key].x1, col[key].x2); ws.box(r, c1, r, c2, v, Object.assign({ fill, border: { l: BL, r: BL, b: BL } }, s)); };
    const cellW = (key) => col[key].x2 - col[key].x1;
    const name = String(it.name || '');
    const note = sin && it.note ? String(it.note) : '';
    put2('name', note ? { rich: [{ t: name, font: F(9.5) }, { t: '\n' + note, font: F(7.5, { color: C.gray }) }] } : name, { font: F(9.5), align: { h: 'left', v: 'center', wrap: true, indent: 1 } });
    let h = xlLineCount(name, cellW('name'), 9.5) * 15.2 + (note ? 1.4 + xlLineCount(note, cellW('name'), 7.5) * 12 : 0);
    if (scat) {
      put2('cat', String(it.cat || ''), { font: F(8, { b: true, color: C.blue }), align: { h: 'left', v: 'center', wrap: true, indent: 1 } });
      h = Math.max(h, xlLineCount(it.cat || '', cellW('cat'), 8) * 12.8);
    }
    if (sc) put2('case', String(it.caseSize || ''), { font: F(9.5), align: { h: 'center', v: 'center', shrink: true } });
    // 数量：未入力は空欄（発注書は施設が手書きで書く欄）。表示は印刷と同じく整数に丸める
    const q = it.qty === '' || it.qty == null ? null : (isFinite(Number(it.qty)) ? Number(it.qty) : String(it.qty));
    put2('qty', q, { font: F(9.5), fmt: '#,##0', fill: isQuote ? fill : C.qty, align: { h: 'right', v: 'center', indent: 1, shrink: true } });
    put2('unit', String(it.unit || ''), { font: F(9.5), align: { h: 'center', v: 'center', shrink: true } });
    if (sp) {
      const price = priceOf(it);
      const num = { font: F(9.5), fmt: XL_YEN, align: { h: 'right', v: 'center', indent: 1, shrink: true } };
      if (isQuote) {
        put2('price', price, num);
        put2('amount', { f: `N(${xlRef(r, at('qty'))})*${xlRef(r, at('price'))}`, v: qn(it.qty) * price }, num);
      } else put2('price', price > 0 ? price : null, num);
    }
    ws.height(r, h + 2 * padY + 0.75);
    r++;
  });
  // 小計（税抜）・消費税（10%）・合計（税込）。消費税は印刷と同じく切り捨て
  if (st) {
    const [v1, v2] = span(cols[cols.length - 1].x1, W);
    ref.sub = xlRef(r, v1); ref.total = xlRef(r + 2, v1);
    const sumF = col.amount && r > firstItem ? `SUM(${xlRange(firstItem, at('amount'), r - 1, at('amount'))})` : null;
    [['小計（税抜）', sumF ? { f: sumF, v: sub } : sub],
      ['消費税（10%）', { f: `INT(${ref.sub}*0.1)`, v: tax }],
      ['合計（税込）', { f: `${ref.sub}+${xlRef(r + 1, v1)}`, v: total }]].forEach(([label, v], k) => {
      const big = k === 2;
      ws.box(r, 0, r, v1 - 1, label, { font: F(9.5, { b: true, color: C.navy }), fill: C.tint2, border: { l: BL, r: BL, b: BL }, align: { h: 'right', v: 'center', indent: 1 } });
      ws.box(r, v1, r, v2, v, { font: F(big ? 11 : 9.5, { b: true }), fill: C.tint2, fmt: XL_YEN, border: { l: BL, r: BL, b: BL }, align: { h: 'right', v: 'center', indent: 1, shrink: true } });
      ws.height(r, (big ? 11 : 9.5) * 1.6 + 2 * padY + 0.75);
      r++;
    });
  }
  if (!isQuote && m.items.some(it => !it.isSpacer && !String(it.name).trim())) {
    ws.height(r, 2 * PT); r++;
    ws.box(r, 0, r, last, '※商品名が空欄の行は、リストにない商品を手書きでご記入いただく欄です。', { font: F(7.5, { color: C.mute }), align: { v: 'center' } });
    ws.height(r, 7.5 * 1.6); r++;
  }
  // 備考（枠の内側の余白 3mm）。1行ずつ別の行にして、行の間隔を印刷（9.5pt×1.6）とそろえる
  ws.height(r, (isQuote ? 8 : 6) * PT); r++;
  const bd = { l: BL, r: BL };
  const pad = 3 * PT + 0.75;
  ws.box(r, 0, r, last, null, { fill: C.tint2, border: Object.assign({ t: BL }, bd) }); ws.height(r, pad); r++;
  ['【備考】', ...String(m.note || '').split('\n')].forEach(line => {
    const n = xlLineCount(line, W - 6 + 4, 9.5);
    ws.box(r, 0, r, last, line, { font: F(9.5, { color: C.sub }), fill: C.tint2, border: bd, align: { h: 'left', v: 'center', wrap: n > 1, indent: 1 } });
    ws.height(r, n * 15.2); r++;
  });
  ws.box(r, 0, r, last, null, { fill: C.tint2, border: Object.assign({ b: BL }, bd) }); ws.height(r, pad); r++;

  // 頭の部分を置く（表の小計・合計のセルが決まってから。御見積金額はその式になる）
  els.forEach(e => {
    const [c1, c2] = span(e.x1, e.x2);
    const r1 = nearest(ys, e.y1), r2 = Math.max(r1, nearest(ys, e.y2) - 1);
    ws.box(r1, c1, r2, c2, typeof e.v === 'function' ? e.v() : e.v, e.s);
  });
  ws.page.printArea = [0, 0, r - 1, last];
  if (isQuote) ws.page.printTitles = [thRow, thRow]; // 2ページ目以降にも表の見出し（印刷の thead と同じ）
  return book.toBytes({ title: isQuote ? '御見積書' : title.replace(/\s/g, '') });
}
/* Excel ここまで */

/* ============================================================
   印刷: 売上レポート（月次 / 年次 / 年度 / 月別推移 の共通帳票）
   明朝・ネイビーの企業文書調 — 画面とは別人格
============================================================ */
function buildReportHtml(m) {
  const th = 'background:#dbeafe;color:#1e3a8a;font-size:8.5pt;padding:1.6mm 2mm;border:1px solid #93c5fd;font-weight:bold;';
  const td = 'padding:1.5mm 2mm;border:1px solid #bfdbfe;font-size:9pt;';
  const tdR = td + 'text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;';
  const emptyRow = (n) => `<tr><td colspan="${n}" style="${td}text-align:center;color:#6b7280;">該当はありません</td></tr>`;
  const zebra = (i) => (i % 2 === 1 ? '#f8fbff' : '#fff');
  const multi = m.monthly && m.monthly.length > 1;
  const kp = m.kpi, cp = m.compare, grossOk = !(kp.grossUnknown > 0);
  // 比較なし：前年データ未取得なら「比較データ不足」、全期間など比較しない帳票は「—」
  const noCmp = m.compareMissing ? '比較データ不足' : '—';
  const marginCell = (unknown, sales, margin) => (unknown ? '未確定' : sales > 0 ? margin + '%' : '—');
  // 前年差のセル：差額（主）と増減率（補助）。比較できないときは理由を出す
  const cmpCell = (diff, rate, reason) => diff === null
    ? (reason || '—')
    : (diff > 0 ? '+' : diff < 0 ? '−' : '±') + yen(Math.abs(diff)) + (rate === null ? '' : `<br><span style="font-size:8pt;color:#6b7280;">${rate > 0 ? '+' : ''}${rate}%</span>`);
  let sec = 0;
  const secTitle = (t) => `<div style="margin-top:7mm;color:#1e3a8a;font-weight:bold;font-size:10.5pt;border-left:3px solid #2563eb;padding-left:2mm;">${++sec}．${t}</div>`;

  const monthRows = multi ? m.monthly.map((x, i) => `
    <tr style="background:${zebra(i)}">
      <td style="${td}">${escapeHTML(x.label)}</td>
      <td style="${tdR}">${yen(x.sales)}</td>
      <td style="${tdR}">${x.grossUnknown ? '未確定' : yen(x.gross)}</td>
      <td style="${tdR}">${marginCell(x.grossUnknown, x.sales, x.rate)}</td>
      <td style="${tdR}">${x.count}件</td>
    </tr>`).join('') : '';
  const catRows = m.categories.length ? m.categories.map((c, i) => `
    <tr style="background:${zebra(i)}">
      <td style="${td}">${escapeHTML(c.name)}</td>
      <td style="${tdR}">${yen(c.sales)}</td>
      <td style="${tdR}">${c.share}%</td>
      <td style="${tdR}">${marginCell(c.grossUnknown, c.sales, c.margin)}</td>
    </tr>`).join('') : emptyRow(4);
  const prodRows = m.topProducts.length ? m.topProducts.map((p, i) => `
    <tr style="background:${zebra(i)}">
      <td style="${tdR}">${i + 1}</td>

  const rankRows = rank.length ? rank.map((f, i) => `
    <tr style="background:${zebra(i)}">
      <td style="${tdR}">${i + 1}</td>

      <td style="${tdR}">${yen(f.sales)}</td>
      <td style="${tdR}">${yen(f.avg)}</td>
      <td style="${tdR}">${marginCell(f.grossUnknown, f.sales, f.margin)}</td>
      <td style="${td}">${escapeHTML(f.repName)}</td>
    </tr>`).join('') : emptyRow(6);

  return `
  <div class="doc" style="width:210mm;min-height:297mm;padding:14mm 13mm;background:#fff;box-sizing:border-box;font-family:'BIZ UDPMincho','Yu Mincho','Hiragino Mincho ProN',serif;color:#1f2937;font-size:9.5pt;line-height:1.6;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div style="flex:1;">
        <div style="font-size:20pt;letter-spacing:0.4em;color:#1e3a8a;border-bottom:1.5px solid #3b82f6;padding-bottom:2mm;display:inline-block;">${escapeHTML(m.title)}</div>
        <div style="margin-top:4mm;font-size:13pt;color:#1e40af;font-weight:bold;">${escapeHTML(m.periodLabel)}</div>
        ${m.conditions ? `<table style="margin-top:2mm;border-collapse:collapse;font-size:8pt;color:#374151;">
          ${m.conditions.map(([k2, v2]) => `<tr><td style="padding:0.3mm 2mm 0.3mm 0;white-space:nowrap;color:#1e3a8a;font-weight:bold;">${escapeHTML(k2)}</td><td style="padding:0.3mm 0;">${escapeHTML(v2)}</td></tr>`).join('')}
        </table>` : ''}
      </div>
      <div style="width:70mm;font-size:8.5pt;color:#4b5563;">
        <div style="text-align:right;">発行日：${escapeHTML(m.issued)}</div>
        ${officeBlockHtml(m.office)}
      </div>
    </div>

    ${secTitle(multi ? '期間サマリー' : '当月サマリー')}
    <table style="width:100%;border-collapse:collapse;margin-top:2mm;table-layout:fixed;">
      <tr>
        <th style="${th}">売上</th><th style="${th}">粗利</th><th style="${th}">粗利率</th>
        <th style="${th}">前年より増えた・減った売上</th><th style="${th}">前年より増えた・減った粗利</th><th style="${th}">購入得意先数</th>
      </tr>
      <tr>
        <td style="${tdR}font-size:10.5pt;">${yen(kp.sales)}</td>
        <td style="${tdR}font-size:10.5pt;">${grossOk ? yen(kp.gross) : '未確定'}</td>
        <td style="${tdR}font-size:10.5pt;">${kp.rateOk ? kp.rate + '%' : (kp.sales > 0 ? '未確定' : '算出対象外')}</td>
        <td style="${tdR}font-size:10.5pt;">${cmpCell(cp ? kp.sales - cp.sales : null, cp ? pctChange(kp.sales, cp.sales) : null, noCmp)}</td>
        <td style="${tdR}font-size:10.5pt;">${cmpCell(cp && grossOk && cp.grossOk ? kp.gross - cp.gross : null, cp && grossOk && cp.grossOk ? pctChange(kp.gross, cp.gross) : null, cp ? '未確定' : noCmp)}</td>
        <td style="${tdR}font-size:10.5pt;">${num(kp.buyers)}件${cp ? `<br><span style="font-size:8pt;color:#6b7280;">前年同期 ${num(cp.buyers)}件</span>` : ''}</td>
      </tr>
      ${cp ? `<tr><td colspan="6" style="${td}font-size:8pt;color:#4b5563;">前年同期：売上 ${yen(cp.sales)} ／ 粗利 ${cp.grossOk ? yen(cp.gross) : '未確定'}。増減率は補助表示で、前年同期が0円以下なら算出しません。</td></tr>` : ''}
      ${!grossOk ? `<tr><td colspan="6" style="${td}font-size:8pt;color:#92400e;">粗利額が不明な明細 ${num(kp.grossUnknown)}行（売上 ${yen(kp.grossUnknownSales)}）を含むため、粗利・粗利率は未確定です（確認済み分 ${yen(kp.gross)}）。</td></tr>` : ''}
    </table>

    ${multi ? `${secTitle('月別の推移')}
    <table style="width:100%;border-collapse:collapse;margin-top:2mm;table-layout:fixed;">
      <colgroup><col style="width:22%"><col style="width:22%"><col style="width:20%"><col style="width:16%"><col style="width:20%"></colgroup>
      <tr><th style="${th}">月</th><th style="${th}">売上</th><th style="${th}">粗利</th><th style="${th}">粗利率</th><th style="${th}">取引施設数</th></tr>
      ${monthRows}
      <tr>
        <td style="${td}font-weight:bold;color:#1e3a8a;background:#eff6ff;">合計</td>
        <td style="${tdR}font-weight:bold;background:#eff6ff;">${yen(m.kpi.sales)}</td>
        <td style="${tdR}font-weight:bold;background:#eff6ff;">${grossOk ? yen(m.kpi.gross) : '未確定'}</td>
        <td style="${tdR}font-weight:bold;background:#eff6ff;">${m.kpi.rateOk ? m.kpi.rate + '%' : '—'}</td>
        <td style="${tdR}font-weight:bold;background:#eff6ff;">${m.kpi.count}件</td>
      </tr>
    </table>` : ''}

    ${secTitle('分類別売上')}
    <table style="width:100%;border-collapse:collapse;margin-top:2mm;table-layout:fixed;">
      <colgroup><col style="width:46%"><col style="width:20%"><col style="width:16%"><col style="width:18%"></colgroup>
      <tr><th style="${th}">分類</th><th style="${th}">売上</th><th style="${th}">構成比</th><th style="${th}">粗利率</th></tr>
      ${catRows}
    </table>

    ${secTitle('商品別売上 TOP10')}
    <table style="width:100%;border-collapse:collapse;margin-top:2mm;table-layout:fixed;">
      <colgroup><col style="width:7%"><col style="width:43%"><col style="width:18%"><col style="width:14%"><col style="width:18%"></colgroup>
      <tr><th style="${th}">順位</th><th style="${th}">商品名</th><th style="${th}">分類</th><th style="${th}">数量</th><th style="${th}">売上</th></tr>
      ${prodRows}
    </table>

    ${secTitle('施設別売上ランキング' + (m.ranking.length > rank.length ? `（上位${rank.length}件 / 全${m.ranking.length}件）` : ''))}
    <table style="width:100%;border-collapse:collapse;margin-top:2mm;table-layout:fixed;">
      <colgroup><col style="width:7%"><col style="width:45%"><col style="width:14%"><col style="width:14%"><col style="width:9%"><col style="width:11%"></colgroup>
      <tr><th style="${th}">順位</th><th style="${th}">施設名</th><th style="${th}">${multi ? '期間売上' : '当月売上'}</th><th style="${th}">月平均</th><th style="${th}">粗利率</th><th style="${th}">担当</th></tr>
      ${rankRows}
    </table>

    <div style="margin-top:8mm;border:1px solid #bfdbfe;background:#eff6ff;padding:3mm;font-size:8.5pt;color:#4b5563;">
      ※ 本レポートは売上分析ダッシュボードから自動生成されています。金額はすべて税抜・返品／値引き反映後の売上です。<br>
      ※ 売上・分類別売上・商品別ランキングは施設・個人を問わず全売上を集計しています。施設別ランキングのみ施設に限定しています。<br>
      ※ 粗利は明細ごとの粗利額（売上－売れた数量の原価）の合計、粗利率は合計粗利÷合計売上です。単位が混在する商品の数量は合計していません。
    </div>
  </div>`;
}

/* ============================================================
   印刷: 施設別販売リスト
============================================================ */
function buildFacilitySalesHtml(m) {
  const th = 'background:#dbeafe;color:#1e3a8a;font-size:8.5pt;padding:1.6mm 2mm;border:1px solid #93c5fd;font-weight:bold;';
  const td = 'padding:1.5mm 2mm;border:1px solid #bfdbfe;font-size:9pt;';
  const tdR = td + 'text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;';
  const body = m.rows.length ? m.rows.map((r, i) => `
    <tr style="background:${i % 2 === 1 ? '#f8fbff' : '#fff'}">
      <td style="${td}overflow-wrap:anywhere;">${escapeHTML(r.product)}</td>
      <td style="${td}">${escapeHTML(r.cat)}</td>
      <td style="${tdR}">${r.qty}</td>
      <td style="${td}text-align:center;">${escapeHTML(r.unit)}</td>
      <td style="${tdR}">${yen(r.price)}</td>
      <td style="${tdR}">${yen(r.qty * r.price)}</td>
      <td style="${tdR}">${escapeHTML(r.last)}</td>
    </tr>`).join('') : `<tr><td colspan="7" style="${td}text-align:center;color:#6b7280;">対象期間の購入実績はありません</td></tr>`;
  // 各行は yen() が四捨五入した金額で印刷される（数量は月平均なので小数になる）。
  // 合計を丸め前の値で出すと、お客様が列を足し算した結果と1円ずれることがあるため、
  // 行ごとに丸めてから合計する。
  const monthTotal = m.rows.reduce((s, r) => s + Math.round(r.qty * r.price), 0);
  const monthHead = m.labels.map(x => `<th style="${th}font-size:7pt;padding:1mm;">${escapeHTML(x)}</th>`).join('');
  const monthCells = m.monthly.map(v => `<td style="${tdR}font-size:7.5pt;padding:1mm;">${num(v / 1000)}k</td>`).join('');
  return `
  <div class="doc" style="width:210mm;min-height:297mm;padding:14mm 13mm;background:#fff;box-sizing:border-box;font-family:'BIZ UDPMincho','Yu Mincho','Hiragino Mincho ProN',serif;color:#1f2937;font-size:9.5pt;line-height:1.6;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div style="flex:1;">
        <div style="font-size:20pt;letter-spacing:0.4em;color:#1e3a8a;border-bottom:1.5px solid #3b82f6;padding-bottom:2mm;display:inline-block;">販売実績リスト</div>
        <div style="margin-top:4mm;font-size:13pt;color:#1f2937;">${escapeHTML(m.name)} <span style="font-size:10pt;color:#2563eb;">御中</span></div>
        <div style="margin-top:1.5mm;font-size:8.5pt;color:#4b5563;">対象期間：${escapeHTML(m.periodText)} ／ 担当：${escapeHTML(m.repName)}</div>
      </div>
      <div style="width:70mm;font-size:8.5pt;color:#4b5563;">
        <div style="text-align:right;">発行日：${escapeHTML(m.issued)}</div>
        ${officeBlockHtml(m.office, m.repName)}
      </div>
    </div>

    <div style="margin-top:8mm;color:#1e3a8a;font-weight:bold;font-size:10.5pt;border-left:3px solid #2563eb;padding-left:2mm;">1．定番購入商品（月平均）</div>
    <table style="width:100%;border-collapse:collapse;margin-top:2mm;table-layout:fixed;">
      <colgroup><col style="width:28%"><col style="width:15%"><col style="width:9%"><col style="width:7%"><col style="width:13%"><col style="width:14%"><col style="width:14%"></colgroup>
      <tr><th style="${th}">商品名</th><th style="${th}">分類</th><th style="${th}">月平均数量</th><th style="${th}">単位</th><th style="${th}">参考単価</th><th style="${th}">月額目安</th><th style="${th}">直近購入</th></tr>
      ${body}
      <tr>
        <td colspan="5" style="${td}text-align:right;font-weight:bold;color:#1e3a8a;background:#eff6ff;">月額合計（税抜・上位15品目分）</td>
        <td style="${tdR}font-weight:bold;background:#eff6ff;">${yen(monthTotal)}</td>
        <td style="${td}background:#eff6ff;"></td>
      </tr>
    </table>

    <div style="margin-top:7mm;color:#1e3a8a;font-weight:bold;font-size:10.5pt;border-left:3px solid #2563eb;padding-left:2mm;">2．月別購入金額の推移（単位：千円）</div>
    <table style="width:100%;border-collapse:collapse;margin-top:2mm;table-layout:fixed;">
      <tr>${monthHead}</tr>
      <tr>${monthCells}</tr>
    </table>
    <div style="margin-top:2mm;text-align:right;font-size:10pt;color:#1e3a8a;font-weight:bold;">年間購入金額（税抜）：${yen(m.yearTotal)}</div>

    <div style="margin-top:8mm;border:1px solid #bfdbfe;background:#eff6ff;padding:3mm;font-size:8.5pt;color:#4b5563;">
      ※ 参考単価は直近の販売実績によるものです。数量・金額は返品相殺後の値です。<br>
      ※ ご不明な点は担当（${escapeHTML(m.repName)}）までお問い合わせください。
    </div>
  </div>`;
}

/* ============================================================
   印刷: 発注書（施設 → 当社。担当営業が代理作成する注文書）
============================================================ */
function buildFacilityOrderHtml(m) {
  const th = 'background:#dbeafe;color:#1e3a8a;font-size:8.5pt;padding:1.6mm 2mm;border:1px solid #93c5fd;font-weight:bold;';
  const td = 'padding:2.2mm 2mm;border:1px solid #bfdbfe;font-size:9.5pt;';
  const tdR = td + 'text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;';
  const sp = m.showPrices;
  const sc = m.showCaseSize !== false;
  const scat = m.showCat !== false;   // カテゴリ列の表示（デフォルトON）
  const sin = !!m.showItemNote;       // 商品ごとの備考（画面のトグルに従う。既定は非表示）
  const o = officeByName(m.office);
  // 数量は施設側が手書きで記入する欄。入力済みなら数字、未入力なら空欄のまま
  const qtyCell = (q) => (q === '' || q === null || q === undefined ? '' : num(q));
  const ed = 'class="editable" contenteditable="true"';
  const orderColCount = 3 + (scat ? 1 : 0) + (sc ? 1 : 0) + (sp ? 1 : 0);
  const rows = m.items.map((it, i) => {
    if (it.isSpacer) return `<tr style="height:6mm;"><td colspan="${orderColCount}" style="border:1px solid #bfdbfe;border-left:none;border-right:none;"></td></tr>`;
    return `
    <tr style="background:${i % 2 === 1 ? '#f8fbff' : '#fff'}">
      ${scat ? `<td style="${td}font-size:8pt;color:#2563eb;font-weight:bold;" ${ed}>${escapeHTML(it.cat || '')}</td>` : ''}
      <td style="${td}overflow-wrap:anywhere;">
        <div ${ed}>${escapeHTML(it.name)}</div>
        ${sin && it.note ? `<div style="margin-top:0.5mm;font-size:7.5pt;color:#6b7280;" ${ed}>${escapeHTML(it.note)}</div>` : ''}
      </td>
      ${sc ? `<td style="${td}text-align:center;" ${ed}>${escapeHTML(it.caseSize || '')}</td>` : ''}
      <td style="${tdR}background:#fffdf5;" ${ed}>${qtyCell(it.qty)}</td>
      <td style="${td}text-align:center;" ${ed}>${escapeHTML(it.unit)}</td>
      ${sp ? `<td style="${tdR}" ${ed}>${it.price > 0 ? yen(it.price) : ''}</td>` : ''}
    </tr>`;
  }).join('');
  const colW = { cat: scat ? 15 : 0, case: sc ? 9 : 0, qty: 11, unit: 8, price: sp ? 13 : 0 };
  const nameW = 100 - colW.cat - colW.case - colW.qty - colW.unit - colW.price;
  const colgroup = '<colgroup>' +
    (scat ? `<col style="width:${colW.cat}%">` : '') +
    `<col style="width:${nameW}%">` +
    (sc ? `<col style="width:${colW.case}%">` : '') +
    `<col style="width:${colW.qty}%"><col style="width:${colW.unit}%">` +
    (sp ? `<col style="width:${colW.price}%">` : '') +
    '</colgroup>';
  const noteHtml = String(m.note || '').split('\n').map(l => escapeHTML(l)).join('<br>');
  return `
  <style>.editable{outline:1px dashed transparent;outline-offset:1px;cursor:text;}.editable:hover,.editable:focus{outline-color:#93c5fd;background:rgba(219,234,254,.35);}</style>
  <div class="doc" data-fit-page="1" style="width:210mm;min-height:297mm;padding:14mm 13mm;background:#fff;box-sizing:border-box;font-family:'BIZ UDPMincho','Yu Mincho','Hiragino Mincho ProN',serif;color:#1f2937;font-size:9.5pt;line-height:1.6;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div style="flex:1;">
        <div style="font-size:22pt;letter-spacing:0.5em;color:#1e3a8a;border-bottom:1.5px solid #3b82f6;padding-bottom:2mm;display:inline-block;" ${ed}>${escapeHTML(m.title || '発　注　書')}</div>
        <div style="margin-top:5mm;font-size:14pt;color:#1f2937;border-bottom:1px solid #93c5fd;display:inline-block;padding-right:10mm;padding-bottom:1mm;">太陽シルバーサービス株式会社${o ? '　' + escapeHTML(o.name) : ''} <span style="font-size:10.5pt;color:#2563eb;">御中</span></div>
        <div style="margin-top:3mm;font-size:8.5pt;color:#4b5563;">下記のとおり注文いたします。</div>
        ${o ? `<div style="margin-top:2mm;font-size:8.5pt;color:#4b5563;">TEL：${escapeHTML(o.tel)}</div>
        <div style="font-size:8.5pt;color:#1f2937;font-weight:bold;">FAX：${escapeHTML(o.fax)}</div>` : ''}
      </div>
      <div style="width:70mm;font-size:8.5pt;color:#4b5563;">
        <div style="text-align:right;">発注日：　　　　　　　　　（ご記入ください）</div>
        <div style="margin-top:3mm;border:1px solid #93c5fd;background:#f0f7ff;padding:2.5mm;">
          <div style="font-size:7.5pt;color:#2563eb;font-weight:bold;">発注元</div>
          <div style="font-weight:bold;color:#1e3a8a;font-size:10pt;" ${ed}>${escapeHTML(m.facilityName)}</div>
          ${String(m.facilityAddress || '').trim() ? `<div style="margin-top:1mm;font-size:8pt;" ${ed}>${escapeHTML(m.facilityAddress)}</div>` : ''}
          ${String(m.facilityTel || '').trim() ? `<div style="margin-top:1mm;font-size:8pt;" ${ed}>TEL：${escapeHTML(m.facilityTel)}</div>` : ''}
          ${String(m.facilityFax || '').trim() ? `<div style="margin-top:1mm;font-size:8pt;" ${ed}>FAX：${escapeHTML(m.facilityFax)}</div>` : ''}
          <div style="margin-top:1.5mm;" ${ed}>ご担当者：　　　　　　　　　</div>
        </div>
      </div>
    </div>

    <table style="width:100%;border-collapse:collapse;margin-top:7mm;table-layout:fixed;">
      ${colgroup}
      <thead><tr>${scat ? `<th style="${th}">カテゴリ</th>` : ''}<th style="${th}">商品名</th>${sc ? `<th style="${th}">入数</th>` : ''}<th style="${th}">数量</th><th style="${th}">単位</th>${sp ? `<th style="${th}">単価（税抜）</th>` : ''}</tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${m.items.some(it => !it.isSpacer && !String(it.name).trim()) ? `<div style="margin-top:2mm;font-size:7.5pt;color:#9ca3af;">※商品名が空欄の行は、リストにない商品を手書きでご記入いただく欄です。</div>` : ''}

    <div style="margin-top:6mm;border:1px solid #bfdbfe;background:#eff6ff;padding:3mm;font-size:9.5pt;color:#4b5563;">
      【備考】<br>
      <div ${ed}>${noteHtml}</div>
    </div>
  </div>`;
}

/* ============================================================
   印刷: 御見積書（taiyo-mitsumori の書式に準拠）
============================================================ */
function buildQuoteHtml(m) {
  const th = 'background:#dbeafe;color:#1e3a8a;font-size:8.5pt;padding:1.6mm 2mm;border:1px solid #93c5fd;font-weight:bold;';
  const td = 'padding:1.8mm 2mm;border:1px solid #bfdbfe;font-size:9.5pt;';
  const tdR = td + 'text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;';
  const sp = m.showPrices;
  const sc = m.showCaseSize !== false;
  const scat = m.showCat !== false;   // カテゴリ列の表示（デフォルトON）
  const sin = !!m.showItemNote;       // 商品ごとの備考（画面のトグルに従う。既定は非表示）
  const st = m.showTotal !== false;   // 合計金額の表示（単価・明細金額とは独立したトグル）
  const qn = (q) => (Number(q) || 0);
  const ed = 'class="editable" contenteditable="true"';
  // 品目・数量・単位の3列が基本。カテゴリ/入数/(単価+金額)は表示時のみ加算する
  const quoteColCount = 3 + (scat ? 1 : 0) + (sc ? 1 : 0) + (sp ? 2 : 0);
  const rows = m.items.map((it, i) => {
    if (it.isSpacer) return `<tr style="height:6mm;"><td colspan="${quoteColCount}" style="border:1px solid #bfdbfe;border-left:none;border-right:none;"></td></tr>`;
    return `
    <tr style="background:${i % 2 === 1 ? '#f8fbff' : '#fff'}">
      ${scat ? `<td style="${td}font-size:8pt;color:#2563eb;font-weight:bold;" ${ed}>${escapeHTML(it.cat || '')}</td>` : ''}
      <td style="${td}overflow-wrap:anywhere;">
        <div ${ed}>${escapeHTML(it.name)}</div>
        ${sin && it.note ? `<div style="margin-top:0.5mm;font-size:7.5pt;color:#6b7280;" ${ed}>${escapeHTML(it.note)}</div>` : ''}
      </td>
      ${sc ? `<td style="${td}text-align:center;" ${ed}>${escapeHTML(it.caseSize || '')}</td>` : ''}
      <td style="${tdR}" ${ed}>${it.qty === '' ? '' : num(it.qty)}</td>
      <td style="${td}text-align:center;" ${ed}>${escapeHTML(it.unit)}</td>
      ${sp ? `<td style="${tdR}" ${ed}>${yen(it.price)}</td><td style="${tdR}" ${ed}>${yen(qn(it.qty) * it.price)}</td>` : ''}
    </tr>`;
  }).join('');
  const sub = m.items.reduce((s, it) => it.isSpacer ? s : s + qn(it.qty) * it.price, 0);
  const tax = Math.floor(sub * 0.1);
  const total = sub + tax;
  const colW = { cat: scat ? 14 : 0, case: sc ? 9 : 0, qty: 10, unit: 8, price: sp ? 14 : 0, amount: sp ? 16 : 0 };
  const nameW = 100 - colW.cat - colW.case - colW.qty - colW.unit - colW.price - colW.amount;
  const colgroup = '<colgroup>' +
    (scat ? `<col style="width:${colW.cat}%">` : '') +
    `<col style="width:${nameW}%">` +
    (sc ? `<col style="width:${colW.case}%">` : '') +
    `<col style="width:${colW.qty}%"><col style="width:${colW.unit}%">` +
    (sp ? `<col style="width:${colW.price}%"><col style="width:${colW.amount}%">` : '') +
    '</colgroup>';
  const totalColspan = (sp ? 4 : 2) + (sc ? 1 : 0) + (scat ? 1 : 0);
  return `
  <style>.editable{outline:1px dashed transparent;outline-offset:1px;cursor:text;}.editable:hover,.editable:focus{outline-color:#93c5fd;background:rgba(219,234,254,.35);}</style>
  <div class="doc" style="width:210mm;min-height:297mm;padding:14mm 13mm;background:#fff;box-sizing:border-box;font-family:'BIZ UDPMincho','Yu Mincho','Hiragino Mincho ProN',serif;color:#1f2937;font-size:9.5pt;line-height:1.6;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div style="flex:1;">
        <div style="font-size:22pt;letter-spacing:0.5em;color:#1e3a8a;border-bottom:1.5px solid #3b82f6;padding-bottom:2mm;display:inline-block;">御　見　積　書</div>
        <div style="margin-top:5mm;font-size:15pt;color:#1f2937;border-bottom:1px solid #93c5fd;display:inline-block;padding-right:10mm;padding-bottom:1mm;" ${ed}>${escapeHTML(m.facilityName)} <span style="font-size:10.5pt;color:#2563eb;">御中</span></div>
        <div style="margin-top:3mm;font-size:8.5pt;color:#4b5563;">下記の通りお見積り申し上げます。</div>
        ${st ? `
        <div style="margin-top:4mm;display:inline-block;border:1.5px solid #1e3a8a;background:#f0f7ff;padding:2mm 6mm;">
          <span style="font-size:9pt;color:#1e3a8a;font-weight:bold;">御見積金額</span>
          <span style="font-size:15pt;color:#1e3a8a;font-weight:bold;margin-left:5mm;font-variant-numeric:tabular-nums;">${yen(m.taxIncluded ? total : sub)}</span>
          <span style="font-size:8.5pt;color:#4b5563;">（${m.taxIncluded ? '税込' : '税抜'}）</span>
        </div>` : ''}
      </div>
      <div style="width:70mm;font-size:8.5pt;color:#4b5563;">
        <div style="text-align:right;" ${ed}>発行日：${escapeHTML(m.issued)}</div>
        <div style="text-align:right;" ${ed}>見積番号：${escapeHTML(m.quoteNo)}</div>
        <div style="text-align:right;">有効期限：お見積日より30日間</div>
        ${officeBlockHtml(m.office, m.repName)}
      </div>
    </div>

    <table style="width:100%;border-collapse:collapse;margin-top:7mm;table-layout:fixed;">
      ${colgroup}
      <thead><tr>${scat ? `<th style="${th}">カテゴリ</th>` : ''}<th style="${th}">品目</th>${sc ? `<th style="${th}">入数</th>` : ''}<th style="${th}">数量</th><th style="${th}">単位</th>${sp ? `<th style="${th}">単価（税抜）</th><th style="${th}">金額（税抜）</th>` : ''}</tr></thead>
      <tbody>
      ${rows}
      ${st ? `
      <tr>
        <td colspan="${totalColspan}" style="${td}text-align:right;font-weight:bold;color:#1e3a8a;background:#eff6ff;">小計（税抜）</td>
        <td style="${tdR}font-weight:bold;background:#eff6ff;">${yen(sub)}</td>
      </tr>
      <tr>
        <td colspan="${totalColspan}" style="${td}text-align:right;font-weight:bold;color:#1e3a8a;background:#eff6ff;">消費税（10%）</td>
        <td style="${tdR}font-weight:bold;background:#eff6ff;">${yen(tax)}</td>
      </tr>
      <tr>
        <td colspan="${totalColspan}" style="${td}text-align:right;font-weight:bold;color:#1e3a8a;background:#eff6ff;">合計（税込）</td>
        <td style="${tdR}font-weight:bold;font-size:11pt;background:#eff6ff;">${yen(total)}</td>
      </tr>` : ''}
      </tbody>
    </table>

    <div style="margin-top:8mm;border:1px solid #bfdbfe;background:#eff6ff;padding:3mm;font-size:9.5pt;color:#4b5563;">
      【備考】<br>
      <div ${ed}>${String(m.note || '').split('\n').map(l => escapeHTML(l)).join('<br>')}</div>
    </div>
  </div>`;
}

/* ============================================================
   印刷: 発注書・見積書（社内確認用）— 仕入・利益率を含む内部資料。外部には出さない前提
============================================================ */
function buildDocInternalHtml(m) {
  const th = 'background:#dbeafe;color:#1e3a8a;font-size:8pt;padding:1.4mm 2mm;border:1px solid #93c5fd;font-weight:bold;';

  const tdR = td + 'text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;';
  const tdCost = 'padding:1.5mm 2mm;border:1px solid #fde68a;background:#fffbeb;font-size:9pt;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;color:#92400e;font-weight:bold;';
  const o = officeByName(m.office);
  const rows = m.items.filter(it => !it.isSpacer).map((it, i) => {
    const gross = it.price - it.cost;
    const rate = it.price > 0 ? Math.round(gross / it.price * 1000) / 10 : 0;
    return `
    <tr style="background:${i % 2 === 1 ? '#f8fbff' : '#fff'}">
      <td style="${tdR}">${i + 1}</td>
      <td style="${td}overflow-wrap:anywhere;">
        ${it.cat ? `<div style="font-size:7pt;color:#2563eb;font-weight:bold;">${escapeHTML(it.cat)}</div>` : ''}
        <div>${escapeHTML(it.name)}</div>
      </td>
      <td style="${td}text-align:center;">${escapeHTML(it.unit || '')}</td>
      <td style="${tdR}">${m.isQuote && it.qty !== '' ? num(it.qty) : ''}</td>
      <td style="${tdCost}">${it.cost > 0 ? yen(it.cost) : '—'}</td>
      <td style="${tdR}font-weight:bold;">${it.price > 0 ? yen(it.price) : '—'}</td>
      <td style="${tdR}">${it.price > 0 && it.cost > 0 ? yen(gross) + '（' + rate + '%）' : '—'}</td>
    </tr>`;
  }).join('');
  return `
  <div class="doc" style="width:210mm;min-height:297mm;padding:11mm 13mm;background:#fff;box-sizing:border-box;font-family:'BIZ UDPMincho','Yu Mincho','Hiragino Mincho ProN',serif;color:#1f2937;font-size:9pt;line-height:1.5;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div style="flex:1;">
        <div style="font-size:18pt;letter-spacing:0.4em;color:#92400e;border-bottom:1.5px solid #f59e0b;padding-bottom:1.5mm;display:inline-block;">${escapeHTML(m.title || (m.isQuote ? '御見積書' : '発注書'))}（社内確認用）</div>
        ${m.facilityName ? `<div style="margin-top:4mm;font-size:11pt;color:#1f2937;">${escapeHTML(m.facilityName)}</div>` : ''}
        <div style="margin-top:2.5mm;font-size:8pt;color:#4b5563;">担当：${escapeHTML(m.repName || '未設定')}</div>
      </div>
      <div style="width:60mm;font-size:8pt;color:#4b5563;text-align:right;">
        <div>発行日：${escapeHTML(m.issued)}</div>
        ${o ? `<div style="margin-top:1mm;">${escapeHTML(o.name)}</div>` : ''}
      </div>
    </div>

    <div style="margin-top:3mm;border:1px solid #fcd34d;background:#fffbeb;padding:2mm 3mm;font-size:7.5pt;color:#92400e;font-weight:bold;">
      ※ 社内確認用資料です。仕入価格・利益率を含みますので、施設など社外へは絶対にお渡しにならないでください。
    </div>

    <table style="width:100%;border-collapse:collapse;margin-top:4mm;table-layout:fixed;">
      <colgroup><col style="width:5%"><col style="width:34%"><col style="width:9%"><col style="width:9%"><col style="width:13%"><col style="width:13%"><col style="width:17%"></colgroup>
      <thead><tr>
        <th style="${th}">No.</th><th style="${th}">商品名</th><th style="${th}">単位</th><th style="${th}">数量</th>
        <th style="${thCost}">仕入</th><th style="${th}">単価</th><th style="${th}">粗利額（率）</th>
      </tr></thead>
      <tbody>${rows || `<tr><td colspan="7" style="${td}text-align:center;color:#6b7280;">商品データがありません</td></tr>`}</tbody>
    </table>

    ${m.note ? `<div style="margin-top:5mm;border:1px solid #bfdbfe;background:#eff6ff;padding:2.5mm;font-size:8pt;color:#4b5563;">
      【備考】<br>${String(m.note).split('\n').map(l => escapeHTML(l)).join('<br>')}
    </div>` : ''}
  </div>`;
}

/* ============================================================
   印刷: 価格改定のご案内
============================================================ */
function buildPriceRevisionHtml(m) {
  const th = 'background:#dbeafe;color:#1e3a8a;font-size:8pt;padding:1.4mm 2mm;border:1px solid #93c5fd;font-weight:bold;';
  const td = 'padding:1.5mm 2mm;border:1px solid #bfdbfe;font-size:9pt;';
  const tdR = td + 'text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;';
  // 改定後の価格・価格差・変動率は施設側が最も確認したい情報のため、ひと目で分かるよう色付けする
  const thNew = 'background:#bfdbfe;color:#1e3a8a;font-size:8pt;padding:1.4mm 2mm;border:1px solid #60a5fa;font-weight:bold;';
  const tdNew = 'padding:1.5mm 2mm;border:1px solid #93c5fd;background:#eff6ff;font-size:9pt;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;color:#1e3a8a;font-weight:bold;';
  const tdUp = 'padding:1.5mm 2mm;border:1px solid #fecaca;background:#fef2f2;font-size:9pt;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;color:#b91c1c;font-weight:bold;';
  const tdDown = 'padding:1.5mm 2mm;border:1px solid #bbf7d0;background:#f0fdf4;font-size:9pt;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;color:#15803d;font-weight:bold;';
  const sc = m.showCaseSize === true;    // 入数（デフォルト非表示）
  const sa = m.showAmounts !== false;    // 現状価格・改定価格
  const sd = sa && m.showDiff !== false; // 価格差（金額表示中のみ意味を持つ）
  const sr = sa && m.showRate !== false; // 変動率（金額表示中のみ意味を持つ）
  const scat = m.showCat !== false;      // カテゴリ列（デフォルトON）
  const ed = 'class="editable" contenteditable="true"';
  const o = officeByName(m.office);
  // 表示する列に応じて列幅を再配分（商品名は非表示になった分を吸収して広がる）
  const cols = [
    { w: 6 }, // No.
    ...(scat ? [{ w: 12 }] : []), // カテゴリ
    { w: (scat ? 18 : 30) + (sc ? 0 : 9) + (sa ? 0 : 27) + (sd ? 0 : 9.5) + (sr ? 0 : 9.5) }, // 商品名
    ...(sc ? [{ w: 9 }] : []), // 入数
    { w: 9 }, // 単位
    ...(sa ? [{ w: 13 }, { w: 13 }] : []), // 現状/改定
    ...(sd ? [{ w: 9.5 }] : []), // 価格差
    ...(sr ? [{ w: 9.5 }] : []), // 変動率
  ];
  const colgroup = '<colgroup>' + cols.map(c => `<col style="width:${c.w}%">`).join('') + '</colgroup>';
  const headCells = [`<th style="${th}">No.</th>`, scat ? `<th style="${th}">カテゴリ</th>` : null, `<th style="${th}">商品名</th>`, sc ? `<th style="${th}">入数</th>` : null, `<th style="${th}">単位</th>`,
    sa ? `<th style="${th}">現状価格（税抜）</th>` : null, sa ? `<th style="${thNew}">改定価格（税抜）</th>` : null, sd ? `<th style="${thNew}">価格差</th>` : null, sr ? `<th style="${thNew}">変動率</th>` : null]
    .filter((v) => v !== null).join('');
  const rows = m.items.map((it, i) => {
    const diff = it.newPrice - it.currentPrice;
    // 現状価格が0(新規取扱など)のときは変動率を算出できない。0%と書くと
    // 「価格差 +¥1,200 / 変動率 +0%」という矛盾した行が顧客向け書類に載るため null にする。
    const rate = it.currentPrice > 0 ? Math.round(diff / it.currentPrice * 1000) / 10 : null;
    const diffSign = diff > 0 ? '+' : diff < 0 ? '−' : '';
    const diffTd = diff === 0 ? tdR : diff > 0 ? tdUp : tdDown;
    return `
    <tr style="background:${i % 2 === 1 ? '#f8fbff' : '#fff'}">
      <td style="${tdR}">${i + 1}</td>
      ${scat ? `<td style="${td}font-size:8pt;color:#2563eb;font-weight:bold;" ${ed}>${escapeHTML(it.cat || '')}</td>` : ''}
      <td style="${td}overflow-wrap:anywhere;">
        <div>${escapeHTML(it.name)}</div>
      </td>
      ${sc ? `<td style="${td}text-align:center;">${escapeHTML(it.caseSize || '')}</td>` : ''}
      <td style="${td}text-align:center;">${escapeHTML(it.unit || '')}</td>
      ${sa ? `<td style="${tdR}">${yen(it.currentPrice)}</td>` : ''}
      ${sa ? `<td style="${tdNew}">${yen(it.newPrice)}</td>` : ''}
      ${sd ? `<td style="${diffTd}">${diff === 0 ? '―' : diffSign + yen(Math.abs(diff))}</td>` : ''}
      ${sr ? `<td style="${diffTd}">${diff === 0 || rate === null ? '―' : diffSign + Math.abs(rate) + '%'}</td>` : ''}
    </tr>`;
  }).join('');
  return `
  <style>.editable{outline:1px dashed transparent;outline-offset:1px;cursor:text;}.editable:hover,.editable:focus{outline-color:#93c5fd;background:rgba(219,234,254,.35);}</style>
  <div class="doc" style="width:210mm;min-height:297mm;padding:11mm 13mm;background:#fff;box-sizing:border-box;font-family:'BIZ UDPMincho','Yu Mincho','Hiragino Mincho ProN',serif;color:#1f2937;font-size:9pt;line-height:1.5;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div style="flex:1;">
        <div style="font-size:20pt;letter-spacing:0.5em;color:#1e3a8a;border-bottom:1.5px solid #3b82f6;padding-bottom:1.5mm;display:inline-block;">${escapeHTML(m.title || '価格改定のご案内')}</div>
        ${m.facilityName ? `<div style="margin-top:4mm;font-size:13pt;color:#1f2937;border-bottom:1px solid #93c5fd;display:inline-block;padding-right:10mm;padding-bottom:1mm;">${escapeHTML(m.facilityName)} <span style="font-size:10pt;color:#2563eb;">御中</span></div>` : ''}
        <div style="margin-top:2.5mm;font-size:8pt;color:#4b5563;">下記のとおり価格を改定いたしますので、ご案内申し上げます。</div>
      </div>
      <div style="width:68mm;font-size:8pt;color:#4b5563;">
        <div style="text-align:right;">発行日：${escapeHTML(m.issued)}</div>

      【備考】<br>${String(m.note).split('\n').map(l => escapeHTML(l)).join('<br>')}
    </div>` : ''}
  </div>`;
}

/* ============================================================
   印刷: 価格改定（社内確認用）— 仕入・利益率を含む内部資料。外部には出さない前提
============================================================ */
function buildPriceRevisionInternalHtml(m) {
  const th = 'background:#dbeafe;color:#1e3a8a;font-size:7.5pt;padding:1.3mm 1.6mm;border:1px solid #93c5fd;font-weight:bold;';
  const thCost = 'background:#fef3c7;color:#92400e;font-size:7.5pt;padding:1.3mm 1.6mm;border:1px solid #fcd34d;font-weight:bold;';
  const td = 'padding:1.4mm 1.6mm;border:1px solid #bfdbfe;font-size:8.5pt;';
  const tdR = td + 'text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;';
  const tdCost = 'padding:1.4mm 1.6mm;border:1px solid #fde68a;background:#fffbeb;font-size:8.5pt;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;color:#92400e;font-weight:bold;';
  const o = officeByName(m.office);
  const colgroup = '<colgroup><col style="width:4%"><col style="width:20%"><col style="width:7%">' +
    '<col style="width:9%"><col style="width:9%"><col style="width:8%">' +
    '<col style="width:9%"><col style="width:9%"><col style="width:8%">' +

      <thead><tr>${headCells}</tr></thead>
      <tbody>${rows}</tbody>

    ${m.note ? `<div style="margin-top:5mm;border:1px solid #bfdbfe;background:#eff6ff;padding:2.5mm;font-size:8pt;color:#4b5563;">
      【備考】<br>${String(m.note).split('\n').map(l => escapeHTML(l)).join('<br>')}
    </div>` : ''}
  </div>`;
}

/* ============================================================
   共通UI部品
============================================================ */
function Segmented({ options, value, onChange }) {
  return (
    <div className="inline-flex bg-slate-200/70 rounded-xl p-1 gap-0.5">
      {options.map(([id, label]) => (
        <button key={id} onClick={() => onChange(id)}
          className={"px-3.5 py-1.5 rounded-lg text-sm font-bold transition " +
            (value === id ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-700 hover:text-slate-700')}>
          {label}
        </button>
      ))}
    </div>
  );
}

function DeltaPill({ v, suffix }) {
  if (v > 0) return <span className="inline-flex items-center gap-0.5 bg-emerald-50 text-emerald-700 text-xs font-bold px-2 py-0.5 rounded-full tabular-nums"><ArrowUpRight size={12} />+{v}{suffix || '%'}</span>;
  if (v < 0) return <span className="inline-flex items-center gap-0.5 bg-rose-50 text-rose-600 text-xs font-bold px-2 py-0.5 rounded-full tabular-nums"><ArrowDownRight size={12} />{v}{suffix || '%'}</span>;
  return <span className="bg-slate-100 text-slate-700 text-xs font-bold px-2 py-0.5 rounded-full tabular-nums">±0{suffix || '%'}</span>;
}

// 差額の表示。色だけに頼らないよう、符号と矢印も付ける
function DiffText({ v, unit, className }) {
  const cls = v > 0 ? 'text-emerald-700' : v < 0 ? 'text-rose-600' : 'text-slate-600';
  const Icon = v > 0 ? ArrowUpRight : v < 0 ? ArrowDownRight : null;
  const body = unit === 'pt' ? Math.abs(v).toFixed(1) + 'pt' : unit === '件' ? num(Math.abs(v)) + '件' : yen(Math.abs(v));
  return (
    <span className={"inline-flex items-center gap-0.5 tabular-nums font-bold " + cls + ' ' + (className || '')}>
      {Icon && <Icon size={14} />}{v > 0 ? '+' : v < 0 ? '−' : '±'}{body}
    </span>
  );
}

// 増減率は差額の補助として出す。比較対象が0以下・未取得なら「—」
function RateSub({ v, className }) {
  if (v === null || v === undefined) return <span className={"text-[11px] text-slate-500 font-bold " + (className || '')}>—</span>;
  return <DeltaPill v={v} />;
}

// 一番新しい月の明細がわずかなときのお知らせ。基準月が自動で前の月になっているか、その月を選んでいるかで文言を変える
function ThinMonthNote({ data, className }) {
  const t = data.thinLatest;
  if (!t) return null;
  const detail = idxLabel(t.idx) + 'の明細はまだ' + num(t.rows) + '行（得意先' + num(t.customers) + '件・' + yen(t.sales) + '）しかありません' +
    '（ふだんの月は' + num(t.medianRows) + '行ほど）。';
  return data.baseIdx === t.idx
    ? <InfoNote tone="warn" className={className}>{detail}売上を月末にまとめて入力している場合や、CSVが途中までの場合に起こります。この月の数字と前年比較は、実態より少なく出ます。</InfoNote>
    : <InfoNote className={className}>{detail}取り込みが途中の可能性があるため、基準月は{idxLabel(data.baseIdx)}にしています。{idxLabel(t.idx)}を見るときは、画面上部の基準月で選んでください。</InfoNote>;
}

// 集計条件や注意を表やカードの上で知らせる（tone: info=青 / warn=黄）
function InfoNote({ children, className, tone }) {

  return <div className={"text-[11px] border rounded-lg px-3 py-2 leading-relaxed " + t + ' ' + (className || '')}>{children}</div>;
}

function KpiCard({ icon: Icon, tint, label, value, delta, deltaSuffix, note, extra, onClick, emphasize, title, linkLabel }) {

}

// 施設別ランキング(buildPeriodReportのranking)2本を突き合わせ、当期・前年同期・差分を施設ごとに算出する。
// metric: 'sales' | 'gross' | 'margin'。片方の期間にしか購入がない施設は onlyCur / onlyPrev で示す
// （「新規」「離脱」とは断定しない。取引開始・終了かどうかは過去の履歴や事情の確認が要る）。
// 粗利額が不明な明細を含む施設の粗利・粗利率は unknown=true にして差額を出さない。
function buildFacilityComparison(curRanking, prevRanking, metric, prevCovered = true) {
  const curMap = new Map((curRanking || []).map(f => [f.name, f]));
  const prevMap = new Map((prevRanking || []).map(f => [f.name, f]));
  const names = new Set([...curMap.keys(), ...prevMap.keys()]);
  let rows = [...names].map(name => {
    const c = curMap.get(name), p = prevMap.get(name);
    const curVal = c ? (c[metric] ?? 0) : 0;
    const prevVal = p ? (p[metric] ?? 0) : 0;
    const unknown = metric !== 'sales' && ((c && c.grossUnknown > 0) || (p && p.grossUnknown > 0));
    return {
      name,
      repName: (c || p).repName,
      curVal, prevVal, unknown,
      salesCur: c ? c.sales : 0, salesPrev: p ? p.sales : 0,
      diff: unknown ? null : curVal - prevVal,
      pct: unknown || metric === 'margin' ? null : pctChange(curVal, prevVal),
      onlyCur: !!c && !p,
      onlyPrev: !c && !!p,
    };
  });
  // 粗利率は売上が正の期間どうしだけで比べる（売上0以下の粗利率は算出対象外。片方に実績がない施設を
  // 入れると、存在しない側が便宜上0%扱いになり「0%→20%」のような取引実態のない変化が紛れ込む）。
  // 前年データがないときは比べずに、当期の売上が正の施設だけを並べる。
  if (metric === 'margin') rows = rows.filter(r => r.salesCur > 0 && (!prevCovered || r.salesPrev > 0));
  // 金額は減少額が大きい施設から（率だけで重要度を決めない）。粗利率は差の大きい順。未確定は最後
  rows.sort((a, b) => (a.diff === null) - (b.diff === null)
    || (metric === 'margin' ? Math.abs(b.diff) - Math.abs(a.diff) : a.diff - b.diff));
  return rows;
}

// KPIカードの施設別内訳。curLabel/prevLabel は日付の範囲（例: 2026/10/1〜2026/10/27）。
// note: 月途中などの注意文。prevCovered=false なら前年データ未取得として差額を出さない。
function KpiDrilldownModal({ title, curLabel, prevLabel, curRanking, prevRanking, metric, unit, note, inProgress, prevCovered, onJump, onClose }) {
  const rows = React.useMemo(() => buildFacilityComparison(curRanking, prevCovered ? prevRanking : [], metric, prevCovered), [curRanking, prevRanking, metric, prevCovered]);
  const fmt = (v) => unit === '%' ? v.toFixed(1) + '%' : yen(v);
  const increased = rows.filter(r => r.diff > 0).length;
  const decreased = rows.filter(r => r.diff < 0).length;
  const decTotal = rows.reduce((t, r) => t + (r.diff < 0 ? r.diff : 0), 0);
  return (
    <div className="fixed inset-0 z-40 bg-slate-600/50 backdrop-blur-sm overflow-auto py-8 px-4 no-print" onClick={onClose}>
      <div className="max-w-3xl mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden" onClick={e => e.stopPropagation()}>
        <div className="px-6 py-4 border-b border-slate-100 flex items-center gap-3 bg-gradient-to-r from-sky-50 to-blue-50">
          <span className="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-sky-100 text-sky-600"><Building2 size={17} /></span>
          <div className="flex-1 min-w-0">
            <div className="font-extrabold text-slate-800">{title}：施設別の前年同期比較</div>
            <div className="text-[11px] text-slate-600">当期 {curLabel} ／ 前年同期 {prevLabel}（税抜）</div>
          </div>
          <button onClick={onClose} className="text-slate-600 hover:text-slate-800 transition"><X size={20} /></button>
        </div>
        <div className="px-6 pt-4 space-y-2">
          {prevCovered ? (
            <div className="flex gap-4 text-xs font-bold flex-wrap">
              <span className="text-emerald-700">増加 {increased}施設</span>
              <span className="text-rose-600">減少 {decreased}施設</span>
              {unit !== '%' && decreased > 0 && <span className="text-slate-700">減少額の合計 <DiffText v={decTotal} /></span>}
            </div>
          ) : (
            <InfoNote tone="warn">前年同期（{prevLabel}）の明細が取り込まれていない（または途中の月が抜けている）ため、比較できません。当期の数字だけを表示しています。</InfoNote>
          )}
          {note && <InfoNote>{note}</InfoNote>}
          {onJump && <div className="text-[11px] text-slate-600">施設名を押すと、その施設の明細・内訳へ進みます。</div>}
        </div>
        <div className="max-h-[60vh] overflow-auto px-6 py-4">
          {rows.length === 0 ? (
            <div className="text-sm text-slate-600 text-center py-6">比較できるデータがありません。</div>
          ) : (
            <table className="w-full text-xs">
              <thead>
                <tr className="text-slate-600 border-b border-slate-200">
                  <th className="text-left font-bold py-2">施設名</th>
                  {prevCovered && <th className="text-right font-bold py-2 whitespace-nowrap">前年同期</th>}
                  <th className="text-right font-bold py-2 whitespace-nowrap">当期</th>
                  {prevCovered && <th className="text-right font-bold py-2 whitespace-nowrap">差額</th>}
                  {prevCovered && unit !== '%' && <th className="text-right font-bold py-2 whitespace-nowrap">増減率</th>}
                </tr>
              </thead>
              <tbody>
                {rows.map(r => (
                  <tr key={r.name} className="border-b border-slate-100">
                    <td className="py-2 text-slate-800 font-bold">
                      {onJump ? <button onClick={() => onJump(r.name)} className="text-left hover:text-sky-700 hover:underline">{r.name}</button> : r.name}
                      {prevCovered && r.onlyCur && <span className="ml-1.5 text-[10px] text-slate-600 bg-slate-100 px-1.5 py-0.5 rounded-full font-bold whitespace-nowrap">前年同期は購入なし</span>}
                      {r.onlyPrev && <span className="ml-1.5 text-[10px] text-slate-600 bg-slate-100 px-1.5 py-0.5 rounded-full font-bold whitespace-nowrap">{inProgress ? '当期はまだ購入なし' : '当期は購入なし'}</span>}
                    </td>
                    {prevCovered && <td className="py-2 text-right text-slate-600 tabular-nums">{r.unknown ? '未確定' : fmt(r.prevVal)}</td>}
                    <td className="py-2 text-right text-slate-800 tabular-nums font-bold">{r.unknown ? '未確定' : fmt(r.curVal)}</td>
                    {prevCovered && <td className="py-2 text-right">{r.diff === null ? <span className="text-slate-500">—</span> : <DiffText v={r.diff} unit={unit === '%' ? 'pt' : undefined} />}</td>}
                    {prevCovered && unit !== '%' && <td className="py-2 text-right"><RateSub v={r.pct} /></td>}
                  </tr>
                ))}
              </tbody>
            </table>

        </div>
      </div>

  );
}

// 購入得意先の内訳：前年同期と当期の両方に購入（継続）／当期だけ／前年同期だけ。
// 「取得データ内で初購入」は、取り込んだ全明細の中で最初の購入が当期にある得意先（それ以前の履歴が
// 取り込まれていなければ、営業所としての新規取引とは断定できない）。継続購入率は締め済みの期間だけで出す。
// curCustomers/prevCustomers は buildPeriodReport の customers。firstBuy は得意先→最初の購入日（sort値）。
// rate は比較元（前年同期）の購入先のうち当期も購入した割合（％、比較元0件なら null）
function buyerBreakdown(curCustomers, prevCustomers, firstBuy, curStartSort) {
  const curB = curCustomers.filter(c => c.sales > 0);
  const prevB = prevCustomers.filter(c => c.sales > 0);
  const prevSet = new Set(prevB.map(c => c.name)), curSet = new Set(curB.map(c => c.name));
  const both = curB.filter(c => prevSet.has(c.name));
  const curOnly = curB.filter(c => !prevSet.has(c.name));
  const prevOnly = prevB.filter(c => !curSet.has(c.name));
  const firstInData = curOnly.filter(c => (firstBuy.get(c.name) || 0) >= curStartSort);
  return { curB, prevB, both, curOnly, prevOnly, firstInData, rate: prevB.length ? Math.round(both.length / prevB.length * 1000) / 10 : null };
}

function BuyersModal({ curRep, prevRep, noCompare, win, firstBuy, dataFrom, onJump, onClose }) {
  const curStartSort = Math.floor(win.cur.from / 12) * 10000 + (win.cur.from % 12 + 1) * 100 + 1;
  const { prevB, both, curOnly, prevOnly, firstInData, rate } = buyerBreakdown(curRep.customers, prevRep ? prevRep.customers : [], firstBuy, curStartSort);
  // 継続購入率は締め済みの同じ長さの期間どうしで出す（月途中の「まだ購入なし」を離脱と数えない）
  const rateOk = !!prevRep && !win.inProgress && rate !== null;
