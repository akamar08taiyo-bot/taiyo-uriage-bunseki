        <div className="px-6 py-4 space-y-4 max-h-[65vh] overflow-auto">
          <InfoNote>購入得意先＝期間内の売上（返品・値引き後）がプラスの得意先（お客様名）の数。同じ得意先の複数伝票は1件と数えます。</InfoNote>
          {noCompare && <Group title="期間内に購入" list={curRep.customers.filter(c => c.sales > 0)} />}
          {noCompare ? (
            <InfoNote>全期間の表示のため、前年との比較（継続・当期だけ・前年同期だけ）はしません。月次・年度・期間指定で確認できます。</InfoNote>
          ) : !prevRep ? (
            <InfoNote tone="warn">前年同期の明細が取り込まれていない（または途中の月が抜けている）ため、継続・当期のみの区別はできません。</InfoNote>
          ) : (

function MiniBars({ values, height = 40, barW = 10, gap = 3, color = '#38bdf8', highlightLast = true }) {
  const max = Math.max(...values, 1);
  const w = values.length * (barW + gap);
  return (
    <svg width={w} height={height} className="block">
      {values.map((v, i) => {
        const h = Math.max(2, (v / max) * (height - 4));
        const isLast = i === values.length - 1;
        return <rect key={i} x={i * (barW + gap)} y={height - h} width={barW} height={h} rx={barW / 3}
          fill={highlightLast && isLast ? '#f59e0b' : color} opacity={highlightLast && isLast ? 1 : 0.6} />;
      })}
    </svg>
  );
}

function AreaChart({ values, labels, height = 190, prevValues }) {
  const stepX = 60, padL = 14, padR = 26, padT = 30, padB = 24;
  const w = padL + padR + stepX * (values.length - 1);
  const prevKnown = (prevValues || []).filter(v => v != null);
  const allValues = prevKnown.length ? values.concat(prevKnown) : values;
  const min = Math.min(...allValues), max = Math.max(...allValues);
  const range = Math.max(max - min, 1);
  const X = (i) => padL + i * stepX;
  const Y = (v) => padT + (height - padT - padB) * (1 - (v - min) / range);
  const line = values.map((v, i) => (i ? 'L' : 'M') + X(i) + ',' + Y(v)).join(' ');
  const area = line + ` L${X(values.length - 1)},${height - padB} L${X(0)},${height - padB} Z`;
  // 前年同月の線: データが連続している区間だけをつなぐ（欠測月で線を切る）
  const prevSegments = [];
  if (prevValues) {
    let seg = [];
    prevValues.forEach((v, i) => {
      if (v == null) { if (seg.length > 1) prevSegments.push(seg); seg = []; return; }
      seg.push([i, v]);
    });
    if (seg.length > 1) prevSegments.push(seg);
  }
  return (
    <div className="overflow-x-auto">
      <svg width={w} height={height} className="block">
        <defs>
          <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#0ea5e9" stopOpacity="0.22" />
            <stop offset="100%" stopColor="#0ea5e9" stopOpacity="0" />
          </linearGradient>
        </defs>
        {[0.25, 0.5, 0.75].map((t, i) => (
          <line key={i} x1={padL} x2={w - padR} y1={padT + (height - padT - padB) * t} y2={padT + (height - padT - padB) * t}
            stroke="#e2e8f0" strokeDasharray="3 4" strokeWidth="1" />
        ))}
        <path d={area} fill="url(#areaGrad)" />
        {prevSegments.map((seg, si) => (
          <path key={si} d={seg.map(([i, v], j) => (j ? 'L' : 'M') + X(i) + ',' + Y(v)).join(' ')}
            fill="none" stroke="#cbd5e1" strokeWidth="2" strokeDasharray="4 3" strokeLinecap="round" strokeLinejoin="round" />
        ))}
        <path d={line} fill="none" stroke="#0ea5e9" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
        {values.map((v, i) => {
          const isLast = i === values.length - 1;
          return (
            <g key={i}>
              <circle cx={X(i)} cy={Y(v)} r={isLast ? 5 : 3.5} fill={isLast ? '#f59e0b' : '#fff'}
                stroke={isLast ? '#fff' : '#0ea5e9'} strokeWidth={isLast ? 2 : 2} />
              <text x={X(i)} y={Y(v) - 10} textAnchor="middle" fontSize="10" fontWeight="bold"
                fill={isLast ? '#b45309' : '#94a3b8'} style={{ fontVariantNumeric: 'tabular-nums' }}>
                {Math.round(v / 1000)}k
              </text>
              <text x={X(i)} y={height - 6} textAnchor="middle" fontSize="10" fill="#94a3b8">{labels[i]}</text>
            </g>
          );
        })}
        {prevValues && prevValues.some(v => v != null) && (
          <g transform={`translate(${w - padR - 96}, ${padT - 20})`}>
            <line x1="0" y1="0" x2="16" y2="0" stroke="#cbd5e1" strokeWidth="2" strokeDasharray="4 3" />
            <text x="20" y="3.5" fontSize="10" fill="#64748b" fontWeight="bold">前年同月</text>
          </g>
        )}
      </svg>
    </div>
  );
}

/* ============================================================
   保存済みドキュメント一覧（価格改定・見積書・発注書 共通）
   施設名でフォルダ分けして表示する。宛先（施設名）は既存の保存データにも
   常に入っているため、過去に作成した未整理の見積・発注書も自動でフォルダに入る。
============================================================ */
function SavedDocFolders({ savedList, onLoad, onDelete, emptyLabel, renderExtra }) {
  const [openFolder, setOpenFolder] = useState(null);
  const [q, setQ] = useState('');
  const folders = useMemo(() => {
    const map = new Map();
    for (const d of savedList) {
      const key = String(d.facility || '').trim() || '（施設未設定）';
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(d);
    }
    const list = [...map.entries()].map(([facility, docs]) => ({
      facility, docs,
      latest: docs.reduce((max, d) => String(d.savedAt) > max ? String(d.savedAt) : max, ''),
    }));
    list.sort((a, b) => b.latest.localeCompare(a.latest));
    return list;
  }, [savedList]);
  const visibleFolders = useMemo(() => {
    const query = normalizeSearchText(q.trim());
    if (!query) return folders;
    return folders.filter(f => normalizeSearchText(f.facility).includes(query));
  }, [folders, q]);

  if (savedList.length === 0) return <div className="py-6 text-center text-sm font-semibold text-slate-700">{emptyLabel}はまだありません</div>;

  return (
    <div>
      {folders.length > 1 && (
        <div className="relative mb-2.5">
          <Search size={14} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-500" />
          <input value={q} onChange={e => setQ(e.target.value)} placeholder="施設名（フォルダ）で絞り込み"
            className="h-9 pl-8 pr-2.5 w-full rounded-lg border border-slate-200 text-xs shadow-sm font-bold text-slate-700 focus:border-sky-400 focus:outline-none" />
        </div>
      )}
      <div className="space-y-2">
        {visibleFolders.map(f => {
          const isOpen = openFolder === f.facility || visibleFolders.length === 1;
          return (
            <div key={f.facility} className="border border-slate-100 rounded-xl overflow-hidden">
              <button type="button" onClick={() => setOpenFolder(isOpen ? null : f.facility)}
                className="w-full flex items-center gap-2.5 px-4 py-3 bg-slate-50/70 hover:bg-sky-50/70 transition text-left">
                <Folder size={16} className="text-amber-500 shrink-0" />
                <span className="font-extrabold text-sm text-slate-900 truncate flex-1">{f.facility}</span>
                <span className="text-xs font-bold text-slate-500 shrink-0">{f.docs.length}件</span>
                {isOpen ? <ChevronUp size={15} className="text-slate-500 shrink-0" /> : <ChevronDown size={15} className="text-slate-500 shrink-0" />}
              </button>
              {isOpen && (
                <div className="p-2 space-y-2">
                  {f.docs.map(d => (
                    <div key={d.id} onClick={() => onLoad(d)} role="button" tabIndex={0}
                      onKeyDown={e => { if (e.key === 'Enter') onLoad(d); }}
                      className="flex items-center gap-4 bg-white hover:bg-sky-50/70 border border-slate-100 rounded-xl px-4 py-3 transition cursor-pointer">
                      <div className="flex-1 min-w-0">
                        <div className="text-xs font-semibold text-slate-700 tabular-nums flex items-center gap-2.5 flex-wrap">
                          <span className="inline-flex items-center gap-1"><CalendarDays size={13} />{d.issued}</span>
                          <span>・{d.items.length}品目</span>
                          <span className="text-slate-500">保存 {stampToLocalDate(d.savedAt)}</span>
                        </div>
                      </div>
                      {renderExtra && renderExtra(d)}
                      <span className="text-sky-600 text-xs font-bold px-3 py-1.5 rounded-full shrink-0 border border-sky-200 bg-white">読み込む</span>
                      <button onClick={e => { e.stopPropagation(); onDelete(d.id); }} className="text-slate-400 hover:text-rose-500 transition shrink-0"><Trash2 size={16} /></button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
        {visibleFolders.length === 0 && <div className="py-6 text-center text-xs text-slate-600">該当する施設フォルダがありません</div>}
      </div>
    </div>
  );
}

/* ============================================================
   簡易電卓（見積書・発注書・価格改定の作成画面の余白に設置）
   単価×数量や入数換算など、その場の暗算をなくすための補助ツール
============================================================ */
function CalcPad() {
  const [display, setDisplay] = useState('0');
  const [prevVal, setPrevVal] = useState(null);
  const [op, setOp] = useState(null);
  const [resetNext, setResetNext] = useState(false);

  const round = (n) => Math.round(n * 1e6) / 1e6;
  const compute = (a, b, o) => {
    switch (o) {
      case '+': return a + b;
      case '-': return a - b;
      case '×': return a * b;
      case '÷': return b !== 0 ? a / b : 0;
      default: return b;
    }
  };
  const inputDigit = (d) => setDisplay(v => {
    if (resetNext) { setResetNext(false); return d === '.' ? '0.' : d; }
    if (v === '0' && d !== '.') return d;
    if (d === '.' && v.includes('.')) return v;
    if (v.replace('-', '').replace('.', '').length >= 12) return v;
    return v + d;
  });
  const clear = () => { setDisplay('0'); setPrevVal(null); setOp(null); setResetNext(false); };
  const backspace = () => setDisplay(v => (v.length > 1 ? v.slice(0, -1) : '0'));
  const toggleSign = () => setDisplay(v => (v === '0' ? v : (v.startsWith('-') ? v.slice(1) : '-' + v)));
  const chooseOp = (o) => {
    const cur = parseFloat(display) || 0;
    if (prevVal !== null && op && !resetNext) {
      const result = round(compute(prevVal, cur, op));
      setPrevVal(result); setDisplay(String(result));
    } else {
      setPrevVal(cur);
    }
    setOp(o);
    setResetNext(true);
  };
  const equals = () => {
    if (prevVal === null || op === null) return;
    const cur = parseFloat(display) || 0;
    const result = round(compute(prevVal, cur, op));
    setDisplay(String(result));
    setPrevVal(null); setOp(null); setResetNext(true);
  };

  const numBtn = "h-11 rounded-lg text-sm font-bold bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 active:scale-95 transition tabular-nums";
  const opBtn = "h-11 rounded-lg text-sm font-bold bg-sky-50 text-sky-600 hover:bg-sky-100 active:scale-95 transition";
  return (
    <Card className="p-3 sticky top-20 min-w-0 max-w-full xl:max-w-[280px]">
      <div className="flex items-center gap-1.5 mb-2.5 text-xs font-bold text-slate-600">
        <Calculator size={14} className="text-slate-400" /> 電卓
      </div>
      <div className="bg-slate-900 rounded-xl px-3 py-3 mb-2.5">
        {op && <div className="text-slate-400 text-[10px] tabular-nums text-right truncate">{num(prevVal)} {op}</div>}
        <div className="text-white text-xl font-bold tabular-nums text-right truncate">{display}</div>
      </div>
      <div className="grid grid-cols-4 gap-1.5">
        <button type="button" onClick={clear} className={numBtn + " col-span-2 bg-rose-50 border-rose-100 text-rose-600 hover:bg-rose-100"}>C</button>
        <button type="button" onClick={backspace} className={numBtn + " inline-flex items-center justify-center"}><Delete size={15} /></button>
        <button type="button" onClick={() => chooseOp('÷')} className={opBtn}>÷</button>
        {[7, 8, 9].map(n => <button type="button" key={n} onClick={() => inputDigit(String(n))} className={numBtn}>{n}</button>)}
        <button type="button" onClick={() => chooseOp('×')} className={opBtn}>×</button>
        {[4, 5, 6].map(n => <button type="button" key={n} onClick={() => inputDigit(String(n))} className={numBtn}>{n}</button>)}
        <button type="button" onClick={() => chooseOp('-')} className={opBtn}>−</button>
        {[1, 2, 3].map(n => <button type="button" key={n} onClick={() => inputDigit(String(n))} className={numBtn}>{n}</button>)}
        <button type="button" onClick={() => chooseOp('+')} className={opBtn}>＋</button>
        <button type="button" onClick={toggleSign} className={numBtn}>±</button>
        <button type="button" onClick={() => inputDigit('0')} className={numBtn}>0</button>
        <button type="button" onClick={() => inputDigit('.')} className={numBtn}>.</button>
        <button type="button" onClick={equals} className="h-11 rounded-lg text-sm font-bold bg-emerald-500 text-white hover:bg-emerald-600 active:scale-95 transition">＝</button>
      </div>
    </Card>
  );
}

  const [repType, setRepType] = useState('month');
  const [consumableOnly, setConsumableOnly] = useState(false);
  const [drilldown, setDrilldown] = useState(null); // KPIカードの施設別内訳モーダル
  const [buyersOpen, setBuyersOpen] = useState(false);
  const [prodSort, setProdSort] = useState('sales'); // 商品TOP10：売上順／粗利順
  const [repMonth, setRepMonth] = useState(data.baseIdx);
  const [repFy, setRepFy] = useState(Math.floor(fiscalStartIdx(data.baseIdx) / 12));
  const [customFrom, setCustomFrom] = useState(data.monthsAll[0] ?? data.baseIdx);
  const [customTo, setCustomTo] = useState(data.baseIdx);
  const [repBusy, setRepBusy] = useState(false);
  useEffect(() => {
    setRepMonth(data.baseIdx);
    setRepFy(Math.floor(fiscalStartIdx(data.baseIdx) / 12));
    setCustomFrom(data.monthsAll[0] ?? data.baseIdx);
    setCustomTo(data.baseIdx);
  }, [data.baseIdx]);

  // データに含まれる年度の一覧
  const fiscalYears = useMemo(() =>
    [...new Set(data.monthsAll.map(i => Math.floor(fiscalStartIdx(i) / 12)))].sort((a, b) => b - a), [data]);

  // 選んだ期間。比較はどの種類も「前年の同じ期間」（月途中なら同じ日まで）
  const spec = useMemo(() => {
    if (repType === 'fy') {
      return { from: repFy * 12 + 3, to: repFy * 12 + 14,
        title: '年度売上レポート', label: repFy + '年度（' + repFy + '年4月〜' + (repFy + 1) + '年3月）', short: repFy + '年度', file: repFy + '年度' };
    }
    if (repType === 'trend') {
      const a = data.monthsAll[0] ?? 0, b = data.monthsAll[data.monthsAll.length - 1] ?? 0;
      return { from: a, to: b, noCompare: true,
        title: '月別推移レポート', label: idxLabel(a) + ' 〜 ' + idxLabel(b) + '（全期間）', short: '全期間', file: '全期間' };
    }
    if (repType === 'custom') {
      const from = Math.min(customFrom, customTo), to = Math.max(customFrom, customTo);
      return { from, to,
        title: '期間指定レポート', label: idxLabel(from) + ' 〜 ' + idxLabel(to), short: idxLabel(from) + '〜' + idxLabel(to),
        file: idxLabel(from) + '-' + idxLabel(to) };
    }
    return { from: repMonth, to: repMonth,
      title: '月次売上レポート', label: idxLabel(repMonth), short: idxLabel(repMonth), file: idxLabel(repMonth) };
  }, [repType, repMonth, repFy, customFrom, customTo, data]);

  // 比較条件（当期・前年同期の日付範囲、月途中、前年データの有無）
  const win = useMemo(() => comparisonWindow(spec.from, spec.to, data.latestDate, data.firstDate, { months: data.monthsAll }), [spec, data]);
  // 画面表示・帳票の両方がこの集計を参照する
  const rep = useMemo(() => buildPeriodReport(rows, masters, spec.from, spec.to, consumableOnly, win && win.cur.cutoff), [rows, masters, spec, consumableOnly, win]);
  const prevRep = useMemo(() => (!win || spec.noCompare || !win.prevCovered ? null
    : buildPeriodReport(rows, masters, win.prev.from, win.prev.to, consumableOnly, win.prev.cutoff)), [rows, masters, spec, consumableOnly, win]);
  const k = rep.kpi, pk = prevRep ? prevRep.kpi : null;
  const grossOk = k.grossUnknown === 0;
  const prevGrossOk = !!pk && pk.grossUnknown === 0;
  const salesDiff = pk ? k.sales - pk.sales : null;
  const grossDiff = pk && grossOk && prevGrossOk ? k.gross - pk.gross : null;
  // 得意先ごとの最初の購入日（取得データ内での初購入の判定用）
  const firstBuy = useMemo(() => {
    const m = new Map();
    for (const r of rows) {
      if (!((+r[7] || 0) > 0)) continue;
      const d = parseDateStr(r[1]);
      if (d && (!m.has(r[2]) || d.sort < m.get(r[2]))) m.set(r[2], d.sort);
    }
    return m;
  }, [rows]);

  // 推移グラフ: 月次は選んだ月までの12ヶ月、それ以外は期間内の各月
  const chartRep = useMemo(() => (repType === 'month' ? buildPeriodReport(rows, masters, repMonth - 11, repMonth, consumableOnly) : rep),
    [repType, repMonth, rows, masters, rep, consumableOnly]);
  const chart = useMemo(() => {
    const m = chartRep.monthly;
    return { values: m.map(x => x.sales), labels: m.map(x => idxShort(x.idx)) };
  }, [chartRep]);

  const facTop = rep.ranking.filter(f => f.sales > 0).slice(0, 10);
  const facMax = facTop.length ? facTop[0].sales : 1;
  // 上位得意先（施設）への集中：上位1・5施設の売上 ÷ 施設売上の合計（合計が正のときだけ）
  const conc = useMemo(() => {
    const total = rep.ranking.reduce((t, f) => t + f.sales, 0);
    if (!(total > 0)) return null;
    const top = rep.ranking.filter(f => f.sales > 0);
    const share = (n) => Math.round(top.slice(0, n).reduce((t, f) => t + f.sales, 0) / total * 1000) / 10;
    return { total, top1: share(1), top5: share(5), n: top.length };
  }, [rep]);
  const topProducts = prodSort === 'gross' ? rep.topProductsGross : rep.topProducts;

  const curRange = win ? win.curRange : spec.label;
  const prevRange = win ? win.prevRange : '';
  const dataRange = data.firstDate ? dateLabel(data.firstDate.idx, data.firstDate.d) + '〜' + dateLabel(data.latestDate.idx, data.latestDate.d) : '—';
  const lastImport = meta && meta.lastImport ? stampToLocalDate(meta.lastImport) : '—';
  const scopeLabel = consumableOnly ? '消耗品のみ（住宅改修・器具本体・部材と個人受給者向けを除く）' : '全売上（施設・個人を含む）';
  const showCompare = !spec.noCompare;
  // 月次で今月を見ているときは「月の途中」、年度・期間指定で最終月が締まっていないときは「期間の途中」
  const inProgNote = win && win.inProgress && win.prev.cutoff && showCompare
    ? (repType === 'month' ? '月の途中です。' : '期間の途中です。') + '前年も同じ日（' + dateLabel(win.prev.cutoff.idx, win.prev.cutoff.d) + '）までで比べています' +
      (win.dayAdjusted ? '（前年に同じ日がないため前年は月末まで）' : '') + '。'
    : '';
  const monthsLabel = (list) => list.map(idxLabel).join('・');

  const drill = (title, metric, unit) => setDrilldown({ title, metric, unit, curLabel: curRange, prevLabel: prevRange,
    curRanking: rep.ranking, prevRanking: prevRep ? prevRep.ranking : [], prevCovered: !!prevRep, inProgress: !!(win && win.inProgress),
    note: inProgNote });
  const jumpFromModal = (name) => { setDrilldown(null); setBuyersOpen(false); jumpToFacility(name); };

  const buildHtml = () => {
    if (rep.kpi.sales === 0 && rep.monthly.length === 0) return null;
    return buildReportHtml({ ...rep, title: spec.title, periodLabel: spec.label, issued: todayLabel(), office,
      conditions: [
        ['対象期間', curRange],
        ['比較期間', showCompare ? (prevRep ? '前年同期 ' + prevRange : '前年同期 ' + prevRange + '（データ未取得のため比較なし）') : 'なし'],
        ['金額', '税抜（販売管理システムの「金額」。返品・値引きを反映）'],
        ['集計対象', scopeLabel],
        ['集計時点', todayLabel() + '（取込済みデータ ' + dataRange + '・最終取込 ' + lastImport + '）'],
      ],
      compare: showCompare && prevRep ? { sales: pk.sales, gross: pk.gross, grossOk: prevGrossOk, buyers: pk.buyers } : null,
      compareMissing: showCompare && !prevRep,
    });
  };
  const handlePrint = () => {
    const html = buildHtml();
    if (!html) { showToast('その期間にはデータがありません', 'error'); return; }
    openPrint(html);   // プレビューを閉じてもこの画面の状態はそのまま
  };
  const handleReportPdf = async () => {
    const html = buildHtml();
    if (!html) { showToast('その期間にはデータがありません', 'error'); return; }
    setRepBusy(true);
    showToast('PDFを作成しています…', 'info');
    try {
      await exportPdf(html, spec.title + '_' + spec.file + '.pdf');
      showToast('PDFを保存しました');
    } catch {
      showToast('PDFの作成に失敗しました。印刷ダイアログの「PDFとして保存」もお試しください', 'error', 7000);
    } finally { setRepBusy(false); }
  };

  const selCls = 'h-10 w-full px-3 rounded-xl border border-slate-200 bg-white text-sm shadow-sm font-bold text-slate-600';
  const notCovered = showCompare && win && !win.prevCovered;
  const noPrevText = win && !win.prevBeforeData && win.prevMissing.length ? '前年同期の明細がそろっていません（' + win.prevMissing.map(idxLabel).join('・') + 'がない）' : '前年同期の明細が未取得です';
  const prevLine = (v) => (
    <div className="flex items-center justify-between gap-2 text-[11px]">
      <span className="text-slate-600 font-bold">前年同期</span>
      <span className="text-slate-800 font-bold tabular-nums">{v}</span>
    </div>
  );

  return (
    <div className="space-y-5">
      {/* 期間バー: ここで選んだ期間が、下の数字とレポートの両方に反映される */}
      <Card className="p-5">
        <div className="flex items-center gap-3 flex-wrap">
          <Segmented value={repType} onChange={setRepType}
            options={[['month', '月次'], ['fy', '年度'], ['custom', '期間指定'], ['trend', '月別推移']]} />
          {/* 幅を固定して、種類を変えてもボタンの位置がずれないようにする */}
          <div className={repType === 'custom' ? 'flex items-center gap-2 shrink-0' : 'w-40 shrink-0'}>
            {repType === 'month' && (
              <select value={repMonth} onChange={e => setRepMonth(+e.target.value)} className={selCls}>
                {data.monthsAll.slice().reverse().map(i => <option key={i} value={i}>{idxLabel(i)}{data.thinLatest && i === data.thinLatest.idx ? '（明細わずか）' : ''}</option>)}
              </select>
            )}
            {repType === 'fy' && (
              <select value={repFy} onChange={e => setRepFy(+e.target.value)} className={selCls}>
                {fiscalYears.map(y => <option key={y} value={y}>{y}年度</option>)}
              </select>
            )}
            {repType === 'custom' && (
              <>
                <select value={customFrom} onChange={e => setCustomFrom(+e.target.value)} className="h-10 w-36 px-3 rounded-xl border border-slate-200 bg-white text-sm shadow-sm font-bold text-slate-600">
                  {data.monthsAll.map(i => <option key={i} value={i}>{idxLabel(i)}</option>)}
                </select>
                <span className="text-xs text-slate-600 font-bold">〜</span>
                <select value={customTo} onChange={e => setCustomTo(+e.target.value)} className="h-10 w-36 px-3 rounded-xl border border-slate-200 bg-white text-sm shadow-sm font-bold text-slate-600">
                  {data.monthsAll.map(i => <option key={i} value={i}>{idxLabel(i)}</option>)}
                </select>
              </>
            )}
            {repType === 'trend' && (
              <div className="h-10 px-3 rounded-xl border border-slate-200 bg-slate-50 text-sm font-bold text-slate-700 flex items-center justify-center">全期間</div>
            )}
          </div>
          <div className="ml-auto flex gap-2 shrink-0">
            <button onClick={handleReportPdf} disabled={repBusy}
              className={"px-4 py-2.5 rounded-xl shadow-sm text-sm font-bold transition inline-flex items-center gap-1.5 text-white " +
                (repBusy ? 'bg-slate-300' : 'bg-indigo-600 hover:bg-indigo-700 active:scale-[.98] shadow-indigo-200')}>
              <Download size={15} /> {repBusy ? '作成中…' : 'PDF保存'}
            </button>
            <button onClick={handlePrint}
              className="bg-sky-600 hover:bg-sky-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-sky-200 text-sm font-bold transition inline-flex items-center gap-1.5">
              <Printer size={15} /> 印刷プレビュー
            </button>
          </div>
        </div>
        {/* 集計条件：画面と帳票の数字がどの範囲のものかを常に示す */}
        <dl className="mt-3 grid sm:grid-cols-2 lg:grid-cols-3 gap-x-5 gap-y-1 text-[11px] text-slate-700">
          <div><dt className="inline font-bold text-slate-600">対象期間：</dt><dd className="inline tabular-nums">{curRange}</dd></div>
          <div><dt className="inline font-bold text-slate-600">比較期間：</dt><dd className="inline tabular-nums">{showCompare ? '前年同期 ' + prevRange : 'なし（全期間）'}</dd></div>
          <div><dt className="inline font-bold text-slate-600">金額：</dt><dd className="inline">税抜・返品／値引き反映後</dd></div>
          <div><dt className="inline font-bold text-slate-600">営業所：</dt><dd className="inline">{office || '未設定'}</dd></div>
          <div><dt className="inline font-bold text-slate-600">取込済みデータ：</dt><dd className="inline tabular-nums">{dataRange}</dd></div>
          <div><dt className="inline font-bold text-slate-600">最終取込：</dt><dd className="inline tabular-nums">{lastImport}</dd></div>
        </dl>
        <div className="mt-2 space-y-1.5">
          {inProgNote && <InfoNote>{inProgNote}当期は取り込んだ最終売上日（{dateLabel(win.asOf.idx, win.asOf.d)}）までの数字です。</InfoNote>}
          {win && win.short && <InfoNote tone="warn">締め済みの期間ですが、取込済みデータは {dateLabel(win.asOf.idx, win.asOf.d)} までです。期間の最後まで取り込まれていない可能性があります（取得不足）。</InfoNote>}
          {notCovered && (
            <InfoNote tone="warn">
              {win.prevBeforeData
                ? '前年同期（' + prevRange + '）の明細が取り込まれていないため、前年との比較は表示しません（取込済みデータは ' + dataRange + '）。'
                : '前年同期のうち ' + monthsLabel(win.prevMissing) + ' の明細が1件もありません（取り込み漏れの可能性）。0円として比べると誤るため、前年との比較は表示しません。'}
              0円とは区別しています。
            </InfoNote>
          )}
          {data.thinLatest && data.baseIdx !== data.thinLatest.idx && spec.from <= data.thinLatest.idx && data.thinLatest.idx <= spec.to && (
            <InfoNote tone="warn">この期間に含まれる {idxLabel(data.thinLatest.idx)} は明細がまだ {num(data.thinLatest.rows)} 行しかありません（取り込みが途中の可能性）。この月を含む数字と前年比較は、実態より少なく出ます。</InfoNote>
          )}
          {win && win.curMissing.length > 0 && (
            <InfoNote tone="warn">対象期間のうち {monthsLabel(win.curMissing)} の明細が1件もありません。取り込み漏れの可能性があります（当期の数字が実際より少ない可能性）。</InfoNote>
          )}
        </div>
      </Card>

      {/* 6指標 */}
      <div className="flex items-center justify-between gap-3 flex-wrap">
        <h2 className="text-sm font-bold text-slate-700">
          {repType === 'month' ? '月次サマリー' : repType === 'trend' ? '全期間サマリー' : '期間サマリー'}
          <span className="text-slate-600 font-normal tabular-nums">（{curRange}）</span>
        </h2>
        <button onClick={() => setConsumableOnly(v => !v)} title="住宅改修・器具本体等を除いた、消耗品の売上だけで集計します"
          className={"h-8 px-3 rounded-full text-xs font-bold border transition inline-flex items-center gap-1.5 shrink-0 " +
            (consumableOnly ? 'bg-sky-500 border-sky-500 text-white shadow-sm' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50')}>
          <Filter size={13} /> 消耗品のみ
        </button>
      </div>
      {consumableOnly && (
        <div className="text-[11px] text-sky-700 bg-sky-50 border border-sky-200 rounded-lg px-3 py-2 -mt-2">
          消耗品のみ表示中：住宅改修・車いす等の器具本体（ポータブルトイレ・シャワーチェアなどの特定福祉用具を含む）・部材と、個人（地域包括支援センター経由等）向けとみられる売上を除いて集計しています。
        </div>
      )}
      <div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-3">
        <KpiCard icon={JapaneseYen} tint="bg-blue-50 text-blue-600" label="売上" value={yen(k.sales)} note="税抜"
          onClick={() => drill('売上', 'sales', '¥')}
          extra={showCompare && pk ? prevLine(yen(pk.sales)) : null} />
        <KpiCard icon={Coins} tint="bg-emerald-50 text-emerald-600" label="粗利（売上－売れた商品の原価）"
          value={grossOk ? yen(k.gross) : '未確定'} note="税抜"
          onClick={() => drill('粗利', 'gross', '¥')}
          extra={!grossOk ? (
            <div className="text-[11px] text-amber-800 leading-snug">粗利額が不明な明細 {num(k.grossUnknown)}行（売上 {yen(k.grossUnknownSales)}）を含むため未確定。確認済み分のみ：{yen(k.gross)}</div>
          ) : showCompare && pk ? prevLine(prevGrossOk ? yen(pk.gross) : '未確定') : null} />
        <KpiCard icon={Percent} tint="bg-violet-50 text-violet-600" label="粗利率（合計粗利 ÷ 合計売上）"
          value={k.rateOk ? k.rate + '%' : (k.sales > 0 ? '未確定' : '算出対象外')}
          onClick={() => drill('粗利率', 'margin', '%')}
          extra={showCompare && pk ? prevLine(pk.rateOk ? pk.rate + '%' : (pk.sales > 0 ? '未確定' : '算出対象外')) : null} />
        <KpiCard icon={TrendingUp} tint="bg-sky-50 text-sky-600" label="前年より増えた・減った売上"
          value={!showCompare ? '比較なし' : salesDiff === null ? '比較データ不足' : <DiffText v={salesDiff} className="text-2xl" />}
          delta={salesDiff !== null && pctChange(k.sales, pk.sales) !== null ? pctChange(k.sales, pk.sales) : undefined} note={salesDiff !== null ? '増減率' : undefined}
          onClick={showCompare ? () => drill('売上', 'sales', '¥') : undefined}
          extra={showCompare && (pk
            ? <div className="text-[11px] text-slate-600 tabular-nums">当期 {yen(k.sales)} － 前年同期 {yen(pk.sales)}{pctChange(k.sales, pk.sales) === null ? '（前年同期が0円以下のため増減率は算出対象外）' : ''}</div>
            : <div className="text-[11px] text-amber-800">{noPrevText}</div>)} />
        <KpiCard icon={TrendingUp} tint="bg-teal-50 text-teal-600" label="前年より増えた・減った粗利"
          value={!showCompare ? '比較なし' : grossDiff === null ? (pk ? '未確定' : '比較データ不足') : <DiffText v={grossDiff} className="text-2xl" />}
          delta={grossDiff !== null && pctChange(k.gross, pk.gross) !== null ? pctChange(k.gross, pk.gross) : undefined} note={grossDiff !== null ? '増減率' : undefined}
          onClick={showCompare ? () => drill('粗利', 'gross', '¥') : undefined}
          extra={showCompare && (grossDiff !== null
            ? <div className="text-[11px] text-slate-600 tabular-nums">当期 {yen(k.gross)} － 前年同期 {yen(pk.gross)}{pctChange(k.gross, pk.gross) === null ? '（前年同期が0円以下のため増減率は算出対象外）' : ''}</div>
            : <div className="text-[11px] text-amber-800">{pk ? '粗利額が不明な明細があるため差額を出しません' : noPrevText}</div>)} />
        <KpiCard icon={Users} tint="bg-amber-50 text-amber-600" label="購入得意先数" value={num(k.buyers) + '件'}
          title="内訳（継続・当期だけ・前年同期だけ）を見る" linkLabel="内訳を見る"
          onClick={() => setBuyersOpen(true)}
          extra={(
            <div className="space-y-0.5 text-[11px]">
              <div className="text-slate-600">施設 {num(k.buyersFacility)}・個人ほか {num(k.buyers - k.buyersFacility)}</div>
              {showCompare && pk && (
                <div className="flex items-center justify-between gap-2">
                  <span className="text-slate-600 font-bold">前年同期 {num(pk.buyers)}件</span>
                  <DiffText v={k.buyers - pk.buyers} unit="件" className="text-[11px]" />
                </div>
              )}
            </div>
          )} />
      </div>
      {drilldown && <KpiDrilldownModal {...drilldown} onJump={jumpFromModal} onClose={() => setDrilldown(null)} />}
      {buyersOpen && win && <BuyersModal curRep={rep} prevRep={showCompare ? prevRep : null} noCompare={!showCompare} win={win} firstBuy={firstBuy}
        dataFrom={data.firstDate ? dateLabel(data.firstDate.idx, data.firstDate.d) : '—'} onJump={jumpFromModal} onClose={() => setBuyersOpen(false)} />}
      {(k.returnCount > 0 || k.discountCount > 0) && (
        <div className="text-[11px] text-slate-600 -mt-2">
          売上に含まれるマイナスの明細：返品（数量マイナス）{num(k.returnCount)}行 {yen(k.returnAmt)} ／ 値引き等（数量0以上で金額マイナス）{num(k.discountCount)}行 {yen(k.discountAmt)}
          （区分列がないため数量の符号で分けています）
        </div>
      )}
      {(() => {
        const unassigned = data.facilities.filter(f => !f.rep).length;
        const other = data.products.filter(p => p.cat === 'その他' && p.winSales !== 0).length;
        if (!(k.grossUnknown || unassigned || other)) return null;
        return (
          <div className="text-[11px] text-slate-700 -mt-2">
            データ確認：{[k.grossUnknown ? 'この期間の粗利未確定の明細 ' + num(k.grossUnknown) + '行' : '', unassigned ? '担当未設定の施設 ' + num(unassigned) + '件' : '', other ? '分類「その他」の商品 ' + num(other) + '件' : ''].filter(Boolean).join(' ・ ')}
            <button onClick={() => goTab('import')} className="ml-1.5 font-bold text-sky-700 hover:underline">データ取込画面の「データ確認」で見る</button>
          </div>
        );
      })()}
      <details className="bg-white border border-slate-200/70 rounded-2xl px-5 py-3 text-xs text-slate-700">
        <summary className="font-bold text-slate-800 cursor-pointer">用語と計算方法</summary>
        <ul className="mt-2 space-y-1 leading-relaxed list-disc pl-5">

          <li><b>粗利</b>：明細ごとの粗利額（その明細の売上－売れた数量の原価）の合計。当月の仕入総額は引きません。粗利額が空の明細は「金額－仕入単価×数量」で求め、どちらもない明細があると「未確定」と表示します（0円としては扱いません）。</li>
          <li><b>粗利率</b>：合計粗利 ÷ 合計売上 × 100。商品ごとの粗利率の平均ではありません。売上が0円以下なら算出対象外です。</li>
          <li><b>前年より増えた・減った売上／粗利</b>：当期 － 前年同期（前年の同じ月・同じ範囲）。月の途中は前年も同じ日までで比べます。増減率は補助表示で、前年同期が0円以下なら算出しません。前年の明細が取り込まれていない期間は「比較データ不足」とし、0円とは区別します。</li>
          <li><b>購入得意先数</b>：期間内の売上（返品・値引き後）がプラスの得意先（お客様名）の数。同じ得意先の複数伝票は1件です。請求先と納品先の区別はCSVにないため、お客様名ごとに数えています。</li>
          <li>増減は色だけでなく「＋／−」と矢印でも示しています。</li>
        </ul>
      </details>

/* 少額施設のノイズを除く目安（施設別推移の「少額施設を除く」で使う） */
const DECLINE_MIN_BASE = 50000;

// 施設詳細：前年同期との売上差の内訳（decomposeSalesChange の結果を表示）
function DecompCard({ decomp, kind, setKind, fyLabel }) {
  const d = decomp;
  const parts = d && !d.none ? [
    ['数量の変化分', d.volume, '同じ商品・単位で、数量が増減した分（前年の平均単価で計算）'],
    ['価格の変化分', d.price, '同じ商品・単位で、平均単価が変わった分（数量と価格が同時に変わった分も含む）'],
    ['前年同期になかった商品', d.added, '当期だけ売れた商品・単位'],
    ['当期に販売のない商品', d.ended, '前年同期だけ売れた商品・単位'],
    ['返品・値引き等の差', d.adj, '金額がマイナスの明細の差。数量・価格には配分しません'],
    ['比較できない明細', d.other, '数量が0以下などで単価を出せない商品'],
  ] : [];
  return (
    <Card className="p-4">
      <div className="flex items-center justify-between gap-2 mb-1 flex-wrap">
        <div className="text-[11px] font-bold text-slate-600 uppercase tracking-wide">前年同期との売上差の内訳</div>
        <Segmented value={kind} onChange={setKind} options={[['month', '今月'], ['fy', fyLabel + '累計']]} />
      </div>
      {!d || d.none ? (
        <div className="text-xs text-slate-600 py-3">前年同期{d && d.w ? '（' + d.w.prevRange + '）' : ''}の明細が取り込まれていないため、内訳を出せません。</div>
      ) : (
        <>
          <div className="text-[11px] text-slate-600 mb-2 tabular-nums">当期 {d.w.curRange}：{yen(d.cur)} ／ 前年同期 {d.w.prevRange}：{yen(d.prev)}</div>
          <div className="flex items-center justify-between text-sm font-bold text-slate-800 border-b border-slate-100 pb-1.5 mb-1.5">
            <span>売上差額</span><DiffText v={d.diff} />
          </div>
          <ul className="space-y-1">
            {parts.map(([label, v, hint]) => (
              <li key={label} className="flex items-center justify-between text-xs gap-2" title={hint}>
                <span className="text-slate-700">{label}</span>
                {Math.abs(v) < 0.5 ? <span className="text-slate-400 tabular-nums">¥0</span> : <DiffText v={v} className="text-xs" />}
              </li>
            ))}
          </ul>
          <div className={"mt-2 text-[10px] " + (d.check ? 'text-slate-600' : 'text-rose-600 font-bold')}>
            {d.check ? '内訳の合計は売上差額と一致しています。' : '内訳の合計が売上差額と一致しません（計算を確認してください）。'}
            比較の単位は「商品名＋単位」。単位の違う同じ商品は混ぜずに別の商品として扱います。理由（購入時期・利用量など）は明細と施設の事情を確認してください。
          </div>
          {d.items.length > 0 && (
            <div className="mt-2 pt-2 border-t border-slate-100">
              <div className="text-[10px] font-bold text-slate-600 mb-1">差の大きい商品</div>
              <ul className="space-y-0.5">
                {d.items.slice(0, 5).map(it => (
                  <li key={it.name + it.unit} className="flex items-center justify-between text-[11px] gap-2">
                    <span className="text-slate-700 truncate">{it.name}{it.unit ? '（' + it.unit + '）' : ''}
                      <span className="text-slate-500 ml-1">{it.kind === 'new' ? '前年なし' : it.kind === 'ended' ? '当期なし' : it.kind === 'both' ? fmtQty(it.q0) + '→' + fmtQty(it.q1) : ''}</span>
                    </span>
                    <DiffText v={it.diff} className="text-[11px]" />
                  </li>
                ))}
              </ul>
            </div>
          )}
        </>
      )}
    </Card>
  );
}

/* CSV出力の対象期間 */
const CSV_PERIODS = [['all', '全期間'], ['fy', '今年度'], ['month', '月を選ぶ']];

function FacilitiesView({ data, openId, setOpenId, repFilter, setRepFilter, showToast, openPrint, startDoc, office }) {
  const cmp = data.cmp;   // 基準月の比較条件（月途中なら前月・前年同月も同じ日まで）
  const [search, setSearch] = useState('');
  const [decompKind, setDecompKind] = useState('month'); // 施設詳細の売上差の内訳：今月／今年度累計
  const [suggestOpen, setSuggestOpen] = useState(false);
  const [sortKey, setSortKey] = useState('sales');
  const [csvPeriod, setCsvPeriod] = useState('all');
  const [csvMonth, setCsvMonth] = useState(data.baseIdx);
  const boxRef = useRef(null);

  useEffect(() => { setCsvMonth(data.baseIdx); }, [data.baseIdx]);
  // 候補リストの外側をクリックしたら閉じる
  useEffect(() => {
    if (!suggestOpen) return;
    const h = (e) => { if (boxRef.current && !boxRef.current.contains(e.target)) setSuggestOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [suggestOpen]);

  const rows = useMemo(() => {
    let list = data.facilities;
    if (repFilter !== null) list = list.filter(f => f.repName === repFilter);
    if (search.trim()) list = list.filter(f => f.name.includes(search.trim()));
    // 前年差額順：減少額が大きい施設から（率だけで順位を付けない）。前年データ未取得の施設は最後
    const sorters = {
      sales: (a, b) => b.monthly[11] - a.monthly[11],
      avg: (a, b) => b.avg - a.avg,
      yoyDiff: (a, b) => (a.yoyDiff === null) - (b.yoyDiff === null) || a.yoyDiff - b.yoyDiff,
      name: (a, b) => a.name.localeCompare(b.name, 'ja'),
    };
    return list.slice().sort(sorters[sortKey]);
  }, [data, search, sortKey, repFilter]);

  // 検索候補（入力に応じて最大8件）
  const suggests = useMemo(() => {
    const q = normalizeSearchText(search.trim());
    if (!q) return [];
    return data.facilities.filter(f => normalizeSearchText(f.name).includes(q))
      .sort((a, b) => b.monthly[11] - a.monthly[11]).slice(0, 8);
  }, [data, search]);

  const selectFacility = (name) => {
    setOpenId(name);
    setSearch('');
    setSuggestOpen(false);
  };

  // 選択中の施設の詳細分析（推移・売上/個数ランキング・分類構成・明細）
  const detail = useMemo(() => {
    if (!openId) return null;
    const f = data.facByName.get(openId);
    if (!f) return null;
    const salesOf = (p) => sum12(p.sales12);
    const qtyOf = (p) => sum12(p.qty12);
    const salesRank = f.pairs.filter(p => salesOf(p) > 0)
      .sort((a, b) => salesOf(b) - salesOf(a)).slice(0, 10)
      .map(p => ({ prod: p.prod, sales: salesOf(p), qty: qtyOf(p), unit: p.unit || '', mixedUnit: p.units.size > 1 }));
    const salesMax = salesRank.length ? salesRank[0].sales : 1;
    // 単位が2種類以上ある商品（ケースと袋など）は数量を合計できないので個数ランキングから外す
    const qtyMixed = f.pairs.filter(p => qtyOf(p) > 0 && p.units.size > 1).length;
    const qtyRank = f.pairs.filter(p => qtyOf(p) > 0 && p.units.size <= 1)
      .sort((a, b) => qtyOf(b) - qtyOf(a)).slice(0, 10)
      .map(p => ({ prod: p.prod, qty: qtyOf(p), unit: p.unit || '', sales: salesOf(p) }));
    const qtyMax = qtyRank.length ? qtyRank[0].qty : 1;
    const catAgg = new Map();
    f.pairs.forEach(p => {
      const s = salesOf(p);
      if (s <= 0) return;
      const prod = data.prodByName.get(p.prod);
      const cat = prod ? prod.cat : 'その他';
      catAgg.set(cat, (catAgg.get(cat) || 0) + s);
    });
    const cats = [...catAgg.entries()].sort((a, b) => b[1] - a[1]);
    const catTotal = cats.reduce((s, c) => s + c[1], 0) || 1;
    let lastD = null;
    for (const r of f.rows) { const d = parseDateStr(r[1]); if (d && (!lastD || d.sort > lastD.sort)) lastD = d; }
    const recent = f.rows.slice()
      .sort((a, b) => ((parseDateStr(b[1]) || {}).sort || 0) - ((parseDateStr(a[1]) || {}).sort || 0))
      .slice(0, 12)
      .map(r => [r[1], r[3], num(+r[4] || 0) + ' ' + (r[5] || ''), +r[7] || 0]);
    // 前年同月（月別売上推移グラフの比較線用）。データがない月は null にして線を切る
    const prevMonthly = data.win.map(idx => {
      const m = f.byMonth.get(idx - 12);
      return m ? m.sales : null;
    });
    // 営業所で直近12ヶ月に売れている分類のうち、この施設の購入がない分類（需要の有無は分からない）
    const officeCats = new Set(data.products.filter(p => p.winSales > 0).map(p => p.cat));
    const noBuyCats = [...officeCats].filter(c => !catAgg.has(c)).sort((a, b) => a.localeCompare(b, 'ja'));
    // 前年同期との売上差の内訳（今月／今年度累計）
    const decomp = {};
    for (const [key, w] of [['month', data.cmp], ['fy', data.fyCmp]]) {
      if (!w || !w.prevCovered) { decomp[key] = { w, none: true }; continue; }
      const pick = (r, ww) => { const d = parseDateStr(r[1]); return d && d.idx >= ww.from && d.idx <= ww.to && withinCut(d, ww.cutoff); };
      decomp[key] = { w, ...decomposeSalesChange(f.rows.filter(r => pick(r, w.cur)), f.rows.filter(r => pick(r, w.prev))) };
    }
    return { f, salesRank, salesMax, qtyRank, qtyMax, qtyMixed, cats, catTotal, lastD, recent, prevMonthly, noBuyCats, decomp };
  }, [data, openId]);

  const handleFacPrint = (f) => {
    const prows = f.pairs.slice()
      .sort((a, b) => sum12(b.sales12) - sum12(a.sales12))
      .slice(0, 15)
      .map(p => {
        const prod = data.prodByName.get(p.prod);
        return {
          product: p.prod,
          cat: prod ? prod.cat : 'その他',
          qty: fmtQty(sum12(p.qty12) / 12),
          unit: p.unit || (prod ? prod.unit : '') || '',
          price: p.lastPrice,
          last: p.lastDate ? p.lastDate.y + '/' + p.lastDate.mo + '/' + p.lastDate.d : '—',
        };
      })
      .filter(r => r.qty > 0);
    openPrint(buildFacilitySalesHtml({
      name: f.name, repName: f.repName, rows: prows,
      monthly: f.monthly, labels: data.winShort, yearTotal: f.winSum,
      periodText: idxLabel(data.win[0]) + ' 〜 ' + idxLabel(data.win[11]) + '（12ヶ月）',
      issued: todayLabel(), office,
    }));
  };

  // 対象期間の月インデックス（CSV用）
  const csvMonthIdxs = useMemo(() => {
    if (csvPeriod === 'month') return [csvMonth];
    if (csvPeriod === 'fy') {
      const s = fiscalStartIdx(data.baseIdx);
      return data.monthsAll.filter(i => i >= s && i <= s + 11);
    }
    return data.monthsAll;
  }, [csvPeriod, csvMonth, data]);
  const csvPeriodLabel = useMemo(() => {
    if (csvPeriod === 'month') return idxLabel(csvMonth);
    if (csvPeriod === 'fy') return Math.floor(fiscalStartIdx(data.baseIdx) / 12) + '年度';
    return '全期間';
  }, [csvPeriod, csvMonth, data]);

  // 施設別CSV（月列は日本語表記。Excelが日付に変換しないように）
  const handleCsv = (only) => {
    const targets = only ? [only] : rows;
    const idxs = csvMonthIdxs;
    if (idxs.length === 0) { showToast('対象期間にデータがありません', 'error'); return; }
    const multi = idxs.length > 1;
    const head = ['施設名', '担当', '直送', '売上合計', '粗利額', '粗利率%'];
    if (multi) head.push('月平均');
    idxs.forEach(i => head.push(idxLabel(i)));
    const lines = targets.map(f => {
      let s = 0, g = 0, gu = 0;
      const cells = idxs.map(i => {
        const m = f.byMonth.get(i);
        const v = m ? m.sales : 0;
        s += v; g += m ? m.gross : 0; gu += m ? m.gu : 0;
        return Math.round(v);
      });
      // 粗利額が不明な明細を含む施設は、粗利額・粗利率を「未確定」とする（0円として出さない）
      const row = [f.name, f.repName, f.direct ? '直送' : '', Math.round(s), gu ? '未確定' : Math.round(g),
        gu || !(s > 0) ? '' : Math.round(g / s * 1000) / 10];
      if (multi) row.push(Math.round(s / idxs.length));
      return row.concat(cells);
    });
    const name = (only ? only.name.replace(/[\\/:*?"<>|]/g, '') + '_' : '施設別売上_') + csvPeriodLabel + '_' + todayCompact() + '.csv';
    const conds = [
      ['対象期間', csvPeriodLabel + '（' + idxRangeDates(idxs[0], idxs[idxs.length - 1], data.latestDate) + '）'],
      ['金額', '税抜・返品／値引き反映後（販売管理システムの金額）'],
      ['集計対象', '施設のみ（個人は含まない）'],
      ['絞り込み', only ? '施設：' + only.name : [repFilter !== null ? '担当：' + repFilter : '', search.trim() ? '施設名：' + search.trim() : ''].filter(Boolean).join(' ／ ') || 'なし'],
      ['集計時点', todayLabel() + '（取込済みデータ ' + dataRangeLabel(data) + '）'],
    ];
    downloadText(name, buildCsvWithConditions(conds, [head, ...lines]), 'text/csv');
    showToast(csvPeriodLabel + 'のCSVを出力しました（' + num(targets.length) + '施設）');
  };

  // 選択中の施設の商品別CSV（直近12ヶ月）
  const handleProdCsv = (f) => {
    const head = ['商品名', '分類', '単位', '数量合計', '売上合計', '直近単価', '最終購入日'];
    const lines = f.pairs
      .filter(p => sum12(p.sales12) !== 0 || sum12(p.qty12) !== 0)
      .sort((a, b) => sum12(b.sales12) - sum12(a.sales12))
      .map(p => {
        const prod = data.prodByName.get(p.prod);
        return [p.prod, prod ? prod.cat : 'その他', p.unit || (prod ? prod.unit : '') || '',
          fmtQty(sum12(p.qty12)), Math.round(sum12(p.sales12)), p.lastPrice,
          p.lastDate ? p.lastDate.y + '/' + p.lastDate.mo + '/' + p.lastDate.d : ''];
      });
    downloadText(f.name.replace(/[\\/:*?"<>|]/g, '') + '_商品別_' + todayCompact() + '.csv',
      buildCsvWithConditions([
        ['施設', f.name],
        ['対象期間', '直近12ヶ月（' + idxRangeDates(data.win[0], data.win[11], data.latestDate) + '）'],
        ['金額', '税抜・返品／値引き反映後'],
        ['数量', '単位ごとに集計（単位が途中で変わった商品は最新の単位を表示）'],
        ['集計時点', todayLabel() + '（取込済みデータ ' + dataRangeLabel(data) + '）'],
      ], [head, ...lines]), 'text/csv');
    showToast('商品別CSVを出力しました（直近12ヶ月）');
  };

  const searchBoxJsx = (
    <div className="relative" ref={boxRef}>
      <Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-600" />
      <input value={search}
        onChange={e => { setSearch(e.target.value); setSuggestOpen(true); }}
        onFocus={() => setSuggestOpen(true)}
        onKeyDown={e => { if (e.key === 'Enter' && suggests.length > 0) selectFacility(suggests[0].name); if (e.key === 'Escape') setSuggestOpen(false); }}
        placeholder="施設名を入力して選ぶ（例: ひかり）"
        className="h-11 pl-10 pr-8 rounded-xl border-2 border-sky-200 text-sm w-72 bg-white shadow-sm focus:border-sky-400 focus:outline-none transition font-bold text-slate-700 placeholder:font-normal placeholder:text-slate-600" />
      {search && (
        <button onClick={() => { setSearch(''); setSuggestOpen(false); }}
          className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700"><X size={15} /></button>
      )}
      {suggestOpen && search.trim() && (
        <div className="absolute z-30 mt-1.5 w-full bg-white rounded-xl border border-slate-200 shadow-xl overflow-hidden">
          {suggests.map(f => (
            <button key={f.name} onMouseDown={e => e.preventDefault()} onClick={() => selectFacility(f.name)}
              className="w-full text-left px-4 py-2.5 hover:bg-sky-50 transition flex items-center gap-2 border-b border-slate-50 last:border-0">
              <Building2 size={14} className="text-sky-400 shrink-0" />
              <span className="flex-1 min-w-0 text-xs font-bold text-slate-700 truncate">{f.name}</span>
              <span className="text-[10px] text-slate-600 tabular-nums shrink-0">今月 {yen(f.monthly[11])}</span>
            </button>
          ))}
          {suggests.length === 0 && (
            <div className="px-4 py-3 text-xs text-slate-600">「{search}」に一致する施設はありません</div>
          )}
        </div>
      )}
    </div>
  );

  const csvControls = (only) => (
    <div className="flex items-center gap-2 flex-wrap">
      <select value={csvPeriod} onChange={e => setCsvPeriod(e.target.value)}
        className="h-10 px-3 rounded-xl border border-slate-200 bg-white text-sm shadow-sm font-bold text-slate-600">
        {CSV_PERIODS.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
      </select>
      {csvPeriod === 'month' && (
        <select value={csvMonth} onChange={e => setCsvMonth(+e.target.value)}
          className="h-10 px-3 rounded-xl border border-slate-200 bg-white text-sm shadow-sm font-bold text-slate-600">
          {data.monthsAll.slice().reverse().map(i => <option key={i} value={i}>{idxLabel(i)}</option>)}
        </select>
      )}
      <button onClick={() => handleCsv(only)}
        className="bg-teal-600 hover:bg-teal-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-teal-200 text-sm font-bold transition inline-flex items-center gap-1.5">
        <FileSpreadsheet size={15} /> CSV出力
      </button>
    </div>
  );

  /* ---------- 施設を1つ選んでいるとき: その施設だけを表示 ---------- */
  if (openId && detail) {
    const f = detail.f;
    return (
      <div className="space-y-4">
        <div className="flex items-center gap-2.5 flex-wrap">
          <button onClick={() => setOpenId(null)}
            className="bg-white border border-slate-200 hover:border-slate-300 active:scale-[.98] text-slate-600 px-3.5 py-2.5 rounded-xl shadow-sm text-sm font-bold transition inline-flex items-center gap-1.5">
            ← 施設一覧へ戻る
          </button>
          {searchBoxJsx}
          <div className="ml-auto">{csvControls(f)}</div>
        </div>

        <Card className="px-5 py-4">
          <div className="flex items-start justify-between gap-3 flex-wrap">
            <div className="flex items-center gap-3 min-w-0">

          <KpiCard icon={Coins} tint="bg-emerald-50 text-emerald-600" label="月平均" value={yen(f.avg)} note="12ヶ月" />
          <KpiCard icon={JapaneseYen} tint="bg-sky-50 text-sky-600" label="年間累計" value={yen(f.winSum)} note="12ヶ月" />

          <KpiCard icon={ClipboardList} tint="bg-amber-50 text-amber-600" label="注文回数" value={fmtQty(f.ordersPerMonth) + '回/月'} note={'返品 ' + detail.f.returns3 + '件'} />
        </div>

        <Card className="p-5">
          <div className="flex items-center justify-between mb-2">
            <div className="font-bold text-sm text-slate-800">月別売上推移</div>
            <span className="text-[11px] text-slate-600 font-bold">
              過去12ヶ月 ・ 単位: 千円 ・ 最終購入 {detail.lastD ? detail.lastD.y + '/' + detail.lastD.mo + '/' + detail.lastD.d : '—'}
            </span>
          </div>
          <AreaChart values={f.monthly} labels={data.winShort} height={200} prevValues={detail.prevMonthly} />
        </Card>

            <ul className="space-y-2">
              {detail.salesRank.map((r, i) => (
                <li key={i} className="text-xs">
                  <div className="flex justify-between items-center">
                    <span className="text-slate-600 truncate"><span className={"font-bold mr-1.5 " + (i < 3 ? 'text-sky-500' : 'text-slate-400')}>{i + 1}</span>{r.prod}</span>
                    <span className="text-slate-700 tabular-nums shrink-0 ml-2 font-bold">{yen(r.sales)}</span>
                  </div>
                  <div className="mt-0.5 bg-slate-100 rounded-full h-1 overflow-hidden">
                    <div className="bg-sky-400 h-1 rounded-full" style={{ width: Math.max(3, Math.round(r.sales / detail.salesMax * 100)) + '%' }} />
                  </div>
                </li>
              ))}
              {detail.salesRank.length === 0 && <li className="text-xs text-slate-600">直近12ヶ月の購入はありません</li>}
            </ul>
          </Card>
          <Card className="p-4">
            <div className="text-[11px] font-bold text-slate-600 uppercase tracking-wide mb-2.5">販売個数ランキング TOP10（12ヶ月計）</div>
            <ul className="space-y-2">
              {detail.qtyRank.map((r, i) => (
                <li key={i} className="text-xs">
                  <div className="flex justify-between items-center">
                    <span className="text-slate-600 truncate"><span className={"font-bold mr-1.5 " + (i < 3 ? 'text-emerald-500' : 'text-slate-400')}>{i + 1}</span>{r.prod}</span>
                    <span className="text-slate-700 tabular-nums shrink-0 ml-2 font-bold">{num(r.qty)} {r.unit}</span>
                  </div>
                  <div className="mt-0.5 bg-slate-100 rounded-full h-1 overflow-hidden">
                    <div className="bg-emerald-400 h-1 rounded-full" style={{ width: Math.max(3, Math.round(r.qty / detail.qtyMax * 100)) + '%' }} />
                  </div>
                </li>
              ))}
              {detail.qtyRank.length === 0 && <li className="text-xs text-slate-600">直近12ヶ月の購入はありません</li>}
            </ul>
            {detail.qtyMixed > 0 && <div className="mt-2 text-[10px] text-slate-600">単位が混在している商品（{num(detail.qtyMixed)}件）は数量を合計できないため、このランキングに入れていません。</div>}
          </Card>
        </div>

        <div className="grid md:grid-cols-2 gap-4">
          <Card className="p-4">
            <div className="text-[11px] font-bold text-slate-600 uppercase tracking-wide mb-2.5">分類別の購入構成（12ヶ月計）</div>
            <ul className="space-y-2">
              {detail.cats.map(([cat, v], i) => (
                <li key={i} className="text-xs">
                  <div className="flex justify-between items-center">
                    <span className="text-slate-600 truncate">{cat}</span>
                    <span className="text-slate-700 tabular-nums shrink-0 ml-2 font-bold">{yen(v)} <span className="text-slate-600">({Math.round(v / detail.catTotal * 100)}%)</span></span>
                  </div>
                  <div className="mt-0.5 bg-slate-100 rounded-full h-1 overflow-hidden">
                    <div className="bg-violet-400 h-1 rounded-full" style={{ width: Math.max(3, Math.round(v / detail.catTotal * 100)) + '%' }} />
                  </div>
                </li>
              ))}
              {detail.cats.length === 0 && <li className="text-xs text-slate-600">データがありません</li>}
            </ul>
          </Card>
          <Card className="p-4">
            <div className="text-[11px] font-bold text-slate-600 uppercase tracking-wide mb-2.5">最近の購入明細</div>
            <ul className="space-y-1.5">
              {detail.recent.map(([d, p, q, a], i) => (
                <li key={i} className="flex justify-between text-xs">
                  <span className="text-slate-600 tabular-nums shrink-0">{d.slice(5)}</span>
                  <span className="text-slate-600 truncate mx-2 flex-1">{p}</span>
                  <span className="text-slate-600 tabular-nums shrink-0 mr-2">{q}</span>
                  <span className={"tabular-nums shrink-0 font-bold " + (a < 0 ? 'text-rose-500' : 'text-slate-700')}>{yen(a)}</span>
                </li>
              ))}
              {detail.recent.length === 0 && <li className="text-xs text-slate-600">明細がありません</li>}
            </ul>
          </Card>
        </div>

        <div className="grid md:grid-cols-2 gap-4">
          <DecompCard decomp={detail.decomp[decompKind]} kind={decompKind} setKind={setDecompKind} fyLabel={data.fyLabel} />
          <Card className="p-4">
            <div className="text-[11px] font-bold text-slate-600 uppercase tracking-wide mb-1">購入のない分類（直近12ヶ月）</div>
            <div className="text-[11px] text-slate-600 mb-2.5 leading-relaxed">
              営業所で直近12ヶ月に売れている分類のうち、この施設の購入がない分類です。購入実績の有無だけを示すもので、需要や切り替えの見込みを示すものではありません。
            </div>
            <div className="flex flex-wrap gap-1.5">
              {detail.noBuyCats.map(c => <span key={c} className="text-[11px] font-bold bg-slate-100 text-slate-700 px-2 py-1 rounded-lg">{c}</span>)}
              {detail.noBuyCats.length === 0 && <span className="text-xs text-slate-600">営業所で売れている分類はすべて購入があります</span>}
            </div>
          </Card>
        </div>
      </div>
    );
  }

  /* ---------- 一覧表示 ---------- */
  return (
    <div className="space-y-4">
      <Card className="px-5 py-4 flex items-center gap-3 flex-wrap">
        <div>
          <div className="text-[11px] font-bold text-slate-600 mb-1.5">施設を検索して選ぶ</div>
          {searchBoxJsx}
        </div>
        <div>
          <div className="text-[11px] font-bold text-slate-600 mb-1.5">並び順</div>
          <select value={sortKey} onChange={e => setSortKey(e.target.value)}
            className="h-11 px-3 rounded-xl border border-slate-200 text-sm bg-white shadow-sm font-bold text-slate-600">
            <option value="sales">今月売上順</option>
            <option value="avg">月平均順</option>
            <option value="yoyDiff">前年差額順（減少が大きい順）</option>
            <option value="name">名前順</option>
          </select>
        </div>
        {repFilter !== null && (
          <span className="inline-flex items-center gap-1.5 bg-fuchsia-100 text-fuchsia-800 text-xs font-bold px-3 py-2 rounded-full mt-5">
            担当: {repFilter}
            <button onClick={() => setRepFilter(null)} className="hover:text-fuchsia-950"><X size={13} /></button>
          </span>
        )}
        <div className="ml-auto">
          <div className="text-[11px] font-bold text-slate-600 mb-1.5">CSV出力の対象期間</div>
          {csvControls(null)}
        </div>
      </Card>

      <Card className="overflow-x-auto">
        <div className="px-5 py-2.5 border-b border-slate-100 text-[11px] text-slate-600">
          行をクリックすると、その施設だけの詳細分析を表示します（全 {num(rows.length)}施設）
          <span className="ml-2">前年差は 当期 {cmp.curRange} と 前年同期 {cmp.prevRange} の差額（税抜）。増減率は補助表示です。</span>
          {cmp.inProgress && (
            <InfoNote className="mt-2">月の途中です。前月・前年同月も同じ日までの明細で比べています（今月はまだ購入のない施設も、減少・取引終了とは判定しません）。</InfoNote>
          )}
          {!data.hasYoy && (
            <InfoNote tone="warn" className="mt-2">前年同月の明細が取り込まれていないため、前年差は「—」と表示します（0円とは区別しています）。</InfoNote>
          )}
        </div>
        <div className="overflow-x-auto">
        <table className="w-full text-sm min-w-[1080px]">
          <thead>
            <tr className="text-[11px] uppercase tracking-wide text-slate-600 border-b border-slate-100">

              <th className="text-center font-bold px-2 py-3 pr-4">今月売上</th>
              <th className="text-center font-bold px-2 py-3 pr-4">月平均</th>
              <th className="text-center font-bold px-2 py-3">前年差（売上）</th>

          </thead>
          <tbody className="divide-y divide-slate-50">
            {rows.map(f => (
              <tr key={f.name} onClick={() => setOpenId(f.name)} className="cursor-pointer transition hover:bg-sky-50/70 group">

// 12ヶ月分の値を簡易棒グラフで表示（行内スパークライン。0はグレーの点で表示）
function Sparkline({ values, width, height }) {
  const w = width || 128, h = height || 32;
  const max = Math.max(1, ...values.map(v => Math.abs(v)));
  const barW = w / values.length;
  return (
    <svg width={w} height={h} viewBox={'0 0 ' + w + ' ' + h} className="shrink-0">
      {values.map((v, i) => {
        const barH = Math.max(1.5, Math.round(Math.abs(v) / max * (h - 4)));
        const x = i * barW + barW * 0.18;
        const bw = Math.max(1.5, barW * 0.64);
        const y = h - barH;
        const isLast = i === values.length - 1;
        return <rect key={i} x={x} y={y} width={bw} height={barH} rx={1}
          fill={v === 0 ? '#e2e8f0' : (isLast ? '#0284c7' : '#93c5fd')} />;
      })}
    </svg>
  );
}

const FAC_TREND_SORTS = [
  ['diff', '年度平均の差額順（減少が大きい順）'],
  ['growth', '伸び率順（年度平均比較）'],
  ['sales', '直近月売上順'],
  ['avg', '今年度平均順'],
  ['name', '施設名順'],
];

function FacilityTrendView({ data, jumpToFacility, showToast }) {
  const [search, setSearch] = useState('');
  const [repFilter, setRepFilter] = useState(null);
  const [sortKey, setSortKey] = useState('diff');
  const [minBase, setMinBase] = useState(true); // 少額施設のノイズを除くか

  const fyStart = data.baseIdx == null ? null : fiscalStartIdx(data.baseIdx);
  const monthsElapsed = fyStart == null ? 0 : (data.baseIdx - fyStart + 1);
  const fyLabel = data.fyLabel || '';
  const fyPrevLabel = fyLabel ? (parseInt(fyLabel, 10) - 1) + '年度' : '';

  // 施設ごとに「今年度平均・前年度同期平均・増減率・12ヶ月推移」を算出
  const trend = useMemo(() => {
    if (fyStart == null) return [];
    const periodAvg = (f, fromIdx, toIdx) => {
      if (monthsElapsed <= 0) return 0;
      let sum = 0;
      for (let i = fromIdx; i <= toIdx; i++) { const m = f.byMonth.get(i); if (m) sum += m.sales; }
      return sum / monthsElapsed;
    };
    // 前年度同期は buildAnalytics の fyPrevCmp（基準月が月途中なら前年同月も同じ日まで）を使う。
    // 前年度同期の明細が取り込まれていなければ比較しない（0円とは区別する）
    return data.facilities.map(f => {
      const fyAvg = periodAvg(f, fyStart, data.baseIdx);
      const fyPrevAvg = data.hasFyPrev && monthsElapsed > 0 ? f.fyPrevCmp / monthsElapsed : null;
      const growth = fyPrevAvg === null ? null : pctChange(fyAvg, fyPrevAvg);
      return { f, fyAvg, fyPrevAvg, growth };
    });
  }, [data, fyStart, monthsElapsed]);

  const reps = useMemo(() => data.reps.map(r => r.rep).sort((a, b) => a.localeCompare(b, 'ja')), [data]);

  const filtered = useMemo(() => {
    let list = trend;
    if (repFilter !== null) list = list.filter(t => t.f.repName === repFilter);
    if (search.trim()) list = list.filter(t => t.f.name.includes(search.trim()));
    if (minBase) list = list.filter(t => (t.fyPrevAvg || 0) >= DECLINE_MIN_BASE / 3 || t.fyAvg >= DECLINE_MIN_BASE / 3);
    const sorters = {
      // 差額順：月あたり平均の差が大きくマイナスの施設から。前年度同期の比較ができない施設は最後
      diff: (a, b) => (a.fyPrevAvg === null) - (b.fyPrevAvg === null) || (a.fyAvg - (a.fyPrevAvg || 0)) - (b.fyAvg - (b.fyPrevAvg || 0)),
      growth: (a, b) => (b.growth ?? -999) - (a.growth ?? -999),
      sales: (a, b) => b.f.monthly[11] - a.f.monthly[11],
      avg: (a, b) => b.fyAvg - a.fyAvg,
      name: (a, b) => a.f.name.localeCompare(b.f.name, 'ja'),
    };
    return list.slice().sort(sorters[sortKey]);
  }, [trend, repFilter, search, minBase, sortKey]);

  // 伸びている施設 / 減っている施設 TOP5（ノイズ除去のため一定額以上の施設のみ対象）
  const movers = useMemo(() => {
    const base = trend.filter(t => t.growth !== null && Math.max(t.fyAvg, t.fyPrevAvg) >= DECLINE_MIN_BASE / 3);
    // 並びは平均の差額（月あたり）。率だけで順位を付けない
    const up = base.filter(t => t.fyAvg > t.fyPrevAvg).sort((a, b) => (b.fyAvg - b.fyPrevAvg) - (a.fyAvg - a.fyPrevAvg)).slice(0, 5);
    const down = base.filter(t => t.fyAvg < t.fyPrevAvg).sort((a, b) => (a.fyAvg - a.fyPrevAvg) - (b.fyAvg - b.fyPrevAvg)).slice(0, 5);
    return { up, down };
  }, [trend]);

  const handleCsv = () => {
    if (fyStart == null) { showToast('データがありません', 'error'); return; }
    const head = ['施設名', '担当', ...data.win.map(idxLabel), fyLabel + '平均', fyPrevLabel + '平均', '増減率%'];
    const lines = filtered.map(t => ([
      t.f.name, t.f.repName, ...t.f.monthly.map(v => Math.round(v)),
      Math.round(t.fyAvg), t.fyPrevAvg === null ? '' : Math.round(t.fyPrevAvg), t.growth === null ? '' : t.growth,
    ]));
    downloadText('施設別売上推移_' + todayCompact() + '.csv', buildCsvWithConditions([
      ['当期', fyLabel + '（' + (data.fyCmp ? data.fyCmp.curRange : '') + '）'],
      ['比較期間', data.hasFyPrev ? fyPrevLabel + '同期（' + data.fyCmp.prevRange + '）' : '前年度同期のデータ未取得のため比較なし'],
      ['金額', '税抜・返品／値引き反映後。平均は経過月数で割った月あたり'],
      ['絞り込み', [repFilter !== null ? '担当：' + repFilter : '', search.trim() ? '施設名：' + search.trim() : '', minBase ? '少額施設を除く' : ''].filter(Boolean).join(' ／ ') || 'なし'],
      ['集計時点', todayLabel() + '（取込済みデータ ' + dataRangeLabel(data) + '）'],
    ], [head, ...lines]), 'text/csv');
    showToast('施設別売上推移のCSVを出力しました（' + num(filtered.length) + '施設）');
  };

  const MoverCard = ({ title, tone, list, emptyText }) => (
    <Card className="p-4 flex-1 min-w-[260px]">
      <div className={"text-xs font-bold mb-2.5 " + (tone === 'up' ? 'text-emerald-700' : 'text-rose-600')}>{title}</div>
      <div className="space-y-2">
        {list.map(t => (
          <button key={t.f.name} onClick={() => jumpToFacility(t.f.name)}
            className="w-full flex items-center justify-between gap-2 text-left hover:bg-slate-50 rounded-lg px-2 py-1.5 -mx-2 transition">
            <span className="text-xs font-bold text-slate-700 truncate">{t.f.name}</span>
            <span className="inline-flex items-center gap-1.5 shrink-0"><DiffText v={t.fyAvg - t.fyPrevAvg} className="text-xs" /><DeltaPill v={t.growth} /></span>
          </button>
        ))}
        {list.length === 0 && <div className="text-[11px] text-slate-600 py-2">{emptyText}</div>}
      </div>
    </Card>
  );

  if (data.empty) {
    return (
      <Card className="p-10 text-center text-sm text-slate-600">データを取り込むと、施設別の月次推移が表示されます。</Card>
    );
  }

  return (
    <div className="space-y-5">
      <Card className="p-5">
        <div className="flex items-center gap-3 flex-wrap">
          <div className="relative">
            <Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-600" />
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="施設名で絞り込み"
              className="h-10 pl-10 pr-3 rounded-xl border border-slate-200 text-sm w-56 bg-white shadow-sm focus:border-sky-400 focus:outline-none font-bold text-slate-700 placeholder:font-normal" />
          </div>
          <select value={repFilter ?? ''} onChange={e => setRepFilter(e.target.value || null)}
            className="h-10 px-3 rounded-xl border border-slate-200 bg-white text-sm shadow-sm font-bold text-slate-600">
            <option value="">担当: 全員</option>
            {reps.map(r => <option key={r} value={r}>担当: {r}</option>)}
          </select>
          <select value={sortKey} onChange={e => setSortKey(e.target.value)}
            className="h-10 px-3 rounded-xl border border-slate-200 bg-white text-sm shadow-sm font-bold text-slate-600">
            {FAC_TREND_SORTS.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
          </select>
          <label className="flex items-center gap-1.5 text-xs font-bold text-slate-600 cursor-pointer select-none">
            <input type="checkbox" checked={minBase} onChange={e => setMinBase(e.target.checked)} className="accent-sky-500" />
            少額施設を除く
          </label>
          <div className="ml-auto">
            <button onClick={handleCsv}
              className="bg-teal-600 hover:bg-teal-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-teal-200 text-sm font-bold transition inline-flex items-center gap-1.5">
              <FileSpreadsheet size={15} /> CSV出力
            </button>
          </div>
        </div>
        <div className="text-[11px] text-slate-600 mt-3 leading-relaxed">
          {fyLabel}平均・{fyPrevLabel}平均は、いずれも{data.baseLabel}までの経過月数（{monthsElapsed}ヶ月）で割った同期間比較です
          （当期 {data.fyCmp ? data.fyCmp.curRange : ''} ／ 前年度同期 {data.fyCmp ? data.fyCmp.prevRange : ''}）。
          {data.cmp && data.cmp.inProgress && '基準月は月途中のため、前年度同期も前年同月の同じ日までで比べています。'}
          {!data.hasFyPrev && <b className="text-amber-700">前年度同期の明細が取り込まれていないため、増減は表示しません。</b>}
          伸びている／減っている施設は、月あたりの平均の差額が大きい順です。
          直近12ヶ月推移は{idxLabel(data.win[0])} 〜 {idxLabel(data.win[11])}。
        </div>
      </Card>

      <div className="flex gap-4 flex-wrap">
        <MoverCard title={'伸びている施設 TOP5（' + fyPrevLabel + '同期比）'} tone="up" list={movers.up} emptyText="対象となる施設がありません" />
        <MoverCard title={'減っている施設 TOP5（' + fyPrevLabel + '同期比）'} tone="down" list={movers.down} emptyText="対象となる施設がありません" />
      </div>

      <Card>

            <div className="font-bold text-sm text-slate-800">施設別売上推移表</div>
            <div className="text-[11px] text-slate-600">{num(filtered.length)}施設・行をクリックすると施設の詳細分析へ</div>
          </div>
        </div>
        <div className="overflow-x-auto">
        <table className="w-full text-sm min-w-[960px]">
          <thead>
            <tr className="text-left text-[11px] text-slate-600 border-b border-slate-100">

          <tbody className="divide-y divide-slate-50">
            {filtered.map(t => (

                <td className="px-3 py-3 text-right">{t.growth === null ? <span className="text-slate-400 text-xs">—</span> : <DeltaPill v={t.growth} />}</td>
                <td className="px-3 py-3 text-right tabular-nums font-bold text-slate-700">{yen(t.f.monthly[11])}</td>

const REFORM_COLORS = { reform: '#d97706', welfare: '#0284c7' };
const manYen = (v) => (Math.abs(v) >= 10000 ? (Math.round(v / 1000) / 10).toLocaleString('ja-JP') + '万' : num(v));

// 月ごとの積み上げ棒。縦軸は金額の1本だけ。棒に指／マウスを乗せると、その月の内訳を出す
// noteOf(m)：月の下に添える短い注記（「26日まで」など）。m.noData の月は棒を描かず「取込なし」と出す
function StackedBars({ months, series, height = 230, noteOf }) {
  const [hover, setHover] = useState(null);
  const colW = 52, padL = 56, padT = 12, padB = 28;
  const W = padL + Math.max(months.length, 6) * colW + 8, H = height;
  const totals = months.map(m => series.reduce((t, s) => t + Math.max(0, m[s.key]), 0));
  const rawMax = Math.max(...totals, 1);
  const pow = Math.pow(10, Math.floor(Math.log10(rawMax)));
  const max = [1, 2, 2.5, 5, 10].map(k => k * pow).find(v => v >= rawMax) || rawMax;
  const y = (v) => padT + (H - padT - padB) * (1 - v / max);
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => f * max);
  const bw = 26;
  return (
    <div className="relative overflow-x-auto">
      <svg width={W} height={H} className="block" role="img" aria-label="月ごとの売上（積み上げ棒グラフ）">
        {ticks.map((t, i) => (
          <g key={i}>
            <line x1={padL} x2={W - 4} y1={y(t)} y2={y(t)} stroke="#e2e8f0" strokeWidth="1" />
            <text x={padL - 6} y={y(t) + 3.5} fontSize="10" textAnchor="end" fill="#64748b">{t === 0 ? '0' : '¥' + manYen(t)}</text>
          </g>
        ))}
        {months.map((m, i) => {
          const cx = padL + i * colW + colW / 2;
          let acc = 0;
          return (
            <g key={m.idx}>
              {series.map((s, si) => {
                const v = Math.max(0, m[s.key]);
                if (v <= 0) return null;
                const y1 = y(acc + v), y0 = y(acc);
                acc += v;
                // 段と段の間は2pxあける
                const h = Math.max(1, y0 - y1 - (si > 0 ? 2 : 0));
                return <rect key={s.key} x={cx - bw / 2} y={y1} width={bw} height={h} rx="3" fill={s.color} />;
              })}
              {m.noData && <text x={cx} y={y(0) - 6} fontSize="9" textAnchor="middle" fill="#94a3b8">取込なし</text>}
              <text x={cx} y={H - 10} fontSize="10" textAnchor="middle" fill="#64748b">{idxShort(m.idx)}</text>
              <rect x={cx - colW / 2} y={padT} width={colW} height={H - padT - padB} fill="transparent"
                onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)} onTouchStart={() => setHover(i)} />
            </g>
          );
        })}
      </svg>
      {hover !== null && months[hover] && (
        <div className="absolute top-1 pointer-events-none bg-white border border-slate-200 shadow-lg rounded-lg px-3 py-2 text-[11px] text-slate-700 tabular-nums"
          style={{ left: Math.min(padL + hover * colW + colW, W - 170) }}>
          <div className="font-bold text-slate-800 mb-0.5">{idxLabel(months[hover].idx)}{noteOf && noteOf(months[hover]) ? '（' + noteOf(months[hover]) + '）' : ''}</div>
          {months[hover].noData ? <div className="text-slate-600">この月の明細は取り込まれていません</div> : series.map(s => (
            <div key={s.key} className="flex items-center gap-1.5">
              <span className="inline-block w-2.5 h-2.5 rounded-sm" style={{ background: s.color }} />
              {s.label} {yen(months[hover][s.key])}（{num(months[hover][s.key + 'Cases'])}件）
            </div>
          ))}
          {series.length > 1 && !months[hover].noData && <div className="mt-0.5 pt-0.5 border-t border-slate-100 font-bold">合計 {yen(series.reduce((t, s) => t + months[hover][s.key], 0))}</div>}
        </div>
      )}
    </div>
  );
}

  const rangeDates = idxRangeDates(range.from, range.to, data.latestDate);

    if (m.noData) return '取込なし';
