                      </td>
                    </tr>
                  );
                })}
                {draft.items.length === 0 && (
                  <tr><td colSpan={2 + (draft.showCaseSize ? 1 : 0) + (draft.showAmounts ? 3 : 0) + (draft.showAmounts && draft.showRate !== false ? 1 : 0)} className="px-5 py-10 text-center text-xs text-slate-600">左の商品一覧から「＋追加」で価格改定表に入れてください</td></tr>
                )}
              </tbody>
            </table>
          </div>
          <div className="px-4 py-3 border-t border-slate-100">
            <div className="text-[11px] font-bold text-slate-600 uppercase tracking-wide mb-1.5">備考（そのまま帳票に印刷されます）</div>
            <textarea rows={3} value={draft.note} onChange={e => patch({ note: e.target.value })}
              className="w-full rounded-xl border border-slate-200 p-3 text-xs resize-y focus:border-blue-400 focus:outline-none transition leading-relaxed" />
          </div>
          <div className="px-5 py-3 bg-sky-50/70 text-[11px] text-slate-700 leading-relaxed border-t border-sky-100">
            商品を選ぶと現状価格（直近の販売価格）が自動で入ります。改定価格を入力すると増加額・増加率が自動計算されます。合計金額は表示されません。
          </div>
        </Card>

        <CalcPad />
      </div>

      {facPickerOpen && (
        <div className="fixed inset-0 z-40 bg-slate-600/50 backdrop-blur-sm overflow-auto py-8 px-4 no-print"
          onClick={() => setFacPickerOpen(false)}>
          <div className="max-w-lg mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden" onClick={e => e.stopPropagation()}>
            <div className="px-6 py-4 border-b border-slate-100 flex items-center gap-3 bg-gradient-to-r from-sky-50 to-blue-50">
              <span className="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-sky-100 text-sky-600"><Search size={17} /></span>
              <div className="flex-1">
                <div className="font-bold text-slate-800 text-sm">既存施設から選ぶ</div>
                <div className="text-[11px] text-slate-600">施設名を検索して選んでください</div>
              </div>
              <button onClick={() => setFacPickerOpen(false)} className="text-slate-400 hover:text-slate-600 transition"><X size={18} /></button>
            </div>
            <div className="px-6 py-4">
              <div className="relative">
                <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-600" />
                <input autoFocus value={facPickerQuery} onChange={e => setFacPickerQuery(e.target.value)}
                  placeholder="施設名で検索"
                  className="h-11 pl-9 pr-3 w-full rounded-xl border border-slate-200 text-sm bg-white shadow-sm focus:border-blue-400 focus:outline-none transition" />
              </div>
              <div className="mt-3 max-h-80 overflow-y-auto divide-y divide-slate-50 border border-slate-100 rounded-xl">
                {facNames.filter(n => normalizeSearchText(n).includes(normalizeSearchText(facPickerQuery.trim()))).slice(0, 200).map(n => (
                  <button key={n} type="button"
                    onClick={() => { patch({ facility: n }); setFacPickerOpen(false); setFacPickerQuery(''); }}
                    className="w-full text-left px-4 py-2.5 hover:bg-sky-50 transition text-xs font-bold text-slate-700 truncate">
                    {n}
                  </button>
                ))}
                {facNames.filter(n => normalizeSearchText(n).includes(normalizeSearchText(facPickerQuery.trim()))).length === 0 && (
                  <div className="px-4 py-8 text-center text-xs text-slate-600">該当する施設がありません</div>
                )}
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   画面: 価格確認リスト
   - 商品にチェックを入れると右側に集まる。直近販売単価・仕入単価・粗利を並べて印刷するだけの一覧（改定価格の入力はしない）
============================================================ */
function PriceCheckListPanel({ data, showToast, openPrint }) {
  const [cat, setCat] = useState('all');
  const [search, setSearch] = useState('');
  const [checked, setChecked] = useState(() => new Set());
  const [sortKey, setSortKey] = useState('name');
  const [sortDir, setSortDir] = useState(1);

  const master = useMemo(() => {
    let list = data.products.slice().sort((a, b) => b.winSales - a.winSales);
    if (cat !== 'all') list = list.filter(x => x.cat === cat);
    const q = normalizeSearchText(search.trim());
    if (q) list = list.filter(x => normalizeSearchText(x.name).includes(q));
    return list;
  }, [data, cat, search]);
  const visibleMaster = master.slice(0, 60);

  const toggleCheck = (name) => setChecked(prev => {
    const n = new Set(prev);
    if (n.has(name)) n.delete(name); else n.add(name);
    return n;
  });
  const removeCheck = (name) => setChecked(prev => { const n = new Set(prev); n.delete(name); return n; });
  const clearAll = () => setChecked(new Set());

  const toggleSort = (k) => { if (sortKey === k) setSortDir(d => -d); else { setSortKey(k); setSortDir(1); } };
  const selected = useMemo(() => {
    const list = data.products.filter(p => checked.has(p.name));
    list.sort((a, b) => {
      let va, vb;
      switch (sortKey) {
        case 'cat': va = a.cat || ''; vb = b.cat || ''; break;
        case 'price': va = a.lastPrice || 0; vb = b.lastPrice || 0; break;
        case 'cost': va = a.cost || 0; vb = b.cost || 0; break;
        default: va = a.name || ''; vb = b.name || '';
      }
      const cmp = typeof va === 'string' ? va.localeCompare(vb, 'ja') : va - vb;
      return cmp * sortDir;
    });
    return list;
  }, [data.products, checked, sortKey, sortDir]);

  const handlePrint = () => {
    if (selected.length === 0) { showToast('商品を選択してください', 'error'); return; }
    openPrint(buildPriceCheckListHtml({
      issued: isoToJa(todayISO()),
      items: selected.map(p => ({ name: p.name, cat: p.cat, unit: p.unit, price: p.lastPrice, cost: p.cost })),
    }));
  };

  const Th = ({ k, children, className }) => (
    <th className={"cursor-pointer select-none " + (className || '')} onClick={() => toggleSort(k)}>
      <span className="inline-flex items-center gap-0.5">{children}{sortKey === k && (sortDir === 1 ? <ChevronUp size={11} /> : <ChevronDown size={11} />)}</span>
    </th>
  );

  return (
    <div className="grid lg:grid-cols-[minmax(340px,1fr)_minmax(420px,1.3fr)] gap-5 items-start">
      <Card>
        <div className="px-5 py-3.5 border-b border-slate-100 flex items-center gap-2.5 flex-wrap">
          <span className="font-bold text-sm text-slate-700">商品を選ぶ</span>
          <select value={cat} onChange={e => setCat(e.target.value)} className="h-9 px-2.5 rounded-lg border border-slate-200 bg-white text-xs shadow-sm font-bold text-slate-600 ml-auto">
            <option value="all">全分類</option>
            {data.categories.map(c => <option key={c.name} value={c.name}>{c.name}</option>)}
          </select>
          <div className="relative w-full">
            <Search size={14} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-500" />
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="商品名で絞り込み"
              className="h-9 pl-8 pr-2.5 w-full rounded-lg border border-slate-200 text-xs shadow-sm font-bold text-slate-700 focus:border-sky-400 focus:outline-none" />
          </div>
        </div>
        <div className="divide-y divide-slate-50 max-h-[32rem] overflow-y-auto">
          {visibleMaster.map(m => {
            const on = checked.has(m.name);
            return (
              <label key={m.name} className={"w-full text-left px-5 py-3.5 flex items-center gap-3 transition cursor-pointer " + (on ? 'bg-sky-50/60' : 'hover:bg-sky-50/30')}>
                <input type="checkbox" checked={on} onChange={() => toggleCheck(m.name)}
                  className="w-4 h-4 rounded border-slate-300 text-sky-600 focus:ring-sky-400 shrink-0" />
                <div className="flex-1 min-w-0">
                  <div className="font-bold text-sm text-slate-800 truncate">{m.name}</div>
                  <div className="text-xs text-slate-600 tabular-nums mt-0.5">
                    {m.cat}{m.lastPrice > 0 && <> ・ 現状価格 <b className="text-slate-700">{yen(m.lastPrice)}</b></>}
                    {m.cost > 0 && <> ・ 仕入 <b className="text-amber-700">{yen(m.cost)}</b></>}
                  </div>
                </div>
              </label>
            );
          })}
          {visibleMaster.length === 0 && <div className="px-5 py-8 text-center text-xs text-slate-600">該当する商品がありません</div>}
        </div>
      </Card>

      <Card>
        <div className="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between gap-2">
          <span className="font-bold text-sm text-slate-700">価格確認リスト {selected.length}品目</span>
          <div className="flex items-center gap-2">
            <button onClick={clearAll} disabled={selected.length === 0}
              className="text-xs font-bold text-slate-500 hover:text-rose-500 disabled:opacity-40 transition">全て外す</button>
            <button onClick={handlePrint}
              className="bg-white hover:bg-slate-50 active:scale-[.98] text-slate-700 border border-slate-200 px-3.5 py-2 rounded-xl shadow-sm text-xs font-bold transition inline-flex items-center gap-1.5">
              <Printer size={14} /> 印刷
            </button>
          </div>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-sm min-w-[520px]">
            <thead>
              <tr className="text-xs uppercase tracking-wide text-slate-600 border-b border-slate-100">
                <Th k="name" className="text-left font-bold px-4 py-2.5">商品名</Th>
                <Th k="cat" className="text-left font-bold px-2 py-2.5">分類</Th>
                <Th k="price" className="text-right font-bold px-1 py-2.5 w-28">直近販売単価</Th>
                <Th k="cost" className="text-right font-bold px-1 py-2.5 w-28">仕入単価</Th>
                <th className="w-10"></th>
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-50">
              {selected.map(p => (
                <tr key={p.name}>
                  <td className="px-4 py-2.5 font-bold text-sm text-slate-800">{p.name}</td>
                  <td className="px-2 py-2.5 text-xs text-slate-600">{p.cat}</td>
                  <td className="px-1 py-2.5 text-right tabular-nums text-sm text-slate-700">{p.lastPrice > 0 ? yen(p.lastPrice) : '—'}</td>
                  <td className="px-1 py-2.5 text-right tabular-nums text-sm text-amber-700">{p.cost > 0 ? yen(p.cost) : '—'}</td>
                  <td className="pr-3 text-right">
                    <button onClick={() => removeCheck(p.name)} className="text-slate-400 hover:text-rose-500 transition"><X size={15} /></button>
                  </td>
                </tr>
              ))}
              {selected.length === 0 && (
                <tr><td colSpan={5} className="px-5 py-10 text-center text-xs text-slate-600">左の商品一覧からチェックを入れると、ここに追加されます</td></tr>
              )}
            </tbody>
          </table>
        </div>
        <div className="px-5 py-3 bg-sky-50/70 text-[11px] text-slate-700 leading-relaxed border-t border-sky-100">
          チェックした商品の直近販売単価・仕入単価・粗利額を一覧にして印刷できます（改定価格の入力はありません）。列見出しをクリックすると並び替えできます。
        </div>
      </Card>
    </div>
  );
}

function DocComposer({ docType, data, masters, draft, setDraft, docs, setDocs, showToast, openPrint, goImport }) {
  const isQuote = docType === 'quote';
  const [source, setSource] = useState(docType === 'order' ? 'all' : 'fac');
  const [cat, setCat] = useState('all');
  const [search, setSearch] = useState('');
  const [showSaved, setShowSaved] = useState(false);
  const [busy, setBusy] = useState(false);
  const [facSuggestOpen, setFacSuggestOpen] = useState(false);
  const [facPickerOpen, setFacPickerOpen] = useState(false);
  const [facPickerQuery, setFacPickerQuery] = useState('');
  const facBoxRef = useRef(null);
  const facInputRef = useRef(null);

  const facNames = useMemo(() =>
    data.facilities.slice().sort((a, b) => (b.sales || 0) - (a.sales || 0)).map(f => f.name), [data]);
  // 未入力（新規作成の初期状態）では候補を出さない。文字を入力し始めたときだけ
  // 部分一致でフィルタして表示する（既存施設の絞り込み）。
  const facSuggests = useMemo(() => {
    const q = normalizeSearchText(String(draft.facility || '').trim());
    if (!q) return [];
    return facNames.filter(n => normalizeSearchText(n).includes(q)).slice(0, 8);
  }, [facNames, draft.facility]);
  // 候補リストの外側をクリックしたら閉じる（施設別検索と同じ自作ドロップダウン方式。
  // ブラウザ標準の<datalist>は表示位置が崩れることがあるため使わない）
  useEffect(() => {
    if (!facSuggestOpen) return;
    const h = (e) => { if (facBoxRef.current && !facBoxRef.current.contains(e.target)) setFacSuggestOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [facSuggestOpen]);
  const fac = draft.facility ? data.facByName.get(draft.facility) : null;
  const repName = fac ? fac.repName : '';
  const facPairs = useMemo(() => {
    const m = new Map();
    if (fac) fac.pairs.forEach(p => m.set(p.prod, p));
    return m;
  }, [fac]);
  const savedList = useMemo(() =>
    docs.filter(d => d.type === docType).sort((a, b) => (a.savedAt < b.savedAt ? 1 : -1)), [docs, docType]);

  // 商品マスタ（販売履歴から自動生成）
  const master = useMemo(() => {
    let list;
    const dstr = (d) => (d ? d.y + '/' + d.mo + '/' + d.d : null);
    if (source === 'fac' && fac) {
      list = fac.pairs.slice().sort((a, b) => sum12(b.sales12) - sum12(a.sales12)).map(p => {
        const prod = data.prodByName.get(p.prod);
        return {
          name: p.prod, cat: prod ? prod.cat : 'その他', unit: p.unit || (prod ? prod.unit : ''),
          price: p.lastPrice > 0 ? p.lastPrice : (prod ? prod.lastPrice : 0),
          priceSrc: p.lastPrice > 0 ? 'この施設' : '全体',
          cost: prod ? prod.cost : 0,
          last: dstr(p.lastDate),
        };
      });
    } else {
      list = data.products.slice().sort((a, b) => b.winSales - a.winSales).map(prod => {
        const pair = facPairs.get(prod.name);
        return {
          name: prod.name, cat: prod.cat, unit: prod.unit,
          price: pair && pair.lastPrice > 0 ? pair.lastPrice : prod.lastPrice,
          priceSrc: pair && pair.lastPrice > 0 ? 'この施設' : '全体',
          cost: prod.cost,
          last: pair ? dstr(pair.lastDate) : null,
        };
      });
    }
    if (cat !== 'all') list = list.filter(x => x.cat === cat);
    const q = normalizeSearchText(search.trim());
    if (q) list = list.filter(x => normalizeSearchText(x.name).includes(q));
    return list;
  }, [data, fac, facPairs, source, cat, search]);
  const visibleMaster = master.slice(0, 40);
  const inItems = useMemo(() => new Set(draft.items.map(i => i.name)), [draft.items]);

  const patch = (p) => setDraft(prev => ({ ...prev, ...p }));
  const addItem = (m) => {
    if (inItems.has(m.name)) { showToast('「' + m.name + '」はすでに明細にあります', 'info'); return; }
    setDraft(prev => ({ ...prev, items: [...prev.items, { name: m.name, cat: m.cat || '', note: '', qty: isQuote ? 1 : '', unit: m.unit || '', caseSize: '', price: Math.round(m.price) || 0, cost: Math.round(m.cost) || 0 }] }));
  };
  const addBlank = () => setDraft(prev => ({ ...prev, items: [...prev.items, { name: '', cat: '', note: '', qty: isQuote ? 1 : '', unit: '', caseSize: '', price: 0 }] }));
  const setItem = (idx, p) => setDraft(prev => ({ ...prev, items: prev.items.map((it, i) => (i === idx ? { ...it, ...p } : it)) }));
  const delItem = (idx) => setDraft(prev => ({ ...prev, items: prev.items.filter((_, i) => i !== idx) }));
  const total = draft.items.reduce((s, it) => s + (Number(it.qty) || 0) * it.price, 0);

  const buildHtml = () => {
    // 商品名が空欄の行も、施設側が手書きで記入できるようそのまま印刷に含める。
    const items = draft.items;
    const common = {
      facilityName: draft.facility, facilityAddress: draft.facilityAddress || '',
      facilityTel: draft.facilityTel || '', facilityFax: draft.facilityFax || '', repName: repName || '未設定', items,
      showPrices: draft.showPrices, showCaseSize: !!draft.showCaseSize, issued: isoToJa(draft.issued),
      note: draft.note, title: draft.title, office: masters.settings.office,
    };
    return isQuote
      ? buildQuoteHtml({ ...common, taxIncluded: !!draft.taxIncluded, showTotal: !!draft.showTotal, quoteNo: 'M-' + String(draft.issued || '').replace(/-/g, '') + '-01' })
      : buildFacilityOrderHtml(common);
  };
  const validate = () => {
    if (!String(draft.facility).trim()) { showToast('施設名を入力してください', 'error'); return false; }
    if (draft.items.filter(it => String(it.name).trim()).length === 0) { showToast('明細に商品を追加してください', 'error'); return false; }
    return true;
  };
  const handlePrint = () => { if (validate()) openPrint(buildHtml()); };
  const handlePdf = async () => {
    if (!validate()) return;
    setBusy(true);
    showToast('PDFを作成しています…', 'info');
    try {
      const fname = (isQuote ? '御見積書_' : '発注書_') + String(draft.facility).replace(/[\\/:*?"<>|]/g, '') + '_' + (draft.issued || todayISO()) + '.pdf';
      await exportPdf(buildHtml(), fname);
      showToast('PDFを保存しました');
    } catch (e) {
      showToast('PDFの作成に失敗しました。印刷ダイアログの「PDFとして保存」もお試しください', 'error', 7000);
    } finally {
      setBusy(false);
    }
  };
  const handleSave = () => {
    if (!String(draft.facility).trim()) { showToast('施設名を入力してください', 'error'); return; }
    const now = new Date().toISOString();
    const id = draft.id || (docType + '-' + Date.now());
    const rec = { ...draft, id, type: docType, savedAt: now };
    setDocs(prev => {
      const i = prev.findIndex(d => d.id === id);
      if (i >= 0) { const a = prev.slice(); a[i] = rec; return a; }
      return [...prev, rec];
    });
    setDraft(rec);
    showToast(draft.id ? '保存しました（上書き）' : '保存しました。次回この画面から呼び出して編集できます');
  };
  const loadDoc = (d) => { setDraft({ ...d }); setShowSaved(false); showToast('「' + d.facility + '」を読み込みました'); };
  const delDoc = (id) => setDocs(prev => prev.filter(d => d.id !== id));
  const newDoc = () => { setDraft(newDocDraft(docType, '')); showToast('新規作成にしました'); };
  // 取り消し: 未保存の編集を破棄。保存済みを編集中ならその内容に戻し、未保存なら空に戻す
  const handleCancel = () => {
    if (draft.id) {
      const saved = docs.find(d => d.id === draft.id);
      if (saved) { setDraft({ ...saved }); showToast('保存済みの内容に戻しました'); return; }
    }
    setDraft(newDocDraft(docType, ''));
    showToast('入力内容を取り消しました');
  };

  const inputCls = 'h-10 px-3 rounded-xl border border-slate-200 bg-white text-sm shadow-sm focus:border-blue-400 focus:outline-none transition';

  return (
    <div className="space-y-4">
      <Card className="px-5 py-4 space-y-3">
        <div className="flex items-center gap-3 flex-wrap">
          <div className="flex items-center gap-2">
            <span className="text-sm text-slate-600 font-bold shrink-0">施設名</span>
            <div className="relative" ref={facBoxRef}>
              <textarea ref={facInputRef} value={draft.facility}
                onChange={e => { patch({ facility: e.target.value }); setFacSuggestOpen(true); }}
                onFocus={() => setFacSuggestOpen(true)}
                onKeyDown={e => { if (e.key === 'Escape') setFacSuggestOpen(false); }}
                placeholder="選択、または新規の施設名を入力"
                rows={1}
                className="w-72 min-h-[40px] max-h-20 px-3 py-2 rounded-xl border border-slate-200 bg-white text-sm shadow-sm focus:border-blue-400 focus:outline-none transition font-bold text-slate-700 leading-snug resize-y" />
              {facSuggestOpen && facSuggests.length > 0 && (
                <div className="absolute z-30 top-full left-0 mt-1.5 w-72 bg-white rounded-xl border border-slate-200 shadow-xl overflow-hidden">
                  {facSuggests.map(n => (
                    <button key={n} type="button" onMouseDown={e => e.preventDefault()}
                      onClick={() => { patch({ facility: n }); setFacSuggestOpen(false); }}
                      className="w-full text-left px-4 py-2.5 hover:bg-sky-50 transition text-xs font-bold text-slate-700 truncate border-b border-slate-50 last:border-0">
                      {n}
                    </button>
                  ))}
                </div>
              )}
            </div>
            <button type="button" onClick={() => { setFacPickerOpen(true); setFacPickerQuery(''); }}

                <div className="text-[11px] text-slate-600">施設名を検索して選んでください</div>
              </div>
              <button onClick={() => setFacPickerOpen(false)} className="text-slate-400 hover:text-slate-600 transition"><X size={18} /></button>
            </div>
            <div className="px-6 py-4">
              <div className="relative">
                <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-600" />
                <input autoFocus value={facPickerQuery} onChange={e => setFacPickerQuery(e.target.value)}
                  placeholder="施設名で検索"
                  className="h-11 pl-9 pr-3 w-full rounded-xl border border-slate-200 text-sm bg-white shadow-sm focus:border-blue-400 focus:outline-none transition" />
              </div>
              <div className="mt-3 max-h-80 overflow-y-auto divide-y divide-slate-50 border border-slate-100 rounded-xl">
                {facNames.filter(n => normalizeSearchText(n).includes(normalizeSearchText(facPickerQuery.trim()))).slice(0, 200).map(n => (
                  <button key={n} type="button"
                    onClick={() => { patch({ facility: n }); setFacPickerOpen(false); setFacPickerQuery(''); }}
                    className="w-full text-left px-4 py-2.5 hover:bg-sky-50 transition text-xs font-bold text-slate-700 truncate">
                    {n}
                  </button>
                ))}
                {facNames.filter(n => normalizeSearchText(n).includes(normalizeSearchText(facPickerQuery.trim()))).length === 0 && (
                  <div className="px-4 py-8 text-center text-xs text-slate-600">該当する施設がありません</div>
                )}
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   画面7: 設定
============================================================ */
function SettingsView({ rows, masters, setRows, setMasters, setOffice, meta, setMeta, docs, setDocs, data, showToast }) {
  const [sub, setSubRaw] = useState('rep');
  const [q, setQ] = useState('');
  const [newRep, setNewRep] = useState('');
  const [catLimit, setCatLimit] = useState(100);
  const [newRuleKw, setNewRuleKw] = useState('');
  const [newRuleCat, setNewRuleCat] = useState(CATEGORY_NAMES[0]);
  const [jsonImp, setJsonImp] = useState(null);
  const [delStep, setDelStep] = useState(0);
  const jsonRef = useRef(null);
  const setSub = (v) => { setSubRaw(v); setQ(''); setCatLimit(100); };

  const customers = masters.customers;
  const updateCustomer = (name, patch) => setMasters(prev => ({
    ...prev, customers: { ...prev.customers, [name]: { ...prev.customers[name], ...patch } },
  }));

  // 担当者リスト = 手動追加分 ∪ すでに割り当てられている名前
  const allReps = useMemo(() => {
    const s = new Set(masters.settings.reps || []);
    for (const n in customers) { const r = customers[n].rep; if (r) s.add(r); }
    return [...s].sort((a, b) => a.localeCompare(b, 'ja'));
  }, [masters]);
  const addRep = () => {
    const name = newRep.trim();
    if (!name) return;
    if (allReps.includes(name)) { showToast('「' + name + '」はすでに登録されています', 'info'); return; }
    setMasters(prev => ({ ...prev, settings: { ...prev.settings, reps: [...(prev.settings.reps || []), name] } }));
    setNewRep('');
    showToast('担当者「' + name + '」を追加しました');
  };

  const facNames = useMemo(() => {
    const list = Object.keys(customers).filter(n => customers[n].type === 'facility');
    list.sort((a, b) => {
      const ua = customers[a].rep ? 1 : 0, ub = customers[b].rep ? 1 : 0;
      if (ua !== ub) return ua - ub;   // 未設定を上に
      return a.localeCompare(b, 'ja');
    });
    return list;
  }, [masters]);
  const perNames = useMemo(() => {
    const list = Object.keys(customers).filter(n => customers[n].type === 'person');
    list.sort((a, b) => {
      const ua = customers[a].uncertain ? 0 : 1, ub = customers[b].uncertain ? 0 : 1;
      if (ua !== ub) return ua - ub;   // 要確認を上に
      return a.localeCompare(b, 'ja');
    });
    return list;
  }, [masters]);
  const facNamesPerson = useMemo(() => {
    const list = Object.keys(customers).filter(n => customers[n].type === 'facility');
    list.sort((a, b) => {
      const ua = customers[a].uncertain ? 0 : 1, ub = customers[b].uncertain ? 0 : 1;
      if (ua !== ub) return ua - ub;
      return a.localeCompare(b, 'ja');
    });
    return list;
  }, [masters]);
  const filterQ = (list) => (q.trim() ? list.filter(n => n.includes(q.trim())) : list);

  // 商品リスト（売上の大きい順）
  const prodNames = useMemo(() => {
    if (!data.empty) return data.products.slice().sort((a, b) => b.winSales - a.winSales).map(p => p.name);
    return [...new Set([...Object.keys(masters.catOverrides), ...Object.keys(masters.itemHandling)])];
  }, [data, masters]);
  const setCat = (name, v) => setMasters(prev => {
    const co = { ...prev.catOverrides };
    // 学習ルール・内蔵辞書と同じ分類に戻したときは手直しを消す（自動判定に任せる）
    if (v === resolveCategory(name, {}, prev.catRules).cat) delete co[name]; else co[name] = v;
    return { ...prev, catOverrides: co };
  });
  const setHandling = (name, v) => setMasters(prev => {
    const ih = { ...prev.itemHandling };
    if (v === HANDLING_DEFAULT) delete ih[name]; else ih[name] = v;
    return { ...prev, itemHandling: ih };
  });

  // ---- キーワード学習ルール ----
  const catOf = (name) => resolveCategory(name, masters.catOverrides, masters.catRules);
  const ruleMatchCount = (kw) => {
    const n = String(kw || '').normalize('NFKC');
    if (!n) return 0;
    return prodNames.reduce((s, p) => s + (String(p).normalize('NFKC').includes(n) ? 1 : 0), 0);
  };
  const addRule = () => {
    const kw = newRuleKw.trim();
    if (!kw) { showToast('キーワードを入力してください', 'error'); return; }
    if ((masters.catRules || []).some(r => r.kw === kw)) { showToast('「' + kw + '」はすでに登録されています', 'info'); return; }
    setMasters(prev => ({ ...prev, catRules: [...(prev.catRules || []), { kw, cat: newRuleCat }] }));
    const n = ruleMatchCount(kw);
    setNewRuleKw('');
    showToast('「' + kw + '」を含む商品を' + newRuleCat + 'に分類するルールを覚えました（該当 ' + n + '件）');
  };
  const delRule = (kw) => setMasters(prev => ({ ...prev, catRules: (prev.catRules || []).filter(r => r.kw !== kw) }));

  // ---- データ管理 ----
  const usage = storageUsage();
  const usagePct = Math.min(100, Math.round(usage / STORAGE_LIMIT * 100));

  const handleExport = () => {
    const payload = { app: 'taiyo-uriage-bunseki', schema: 1, exportedAt: new Date().toISOString(), rows, masters, meta, docs };
    downloadText('売上分析データ_' + todayISO() + '.json', JSON.stringify(payload), 'application/json');
    showToast('JSONエクスポートしました（バックアップ・PC間共有に使えます）');
  };
  const handleJsonFile = (file) => {
    if (!file) return;
    file.text().then(t => {
      let obj = null;
      try { obj = JSON.parse(t.replace(/^﻿/, '')); } catch {}
      if (!obj || !Array.isArray(obj.rows) || !obj.masters || typeof obj.masters !== 'object') {
        showToast('このファイルは売上分析アプリのバックアップではありません', 'error'); return;
      }
      if ((obj.schema || 1) > 1) { showToast('このファイルは新しいバージョンの形式です。アプリを最新版に更新してください', 'error'); return; }
      const valid = obj.rows.filter(r => Array.isArray(r) && r.length >= 11 && parseDateStr(r[1]));
      setJsonImp({ fileName: file.name, rows: valid, dropped: obj.rows.length - valid.length,
        masters: normalizeMasters(obj.masters), meta: (obj.meta && typeof obj.meta === 'object') ? obj.meta : { schema: 1 },
        docs: Array.isArray(obj.docs) ? obj.docs.filter(d => d && d.id && d.type) : [] });
    }).catch(() => showToast('ファイルの読み込みに失敗しました', 'error'));
  };
  const applyJson = (mode) => {
    const imp = jsonImp;
    if (!imp) return;
    if (mode === 'replace') {
      setRows(imp.rows);
      setMasters(imp.masters);
      setMeta(imp.meta);
      setDocs(imp.docs);
      showToast('データを置き換えました（明細 ' + num(imp.rows.length) + '行）');
    } else {
      const remaining = rowKeyCounts(rows);
      const add = [];
      imp.rows.forEach(r => {
        const k = rowKey(r);
        const rem = remaining.get(k) || 0;
        if (rem > 0) { remaining.set(k, rem - 1); return; }
        add.push(r);
      });
      if (add.length) setRows(prev => [...prev, ...add]);
      setMasters(prev => {
        const mc = { ...imp.masters.customers };
        for (const n in prev.customers) {
          const loc = prev.customers[n], im = imp.masters.customers[n];
          mc[n] = { ...(im || {}), ...loc, rep: loc.rep || ((im && im.rep) || '') };
        }
        return {
          customers: mc,
          catOverrides: { ...imp.masters.catOverrides, ...prev.catOverrides },
          priceOverrides: { ...imp.masters.priceOverrides, ...prev.priceOverrides },
          itemHandling: { ...imp.masters.itemHandling, ...prev.itemHandling },
          itemFacilityHandling: { ...imp.masters.itemFacilityHandling, ...prev.itemFacilityHandling },
          stockQtyOverrides: { ...imp.masters.stockQtyOverrides, ...prev.stockQtyOverrides },
          stockMonthOverrides: { ...imp.masters.stockMonthOverrides, ...prev.stockMonthOverrides },
          settings: { ...prev.settings, reps: [...new Set([...(prev.settings.reps || []), ...(imp.masters.settings.reps || [])])] },
        };
      });
      setDocs(prev => {
        const seenIds = new Set(prev.map(d => d.id));
        return [...prev, ...imp.docs.filter(d => !seenIds.has(d.id))];
      });
      showToast('データを統合しました（新しい明細 ' + num(add.length) + '行を追加）');
    }
    setJsonImp(null);
  };
  const doDelete = () => {
    removeStorage([K.ROWS, K.MASTERS, K.META, K.DOCS]);
    setRows([]);
    setMasters(defaultMasters());
    setMeta({ schema: 1 });
    setDocs([]);
    setDelStep(0);
    showToast('全データを削除しました');
  };

  const searchBox = (placeholder) => (
    <div className="relative">
      <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-600" />
      <input value={q} onChange={e => setQ(e.target.value)} placeholder={placeholder}
        className="h-10 pl-9 pr-3 rounded-xl border border-slate-200 text-sm w-56 bg-white shadow-sm focus:border-blue-400 focus:outline-none transition" />
    </div>
  );

  return (
    <div className="space-y-4">
      <Segmented value={sub} onChange={setSub}
        options={[['office', '営業所'], ['rep', '担当者対応表'], ['direct', '直送フラグ'], ['cat', '商品分類'], ['handling', '在庫扱い'], ['person', '施設/個人判定'], ['labels', '画面名'], ['data', 'データ管理']]} />

      {sub === 'labels' && (
        <Card className="p-5 max-w-2xl">
          <div className="font-bold text-sm text-slate-800 mb-1">画面名の変更</div>
          <div className="text-xs text-slate-600 leading-relaxed mb-3">
            左側メニューに表示される画面名を、自由に書き換えられます。空欄にすると元の名前に戻ります。
          </div>
          <div className="space-y-2">
            {TABS.map(t => (
              <div key={t.id} className="flex items-center gap-3">
                <span className="w-40 shrink-0 text-xs text-slate-600 font-bold">{t.label}</span>
                <input value={(masters.settings.tabLabels && masters.settings.tabLabels[t.id]) || ''}
                  onChange={e => {
                    const v = e.target.value;
                    setMasters(prev => {
                      const next = { ...(prev.settings.tabLabels || {}) };
                      if (v.trim()) next[t.id] = v; else delete next[t.id];
                      return { ...prev, settings: { ...prev.settings, tabLabels: next } };
                    });
                  }}
                  placeholder={t.label}
                  className="h-10 flex-1 px-3 rounded-xl border border-slate-200 bg-white text-sm shadow-sm focus:border-blue-400 focus:outline-none transition" />
              </div>
            ))}
          </div>
        </Card>
      )}

      {sub === 'office' && (
        <Card className="p-5 max-w-2xl">
          <div className="font-bold text-sm text-slate-800 mb-1 inline-flex items-center gap-2">
            <span className="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-amber-50 text-amber-500"><Sun size={14} /></span>
            お使いの営業所
          </div>
          <div className="text-xs text-slate-600 leading-relaxed mb-3">
            見積書・発注書・レポートの発行元欄に、ここで選んだ営業所の名称・住所・電話番号が印刷されます。
          </div>
          <select value={masters.settings.office || ''} onChange={e => setOffice(e.target.value)}
            className="h-11 w-full max-w-sm px-3 rounded-xl border border-slate-200 bg-white text-sm shadow-sm font-bold text-slate-700 focus:border-blue-400 focus:outline-none">
            {OFFICE_MASTER.map(x => <option key={x.name} value={x.name}>{x.name}</option>)}
          </select>
          {officeByName(masters.settings.office) && (
            <div className="mt-3 bg-sky-50/70 border border-sky-100 rounded-xl px-4 py-3 text-xs text-slate-600 leading-relaxed max-w-sm">
              〒{officeByName(masters.settings.office).zip}　{officeByName(masters.settings.office).addr}<br />
              TEL：{officeByName(masters.settings.office).tel}　／　FAX：{officeByName(masters.settings.office).fax}<br />
              所長：{officeByName(masters.settings.office).chief}
            </div>
          )}
        </Card>
      )}

      {sub === 'rep' && (
        <Card>
          <div className="px-5 py-3 border-b border-slate-100 text-xs text-slate-600 leading-relaxed">
            施設ごとに担当者を設定します。<b className="text-amber-600">未設定の施設が上に表示されます。</b>一度設定すれば以後の取込で自動適用されます。
          </div>
          <div className="px-5 py-3 border-b border-slate-100 flex items-center gap-2.5 flex-wrap">
            {searchBox('施設名で検索')}
            <div className="flex items-center gap-2 ml-auto">
              <input value={newRep} onChange={e => setNewRep(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter') addRep(); }}
                placeholder="担当者名を追加（例: 田中）"
                className="h-10 px-3 rounded-xl border border-slate-200 text-sm w-48 bg-white shadow-sm focus:border-blue-400 focus:outline-none transition" />
              <button onClick={addRep}
                className="bg-sky-600 hover:bg-sky-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-sky-200 text-sm font-bold transition">追加</button>
            </div>
          </div>
          <div className="divide-y divide-slate-50 max-h-[28rem] overflow-y-auto">
            {filterQ(facNames).map(name => (
              <div key={name} className={"px-5 py-2.5 flex items-center justify-between gap-3 " + (!customers[name].rep ? 'bg-amber-50/60' : '')}>
                <div className="font-bold text-sm text-slate-700">
                  {name}
                  {!customers[name].rep && <span className="ml-2 bg-amber-400 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">未設定</span>}
                </div>
                <select value={customers[name].rep || ''} onChange={e => updateCustomer(name, { rep: e.target.value })}
                  className="h-10 px-3 rounded-xl border border-slate-200 bg-white text-sm w-36 shadow-sm font-bold text-slate-600">
                  <option value="">（未設定）</option>
                  {allReps.map(r => <option key={r} value={r}>{r}</option>)}
                </select>
              </div>
            ))}
            {filterQ(facNames).length === 0 && (
              <div className="px-5 py-10 text-center text-sm text-slate-600">{facNames.length === 0 ? 'まずデータ取込でCSVを取り込んでください' : '該当する施設がありません'}</div>
            )}
          </div>
          {allReps.length === 0 && facNames.length > 0 && (
            <div className="px-5 py-2.5 text-[11px] text-amber-600 border-t border-slate-50 font-bold">まず右上の入力欄で担当者名を追加してください（CSVに担当者列がある場合は自動で入ります）</div>
          )}
        </Card>
      )}

      {sub === 'direct' && (
        <Card>
          <div className="px-5 py-3 border-b border-slate-100 text-xs text-slate-600 leading-relaxed">
            <b className="text-slate-600">直送</b>＝仕入先からその施設へ直接納品（自社在庫を使わない）。適正在庫の計算は<b className="text-slate-600">非直送のみ</b>が対象です。商品単位の扱い（在庫品/受注発注）は「在庫扱い」タブで設定します。
          </div>
          <div className="px-5 py-3 border-b border-slate-100">{searchBox('施設名で検索')}</div>
          <div className="divide-y divide-slate-50 max-h-[28rem] overflow-y-auto">
            {filterQ(facNames).map(name => (
              <div key={name} className="px-5 py-3 flex items-center justify-between gap-3">
                <div className="font-bold text-sm text-slate-700">{name}</div>
                <Toggle on={!!customers[name].direct}
                  onChange={(v) => updateCustomer(name, { direct: v })}
                  labelOn="直送（在庫計算の対象外）" labelOff="非直送（在庫計算の対象）" />
              </div>
            ))}
            {filterQ(facNames).length === 0 && (
              <div className="px-5 py-10 text-center text-sm text-slate-600">{facNames.length === 0 ? 'まずデータ取込でCSVを取り込んでください' : '該当する施設がありません'}</div>
            )}
          </div>
        </Card>
      )}

      {sub === 'cat' && (
        <div className="space-y-4">
        <Card className="p-5">
          <div className="font-bold text-sm text-slate-800 mb-1 inline-flex items-center gap-2">
            <span className="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-teal-50 text-teal-600"><Package size={14} /></span>
            キーワード学習ルール
          </div>
          <div className="text-xs text-slate-600 leading-relaxed mb-3">
            商品名に含まれる言葉から、まとめて分類を決めるルールです。<b className="text-slate-600">一度覚えさせれば、次の取込で入ってきた新しい商品にも自動で適用されます。</b>
            （例：「ブラケット」→ 部材、「トイレット」→ 紙製品）
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            <input value={newRuleKw} onChange={e => setNewRuleKw(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') addRule(); }}
              placeholder="商品名に含まれる言葉（例: ブラケット）"
              className="h-10 px-3 rounded-xl border border-slate-200 text-sm w-64 bg-white shadow-sm focus:border-blue-400 focus:outline-none transition" />
            <span className="text-xs text-slate-600 font-bold">→</span>
            <select value={newRuleCat} onChange={e => setNewRuleCat(e.target.value)}
              className="h-10 px-3 rounded-xl border border-slate-200 bg-white text-sm shadow-sm font-bold text-slate-600">
              {CATEGORY_NAMES.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
            <button onClick={addRule}
              className="bg-teal-600 hover:bg-teal-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-teal-200 text-sm font-bold transition">覚えさせる</button>
            {newRuleKw.trim() && (
              <span className="text-[11px] text-slate-700 font-bold tabular-nums">この言葉を含む商品: {num(ruleMatchCount(newRuleKw))}件</span>
            )}
          </div>
          {(masters.catRules || []).length > 0 && (
            <div className="mt-3.5 flex gap-2 flex-wrap">
              {masters.catRules.map(r => (
                <span key={r.kw} className="inline-flex items-center gap-1.5 bg-teal-50 border border-teal-200 text-teal-800 text-xs font-bold px-3 py-1.5 rounded-full">
                  「{r.kw}」→ {r.cat}
                  <span className="text-teal-500 font-normal tabular-nums">{num(ruleMatchCount(r.kw))}件</span>
                  <button onClick={() => delRule(r.kw)} className="text-teal-400 hover:text-rose-500 transition"><X size={13} /></button>
                </span>
              ))}
            </div>
          )}
          <div className="text-[11px] text-slate-600 mt-3 leading-relaxed">
            優先順位：<b className="text-fuchsia-600">手動</b>（下の一覧で個別に直したもの） ＞ <b className="text-teal-600">学習</b>（このルール） ＞ <b className="text-slate-700">自動</b>（商品名からの内蔵判定）。ルールは上から順に照合します。
          </div>
        </Card>
        <Card>
          <div className="px-5 py-3 border-b border-slate-100 text-xs text-slate-600 leading-relaxed">
            いま各商品にどの分類が当たっているかの一覧です。バッジは判定のもと（手動／学習／自動）。間違っていたらプルダウンで直してください。<b className="text-slate-600">直した結果は記憶され、以後の取込でも優先されます。</b>
          </div>
          <div className="px-5 py-3 border-b border-slate-100">{searchBox('商品名で検索')}</div>
          <div className="divide-y divide-slate-50 max-h-[28rem] overflow-y-auto">
            {filterQ(prodNames).slice(0, catLimit).map(prod => (
              <div key={prod} className="px-5 py-2.5 flex items-center justify-between gap-3">

                <div className="flex items-center gap-2 shrink-0">
                  <span className={"text-[10px] font-bold px-2 py-0.5 rounded-full " +
                    (catOf(prod).src === '手動' ? 'bg-fuchsia-100 text-fuchsia-700'

                    title={catOf(prod).src === '学習' ? '学習ルール「' + catOf(prod).kw + '」で判定' : ''}>
                    {catOf(prod).src}
                  </span>
                  <select value={catOf(prod).cat} onChange={e => setCat(prod, e.target.value)}
                    className="h-10 px-3 rounded-xl border border-slate-200 bg-white text-sm w-52 shadow-sm font-bold text-slate-600">
                    {CATEGORY_NAMES.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
              </div>
            ))}
            {filterQ(prodNames).length === 0 && (
              <div className="px-5 py-10 text-center text-sm text-slate-600">{prodNames.length === 0 ? 'まずデータ取込でCSVを取り込んでください' : '該当する商品がありません'}</div>
            )}
          </div>
          {filterQ(prodNames).length > catLimit && (
            <div className="px-5 py-2.5 border-t border-slate-50 flex items-center gap-3">
              <span className="text-[11px] text-slate-600">売上の大きい順に{catLimit}件を表示中（全{num(filterQ(prodNames).length)}件）</span>
              <button onClick={() => setCatLimit(c => c + 100)} className="text-[11px] text-sky-600 underline font-bold hover:text-sky-800">さらに100件表示</button>
            </div>
          )}
        </Card>
        </div>
      )}

      {sub === 'handling' && (
        <Card>
          <div className="px-5 py-3 border-b border-slate-100 text-xs text-slate-600 leading-relaxed">
            商品ごとに<b className="text-slate-600">在庫品（営業所で在庫を持つ）／受注発注（注文が来てから仕入れる）</b>を設定します。
            <b className="text-violet-700">初期値は受注発注</b>で、在庫を置く商品だけを「在庫品」にしてください。適正在庫画面からも同じ設定ができます。
          </div>
          <div className="px-5 py-3 border-b border-slate-100">{searchBox('商品名で検索')}</div>
          <div className="divide-y divide-slate-50 max-h-[28rem] overflow-y-auto">
            {filterQ(prodNames).slice(0, catLimit).map(prod => (
              <div key={prod} className="px-5 py-2.5 flex items-center justify-between gap-3">
                <div className="font-bold text-sm text-slate-700 truncate">{prod}</div>
                <div className="flex items-center gap-1.5 shrink-0">
                  {HANDLING_TYPES.map(h => (
                    <button key={h} onClick={() => setHandling(prod, h)}
                      className={"text-[11px] font-bold px-2.5 py-1.5 rounded-full transition " +
                        (handlingOf(prod, masters.itemHandling) === h
                          ? (h === 'stock' ? 'bg-sky-500 text-white shadow-sm' : 'bg-violet-500 text-white shadow-sm')
                          : 'bg-white border border-slate-200 text-slate-700 hover:border-sky-300')}>
                      {HANDLING_LABELS[h]}
                    </button>
                  ))}
                </div>
              </div>
            ))}
            {filterQ(prodNames).length === 0 && (
              <div className="px-5 py-10 text-center text-sm text-slate-600">{prodNames.length === 0 ? 'まずデータ取込でCSVを取り込んでください' : '該当する商品がありません'}</div>
            )}
          </div>
          {filterQ(prodNames).length > catLimit && (
            <div className="px-5 py-2.5 border-t border-slate-50 flex items-center gap-3">
              <span className="text-[11px] text-slate-600">売上の大きい順に{catLimit}件を表示中（全{num(filterQ(prodNames).length)}件）</span>
              <button onClick={() => setCatLimit(c => c + 100)} className="text-[11px] text-sky-600 underline font-bold hover:text-sky-800">さらに100件表示</button>
            </div>
          )}
        </Card>
      )}

      {sub === 'person' && (
        <div className="space-y-4">
          <div>{searchBox('お客様名で検索')}</div>
          <div className="grid md:grid-cols-2 gap-4">
            <Card>
              <div className="px-5 py-3.5 border-b border-slate-100 font-bold text-sm text-slate-800">🏢 施設（集計対象）<span className="text-slate-600 font-normal ml-1">{num(facNamesPerson.length)}件</span></div>
              <ul className="divide-y divide-slate-50 max-h-80 overflow-y-auto">
                {filterQ(facNamesPerson).map(n => (
                  <li key={n} className="px-5 py-2.5 text-sm text-slate-600 flex items-center justify-between gap-2">
                    <span className="truncate">
                      {n}
                      {customers[n].uncertain && <span className="ml-2 bg-amber-400 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">要確認</span>}
                    </span>
                    <button onClick={() => updateCustomer(n, { type: 'person', uncertain: false })}
                      className="text-[11px] text-slate-400 hover:text-rose-500 font-bold transition shrink-0">個人へ→</button>
                  </li>
                ))}
                {filterQ(facNamesPerson).length === 0 && <li className="px-5 py-8 text-center text-xs text-slate-600">該当なし</li>}
              </ul>
            </Card>
            <Card>
              <div className="px-5 py-3.5 border-b border-slate-100 font-bold text-sm text-slate-700">👤 個人（集計対象外）<span className="text-slate-600 font-normal ml-1">{num(perNames.length)}件</span></div>
              <ul className="divide-y divide-slate-50 max-h-80 overflow-y-auto">
                {filterQ(perNames).map(n => (
                  <li key={n} className="px-5 py-2.5 text-sm text-slate-600 flex items-center justify-between gap-2">
                    <span className="truncate">
                      {n}
                      {customers[n].uncertain && <span className="ml-2 bg-amber-400 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">要確認</span>}
                    </span>
                    <button onClick={() => updateCustomer(n, { type: 'facility', uncertain: false })}
