// 12ヶ月分の値を簡易棒グラフで表示（行内スパークライン。0はグレーの点で表示）
function Sparkline({ values, width, height }) {
  const w = width || 128, h = height || 32;
  const max = Math.max(1, ...values.map(v => Math.abs(v)));
  const barW = w / values.length;
  return (
    <svg width={w} height={h} viewBox={'0 0 ' + w + ' ' + h} className="shrink-0">
      {values.map((v, i) => {
        const barH = Math.max(1.5, Math.round(Math.abs(v) / max * (h - 4)));
        const x = i * barW + barW * 0.18;
        const bw = Math.max(1.5, barW * 0.64);
        const y = h - barH;
        const isLast = i === values.length - 1;
        return <rect key={i} x={x} y={y} width={bw} height={barH} rx={1}
          fill={v === 0 ? '#e2e8f0' : (isLast ? '#0284c7' : '#93c5fd')} />;
      })}
    </svg>
  );
}

const FAC_TREND_SORTS = [
  ['growth', '伸び率順（年度平均比較）'],
  ['sales', '直近月売上順'],
  ['avg', '今年度平均順'],
  ['name', '施設名順'],
];

function FacilityTrendView({ data, jumpToFacility, showToast }) {
  const [search, setSearch] = useState('');
  const [repFilter, setRepFilter] = useState(null);
  const [sortKey, setSortKey] = useState('growth');
  const [minBase, setMinBase] = useState(true); // 少額施設のノイズを除くか

  const fyStart = data.baseIdx == null ? null : fiscalStartIdx(data.baseIdx);
  const monthsElapsed = fyStart == null ? 0 : (data.baseIdx - fyStart + 1);
  const fyLabel = data.fyLabel || '';
  const fyPrevLabel = fyLabel ? (parseInt(fyLabel, 10) - 1) + '年度' : '';

  // 施設ごとに「今年度平均・前年度同期平均・増減率・12ヶ月推移」を算出
  const trend = useMemo(() => {
    if (fyStart == null) return [];
    const periodAvg = (f, fromIdx, toIdx) => {
      if (monthsElapsed <= 0) return 0;
      let sum = 0;
      for (let i = fromIdx; i <= toIdx; i++) { const m = f.byMonth.get(i); if (m) sum += m.sales; }
      return sum / monthsElapsed;
    };
    return data.facilities.map(f => {
      const fyAvg = periodAvg(f, fyStart, data.baseIdx);
      const fyPrevAvg = periodAvg(f, fyStart - 12, data.baseIdx - 12);
      const growth = fyPrevAvg !== 0 ? Math.round((fyAvg - fyPrevAvg) / Math.abs(fyPrevAvg) * 100) : (fyAvg > 0 ? null : 0);
      return { f, fyAvg, fyPrevAvg, growth };
    });
  }, [data, fyStart, monthsElapsed]);

  const reps = useMemo(() => data.reps.map(r => r.rep).sort((a, b) => a.localeCompare(b, 'ja')), [data]);

  const filtered = useMemo(() => {
    let list = trend;
    if (repFilter !== null) list = list.filter(t => t.f.repName === repFilter);
    if (search.trim()) list = list.filter(t => t.f.name.includes(search.trim()));
    if (minBase) list = list.filter(t => t.fyPrevAvg >= DECLINE_MIN_BASE / 3 || t.fyAvg >= DECLINE_MIN_BASE / 3);
    const sorters = {
      growth: (a, b) => (b.growth ?? -999) - (a.growth ?? -999),
      sales: (a, b) => b.f.monthly[11] - a.f.monthly[11],
      avg: (a, b) => b.fyAvg - a.fyAvg,
      name: (a, b) => a.f.name.localeCompare(b.f.name, 'ja'),
    };
    return list.slice().sort(sorters[sortKey]);
  }, [trend, repFilter, search, minBase, sortKey]);

  // 伸びている施設 / 減っている施設 TOP5（ノイズ除去のため一定額以上の施設のみ対象）
  const movers = useMemo(() => {
    const base = trend.filter(t => t.growth !== null && Math.max(t.fyAvg, t.fyPrevAvg) >= DECLINE_MIN_BASE / 3);
    const up = base.filter(t => t.growth > 0).sort((a, b) => b.growth - a.growth).slice(0, 5);
    const down = base.filter(t => t.growth < 0).sort((a, b) => a.growth - b.growth).slice(0, 5);
    return { up, down };
  }, [trend]);

  const handleCsv = () => {
    if (fyStart == null) { showToast('データがありません', 'error'); return; }
    const head = ['施設名', '担当', ...data.win.map(idxLabel), fyLabel + '平均', fyPrevLabel + '平均', '増減率%'];
    const lines = filtered.map(t => ([
      t.f.name, t.f.repName, ...t.f.monthly.map(v => Math.round(v)),
      Math.round(t.fyAvg), Math.round(t.fyPrevAvg), t.growth === null ? '' : t.growth,
    ]));
    downloadText('施設別売上推移_' + todayCompact() + '.csv', buildCsv([head, ...lines]), 'text/csv');
    showToast('施設別売上推移のCSVを出力しました（' + num(filtered.length) + '施設）');
  };

  const MoverCard = ({ title, tone, list, emptyText }) => (
    <Card className="p-4 flex-1 min-w-[260px]">
      <div className={"text-xs font-bold mb-2.5 " + (tone === 'up' ? 'text-emerald-700' : 'text-rose-600')}>{title}</div>
      <div className="space-y-2">
        {list.map(t => (
          <button key={t.f.name} onClick={() => jumpToFacility(t.f.name)}
            className="w-full flex items-center justify-between gap-2 text-left hover:bg-slate-50 rounded-lg px-2 py-1.5 -mx-2 transition">
            <span className="text-xs font-bold text-slate-700 truncate">{t.f.name}</span>
            <DeltaPill v={t.growth} />
          </button>
        ))}
        {list.length === 0 && <div className="text-[11px] text-slate-600 py-2">{emptyText}</div>}
      </div>
    </Card>
  );

  if (data.empty) {
    return (
      <Card className="p-10 text-center text-sm text-slate-600">データを取り込むと、施設別の月次推移が表示されます。</Card>
    );
  }

  return (
    <div className="space-y-5">
      <Card className="p-5">
        <div className="flex items-center gap-3 flex-wrap">
          <div className="relative">
            <Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-600" />
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="施設名で絞り込み"
              className="h-10 pl-10 pr-3 rounded-xl border border-slate-200 text-sm w-56 bg-white shadow-sm focus:border-sky-400 focus:outline-none font-bold text-slate-700 placeholder:font-normal" />
          </div>
          <select value={repFilter ?? ''} onChange={e => setRepFilter(e.target.value || null)}
            className="h-10 px-3 rounded-xl border border-slate-200 bg-white text-sm shadow-sm font-bold text-slate-600">
            <option value="">担当: 全員</option>
            {reps.map(r => <option key={r} value={r}>担当: {r}</option>)}
          </select>
          <select value={sortKey} onChange={e => setSortKey(e.target.value)}
            className="h-10 px-3 rounded-xl border border-slate-200 bg-white text-sm shadow-sm font-bold text-slate-600">
            {FAC_TREND_SORTS.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
          </select>
          <label className="flex items-center gap-1.5 text-xs font-bold text-slate-600 cursor-pointer select-none">
            <input type="checkbox" checked={minBase} onChange={e => setMinBase(e.target.checked)} className="accent-sky-500" />
            少額施設を除く
          </label>
          <div className="ml-auto">
            <button onClick={handleCsv}
              className="bg-teal-600 hover:bg-teal-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-teal-200 text-sm font-bold transition inline-flex items-center gap-1.5">
              <FileSpreadsheet size={15} /> CSV出力
            </button>
          </div>
        </div>
        <div className="text-[11px] text-slate-600 mt-3 leading-relaxed">
          {fyLabel}平均・{fyPrevLabel}平均は、いずれも{data.baseLabel}までの経過月数（{monthsElapsed}ヶ月）で割った同期間比較です。
          直近12ヶ月推移は{idxLabel(data.win[0])} 〜 {idxLabel(data.win[11])}。
        </div>
      </Card>

      <div className="flex gap-4 flex-wrap">
        <MoverCard title={'伸びている施設 TOP5（' + fyPrevLabel + '同期比）'} tone="up" list={movers.up} emptyText="対象となる施設がありません" />
        <MoverCard title={'減っている施設 TOP5（' + fyPrevLabel + '同期比）'} tone="down" list={movers.down} emptyText="対象となる施設がありません" />
      </div>

      <Card>
        <div className="px-5 py-3.5 border-b border-slate-100 flex items-center gap-2.5">
          <span className="inline-flex items-center justify-center w-8 h-8 rounded-xl bg-sky-50 text-sky-500"><TrendingUp size={16} /></span>
          <div className="flex-1">
            <div className="font-bold text-sm text-slate-800">施設別売上推移表</div>
            <div className="text-[11px] text-slate-600">{num(filtered.length)}施設・行をクリックすると施設の詳細分析へ</div>
          </div>
        </div>
        <div className="overflow-x-auto">
        <table className="w-full text-sm min-w-[720px]">
          <thead>
            <tr className="text-left text-[11px] text-slate-600 border-b border-slate-100">
              <th className="px-5 py-2.5 font-bold">施設名</th>
              <th className="px-3 py-2.5 font-bold">担当</th>
              <th className="px-3 py-2.5 font-bold">直近12ヶ月推移</th>
              <th className="px-3 py-2.5 font-bold text-right">{fyLabel}平均/月</th>
              <th className="px-3 py-2.5 font-bold text-right">{fyPrevLabel}平均/月</th>
              <th className="px-3 py-2.5 font-bold text-right">増減率</th>
              <th className="px-3 py-2.5 font-bold text-right">今月</th>
              <th className="px-5 py-2.5 font-bold text-right">前月比</th>
              <th className="pr-4"></th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-50">
            {filtered.map(t => (
              <tr key={t.f.name} onClick={() => jumpToFacility(t.f.name)}
                className="hover:bg-slate-50 cursor-pointer transition group">
                <td className="px-5 py-3 font-bold text-slate-700">{t.f.name}</td>

                <td className="px-3 py-3 text-right tabular-nums font-bold text-slate-700">{yen(t.f.monthly[11])}</td>

/* ============================================================
   画面5: 適正在庫（必要在庫 = 月平均出荷 × 在庫回数。余剰在庫を持たない設計）
============================================================ */
// 在庫回数のプリセット（月の平均販売個数に掛けて必要在庫を算出）。ユーザーが選びやすいよう分数表記で提示
const STOCK_MONTH_PRESETS = [
  [0.25, '1/4ヶ月'], [0.5, '2/4ヶ月'], [0.75, '3/4ヶ月'],
  [1, '1ヶ月'], [1.5, '1.5ヶ月'], [2, '2ヶ月'], [3, '3ヶ月'],
];
// 商品×施設の個別上書き（未設定なら受注発注として計上＝手動で在庫品に指定した施設分だけを集計）
const facHandlingOf = (product, facility, ifh) =>
  (ifh[product] && ifh[product][facility]) || 'order';

function StockView({ data, masters, setMasters, showToast, openPrint }) {
  const [period, setPeriod] = useState(6);
  // 初期タブ: 在庫品がまだ1件も選ばれていなければ「受注発注」を開いて分類作業から始めてもらう
  const [handlingTab, setHandlingTab] = useState(() =>
    (Object.values(masters.itemHandling).some(v => v === 'stock') ? 'stock' : 'order'));
  const [catFilter, setCatFilter] = useState('all');
  const [search, setSearch] = useState('');
  const [openProd, setOpenProd] = useState(null);
  const [editQty, setEditQty] = useState(null); // 必要在庫を編集中の商品名
  const [editMonth, setEditMonth] = useState(null); // 在庫回数を個別編集中の商品名
  const [qtyView, setQtyView] = useState('shipment'); // 一覧表示: 'shipment'=通常の出荷数 / 'stock'=在庫数（在庫回数を掛けた数）
  const [qtyViewMonths, setQtyViewMonths] = useState(0.5); // 在庫数タブでの倍率（1/2ヶ月・1/4ヶ月など）
  const months = Math.max(0.25, +masters.settings.stockMonths || 1);
  // プリセットに無い値（旧バージョンで設定された値など）が保存されていれば選択肢に足しておく
  const monthPresetOptions = useMemo(() => {
    if (STOCK_MONTH_PRESETS.some(([v]) => v === months)) return STOCK_MONTH_PRESETS;
    return [...STOCK_MONTH_PRESETS, [months, months + 'ヶ月']].sort((a, b) => a[0] - b[0]);
  }, [months]);
  const setMonths = (v) => setMasters(prev => ({ ...prev, settings: { ...prev.settings, stockMonths: v } }));
  const setHandling = (name, h) => setMasters(prev => {
    const ih = { ...prev.itemHandling };
    if (h === HANDLING_DEFAULT) delete ih[name]; else ih[name] = h;
    return { ...prev, itemHandling: ih };
  });
  const setCat = (name, v) => setMasters(prev => {
    const co = { ...prev.catOverrides };
    if (v === resolveCategory(name, {}, prev.catRules).cat) delete co[name]; else co[name] = v;
    return { ...prev, catOverrides: co };
  });
  // 商品×施設の個別上書きを更新（在庫品に戻すときはキー削除）
  const setFacHandling = (product, facility, h) => setMasters(prev => {
    const ifh = { ...prev.itemFacilityHandling };
    const cur = { ...(ifh[product] || {}) };
    if (h === 'order') delete cur[facility]; else cur[facility] = h;
    if (Object.keys(cur).length) ifh[product] = cur; else delete ifh[product];
    return { ...prev, itemFacilityHandling: ifh };
  });
  const setStockQty = (name, v) => setMasters(prev => ({ ...prev, stockQtyOverrides: { ...prev.stockQtyOverrides, [name]: v } }));
  const clearStockQty = (name) => setMasters(prev => {
    const so = { ...prev.stockQtyOverrides };
    delete so[name];
    return { ...prev, stockQtyOverrides: so };
  });
  const setStockMonth = (name, v) => setMasters(prev => ({ ...prev, stockMonthOverrides: { ...prev.stockMonthOverrides, [name]: v } }));
  const clearStockMonth = (name) => setMasters(prev => {
    const sm = { ...prev.stockMonthOverrides };
    delete sm[name];
    return { ...prev, stockMonthOverrides: sm };
  });
  const monthLabel = (v) => { const f = STOCK_MONTH_PRESETS.find(([x]) => x === v); return f ? f[1] : (v + 'ヶ月'); };

  // 非直送施設への出荷実績から商品ごとの在庫指標を計算（施設ごとの扱いが「在庫品」のものだけを合算）
  const stockAll = useMemo(() => {
    const start = 12 - period;
    const periodStartIdx = data.win[start];
    const ifh = masters.itemFacilityHandling;
    const list = [];
    for (const p of data.products) {
      const monthTotals = zeros12();
      const orderSet = new Set();
      let periodQty = 0;
      let anyQty = 0;   // 扱いに関わらない非直送施設の合計（一覧への表示可否の判定用）
      const breakdown = [];
      for (const pair of p.pairs) {
        if (pair.direct) continue;   // 施設全体が直送フラグの場合は従来通り対象外（表示もしない）
        const resolved = facHandlingOf(p.name, pair.fac, ifh);
        const included = resolved === 'stock';
        const slice = pair.qty12.slice(start);
        let t = 0; for (let i = 0; i < slice.length; i++) t += slice[i];
        breakdown.push({ fac: pair.fac, avg: t / period, handling: resolved, included });
        anyQty += t;
        if (included) {
          for (let i = 0; i < 12; i++) monthTotals[i] += pair.qty12[i];
          periodQty += t;
          for (let i = 0; i < pair.orders.length; i++) { if (pair.orders[i].idx >= periodStartIdx) orderSet.add(pair.orders[i].no); }
        }
      }
      if (anyQty <= 0) continue;
      breakdown.sort((a, b) => b.avg - a.avg);
      const avg = periodQty / period;
      const mx = Math.max(...monthTotals.slice(start));
      const cost = p.cost > 0 ? p.cost : 0;
      const avgPerOrder = orderSet.size > 0 ? periodQty / orderSet.size : null;
      list.push({
        name: p.name, cat: p.cat, catSrc: p.catSrc, unit: p.unit || '', supplier: p.supplier || '（仕入先未設定）',
        avg, max: mx, cost, breakdown, tot: anyQty, avgPerOrder, orderCount: orderSet.size,
        handling: handlingOf(p.name, masters.itemHandling),
        classified: masters.itemHandling[p.name] !== undefined,
      });
    }
    list.sort((a, b) => b.tot - a.tot);
    return list;
  }, [data, masters, period]);

  const counts = useMemo(() => {
    const c = { stock: 0, order: 0, done: 0 };
    stockAll.forEach(p => { c[p.handling]++; if (p.classified) c.done++; });
    return c;
  }, [stockAll]);

  const filtered = useMemo(() => {
    let list = handlingTab === 'all' ? stockAll : stockAll.filter(p => p.handling === handlingTab);
    if (catFilter !== 'all') list = list.filter(p => p.cat === catFilter);
    const q = normalizeSearchText(search.trim());
    if (q) list = list.filter(p => normalizeSearchText(p.name).includes(q) || normalizeSearchText(p.supplier).includes(q));
    return list;
  }, [stockAll, handlingTab, catFilter, search]);
  const visible = filtered.slice(0, 100);

  const monthsFor = (p) => {
    const ov = masters.stockMonthOverrides[p.name];
    return ov !== undefined ? ov : months;
  };
  const hasMonthOverride = (p) => masters.stockMonthOverrides[p.name] !== undefined;
  const rawCalc = (p) => Math.max(0, Math.ceil(p.avg * monthsFor(p)));
  const calc = (p) => {
    const ov = masters.stockQtyOverrides[p.name];
    return ov !== undefined ? ov : rawCalc(p);
  };
  const hasOverride = (p) => masters.stockQtyOverrides[p.name] !== undefined;

  // 絞り込み中の商品をまとめて分類（例:「部材」を全部 受注発注 にする）
  const bulkHandling = (h) => {
    if (filtered.length === 0) return;
    setMasters(prev => {
      const ih = { ...prev.itemHandling };
      filtered.forEach(p => { if (h === HANDLING_DEFAULT) delete ih[p.name]; else ih[p.name] = h; });
      return { ...prev, itemHandling: ih };
    });
    showToast(num(filtered.length) + '件を「' + HANDLING_LABELS[h] + '」にしました');
  };

  const handleCsv = () => {
    const head = ['商品名', '分類', '扱い', '仕入先', '単位', '月平均出荷', '最大月出荷', '必要在庫', '平均発注数', '仕入単価'];
    const lines = filtered.map(p => [
      p.name, p.cat, HANDLING_LABELS[p.handling], p.supplier, p.unit,
      fmtQty(p.avg), fmtQty(p.max), calc(p), p.avgPerOrder != null ? fmtQty(p.avgPerOrder) : '', p.cost,
    ]);
    downloadText('適正在庫_' + todayCompact() + '.csv', buildCsv([head, ...lines]), 'text/csv');
    showToast('CSVを出力しました（Excelでそのまま開けます）');
  };

  return (
    <div className="space-y-4">
      <Card className="px-5 py-4 flex items-center gap-5 flex-wrap">
        <span className="text-sm font-bold text-slate-600">計算条件</span>
        <label className="inline-flex items-center gap-2 text-sm text-slate-700 font-bold">
          在庫回数（月平均販売個数の何か月分）
          <select value={months}
            onChange={e => setMonths(parseFloat(e.target.value))}
            className="h-10 px-2.5 rounded-xl border border-amber-300 bg-amber-50 tabular-nums font-bold text-amber-800 focus:outline-none focus:border-amber-400">
            {monthPresetOptions.map(([v, label]) => <option key={v} value={v}>{label}</option>)}
          </select>
        </label>
        <label className="inline-flex items-center gap-2 text-sm text-slate-700 font-bold">
          対象期間
          <select value={period} onChange={e => setPeriod(+e.target.value)}
            className="h-10 px-3 rounded-xl border border-slate-200 bg-white text-sm shadow-sm font-bold text-slate-700">
            <option value={6}>過去6ヶ月</option>
            <option value={12}>過去12ヶ月</option>
          </select>
        </label>
        <div className="ml-auto">
          <button onClick={handleCsv}
            className="bg-teal-600 hover:bg-teal-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-teal-200 text-sm font-bold transition inline-flex items-center gap-1.5">
            <FileSpreadsheet size={15} /> CSV出力
          </button>
        </div>
      </Card>

      {/* 分類作業のすすめ（在庫品がまだ選ばれていないときは強めに案内） */}
      <div className={"rounded-2xl px-5 py-4 flex gap-3 border " +
        (counts.stock === 0 ? 'bg-amber-50 border-amber-200' : 'bg-sky-50/70 border-sky-100')}>
        {counts.stock === 0
          ? <AlertTriangle size={18} className="text-amber-500 shrink-0 mt-0.5" />
          : <CheckCircle2 size={18} className="text-sky-500 shrink-0 mt-0.5" />}
        <div className="flex-1 text-xs leading-relaxed text-slate-600">
          <b className={counts.stock === 0 ? 'text-amber-800' : 'text-slate-700'}>
            {counts.stock === 0
              ? 'まず「営業所で在庫を持つ商品」を選んでください'
              : '在庫品 ' + num(counts.stock) + '件を登録済みです'}
          </b>
          <div className="mt-1">
            すべての商品は最初<b className="text-violet-700">受注発注（在庫を持たない）</b>から始まります。
            下の一覧で在庫を置く商品だけを<b className="text-sky-700">在庫品</b>に変えてください。必要在庫の計算対象は在庫品だけです。
          </div>
          <div className="mt-2 flex items-center gap-2 flex-wrap">
            <span className="text-[11px] text-slate-600 font-bold tabular-nums">分類済み {num(counts.done)} / {num(stockAll.length)}件</span>
            <div className="w-40 bg-white rounded-full h-1.5 overflow-hidden border border-slate-200">
              <div className="bg-sky-400 h-full rounded-full" style={{ width: (stockAll.length ? Math.round(counts.done / stockAll.length * 100) : 0) + '%' }} />
            </div>
            <span className="text-[11px] text-slate-700">在庫品 {num(counts.stock)} ／ 受注発注 {num(counts.order)}</span>
          </div>
        </div>
      </div>

      <div className="flex items-center gap-2.5 flex-wrap">
        <Segmented value={handlingTab} onChange={setHandlingTab}
          options={[['stock', '在庫品 ' + counts.stock], ['order', '受注発注 ' + counts.order], ['all', 'すべて']]} />
        <Segmented value={qtyView} onChange={setQtyView}
          options={[['shipment', '出荷数'], ['stock', '在庫数']]} />
        {qtyView === 'stock' && (
          <select value={qtyViewMonths} onChange={e => setQtyViewMonths(parseFloat(e.target.value))}
            className="h-10 px-3 rounded-xl border border-amber-300 bg-amber-50 text-sm shadow-sm font-bold text-amber-800">
            {STOCK_MONTH_PRESETS.map(([v, label]) => <option key={v} value={v}>{label}分</option>)}
          </select>
        )}
        <select value={catFilter} onChange={e => setCatFilter(e.target.value)}
          className="h-10 px-3 rounded-xl border border-slate-200 bg-white text-sm shadow-sm font-bold text-slate-700">
          <option value="all">すべての分類</option>
          {CATEGORY_NAMES.map(c => <option key={c} value={c}>{c}</option>)}
        </select>
        <div className="relative">
          <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-700" />
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="商品名・仕入先で検索"
            className="h-10 pl-9 pr-3 rounded-xl border border-slate-200 text-sm w-52 bg-white shadow-sm focus:border-blue-400 focus:outline-none transition" />
        </div>
      </div>

      {(catFilter !== 'all' || search.trim()) && filtered.length > 0 && (
        <div className="flex items-center gap-2 bg-white border border-slate-200/70 rounded-2xl px-5 py-3 flex-wrap shadow-sm">
          <span className="text-xs font-bold text-slate-600 tabular-nums">絞り込み中の {num(filtered.length)}件をまとめて:</span>
          {HANDLING_TYPES.map(h => (
            <button key={h} onClick={() => bulkHandling(h)}
              className={"text-xs font-bold px-3 py-1.5 rounded-full transition text-white " +
                (h === 'stock' ? 'bg-sky-600 hover:bg-sky-700' : 'bg-violet-600 hover:bg-violet-700')}>
              {HANDLING_LABELS[h]}にする
            </button>
          ))}
        </div>
      )}

      <Card className="overflow-x-auto">
        <table className="w-full text-sm min-w-[860px]">
          <thead>
            <tr className="text-[11px] uppercase tracking-wide text-slate-700 border-b border-slate-100">
              <th className="text-left font-bold px-5 py-3">商品名</th>
              <th className="text-left font-bold px-2 py-3 w-[190px]">扱い</th>
              <th className="text-right font-bold px-2 py-3 pr-4">{qtyView === 'stock' ? monthLabel(qtyViewMonths) + '分' : '月平均出荷'}</th>
              <th className="text-right font-bold px-2 py-3 pr-4">{qtyView === 'stock' ? '最大月換算' : '最大月'}</th>
              <th className="text-right font-bold px-2 py-3 pr-4">必要在庫</th>
              <th className="text-right font-bold px-2 py-3 pr-4">仕入単価</th>
              <th className="w-10"></th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-50">
            {visible.map(p => {
              const isOpen = openProd === p.name;
              const editing = editQty === p.name;
              return (
              <React.Fragment key={p.name}>
                <tr onClick={() => { setOpenProd(isOpen ? null : p.name); setEditQty(null); }}
                  className={"cursor-pointer transition " + (isOpen ? 'bg-sky-50/80' : 'hover:bg-sky-50/50 hover:ring-1 hover:ring-inset hover:ring-sky-200')}>
                  <td className="px-5 py-3">
                    <div className="font-bold text-slate-800">{p.name}</div>
                    <div className="text-[10px] text-slate-700 flex items-center gap-1.5 flex-wrap">
                      <span className="bg-slate-100 text-slate-700 font-bold px-1.5 py-0.5 rounded-md">{p.cat}</span>
                      <span className={"font-bold " + (p.catSrc === '手動' ? 'text-fuchsia-500' : p.catSrc === '学習' ? 'text-teal-500' : 'text-slate-600')}>{p.catSrc}</span>
                      {p.supplier}
                      <span className="text-sky-600 font-bold inline-flex items-center gap-0.5">
                        {isOpen ? <>閉じる <ChevronUp size={11} /></> : <>タップで詳細 <ChevronDown size={11} /></>}
                      </span>
                    </div>
                  </td>
                  <td className="px-2 py-3" onClick={e => e.stopPropagation()}>
                    <div className="inline-flex bg-slate-100 rounded-lg p-0.5 gap-0.5">
                      {HANDLING_TYPES.map(h => (
                        <button key={h} onClick={() => setHandling(p.name, h)}
                          className={"text-[10px] font-bold px-2 py-1 rounded-md transition " +
                            (p.handling === h
                              ? (h === 'stock' ? 'bg-sky-500 text-white shadow-sm' : 'bg-violet-500 text-white shadow-sm')
                              : 'text-slate-600 hover:text-slate-800')}>
                          {HANDLING_LABELS[h]}
                        </button>
                      ))}
                    </div>
                  </td>
                  <td className="px-2 py-3 pr-4 text-right tabular-nums text-slate-700">{fmtQty(qtyView === 'stock' ? p.avg * qtyViewMonths : p.avg)}<span className="text-[10px] text-slate-700 ml-0.5">{p.unit}</span></td>
                  <td className="px-2 py-3 pr-4 text-right tabular-nums text-slate-700">{fmtQty(qtyView === 'stock' ? p.max * qtyViewMonths : p.max)}<span className="text-[10px] text-slate-700 ml-0.5">{p.unit}</span></td>
                  <td className="px-2 py-3 pr-4 text-right" onClick={e => e.stopPropagation()}>
                    {editing ? (
                      <div className="inline-flex items-center gap-1">
                        <input type="number" min="0" autoFocus defaultValue={calc(p)}
                          onBlur={e => { const v = Math.max(0, parseInt(e.target.value || '0', 10)); setStockQty(p.name, v); setEditQty(null); }}
                          onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); if (e.key === 'Escape') setEditQty(null); }}
                          className="h-8 w-20 px-2 rounded-lg border border-sky-300 bg-sky-50 text-right tabular-nums text-sm font-bold text-sky-800 focus:outline-none" />
                        <span className="text-[10px] text-slate-700">{p.unit}</span>
                      </div>
                    ) : (
                      <div className="inline-flex items-center gap-1">
                        {hasOverride(p) && (
                          <button onClick={() => clearStockQty(p.name)} title="自動計算に戻す"
                            className="text-slate-600 hover:text-rose-500 transition"><RotateCcw size={12} /></button>
                        )}
                        <button onClick={() => setEditQty(p.name)}
                          className={"font-extrabold tabular-nums px-2.5 py-1 rounded-lg inline-flex items-center gap-1 transition " +
                            (hasOverride(p) ? 'bg-fuchsia-100 text-fuchsia-700 hover:bg-fuchsia-200'
                              : hasMonthOverride(p) ? 'bg-amber-100 text-amber-700 hover:bg-amber-200'
                              : 'bg-sky-100 text-sky-700 hover:bg-sky-200')}>
                          {calc(p)}<span className="text-[10px] font-bold">{p.unit}</span> <Pencil size={10} className="opacity-60" />
                        </button>
                      </div>
                    )}
                  </td>
                  <td className="px-2 py-3 pr-4 text-right tabular-nums text-slate-700">{p.cost > 0 ? yen(p.cost) : '—'}</td>
                  <td className="pr-4 text-slate-600">{isOpen ? <ChevronDown size={16} /> : <ChevronRight size={16} />}</td>
                </tr>
                {isOpen && (
                  <tr>
                    <td colSpan={7} className="bg-slate-50/70 px-6 py-3.5">
                      <div className="flex items-center gap-2 mb-3 flex-wrap" onClick={e => e.stopPropagation()}>
                        <span className="text-[11px] font-bold text-slate-900">分類:</span>
                        <select value={p.cat} onChange={e => setCat(p.name, e.target.value)}
                          className="h-9 px-2.5 rounded-lg border border-slate-200 bg-white text-xs shadow-sm font-bold text-slate-900">
                          {CATEGORY_NAMES.map(c => <option key={c} value={c}>{c}</option>)}
                        </select>
                        <span className={"text-[10px] font-bold px-2 py-1 rounded-full " +
                          (p.catSrc === '手動' ? 'bg-fuchsia-100 text-fuchsia-700' : p.catSrc === '学習' ? 'bg-teal-100 text-teal-700' : 'bg-slate-100 text-slate-800')}>
                          {p.catSrc === '手動' ? '手動で設定' : p.catSrc === '学習' ? '学習ルールで判定' : '商品名から自動判定'}
                        </span>
                        <span className="text-[10px] text-slate-900 font-semibold">同じ言葉を含む商品をまとめて分類したいときは 設定→商品分類 のキーワード学習ルールへ</span>
                      </div>

                      <div className="text-[11px] font-bold text-slate-900 uppercase tracking-wide mb-2">施設消費一覧（施設ごとに扱いを個別設定できます）</div>
                      <div className="flex gap-2 flex-wrap">
                        {p.breakdown.map((b, i) => (
                          <div key={i} className={"flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 border shadow-sm " +
                            (b.included ? 'bg-white border-slate-200/70' : 'bg-slate-100 border-slate-300')}>
                            <span className="text-sm font-bold text-slate-900">
                              {b.fac} <span className="font-extrabold tabular-nums text-slate-900">{fmtQty(b.avg)}{p.unit}</span>
                            </span>
                            <div className="inline-flex bg-slate-100 rounded-md p-0.5 gap-0.5">
                              {HANDLING_TYPES.map(h => (
                                <button key={h} onClick={() => setFacHandling(p.name, b.fac, h)}
                                  className={"text-[11px] font-bold px-1.5 py-0.5 rounded transition " +
                                    (b.handling === h
                                      ? (h === 'stock' ? 'bg-sky-500 text-white' : 'bg-violet-500 text-white')
                                      : 'text-slate-900 hover:text-slate-900')}>
                                  {HANDLING_LABELS[h].slice(0, 2)}
                                </button>
                              ))}
                            </div>
                          </div>
                        ))}
                        {p.breakdown.length === 0 && <span className="text-sm font-semibold text-slate-900">非直送施設への出荷実績がありません</span>}
                      </div>
                      <div className="text-[11px] text-slate-900 font-medium mt-1.5">
                        すべての施設は最初「{HANDLING_LABELS.order}」＝この商品の必要在庫の計算から除外された状態です。実際に在庫を置いている施設だけ、ボタンで「{HANDLING_LABELS.stock}」に変えてください（変えた施設だけ白背景で表示されます）。
                      </div>

                      <div className="text-[11px] font-semibold text-slate-900 mt-3 tabular-nums flex items-center gap-1.5 flex-wrap" onClick={e => e.stopPropagation()}>
                        <span>計算: 月平均 {fmtQty(p.avg)}{p.unit} ×</span>
                        {editMonth === p.name ? (
                          <select autoFocus defaultValue={0.25}
                            onChange={e => { setStockMonth(p.name, parseFloat(e.target.value)); setEditMonth(null); }}
                            onBlur={() => setEditMonth(null)}
                            className="h-7 px-1.5 rounded-md border border-amber-300 bg-amber-50 text-xs font-bold text-amber-800 focus:outline-none">
                            {monthPresetOptions.map(([v, label]) => <option key={v} value={v}>{label}</option>)}
                          </select>
                        ) : (
                          <button onClick={() => setEditMonth(p.name)}
                            className={"text-xs font-bold px-1.5 py-0.5 rounded-md inline-flex items-center gap-0.5 transition " +
                              (hasMonthOverride(p) ? 'bg-amber-100 text-amber-700 hover:bg-amber-200' : 'bg-slate-100 text-slate-900 hover:bg-slate-200')}>
                            {hasMonthOverride(p) ? monthLabel(monthsFor(p)) : '共通（' + monthLabel(months) + '）'} <Pencil size={9} className="opacity-60" />
                          </button>
                        )}
                        {hasMonthOverride(p) && (
                          <button onClick={() => clearStockMonth(p.name)} title="共通設定に戻す" className="text-slate-700 hover:text-rose-500 transition"><RotateCcw size={11} /></button>
                        )}
                        <span>回分 = <b className="text-sky-700">{rawCalc(p)}{p.unit}</b></span>
                        {hasOverride(p) && <span className="text-fuchsia-600 font-bold">（手動入力中: {calc(p)}{p.unit}）</span>}
                        <span>（最大月 {fmtQty(p.max)}{p.unit} は参考値）</span>
                      </div>
                      {p.avgPerOrder != null && (
                        <div className="text-[11px] font-semibold text-slate-900 mt-1 tabular-nums">
                          一回あたりの平均発注数: <b className="text-slate-900">{fmtQty(p.avgPerOrder)}{p.unit}</b>（対象期間中 {num(p.orderCount)}回の発注）
                        </div>
                      )}
                      <div className="text-[10px] text-slate-900 font-medium mt-2">受注発注は在庫を持たない商品です（商品全体の扱いは行の「扱い」ボタンから）</div>
                    </td>
                  </tr>
                )}
              </React.Fragment>
              );
            })}
            {visible.length === 0 && (
              <tr><td colSpan={7} className="px-5 py-10 text-center text-sm text-slate-700">該当する商品がありません（施設直送分は在庫集計の対象外です）</td></tr>
            )}
          </tbody>
        </table>
        {filtered.length > visible.length && (
          <div className="px-5 py-2.5 text-[11px] text-slate-700 border-t border-slate-50">出荷量の多い順に{visible.length}件を表示中（全{num(filtered.length)}件）— 検索で絞り込めます。CSV出力は全件が対象です</div>
        )}
      </Card>

      <div className="bg-sky-50/70 border border-sky-100 rounded-2xl px-5 py-4 text-xs text-slate-600 flex gap-3">
        <Info size={16} className="text-sky-500 shrink-0 mt-0.5" />
        <div className="leading-relaxed">
          <b className="text-slate-700">必要在庫 = 月平均出荷 × 在庫回数（1/4ヶ月・2/4ヶ月・1ヶ月など上のプルダウンで選択）</b> — 余剰在庫を持ちすぎないよう、直近実績の平均を基準にしています。数量は非直送施設への出荷実績のみで計算しています。計算結果は右側の鉛筆アイコンから手動で上書きできます。<br />
          商品名をタップして開くと、<b className="text-slate-700">その商品だけ在庫回数を個別設定</b>できます（初期値1/4ヶ月）。個別設定していない商品は上のプルダウンの値がそのまま使われます。<br />
          <b className="text-slate-700">在庫品</b>＝営業所に在庫を置く商品（この必要在庫を目安に補充）／<b className="text-slate-700">受注発注</b>＝注文が来てから仕入れる商品（初期値）。商品全体の扱いは行の「扱い」ボタン、または絞り込み後の一括変更で切り替えられます。<br />
          商品名をタップして開くと、<b className="text-slate-700">施設ごとに個別の扱い</b>も設定できます（同じ商品でも施設Aは在庫品・施設Bは受注発注、といった使い分けが可能です）。
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   画面6: データ取込（プレビュー確認 → 重複スキップして蓄積）
============================================================ */
const PREVIEW_COLS = [
  ['saleNo', '売上番号'], ['date', '売上日'], ['customer', 'お客様名'], ['product', '商品名'],
  ['qty', '数量'], ['unit', '単位'], ['amount', '金額'], ['gross', '粗利額'],
];
const PREVIEW_ARR_IDX = { saleNo: 0, date: 1, customer: 2, product: 3, qty: 4, unit: 5, amount: 7, gross: 8 };

function ImportView({ rows, masters, setRows, setMasters, setMeta, setDocs, showToast }) {
  const [dragOver, setDragOver] = useState(false);
  const [preview, setPreview] = useState(null);
  const [result, setResult] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const fileRef = useRef(null);

  const doDeleteAll = () => {
    removeStorage([K.ROWS, K.MASTERS, K.META, K.DOCS]);
    setRows([]);
    setMasters(defaultMasters());
    setMeta({ schema: 1 });
    setDocs([]);
    setConfirmDelete(false);
    setResult(null);
    showToast('取り込んだデータを削除しました');
  };

  const runAnalyze = (text, fileName, encoding) => {
    setResult(null);
    const res = analyzeCsv(text, fileName, encoding);
    if (res.fatal) {
      setResult({ type: 'error', file: fileName, message: res.fatal, header: res.header });
      return;
    }
    if (res.rowsParsed.length === 0) {
      setResult({ type: 'error', file: fileName, message: '取り込める明細行がありません' + (res.badRows.length ? '（不正な行 ' + res.badRows.length + '行）' : '') });
      return;
    }
    setPreview(res);
  };

  const handleFile = (file) => {
    if (!file) return;
    file.arrayBuffer().then(buf => {
      const dec = decodeCsvBuffer(buf);
      runAnalyze(dec.text, file.name, dec.encoding);
    }).catch(() => setResult({ type: 'error', file: file.name, message: 'ファイルの読み込みに失敗しました' }));
  };

  const handlePaste = (e) => {
    e.preventDefault();
    const text = e.clipboardData.getData('text');
    if (!text.trim()) return;
    runAnalyze(text, 'クリップボードからの貼り付け', '貼り付け');
  };

  const doImport = () => {
    const p = preview;
    if (!p) return;
    const remaining = rowKeyCounts(rows);
    const added = [];
    let skipped = 0;
    const changed = {};   // 新規・更新した顧客だけ
    const cur = masters.customers;
    for (let i = 0; i < p.rowsParsed.length; i++) {
      const pr = p.rowsParsed[i];
      const name = pr.arr[2];
      let c = changed[name] || cur[name];
      if (!c) {
        const cls = classifyCustomerName(name);
        c = { type: cls.type, rep: '', direct: false, uncertain: cls.uncertain };
        changed[name] = c;
      }
      if (pr.rep && !c.rep) changed[name] = { ...c, rep: pr.rep };  // CSVに担当者列があれば未設定のみ反映
      const k = rowKey(pr.arr);
      const rem = remaining.get(k) || 0;
      if (rem > 0) { remaining.set(k, rem - 1); skipped++; continue; }
      added.push(pr.arr);
    }
    if (added.length) setRows(prev => [...prev, ...added]);
    if (Object.keys(changed).length) setMasters(prev => ({ ...prev, customers: { ...prev.customers, ...changed } }));
    setMeta(prev => ({ ...(prev || {}), schema: 1, lastImport: new Date().toISOString() }));

    const merged = { ...cur, ...changed };
    let fac = 0, per = 0, unc = 0, unas = 0;
    for (const n in merged) {
      const c = merged[n];
      if (c.type === 'facility') { fac++; if (!c.rep) unas++; } else per++;
      if (c.uncertain) unc++;
    }
    setResult({
      type: 'ok', file: p.fileName, encoding: p.encoding,
      rowsTotal: p.rowsParsed.length + p.badRows.length,
      added: added.length, skipped, bad: p.badRows, period: p.period,
      facilities: fac, persons: per, uncertain: unc, unassigned: unas,
    });
    setPreview(null);
    showToast(added.length ? num(added.length) + '行を取り込みました' : '新しい行はありませんでした（すべて重複スキップ）', added.length ? 'success' : 'info');
  };

  return (
    <div className="space-y-4 max-w-3xl">
      <div className="flex items-center justify-between gap-3 flex-wrap">
        <div className="text-xs text-slate-600 font-bold tabular-nums">現在の売上明細: {num(rows.length)}行</div>
        <button onClick={() => setConfirmDelete(true)} disabled={rows.length === 0}
          className={"px-3.5 py-2 rounded-xl shadow-sm text-xs font-bold transition inline-flex items-center gap-1.5 " +
            (rows.length === 0 ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-white border border-slate-200 text-rose-600 hover:border-rose-300 hover:bg-rose-50')}>
          <Trash2 size={13} /> 取り込んだデータを削除
        </button>
      </div>
      <div
        onDragOver={e => { e.preventDefault(); setDragOver(true); }}
        onDragLeave={() => setDragOver(false)}
        onDrop={e => { e.preventDefault(); setDragOver(false); handleFile(e.dataTransfer.files[0]); }}
        onClick={() => fileRef.current && fileRef.current.click()}
        className={"cursor-pointer rounded-3xl border-2 border-dashed px-6 py-14 text-center transition bg-white " +
          (dragOver ? 'border-emerald-400 bg-emerald-50/60 scale-[1.01]' : 'border-slate-200 hover:border-emerald-300 hover:bg-emerald-50/30')}>
        <span className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-50 text-emerald-500 mb-4">
          <FileUp size={28} />
        </span>
        <div className="font-extrabold text-slate-700">CSVファイルをここにドラッグ＆ドロップ</div>
        <div className="text-xs text-slate-600 mt-1.5">またはクリックしてファイルを選択 ・ 文字コードは自動判別（Shift-JIS / UTF-8）</div>
        <input ref={fileRef} type="file" accept=".csv,.txt" className="hidden"
          onChange={e => { handleFile(e.target.files[0]); e.target.value = ''; }} />
      </div>

      <div className="flex items-center gap-3 text-[11px] text-slate-600 font-bold">
        <div className="flex-1 border-t border-slate-200" />
        または
        <div className="flex-1 border-t border-slate-200" />
      </div>

      <Card className="p-5">
        <div className="text-sm font-bold text-slate-700 mb-2.5 inline-flex items-center gap-2">
          <span className="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-slate-100 text-slate-700"><ClipboardPaste size={14} /></span>
          Excelからコピーした表を貼り付け
        </div>
        <textarea rows={3} placeholder="ここにコピーした表を貼り付けてください（Ctrl+V）・1行目は列名（見出し）を含めてください" value="" onChange={() => {}}
          onPaste={handlePaste}
          className="w-full rounded-xl border border-slate-200 p-3 text-sm resize-y focus:border-blue-400 focus:outline-none transition" />
      </Card>

      {result && result.type === 'error' && (
        <Card className="overflow-hidden border-rose-200">
          <div className="bg-rose-50 px-5 py-3.5 border-b border-rose-100 flex items-center gap-2.5">
            <AlertTriangle size={18} className="text-rose-500" />
            <span className="font-bold text-sm text-rose-700">取込できませんでした</span>
          </div>
          <div className="p-5 space-y-2 text-sm text-slate-600">
            <div>📄 {result.file}</div>
            <div className="text-rose-600 font-bold">{result.message}</div>
            {result.header && (
              <div className="text-xs text-slate-600 leading-relaxed">読み取った列名: {result.header.join(' / ')}</div>
            )}
            <div className="text-xs text-slate-600">販売管理システムの「売上照会」画面からCSV出力したファイルをそのまま入れてください。</div>
          </div>
        </Card>
      )}

      {result && result.type === 'ok' && (
        <Card className="overflow-hidden border-emerald-200">
          <div className="bg-gradient-to-r from-emerald-50 to-teal-50 px-5 py-3.5 border-b border-emerald-100 flex items-center gap-2.5">
            <CheckCircle2 size={18} className="text-emerald-500" />
            <span className="font-bold text-sm text-emerald-800">取込が完了しました</span>
          </div>
          <div className="p-5 space-y-2.5 text-sm text-slate-600">
            <div className="tabular-nums">📄 {result.file} — <b className="text-slate-800">{num(result.rowsTotal)}行</b>を読み込みました（{result.encoding}）</div>
            <div className="tabular-nums">新規追加: <b className="text-slate-800">{num(result.added)}行</b> ／ 重複スキップ: <b className="text-slate-800">{num(result.skipped)}行</b>（売上番号＋商品名＋数量＋金額で重複判定）</div>
            <div className="tabular-nums">期間: {result.period} ／ 施設: {num(result.facilities)}件 ／ 個人（集計対象外）: {num(result.persons)}件</div>
            {result.bad.length > 0 && (
              <div className="bg-rose-50 border border-rose-100 rounded-xl px-4 py-2.5 text-xs text-rose-700">
                <b>読み飛ばした行: {num(result.bad.length)}行</b>
                <ul className="mt-1 space-y-0.5">
                  {result.bad.slice(0, 5).map((b, i) => <li key={i} className="tabular-nums">{b.line}行目: {b.reason}</li>)}
                  {result.bad.length > 5 && <li>…他 {num(result.bad.length - 5)}行</li>}
                </ul>
              </div>
            )}
            {result.uncertain > 0 && (
              <div className="flex items-center gap-2.5 bg-sky-50 border border-sky-200 rounded-xl px-4 py-2.5 text-sky-800 text-xs font-bold">
                <Info size={15} className="shrink-0" />
                施設か個人か自動判定に自信がないお客様が {num(result.uncertain)}件 あります → 設定画面の「施設/個人判定」でご確認ください
              </div>
            )}
            {result.unassigned > 0 && (
              <div className="flex items-center gap-2.5 bg-amber-50 border border-amber-200 rounded-xl px-4 py-2.5 text-amber-800 text-xs font-bold">
                <AlertTriangle size={15} className="shrink-0" />
                担当者が未設定の施設が {num(result.unassigned)}件 あります → 設定画面の「担当者対応表」で設定してください
              </div>
            )}
          </div>
        </Card>
      )}

      <div className="bg-blue-50/70 border border-blue-100 rounded-2xl px-5 py-4 text-xs text-slate-600 flex gap-3">
        <Info size={16} className="text-blue-500 shrink-0 mt-0.5" />
        <div className="leading-relaxed">
          取込は<b className="text-slate-700">蓄積型</b>です。同じCSVを二度入れても、売上番号＋商品名＋数量＋金額で重複を自動スキップするので二重計上になりません。<br />
          取込前に先頭5行のプレビュー確認画面を挟みます。マイナスの行（返品・赤伝）はそのまま取り込むと自動で相殺されます。
        </div>
      </div>

      {/* 取込プレビュー確認モーダル */}
      {preview && (
        <div className="fixed inset-0 z-40 bg-slate-600/50 backdrop-blur-sm overflow-auto py-8 px-4 no-print">
          <div className="max-w-3xl mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden">
            <div className="px-6 py-4 border-b border-slate-100 flex items-center gap-3 bg-gradient-to-r from-emerald-50 to-teal-50">
              <span className="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-emerald-100 text-emerald-600"><FileSpreadsheet size={17} /></span>
              <div className="flex-1 min-w-0">
                <div className="font-extrabold text-slate-800">取込内容の確認</div>
                <div className="text-[11px] text-slate-600 truncate">{preview.fileName}（{preview.encoding}）</div>
              </div>
              <button onClick={() => setPreview(null)} className="text-slate-600 hover:text-slate-600 transition"><X size={20} /></button>
            </div>
            <div className="px-6 py-4 space-y-4 max-h-[55vh] overflow-y-auto">
              <div className="flex gap-2 flex-wrap text-xs">
                <span className="bg-slate-100 text-slate-600 font-bold px-2.5 py-1 rounded-full tabular-nums">明細 {num(preview.rowsParsed.length)}行</span>
                <span className="bg-slate-100 text-slate-600 font-bold px-2.5 py-1 rounded-full tabular-nums">期間 {preview.period}</span>
                {preview.badRows.length > 0 && (
                  <span className="bg-rose-50 text-rose-600 font-bold px-2.5 py-1 rounded-full tabular-nums">不正な行 {num(preview.badRows.length)}行（読み飛ばします）</span>
                )}
              </div>
              <div>
                <div className="text-[11px] font-bold text-slate-600 uppercase tracking-wide mb-2">列の対応（列名で自動対応付け）</div>
                <div className="flex gap-1.5 flex-wrap">
                  {[...REQUIRED_COLS, ...OPTIONAL_COLS].map(([key, names]) => (
                    <span key={key} className={"text-[11px] font-bold px-2 py-1 rounded-lg border " +
                      (preview.found[key] ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : 'bg-slate-50 border-slate-200 text-slate-600')}>
                      {preview.found[key] ? '✓ ' : '— '}{colLabel(names)}
                    </span>
                  ))}
                </div>
              </div>
              <div>
                <div className="text-[11px] font-bold text-slate-600 uppercase tracking-wide mb-2">先頭5行のプレビュー</div>
                <div className="overflow-x-auto rounded-xl border border-slate-100">
                  <table className="w-full text-xs min-w-[640px]">
                    <thead>
                      <tr className="text-[10px] uppercase tracking-wide text-slate-600 bg-slate-50/70">
                        {PREVIEW_COLS.map(([k, label]) => <th key={k} className="text-left font-bold px-2.5 py-2 whitespace-nowrap">{label}</th>)}
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-50">
                      {preview.rowsParsed.slice(0, 5).map((pr, i) => (
                        <tr key={i}>
                          {PREVIEW_COLS.map(([k]) => (
                            <td key={k} className="px-2.5 py-1.5 text-slate-600 whitespace-nowrap max-w-[180px] overflow-hidden text-ellipsis tabular-nums">
                              {String(pr.arr[PREVIEW_ARR_IDX[k]])}
                            </td>
                          ))}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
              {preview.badRows.length > 0 && (
                <div className="bg-rose-50 border border-rose-100 rounded-xl px-4 py-2.5 text-xs text-rose-700">
                  <b>読み飛ばす行の例:</b>
                  <ul className="mt-1 space-y-0.5">
                    {preview.badRows.slice(0, 3).map((b, i) => <li key={i} className="tabular-nums">{b.line}行目: {b.reason}</li>)}
                  </ul>
                </div>
              )}
            </div>
            <div className="px-6 py-3 bg-sky-50/70 text-[11px] text-slate-700 leading-relaxed border-t border-sky-100">
              「取り込む」を押すと、すでに保存済みの明細と重複する行は自動でスキップされ、新しい行だけが追加されます。
            </div>
            <div className="px-6 py-4 flex gap-2 justify-end border-t border-slate-100">
              <button onClick={doImport}
                className="bg-emerald-600 hover:bg-emerald-700 active:scale-[.98] text-white px-5 py-2.5 rounded-xl shadow-sm shadow-emerald-200 text-sm font-bold transition inline-flex items-center gap-1.5">
                <CheckCircle2 size={15} /> 取り込む（{num(preview.rowsParsed.length)}行）
              </button>
              <button onClick={() => setPreview(null)}
                className="bg-rose-600 hover:bg-rose-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-rose-200 text-sm font-bold transition inline-flex items-center gap-1.5">
                <X size={15} /> キャンセル
              </button>
            </div>
          </div>
        </div>
      )}

      {/* 取り込んだデータの削除確認 */}
      {confirmDelete && (
        <div className="fixed inset-0 z-40 bg-slate-600/50 backdrop-blur-sm overflow-auto py-8 px-4 no-print">
          <div className="max-w-lg mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden">
            <div className="px-6 py-4 border-b border-slate-100 flex items-center gap-3 bg-rose-50">
              <span className="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-rose-100 text-rose-600"><Trash2 size={17} /></span>
              <div className="flex-1">
                <div className="font-extrabold text-slate-800">取り込んだデータを削除しますか？</div>
                <div className="text-[11px] text-slate-600">この操作は取り消せません</div>
              </div>
              <button onClick={() => setConfirmDelete(false)} className="text-slate-600 hover:text-slate-600 transition"><X size={20} /></button>
            </div>
            <div className="px-6 py-4 text-sm text-slate-600 space-y-2">
              <div>売上明細 <b className="text-rose-600">{num(rows.length)}行</b>と、施設/個人の判定・担当者・在庫扱いなどの設定が<b className="text-rose-600">すべて</b>消えます。</div>
              <div className="flex items-center gap-2 bg-amber-50 border border-amber-200 rounded-xl px-4 py-2.5 text-amber-800 text-xs font-bold">
                <AlertTriangle size={15} className="shrink-0" />
                大事なデータは設定画面の「JSONエクスポート」で先に控えを取ることをおすすめします
              </div>
            </div>
            <div className="px-6 py-4 flex gap-2 justify-end border-t border-slate-100 flex-wrap">
              <button onClick={doDeleteAll}
                className="bg-rose-600 hover:bg-rose-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-rose-200 text-sm font-bold transition">完全に削除する</button>
              <button onClick={() => setConfirmDelete(false)}
                className="bg-slate-500 hover:bg-slate-600 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm text-sm font-bold transition">キャンセル</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   画面: 発注書作成 / 見積書作成（共通コンポーザー）
   - 商品マスタは販売履歴から自動生成。種別（分類）と検索で絞り込み
   - 施設は履歴から選ぶほか、新規施設名を直接入力できる
   - 直近の販売価格（この施設向け優先）を初期単価にする
   - 全項目（施設名・商品名・数量・単位・単価・日付・備考・表題）を編集できる
   - 保存すると次回そのまま呼び出して編集できる（印刷 / PDF保存の両方に対応）
============================================================ */
const DEFAULT_ORDER_NOTE = '・納品希望日：　　月　　日（ご記入ください）\n・数量欄にご記入のうえ、ご返送ください。\n・ご不明な点は担当までお問い合わせください。';
const DEFAULT_QUOTE_NOTE = '・納期：ご注文後、通常2〜3営業日\n・支払条件：月末締め翌月末払い\n・有効期限：お見積日より30日間';
const newDocDraft = (type, facility) => ({
  id: null,
  facility: facility || '',
  title: type === 'quote' ? '御　見　積　書' : '発　注　書',
  issued: todayISO(),
  note: type === 'quote' ? DEFAULT_QUOTE_NOTE : DEFAULT_ORDER_NOTE,
  items: [],
  showItemNote: false, // 商品ごとの備考欄はデフォルト非表示（必要なときだけ表示）
  showPrices: false,   // 発注書・見積書とも初期状態は金額なし
  showTotal: false,    // 見積書の合計金額欄。デフォルト非表示（見積明細の表示切替ボタンで切り替え）
  showCaseSize: false, // 入数列の表示/非表示（デフォルト非表示）
  taxIncluded: false,   // 見積書はデフォルト税抜表記。チェックで税込に切替
});
const isoToJa = (iso) => {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
  return m ? +m[1] + '年' + +m[2] + '月' + +m[3] + '日' : todayLabel();
};

/* ============================================================
   画面: 価格改定
   - 商品を選ぶと現状価格（直近販売価格）が入り、改定価格を入力すると増加額・増加率が自動計算される
   - 合計金額は出さない（施設単位の合計ではなく、商品ごとの改定案内のため）
============================================================ */
const newPriceRevisionDraft = () => ({
  facility: '', rep: loadStorage(K.LAST_PRICE_REV_REP, ''), title: '価格改定のご案内', issued: todayISO(), note: '', items: [],
  showCaseSize: false, showRate: true, showAmounts: true,
});
// 利益率(%) = (価格-仕入)/価格*100。仕入・利益率から価格を逆算する式も用意。
const marginPctOf = (price, cost) => (price > 0 ? Math.round((price - cost) / price * 1000) / 10 : 0);
const priceFromMargin = (marginPct, cost) => {
  const r = Number(marginPct) / 100;
  if (!(r < 1)) return Math.round(cost) || 0;
  return Math.max(0, Math.round((Number(cost) || 0) / (1 - r)));
};
// 数値<input>の先頭に余分な0が残る問題（controlled inputでReactが同値と判断しDOM表示を
// 更新しないケース）を防ぐため、入力イベント内でDOMのvalueを直接補正してから状態に渡す。
const sanitizeNumInput = (e) => {
  const raw = e.target.value;
  const cleaned = raw.replace(/^0+(?=\d)/, '');
  if (cleaned !== raw) e.target.value = cleaned;
  return cleaned;
};
function PriceRevisionView({ data, masters, draft, setDraft, docs, setDocs, showToast, openPrint }) {
  const [cat, setCat] = useState('all');
  const [search, setSearch] = useState('');
  const [busy, setBusy] = useState(false);
  const [showSaved, setShowSaved] = useState(false);
  const [facSuggestOpen, setFacSuggestOpen] = useState(false);
  const [facPickerOpen, setFacPickerOpen] = useState(false);
  const [facPickerQuery, setFacPickerQuery] = useState('');
  const facBoxRef = useRef(null);
  const facNames = useMemo(() =>
    data.facilities.slice().sort((a, b) => (b.sales || 0) - (a.sales || 0)).map(f => f.name), [data]);
  const facSuggests = useMemo(() => {
    const q = normalizeSearchText(String(draft.facility || '').trim());
    if (!q) return [];
    return facNames.filter(n => normalizeSearchText(n).includes(q)).slice(0, 8);
  }, [facNames, draft.facility]);
  useEffect(() => {
    if (!facSuggestOpen) return;
    const h = (e) => { if (facBoxRef.current && !facBoxRef.current.contains(e.target)) setFacSuggestOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [facSuggestOpen]);
  const savedList = useMemo(() =>
    docs.filter(d => d.type === 'pricerevision').sort((a, b) => (a.savedAt < b.savedAt ? 1 : -1)), [docs]);

  const master = useMemo(() => {
    let list = data.products.slice().sort((a, b) => b.winSales - a.winSales);
    if (cat !== 'all') list = list.filter(x => x.cat === cat);
    const q = normalizeSearchText(search.trim());
    if (q) list = list.filter(x => normalizeSearchText(x.name).includes(q));
    return list;
  }, [data, cat, search]);
  const visibleMaster = master.slice(0, 40);
  const inItems = useMemo(() => new Set(draft.items.map(i => i.name)), [draft.items]);

  // 過去に保存した価格改定から、商品ごとに最後に使った新仕入を記憶しておく（新しい保存ほど優先）
  const lastNewCostByProduct = useMemo(() => {
    const map = new Map();
    docs.filter(d => d.type === 'pricerevision').slice().sort((a, b) => (a.savedAt < b.savedAt ? 1 : -1))
      .forEach(d => {
        (d.items || []).forEach(it => {
          if (!map.has(it.name) && it.newCost !== '' && it.newCost != null) map.set(it.name, it.newCost);
        });
      });
    return map;
  }, [docs]);

  const patch = (p) => setDraft(prev => ({ ...prev, ...p }));
  const addItem = (m) => {
    if (inItems.has(m.name)) { showToast('「' + m.name + '」はすでに明細にあります', 'info'); return; }
    const cur = Math.round(m.lastPrice) || 0;
    const rememberedCost = lastNewCostByProduct.has(m.name) ? lastNewCostByProduct.get(m.name) : '';
    setDraft(prev => ({ ...prev, items: [...prev.items, { name: m.name, cat: m.cat || '', unit: m.unit || '', caseSize: '', cost: Math.round(m.cost) || 0, currentPrice: cur, newPrice: cur, newCost: rememberedCost, newMarginPct: '' }] }));
    if (rememberedCost !== '') showToast('前回の新仕入（' + yen(rememberedCost) + '）を自動入力しました', 'info', 2500);
  };
  // 新仕入・新利益率が両方入力されたら改定価格を自動算出（新仕入 ÷ (1 - 新利益率)）。
  // 逆に改定価格を直接編集したときは、新仕入（未入力なら現行仕入）を基準に利益率を逆算する。
  const setItem = (idx, p) => setDraft(prev => ({
    ...prev,
    items: prev.items.map((it, i) => {
      if (i !== idx) return it;
      const merged = { ...it, ...p };
      const hasNewCost = merged.newCost !== '' && merged.newCost != null;
      const hasNewMargin = merged.newMarginPct !== '' && merged.newMarginPct != null;
      if ('newPrice' in p) {
        const costBasis = hasNewCost ? Number(merged.newCost) : Number(merged.cost) || 0;
        if (costBasis > 0) merged.newMarginPct = marginPctOf(merged.newPrice, costBasis);
      } else if (hasNewCost && hasNewMargin) {
        merged.newPrice = priceFromMargin(merged.newMarginPct, merged.newCost);
      }
      return merged;
    }),
  }));
  const delItem = (idx) => setDraft(prev => ({ ...prev, items: prev.items.filter((_, i) => i !== idx) }));

  // 適用開始日を選ぶと、備考欄の先頭に「YYYY年M月D日〜の改定価格となります。」を自動で挿入・更新する
  const EFFECTIVE_NOTE_RE = /^\d{4}年\d{1,2}月\d{1,2}日〜の改定価格となります。\n?/;
  const setEffectiveDate = (dateStr) => {
    setDraft(prev => {
      const base = (prev.note || '').replace(EFFECTIVE_NOTE_RE, '');
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr);
      const note = m ? (+m[1] + '年' + +m[2] + '月' + +m[3] + '日〜の改定価格となります。' + (base ? '\n' + base : '')) : base;
      return { ...prev, effectiveDate: dateStr, note };
    });
  };

  const buildHtml = () => buildPriceRevisionHtml({
    facilityName: draft.facility, title: draft.title, issued: isoToJa(draft.issued),
    note: draft.note, items: draft.items, office: masters.settings.office, repName: draft.rep || '未設定',
    showCaseSize: !!draft.showCaseSize, showAmounts: draft.showAmounts !== false, showRate: draft.showRate !== false,
  });
  const validate = () => {
    if (draft.items.length === 0) { showToast('価格改定表に商品を追加してください', 'error'); return false; }
    return true;
  };
  const handlePrint = () => { if (validate()) openPrint(buildHtml()); };
  const handleInternalPrint = () => {
    if (!validate()) return;
    openPrint(buildPriceRevisionInternalHtml({
      facilityName: draft.facility, issued: isoToJa(draft.issued),
      note: draft.note, items: draft.items, office: masters.settings.office, repName: draft.rep || '未設定',
    }));
  };
  const handlePdf = async () => {
    if (!validate()) return;
    setBusy(true);
    showToast('PDFを作成しています…', 'info');
    try {
      const fname = '価格改定_' + (draft.facility ? String(draft.facility).replace(/[\\/:*?"<>|]/g, '') + '_' : '') + (draft.issued || todayISO()) + '.pdf';
      await exportPdf(buildHtml(), fname);
      showToast('PDFを保存しました');
    } catch (e) {
      showToast('PDFの作成に失敗しました。印刷ダイアログの「PDFとして保存」もお試しください', 'error', 7000);
    } finally {
      setBusy(false);
    }
  };
  const handleSave = () => {
    if (draft.items.length === 0) { showToast('価格改定表に商品を追加してください', 'error'); return; }
    const now = new Date().toISOString();
    const id = draft.id || ('pricerevision-' + Date.now());
    const rec = { ...draft, id, type: 'pricerevision', facility: draft.facility || '（宛先未設定）', savedAt: now };
    setDocs(prev => {
      const i = prev.findIndex(d => d.id === id);
      if (i >= 0) { const a = prev.slice(); a[i] = rec; return a; }
      return [...prev, rec];
    });
    setDraft(rec);
    showToast(draft.id ? '保存しました（上書き）' : '保存しました。次回この画面から呼び出して編集できます');
  };
  const loadDoc = (d) => { setDraft({ ...d }); setShowSaved(false); showToast('「' + d.facility + '」を読み込みました'); };
  const delDoc = (id) => setDocs(prev => prev.filter(d => d.id !== id));
  const newDoc = () => { setDraft(newPriceRevisionDraft()); showToast('新規作成にしました'); };
  const handleCancel = () => {
    if (draft.id) {
      const saved = docs.find(d => d.id === draft.id);
      if (saved) { setDraft({ ...saved }); showToast('保存済みの内容に戻しました'); return; }
    }
    setDraft(newPriceRevisionDraft());
    showToast('入力内容を取り消しました');
  };
  const inputCls = 'h-10 px-3 rounded-lg border border-slate-200 bg-white text-sm shadow-sm font-bold text-slate-700 focus:border-sky-400 focus:outline-none';

  return (
    <div className="space-y-4">
      <Card className="px-5 py-4 space-y-3">
        <div className="flex items-center gap-3 flex-wrap">
          <div className="inline-flex items-center gap-2">
            <span className="text-sm text-slate-600 font-bold shrink-0">宛先（任意）</span>
            <div className="relative" ref={facBoxRef}>
              <input value={draft.facility} onChange={e => { patch({ facility: e.target.value }); setFacSuggestOpen(true); }}
                onFocus={() => setFacSuggestOpen(true)}
                onKeyDown={e => { if (e.key === 'Escape') setFacSuggestOpen(false); }}
                placeholder="施設名など（空欄可）" className={inputCls + ' w-56'} />
              {facSuggestOpen && facSuggests.length > 0 && (
                <div className="absolute z-30 top-full left-0 mt-1.5 w-56 bg-white rounded-xl border border-slate-200 shadow-xl overflow-hidden">
                  {facSuggests.map(n => (
                    <button key={n} type="button" onMouseDown={e => e.preventDefault()}
                      onClick={() => { patch({ facility: n }); setFacSuggestOpen(false); }}
                      className="w-full text-left px-4 py-2.5 hover:bg-sky-50 transition text-xs font-bold text-slate-700 truncate border-b border-slate-50 last:border-0">
                      {n}
                    </button>
                  ))}
                </div>
              )}
            </div>
            <button type="button" onClick={() => { setFacPickerOpen(true); setFacPickerQuery(''); }}
              title="既存施設の一覧から選ぶ"
              className="h-10 px-3 rounded-lg border border-slate-200 bg-white hover:bg-sky-50 hover:border-sky-300 active:scale-[.98] text-slate-600 hover:text-sky-700 text-xs font-bold shadow-sm transition inline-flex items-center gap-1.5 shrink-0">
              <Search size={14} /> 一覧から選ぶ
            </button>
          </div>
          {draft.id && <span className="bg-teal-100 text-teal-700 text-[11px] font-bold px-2.5 py-1 rounded-full">保存済みを編集中</span>}
          <label className="inline-flex items-center gap-2 text-sm text-slate-600 font-bold">
            担当
            <input value={draft.rep || ''} list="pricerevision-rep-list"
              onChange={e => {
                patch({ rep: e.target.value });
                saveStorage(K.LAST_PRICE_REV_REP, e.target.value);
              }}
              placeholder="担当者名" className={inputCls + ' w-36'} />
            <datalist id="pricerevision-rep-list">
              {(masters.settings.reps || []).map(r => <option key={r} value={r} />)}
            </datalist>
          </label>
          <label className="inline-flex items-center gap-2 text-sm text-slate-600 font-bold">
            表題
            <input value={draft.title} onChange={e => patch({ title: e.target.value })} className={inputCls + ' w-56'} />
          </label>
          <label className="inline-flex items-center gap-2 text-sm text-slate-600 font-bold">
            発行日
            <input type="date" value={draft.issued} onChange={e => patch({ issued: e.target.value })} className={inputCls + ' tabular-nums'} />
          </label>
          <label className="inline-flex items-center gap-2 text-sm text-slate-600 font-bold">
            適用開始日
            <input type="date" value={draft.effectiveDate || ''} onChange={e => setEffectiveDate(e.target.value)}
              title="選ぶと備考欄に「〇月〇日〜の改定価格となります。」を自動で入れます"
              className={inputCls + ' tabular-nums'} />
          </label>
        </div>
        <div className="flex items-center gap-2 flex-wrap">
          <button onClick={() => setShowSaved(s => !s)}
            className="bg-slate-500 hover:bg-slate-600 active:scale-[.98] text-white px-3.5 py-2.5 rounded-xl shadow-sm text-sm font-bold transition inline-flex items-center gap-1.5">
            <Database size={15} /> 保存済み（{savedList.length}）
          </button>
          <button onClick={handleCancel}
            className="bg-white border border-slate-200 hover:border-rose-300 hover:text-rose-600 active:scale-[.98] text-slate-600 px-3.5 py-2.5 rounded-xl shadow-sm text-sm font-bold transition inline-flex items-center gap-1.5">
            <RotateCcw size={14} /> 取り消し
          </button>
          <button onClick={newDoc}
            className="bg-white border border-slate-200 hover:border-slate-300 active:scale-[.98] text-slate-600 px-3.5 py-2.5 rounded-xl shadow-sm text-sm font-bold transition">新規</button>
          <button onClick={handleSave}
            className="bg-emerald-600 hover:bg-emerald-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-emerald-200 text-sm font-bold transition inline-flex items-center gap-1.5">
            <CheckCircle2 size={15} /> 保存
          </button>
          <button onClick={handlePdf} disabled={busy} className="bg-sky-600 hover:bg-sky-700 disabled:opacity-60 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-sky-200 text-sm font-bold transition inline-flex items-center gap-1.5">
            <Download size={15} /> PDF保存
          </button>
          <button onClick={handlePrint} className="bg-white hover:bg-slate-50 active:scale-[.98] text-slate-700 border border-slate-200 px-4 py-2.5 rounded-xl shadow-sm text-sm font-bold transition inline-flex items-center gap-1.5">
            <Printer size={15} /> 印刷
          </button>
          <button onClick={handleInternalPrint} title="仕入価格・利益率を含む社内確認用の資料を印刷します（社外秘）"
            className="bg-amber-50 hover:bg-amber-100 active:scale-[.98] text-amber-800 border border-amber-300 px-4 py-2.5 rounded-xl shadow-sm text-sm font-bold transition inline-flex items-center gap-1.5">
            <Printer size={15} /> 社内用印刷
          </button>
        </div>

        {showSaved && (
          <div className="border-t border-slate-100 pt-3">
            <div className="text-sm font-bold text-slate-800 uppercase tracking-wide mb-2.5">保存済みの価格改定（{savedList.length}件）</div>
            <div className="space-y-2.5 max-h-96 overflow-y-auto pr-0.5">
              {savedList.map(d => (
                <div key={d.id} onClick={() => loadDoc(d)} role="button" tabIndex={0}
                  onKeyDown={e => { if (e.key === 'Enter') loadDoc(d); }}
                  className="flex items-center gap-4 bg-slate-50/70 hover:bg-sky-50/70 border border-slate-100 rounded-xl px-5 py-3.5 transition cursor-pointer">
                  <div className="flex-1 min-w-0">
                    <div className="font-extrabold text-base text-slate-900 truncate">{d.facility}</div>
                    <div className="text-xs font-semibold text-slate-700 tabular-nums mt-1 flex items-center gap-2.5 flex-wrap">
                      <span className="inline-flex items-center gap-1"><CalendarDays size={13} />{d.issued}</span>
                      <span>・{d.items.length}品目</span>
                      <span className="text-slate-500">保存 {String(d.savedAt).slice(0, 10)}</span>
                    </div>
                  </div>
                  <span className="text-sky-600 text-sm font-bold px-4 py-2 rounded-full shrink-0 border border-sky-200 bg-white">読み込む</span>
                  <button onClick={e => { e.stopPropagation(); delDoc(d.id); }} className="text-slate-400 hover:text-rose-500 transition shrink-0"><Trash2 size={18} /></button>
                </div>
              ))}
              {savedList.length === 0 && <div className="py-6 text-center text-sm font-semibold text-slate-700">保存された価格改定はまだありません</div>}
            </div>
          </div>
        )}
      </Card>

      <div className="grid lg:grid-cols-[minmax(280px,0.75fr)_minmax(440px,1.6fr)_minmax(180px,0.5fr)] gap-5 items-start [&>*]:min-w-0">
        <Card>
          <div className="px-5 py-3.5 border-b border-slate-100 flex items-center gap-2.5 flex-wrap">
            <span className="font-bold text-sm text-slate-700">商品を選ぶ</span>
            <select value={cat} onChange={e => setCat(e.target.value)} className="h-9 px-2.5 rounded-lg border border-slate-200 bg-white text-xs shadow-sm font-bold text-slate-600 ml-auto">
              <option value="all">全分類</option>
              {data.categories.map(c => <option key={c.name} value={c.name}>{c.name}</option>)}
            </select>
            <div className="relative w-full">
              <Search size={14} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-500" />
              <input value={search} onChange={e => setSearch(e.target.value)} placeholder="商品名で絞り込み"
                className="h-9 pl-8 pr-2.5 w-full rounded-lg border border-slate-200 text-xs shadow-sm font-bold text-slate-700 focus:border-sky-400 focus:outline-none" />
            </div>
          </div>
          <div className="divide-y divide-slate-50 max-h-[32rem] overflow-y-auto">
            {visibleMaster.map(m => (
              <button key={m.name} onClick={() => addItem(m)} disabled={inItems.has(m.name)}
                className={"w-full text-left px-5 py-3.5 flex items-center gap-3 transition " +
                  (inItems.has(m.name) ? 'opacity-40 cursor-default' : 'hover:bg-sky-50/60')}>
                <div className="flex-1 min-w-0">
                  <div className="font-bold text-sm text-slate-800 truncate">{m.name}</div>
                  <div className="text-xs text-slate-600 tabular-nums mt-0.5">
                    {m.cat}{m.lastPrice > 0 && <> ・ 現状価格 <b className="text-slate-700">{yen(m.lastPrice)}</b></>}
                    {m.cost > 0 && <> ・ 仕入 <b className="text-amber-700">{yen(m.cost)}</b></>}
                  </div>
                </div>
                <span className={"text-xs font-bold px-2.5 py-1 rounded-full shrink-0 " +
                  (inItems.has(m.name) ? 'bg-slate-100 text-slate-600' : 'bg-sky-500 text-white')}>
                  {inItems.has(m.name) ? '追加済' : '＋追加'}
                </span>
              </button>
            ))}
            {visibleMaster.length === 0 && <div className="px-5 py-8 text-center text-xs text-slate-600">該当する商品がありません</div>}
          </div>
        </Card>

        <Card>
          <div className="px-5 py-3.5 border-b border-slate-100">
            <div className="font-bold text-sm text-slate-700">価格改定表 {draft.items.length}品目</div>
            <div className="flex items-center gap-2 flex-wrap mt-2.5">
              <button onClick={() => patch({ showCaseSize: !draft.showCaseSize })}
                title={draft.showCaseSize ? '入数を非表示にする' : '入数を表示する'}
                className={"inline-flex items-center gap-1.5 text-xs font-bold px-3 py-2 rounded-lg border transition shrink-0 " +
                  (draft.showCaseSize ? 'border-sky-300 bg-sky-50 text-sky-700' : 'border-slate-200 text-slate-600 hover:bg-slate-100')}>
                {draft.showCaseSize ? <Eye size={15} /> : <EyeOff size={15} />}
                入数{draft.showCaseSize ? '表示中' : '非表示中'}
              </button>
              <button onClick={() => patch({ showAmounts: !draft.showAmounts })}
                title={draft.showAmounts ? '金額を非表示にする' : '金額を表示する'}
                className={"inline-flex items-center gap-1.5 text-xs font-bold px-3 py-2 rounded-lg border transition shrink-0 " +
                  (draft.showAmounts ? 'border-sky-300 bg-sky-50 text-sky-700' : 'border-slate-200 text-slate-600 hover:bg-slate-100')}>
                {draft.showAmounts ? <Eye size={15} /> : <EyeOff size={15} />}
                金額{draft.showAmounts ? '表示中' : '非表示中'}
              </button>
              {draft.showAmounts && (
                <button onClick={() => patch({ showRate: !(draft.showRate !== false) })}
                  title={draft.showRate !== false ? '変動率を非表示にする' : '変動率を表示する'}
                  className={"inline-flex items-center gap-1.5 text-xs font-bold px-3 py-2 rounded-lg border transition shrink-0 " +
                    (draft.showRate !== false ? 'border-sky-300 bg-sky-50 text-sky-700' : 'border-slate-200 text-slate-600 hover:bg-slate-100')}>
                  {draft.showRate !== false ? <Eye size={15} /> : <EyeOff size={15} />}
                  変動率{draft.showRate !== false ? '表示中' : '非表示中'}
                </button>
              )}
            </div>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-sm min-w-[420px]">
              <thead>
                <tr className="text-xs uppercase tracking-wide text-slate-600 border-b border-slate-100">
                  <th className="text-left font-bold px-4 py-2.5 min-w-[260px] whitespace-nowrap">商品名</th>
                  {draft.showCaseSize && <th className="text-center font-bold px-1 py-2.5 w-12 whitespace-nowrap">入数</th>}
                  {draft.showAmounts && <th className="text-right font-bold px-1 py-2.5 w-20 whitespace-nowrap">現状価格</th>}
                  {draft.showAmounts && <th className="text-right font-bold px-1 py-2.5 w-20 whitespace-nowrap">改定価格</th>}
                  {draft.showAmounts && <th className="text-right font-bold px-1 py-2.5 w-24 whitespace-nowrap">価格差</th>}
                  {draft.showAmounts && draft.showRate !== false && <th className="text-right font-bold px-1 py-2.5 w-16 whitespace-nowrap">変動率</th>}
                  <th className="w-8"></th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-50">
                {draft.items.map((it, i) => {
                  const diff = it.newPrice - it.currentPrice;
                  const rate = it.currentPrice > 0 ? Math.round(diff / it.currentPrice * 1000) / 10 : 0;
                  return (
                    <tr key={i}>
                      <td className="px-4 py-2.5 max-w-0">
                        <div className="flex items-center gap-1 mb-0.5">
                          <input value={it.cat || ''} onChange={e => setItem(i, { cat: e.target.value })}
                            placeholder="分類名（商品名の上に印刷。空欄で非表示）"
                            className="h-5 flex-1 min-w-0 px-1.5 rounded border border-slate-100 bg-sky-50/50 text-[9px] text-sky-700 font-bold focus:border-sky-400 focus:outline-none placeholder:font-normal placeholder:text-slate-400" />
                          {it.cat && (
                            <button type="button" onClick={() => setItem(i, { cat: '' })} title="分類名を削除"
                              className="text-slate-400 hover:text-rose-500 transition shrink-0"><X size={11} /></button>
                          )}
                        </div>
                        <div className="font-bold text-base text-slate-800 truncate" title={it.name}>{it.name}</div>
                        <div className="text-xs text-slate-500 truncate">{it.unit}</div>
                      </td>
                      {draft.showCaseSize && (
                        <td className="px-1 py-2.5">
                          <input value={it.caseSize || ''} onChange={e => setItem(i, { caseSize: e.target.value })}
                            className="h-11 w-full px-2 rounded-lg border border-slate-200 text-sm text-slate-700 font-bold text-center placeholder:font-normal placeholder:text-slate-400 focus:border-sky-400 focus:outline-none" />
                        </td>
                      )}
                      {draft.showAmounts && (
                        <td className="px-1 py-2.5 text-right">
                          <input type="number" min="0" value={it.currentPrice}
                            onChange={e => setItem(i, { currentPrice: Math.max(0, parseInt(sanitizeNumInput(e) || '0', 10)) })}
                            onFocus={e => e.target.select()}
                            className="h-11 w-full px-2 rounded-lg border border-slate-200 text-right tabular-nums text-sm font-bold focus:border-sky-400 focus:outline-none" />
                          {it.cost > 0 && (
                            <div className="mt-1 text-sm text-amber-700 font-bold text-right whitespace-nowrap">仕入 {yen(it.cost)}・利益率 {marginPctOf(it.currentPrice, it.cost)}%</div>
                          )}
                        </td>
                      )}
                      {draft.showAmounts && (
                        <td className="px-1 py-2.5 text-right">
                          <input type="number" min="0" value={it.newPrice}
                            onChange={e => setItem(i, { newPrice: Math.max(0, parseInt(sanitizeNumInput(e) || '0', 10)) })}
                            onFocus={e => e.target.select()}
                            className="h-11 w-full px-2 rounded-lg border border-amber-200 bg-amber-50/50 text-right tabular-nums text-sm font-bold focus:border-amber-400 focus:outline-none" />
                          <div className="flex items-center gap-1 mt-1 justify-end">
                            <input type="number" min="0" value={it.newCost ?? ''}
                              onChange={e => { const v = sanitizeNumInput(e); setItem(i, { newCost: v === '' ? '' : Math.max(0, parseInt(v, 10) || 0) }); }}
                              onFocus={e => e.target.select()}
                              placeholder="新仕入"
                              className="h-8 w-20 px-1.5 rounded-lg border border-slate-200 text-sm font-bold text-slate-700 text-right focus:border-emerald-400 focus:outline-none placeholder:font-normal placeholder:text-xs" />
                            <input type="number" value={it.newMarginPct ?? ''}
                              onChange={e => { const v = sanitizeNumInput(e); setItem(i, { newMarginPct: v === '' ? '' : Math.max(0, Math.min(99, parseFloat(v) || 0)) }); }}
                              onFocus={e => e.target.select()}
                              placeholder="利益率%"
                              className="h-8 w-20 px-1.5 rounded-lg border border-slate-200 text-sm font-bold text-slate-700 text-right focus:border-emerald-400 focus:outline-none placeholder:font-normal placeholder:text-xs" />
                          </div>
                        </td>
                      )}
                      {draft.showAmounts && (
                        <td className="px-1 py-2.5 text-right tabular-nums font-extrabold text-sm text-slate-800">
                          {diff === 0 ? '―' : (diff > 0 ? '+' : '−') + num(Math.abs(diff))}
                        </td>
                      )}
                      {draft.showAmounts && draft.showRate !== false && <td className="px-1 py-2.5 text-right tabular-nums font-extrabold text-sm text-slate-800">{diff === 0 ? '―' : (diff > 0 ? '+' : '−') + Math.abs(rate) + '%'}</td>}
                      <td className="pr-3 text-right">
                        <button onClick={() => delItem(i)} className="text-slate-400 hover:text-rose-500 transition"><X size={15} /></button>
