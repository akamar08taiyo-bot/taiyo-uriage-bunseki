/* ============================================================
   画面5: 適正在庫（必要在庫 = 月平均出荷 × 在庫回数。余剰在庫を持たない設計）
============================================================ */
// 在庫回数のプリセット（月の平均販売個数に掛けて必要在庫を算出）。ユーザーが選びやすいよう分数表記で提示
const STOCK_MONTH_PRESETS = [
  [0.25, '1/4ヶ月'], [0.5, '2/4ヶ月'], [0.75, '3/4ヶ月'],
  [1, '1ヶ月'], [1.5, '1.5ヶ月'], [2, '2ヶ月'], [3, '3ヶ月'],
];
// 商品×施設の個別上書き。未設定の施設は「商品全体の扱い」（在庫品/受注発注）をそのまま引き継ぐ。
// 施設だけ例外にしたい場合（例: この施設だけ直送扱いにしたい）は、施設消費一覧のボタンで個別に変更できる。
const facHandlingOf = (product, facility, ifh, productHandling) =>
  (ifh[product] && ifh[product][facility]) || productHandling || 'order';

function StockView({ data, masters, setMasters, showToast, openPrint }) {
  const [period, setPeriod] = useState(6);
  // 初期タブ: 在庫品がまだ1件も選ばれていなければ「受注発注」を開いて分類作業から始めてもらう
  const [handlingTab, setHandlingTab] = useState(() =>
    (Object.values(masters.itemHandling).some(v => v === 'stock') ? 'stock' : 'order'));
  const [catFilter, setCatFilter] = useState('all');
  const [search, setSearch] = useState('');
  const [openProd, setOpenProd] = useState(null);
  const [editQty, setEditQty] = useState(null); // 必要在庫を編集中の商品名
  const [editMonth, setEditMonth] = useState(null); // 在庫回数を個別編集中の商品名
  const [qtyView, setQtyView] = useState('shipment'); // 一覧表示: 'shipment'=通常の出荷数 / 'stock'=在庫数（在庫回数を掛けた数）
  const [qtyViewMonths, setQtyViewMonths] = useState(0.5); // 在庫数タブでの倍率（1/2ヶ月・1/4ヶ月など）
  const months = Math.max(0.25, +masters.settings.stockMonths || 1);
  // プリセットに無い値（旧バージョンで設定された値など）が保存されていれば選択肢に足しておく
  const monthPresetOptions = useMemo(() => {
    if (STOCK_MONTH_PRESETS.some(([v]) => v === months)) return STOCK_MONTH_PRESETS;
    return [...STOCK_MONTH_PRESETS, [months, months + 'ヶ月']].sort((a, b) => a[0] - b[0]);
  }, [months]);
  const setMonths = (v) => setMasters(prev => ({ ...prev, settings: { ...prev.settings, stockMonths: v } }));
  const setHandling = (name, h) => setMasters(prev => {
    const ih = { ...prev.itemHandling };
    if (h === HANDLING_DEFAULT) delete ih[name]; else ih[name] = h;
    return { ...prev, itemHandling: ih };
  });
  const setCat = (name, v) => setMasters(prev => {
    const co = { ...prev.catOverrides };
    if (v === resolveCategory(name, {}, prev.catRules).cat) delete co[name]; else co[name] = v;
    return { ...prev, catOverrides: co };
  });
  // 商品×施設の個別上書きを更新（在庫品に戻すときはキー削除）
  const setFacHandling = (product, facility, h) => setMasters(prev => {
    const ifh = { ...prev.itemFacilityHandling };
    const cur = { ...(ifh[product] || {}) };
    if (h === 'order') delete cur[facility]; else cur[facility] = h;
    if (Object.keys(cur).length) ifh[product] = cur; else delete ifh[product];
    return { ...prev, itemFacilityHandling: ifh };
  });
  const setStockQty = (name, v) => setMasters(prev => ({ ...prev, stockQtyOverrides: { ...prev.stockQtyOverrides, [name]: v } }));
  const clearStockQty = (name) => setMasters(prev => {
    const so = { ...prev.stockQtyOverrides };
    delete so[name];
    return { ...prev, stockQtyOverrides: so };
  });
  const setStockMonth = (name, v) => setMasters(prev => ({ ...prev, stockMonthOverrides: { ...prev.stockMonthOverrides, [name]: v } }));
  const clearStockMonth = (name) => setMasters(prev => {
    const sm = { ...prev.stockMonthOverrides };
    delete sm[name];
    return { ...prev, stockMonthOverrides: sm };
  });
  const monthLabel = (v) => { const f = STOCK_MONTH_PRESETS.find(([x]) => x === v); return f ? f[1] : (v + 'ヶ月'); };

  // 非直送施設への出荷実績から商品ごとの在庫指標を計算（施設ごとの扱いが「在庫品」のものだけを合算）
  const stockAll = useMemo(() => {
    const start = 12 - period;
    const periodStartIdx = data.win[start];
    // 月平均は「選んだ期間の月数」ではなく「その期間のうち実際に取り込まれている月数」で割る。
    // 例: 3ヶ月分しか取り込んでいないのに過去6ヶ月を選ぶと、6で割って平均が半分になり、
    // 必要在庫が過小に出て欠品につながる。
    const dataStartIdx = data.monthsAll.length ? data.monthsAll[0] : -Infinity;
    const coveredMonths = Math.max(1, data.win.slice(start).filter(i => i >= dataStartIdx).length);
    const ifh = masters.itemFacilityHandling;
    const list = [];
    for (const p of data.products) {
      const productHandling = handlingOf(p.name, masters.itemHandling);
      const monthTotals = zeros12();
      const orderSet = new Set();
      let periodQty = 0;
      let anyQty = 0;   // 扱いに関わらない非直送施設の合計（一覧への表示可否の判定用）
      const breakdown = [];
      for (const pair of p.pairs) {
        if (pair.direct) continue;   // 施設全体が直送フラグの場合は従来通り対象外（表示もしない）
        const resolved = facHandlingOf(p.name, pair.fac, ifh, productHandling);
        const included = resolved === 'stock';
        const slice = pair.qty12.slice(start);
        let t = 0; for (let i = 0; i < slice.length; i++) t += slice[i];
        breakdown.push({ fac: pair.fac, avg: t / coveredMonths, handling: resolved, included });
        anyQty += t;
        if (included) {
          for (let i = 0; i < 12; i++) monthTotals[i] += pair.qty12[i];
          periodQty += t;
          for (let i = 0; i < pair.orders.length; i++) { if (pair.orders[i].idx >= periodStartIdx) orderSet.add(pair.orders[i].no); }
        }
      }
      if (anyQty <= 0) continue;
      breakdown.sort((a, b) => b.avg - a.avg);
      const avg = periodQty / coveredMonths;
      const mx = Math.max(...monthTotals.slice(start));
      const cost = p.cost > 0 ? p.cost : 0;
      const avgPerOrder = orderSet.size > 0 ? periodQty / orderSet.size : null;
      list.push({
        name: p.name, cat: p.cat, catSrc: p.catSrc, unit: p.unit || '', supplier: p.supplier || '（仕入先未設定）',
        avg, max: mx, cost, breakdown, tot: anyQty, avgPerOrder, orderCount: orderSet.size,
        handling: productHandling,
        classified: masters.itemHandling[p.name] !== undefined,
        lastOrder: p.lastSale ? `${p.lastSale.y}/${p.lastSale.mo}/${p.lastSale.d}` : null,
      });
    }
    list.sort((a, b) => b.tot - a.tot);
    return list;
  }, [data, masters, period]);

  const counts = useMemo(() => {
    const c = { stock: 0, order: 0, done: 0 };
    stockAll.forEach(p => { c[p.handling]++; if (p.classified) c.done++; });
    return c;
  }, [stockAll]);

  const filtered = useMemo(() => {
    let list = handlingTab === 'all' ? stockAll : stockAll.filter(p => p.handling === handlingTab);
    if (catFilter !== 'all') list = list.filter(p => p.cat === catFilter);
    const q = normalizeSearchText(search.trim());
    if (q) list = list.filter(p => normalizeSearchText(p.name).includes(q) || normalizeSearchText(p.supplier).includes(q));
    return list;
  }, [stockAll, handlingTab, catFilter, search]);
  const visible = filtered.slice(0, 100);

  const monthsFor = (p) => {
    const ov = masters.stockMonthOverrides[p.name];
    return ov !== undefined ? ov : months;
  };
  const hasMonthOverride = (p) => masters.stockMonthOverrides[p.name] !== undefined;
  const rawCalc = (p) => Math.max(0, Math.ceil(p.avg * monthsFor(p)));
  const calc = (p) => {
    const ov = masters.stockQtyOverrides[p.name];
    return ov !== undefined ? ov : rawCalc(p);
  };
  const hasOverride = (p) => masters.stockQtyOverrides[p.name] !== undefined;

  // 絞り込み中の商品をまとめて分類（例:「部材」を全部 受注発注 にする）
  const bulkHandling = (h) => {
    if (filtered.length === 0) return;
    setMasters(prev => {
      const ih = { ...prev.itemHandling };
      filtered.forEach(p => { if (h === HANDLING_DEFAULT) delete ih[p.name]; else ih[p.name] = h; });
      return { ...prev, itemHandling: ih };
    });
    showToast(num(filtered.length) + '件を「' + HANDLING_LABELS[h] + '」にしました');
  };

  const handleCsv = () => {
    const head = ['商品名', '分類', '扱い', '仕入先', '単位', '月平均出荷', '最大月出荷', '必要在庫', '平均発注数', '仕入単価', '最終発注日'];
    const lines = filtered.map(p => [
      p.name, p.cat, HANDLING_LABELS[p.handling], p.supplier, p.unit,
      fmtQty(p.avg), fmtQty(p.max), calc(p), p.avgPerOrder != null ? fmtQty(p.avgPerOrder) : '', p.cost, p.lastOrder || '',
    ]);
    downloadText('適正在庫_' + todayCompact() + '.csv', buildCsv([head, ...lines]), 'text/csv');
    showToast('CSVを出力しました（Excelでそのまま開けます）');
  };

  return (
    <div className="space-y-4">
      <Card className="px-5 py-4 flex items-center gap-5 flex-wrap">
        <span className="text-sm font-bold text-slate-600">計算条件</span>
        <label className="inline-flex items-center gap-2 text-sm text-slate-700 font-bold">
          在庫回数（月平均販売個数の何か月分）
          <select value={months}
            onChange={e => setMonths(parseFloat(e.target.value))}
            className="h-10 px-2.5 rounded-xl border border-amber-300 bg-amber-50 tabular-nums font-bold text-amber-800 focus:outline-none focus:border-amber-400">
            {monthPresetOptions.map(([v, label]) => <option key={v} value={v}>{label}</option>)}
          </select>
        </label>
        <label className="inline-flex items-center gap-2 text-sm text-slate-700 font-bold">
          対象期間
          <select value={period} onChange={e => setPeriod(+e.target.value)}
            className="h-10 px-3 rounded-xl border border-slate-200 bg-white text-sm shadow-sm font-bold text-slate-700">
            <option value={6}>過去6ヶ月</option>
            <option value={12}>過去12ヶ月</option>
          </select>
        </label>
        <div className="ml-auto">
          <button onClick={handleCsv}
            className="bg-teal-600 hover:bg-teal-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-teal-200 text-sm font-bold transition inline-flex items-center gap-1.5">
            <FileSpreadsheet size={15} /> CSV出力
          </button>
        </div>
      </Card>

      {/* 分類作業のすすめ（在庫品がまだ選ばれていないときは強めに案内） */}
      <div className={"rounded-2xl px-5 py-4 flex gap-3 border " +
        (counts.stock === 0 ? 'bg-amber-50 border-amber-200' : 'bg-sky-50/70 border-sky-100')}>
        {counts.stock === 0
          ? <AlertTriangle size={18} className="text-amber-500 shrink-0 mt-0.5" />
          : <CheckCircle2 size={18} className="text-sky-500 shrink-0 mt-0.5" />}
        <div className="flex-1 text-xs leading-relaxed text-slate-600">
          <b className={counts.stock === 0 ? 'text-amber-800' : 'text-slate-700'}>
            {counts.stock === 0
              ? 'まず「営業所で在庫を持つ商品」を選んでください'
              : '在庫品 ' + num(counts.stock) + '件を登録済みです'}
          </b>
          <div className="mt-1">
            すべての商品は最初<b className="text-violet-700">受注発注（在庫を持たない）</b>から始まります。
            下の一覧で在庫を置く商品だけを<b className="text-sky-700">在庫品</b>に変えてください。必要在庫の計算対象は在庫品だけです。
          </div>
          <div className="mt-2 flex items-center gap-2 flex-wrap">
            <span className="text-[11px] text-slate-600 font-bold tabular-nums">分類済み {num(counts.done)} / {num(stockAll.length)}件</span>
            <div className="w-40 bg-white rounded-full h-1.5 overflow-hidden border border-slate-200">
              <div className="bg-sky-400 h-full rounded-full" style={{ width: (stockAll.length ? Math.round(counts.done / stockAll.length * 100) : 0) + '%' }} />
            </div>
            <span className="text-[11px] text-slate-700">在庫品 {num(counts.stock)} ／ 受注発注 {num(counts.order)}</span>
          </div>
        </div>
      </div>

      <div className="flex items-center gap-2.5 flex-wrap">
        <Segmented value={handlingTab} onChange={setHandlingTab}
          options={[['stock', '在庫品 ' + counts.stock], ['order', '受注発注 ' + counts.order], ['all', 'すべて']]} />
        <Segmented value={qtyView} onChange={setQtyView}
          options={[['shipment', '出荷数'], ['stock', '在庫数']]} />
        {qtyView === 'stock' && (
          <select value={qtyViewMonths} onChange={e => setQtyViewMonths(parseFloat(e.target.value))}
            className="h-10 px-3 rounded-xl border border-amber-300 bg-amber-50 text-sm shadow-sm font-bold text-amber-800">
            {STOCK_MONTH_PRESETS.map(([v, label]) => <option key={v} value={v}>{label}分</option>)}
          </select>
        )}
        <select value={catFilter} onChange={e => setCatFilter(e.target.value)}
          className="h-10 px-3 rounded-xl border border-slate-200 bg-white text-sm shadow-sm font-bold text-slate-700">
          <option value="all">すべての分類</option>
          {CATEGORY_NAMES.map(c => <option key={c} value={c}>{c}</option>)}
        </select>
        <div className="relative">
          <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-700" />
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="商品名・仕入先で検索"
            className="h-10 pl-9 pr-3 rounded-xl border border-slate-200 text-sm w-52 bg-white shadow-sm focus:border-blue-400 focus:outline-none transition" />
        </div>
      </div>

      {(catFilter !== 'all' || search.trim()) && filtered.length > 0 && (
        <div className="flex items-center gap-2 bg-white border border-slate-200/70 rounded-2xl px-5 py-3 flex-wrap shadow-sm">
          <span className="text-xs font-bold text-slate-600 tabular-nums">絞り込み中の {num(filtered.length)}件をまとめて:</span>
          {HANDLING_TYPES.map(h => (
            <button key={h} onClick={() => bulkHandling(h)}
              className={"text-xs font-bold px-3 py-1.5 rounded-full transition text-white " +
                (h === 'stock' ? 'bg-sky-600 hover:bg-sky-700' : 'bg-violet-600 hover:bg-violet-700')}>
              {HANDLING_LABELS[h]}にする
            </button>
          ))}
        </div>
      )}

      <Card className="overflow-x-auto">
        <table className="w-full text-sm min-w-[960px]">
          <thead>
            <tr className="text-[11px] uppercase tracking-wide text-slate-700 border-b border-slate-100">
              <th className="text-left font-bold px-5 py-3 whitespace-nowrap">商品名</th>
              <th className="text-left font-bold px-2 py-3 w-[190px] whitespace-nowrap">扱い</th>
              <th className="text-right font-bold px-2 py-3 pr-4 whitespace-nowrap">{qtyView === 'stock' ? monthLabel(qtyViewMonths) + '分' : '月平均出荷'}</th>
              <th className="text-right font-bold px-2 py-3 pr-4 whitespace-nowrap">{qtyView === 'stock' ? '最大月換算' : '最大月'}</th>
              <th className="text-right font-bold px-2 py-3 pr-4 whitespace-nowrap">必要在庫</th>
              <th className="text-right font-bold px-2 py-3 pr-4 whitespace-nowrap">仕入単価</th>
              <th className="w-10"></th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-50">
            {visible.map(p => {
              const isOpen = openProd === p.name;
              const editing = editQty === p.name;
              return (
              <React.Fragment key={p.name}>
                <tr onClick={() => { setOpenProd(isOpen ? null : p.name); setEditQty(null); }}
                  className={"cursor-pointer transition " + (isOpen ? 'bg-sky-50/80' : 'hover:bg-sky-50/50 hover:ring-1 hover:ring-inset hover:ring-sky-200')}>
                  <td className="px-5 py-3">
                    <div className="font-bold text-slate-800 flex items-center gap-1.5 flex-wrap">
                      <span>{p.name}</span>
                      {p.lastOrder && <span className="text-[10px] font-bold text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded-md whitespace-nowrap">最終発注 {p.lastOrder}</span>}
                    </div>
                    <div className="text-[10px] text-slate-700 flex items-center gap-1.5 flex-wrap">
                      <span className="bg-slate-100 text-slate-700 font-bold px-1.5 py-0.5 rounded-md">{p.cat}</span>
                      <span className={"font-bold " + (p.catSrc === '手動' ? 'text-fuchsia-500' : p.catSrc === '学習' ? 'text-teal-500' : 'text-slate-600')}>{p.catSrc}</span>
                      {p.supplier}
                      <span className="text-sky-600 font-bold inline-flex items-center gap-0.5">
                        {isOpen ? <>閉じる <ChevronUp size={11} /></> : <>タップで詳細 <ChevronDown size={11} /></>}
                      </span>
                    </div>
                  </td>
                  <td className="px-2 py-3" onClick={e => e.stopPropagation()}>
                    <div className="inline-flex bg-slate-100 rounded-lg p-0.5 gap-0.5">
                      {HANDLING_TYPES.map(h => (
                        <button key={h} onClick={() => setHandling(p.name, h)}
                          className={"text-[10px] font-bold px-2 py-1 rounded-md transition " +
                            (p.handling === h
                              ? (h === 'stock' ? 'bg-sky-500 text-white shadow-sm' : 'bg-violet-500 text-white shadow-sm')
                              : 'text-slate-600 hover:text-slate-800')}>
                          {HANDLING_LABELS[h]}
                        </button>
                      ))}
                    </div>
                  </td>
                  <td className="px-2 py-3 pr-4 text-right tabular-nums text-slate-700">{fmtQty(qtyView === 'stock' ? p.avg * qtyViewMonths : p.avg)}<span className="text-[10px] text-slate-700 ml-0.5">{p.unit}</span></td>
                  <td className="px-2 py-3 pr-4 text-right tabular-nums text-slate-700">{fmtQty(qtyView === 'stock' ? p.max * qtyViewMonths : p.max)}<span className="text-[10px] text-slate-700 ml-0.5">{p.unit}</span></td>
                  <td className="px-2 py-3 pr-4 text-right" onClick={e => e.stopPropagation()}>
                    {editing ? (
                      <div className="inline-flex items-center gap-1">
                        <input type="number" min="0" autoFocus defaultValue={calc(p)}
                          onBlur={e => { const v = Math.max(0, parseInt(e.target.value || '0', 10)); setStockQty(p.name, v); setEditQty(null); }}
                          onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); if (e.key === 'Escape') setEditQty(null); }}
                          className="h-8 w-20 px-2 rounded-lg border border-sky-300 bg-sky-50 text-right tabular-nums text-sm font-bold text-sky-800 focus:outline-none" />
                        <span className="text-[10px] text-slate-700">{p.unit}</span>
                      </div>
                    ) : (
                      <div className="inline-flex items-center gap-1">
                        {hasOverride(p) && (
                          <button onClick={() => clearStockQty(p.name)} title="自動計算に戻す"
                            className="text-slate-600 hover:text-rose-500 transition"><RotateCcw size={12} /></button>
                        )}
                        <button onClick={() => setEditQty(p.name)}
                          title={hasOverride(p) ? '手動で上書き中の数値です（自動計算は使われていません）。クリックして編集、隣の↻で自動計算に戻せます' : hasMonthOverride(p) ? 'この商品だけ在庫回数を個別設定しています' : 'クリックして手動で上書きできます'}
                          className={"font-extrabold tabular-nums px-2.5 py-1 rounded-lg inline-flex items-center gap-1 transition " +
                            (hasOverride(p) ? 'bg-fuchsia-100 text-fuchsia-700 hover:bg-fuchsia-200'
                              : hasMonthOverride(p) ? 'bg-amber-100 text-amber-700 hover:bg-amber-200'
                              : 'bg-sky-100 text-sky-700 hover:bg-sky-200')}>
                          {calc(p)}<span className="text-[10px] font-bold">{p.unit}</span> <Pencil size={10} className="opacity-60" />
                        </button>
                      </div>
                    )}
                  </td>
                  <td className="px-2 py-3 pr-4 text-right tabular-nums text-slate-700">{p.cost > 0 ? yen(p.cost) : '—'}</td>
                  <td className="pr-4 text-slate-600">{isOpen ? <ChevronDown size={16} /> : <ChevronRight size={16} />}</td>
                </tr>
                {isOpen && (
                  <tr>
                    <td colSpan={7} className="bg-slate-50/70 px-6 py-3.5">
                      <div className="flex items-center gap-2 mb-3 flex-wrap" onClick={e => e.stopPropagation()}>
                        <span className="text-[11px] font-bold text-slate-900">分類:</span>
                        <select value={p.cat} onChange={e => setCat(p.name, e.target.value)}
                          className="h-9 px-2.5 rounded-lg border border-slate-200 bg-white text-xs shadow-sm font-bold text-slate-900">
                          {CATEGORY_NAMES.map(c => <option key={c} value={c}>{c}</option>)}
                        </select>
                        <span className={"text-[10px] font-bold px-2 py-1 rounded-full " +
                          (p.catSrc === '手動' ? 'bg-fuchsia-100 text-fuchsia-700' : p.catSrc === '学習' ? 'bg-teal-100 text-teal-700' : 'bg-slate-100 text-slate-800')}>
                          {p.catSrc === '手動' ? '手動で設定' : p.catSrc === '学習' ? '学習ルールで判定' : '商品名から自動判定'}
                        </span>
                        <span className="text-[10px] text-slate-900 font-semibold">同じ言葉を含む商品をまとめて分類したいときは 設定→商品分類 のキーワード学習ルールへ</span>
                      </div>

                      <div className="text-[11px] font-bold text-slate-900 uppercase tracking-wide mb-2">施設消費一覧（施設ごとに扱いを個別設定できます）</div>
                      <div className="flex gap-2 flex-wrap">
                        {p.breakdown.map((b, i) => (
                          <div key={i} className={"flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 border shadow-sm " +
                            (b.included ? 'bg-white border-slate-200/70' : 'bg-slate-100 border-slate-300')}>
                            <span className="text-sm font-bold text-slate-900">
                              {b.fac} <span className="font-extrabold tabular-nums text-slate-900">{fmtQty(b.avg)}{p.unit}</span>
                            </span>
                            <div className="inline-flex bg-slate-100 rounded-md p-0.5 gap-0.5">
                              {HANDLING_TYPES.map(h => (
                                <button key={h} onClick={() => setFacHandling(p.name, b.fac, h)}
                                  className={"text-[11px] font-bold px-1.5 py-0.5 rounded transition " +
                                    (b.handling === h
                                      ? (h === 'stock' ? 'bg-sky-500 text-white' : 'bg-violet-500 text-white')
                                      : 'text-slate-900 hover:text-slate-900')}>
                                  {HANDLING_LABELS[h].slice(0, 2)}
                                </button>
                              ))}
                            </div>
                          </div>
                        ))}
                        {p.breakdown.length === 0 && <span className="text-sm font-semibold text-slate-900">非直送施設への出荷実績がありません</span>}
                      </div>
                      <div className="text-[11px] text-slate-900 font-medium mt-1.5">
                        施設は商品全体の扱い（{HANDLING_LABELS[p.handling]}）を初期値として引き継ぎます。この施設だけ例外にしたい場合は、ボタンで個別に切り替えてください（白背景＝必要在庫の計算に含まれている施設）。
                      </div>

                      <div className="text-[11px] font-semibold text-slate-900 mt-3 tabular-nums flex items-center gap-1.5 flex-wrap" onClick={e => e.stopPropagation()}>
                        <span>計算: 月平均 {fmtQty(p.avg)}{p.unit} ×</span>
                        {editMonth === p.name ? (
                          <select autoFocus defaultValue={0.25}
                            onChange={e => { setStockMonth(p.name, parseFloat(e.target.value)); setEditMonth(null); }}
                            onBlur={() => setEditMonth(null)}
                            className="h-7 px-1.5 rounded-md border border-amber-300 bg-amber-50 text-xs font-bold text-amber-800 focus:outline-none">

                              (hasMonthOverride(p) ? 'bg-amber-100 text-amber-700 hover:bg-amber-200' : 'bg-slate-100 text-slate-900 hover:bg-slate-200')}>

                          </button>
                        )}
                        {hasMonthOverride(p) && (
                          <button onClick={() => clearStockMonth(p.name)} title="共通設定に戻す" className="text-slate-700 hover:text-rose-500 transition"><RotateCcw size={11} /></button>
                        )}
                        <span>回分 = <b className="text-sky-700">{rawCalc(p)}{p.unit}</b></span>
                        {hasOverride(p) && <span className="text-fuchsia-600 font-bold">（手動入力中: {calc(p)}{p.unit}）</span>}
                        <span>（最大月 {fmtQty(p.max)}{p.unit} は参考値）</span>
                      </div>
                      {p.avgPerOrder != null && (
                        <div className="text-[11px] font-semibold text-slate-900 mt-1 tabular-nums">
                          一回あたりの平均発注数: <b className="text-slate-900">{fmtQty(p.avgPerOrder)}{p.unit}</b>（対象期間中 {num(p.orderCount)}回の発注）
                        </div>
                      )}
                      <div className="text-[10px] text-slate-900 font-medium mt-2">受注発注は在庫を持たない商品です（商品全体の扱いは行の「扱い」ボタンから）</div>
                    </td>
                  </tr>
                )}
              </React.Fragment>
              );
            })}
            {visible.length === 0 && (
              <tr><td colSpan={7} className="px-5 py-10 text-center text-sm text-slate-700">該当する商品がありません（施設直送分は在庫集計の対象外です）</td></tr>
            )}
          </tbody>
        </table>
        {filtered.length > visible.length && (
          <div className="px-5 py-2.5 text-[11px] text-slate-700 border-t border-slate-50">出荷量の多い順に{visible.length}件を表示中（全{num(filtered.length)}件）— 検索で絞り込めます。CSV出力は全件が対象です</div>
        )}
      </Card>

      <div className="bg-sky-50/70 border border-sky-100 rounded-2xl px-5 py-4 text-xs text-slate-600 flex gap-3">
        <Info size={16} className="text-sky-500 shrink-0 mt-0.5" />
        <div className="leading-relaxed">
          <b className="text-slate-700">必要在庫 = 月平均出荷 × 在庫回数（1/4ヶ月・2/4ヶ月・1ヶ月など上のプルダウンで選択）</b> — 余剰在庫を持ちすぎないよう、直近実績の平均を基準にしています。数量は非直送施設への出荷実績のみで計算しています。<br />
          商品名をタップして開くと、<b className="text-slate-700">その商品だけ在庫回数を個別設定</b>できます（初期値1/4ヶ月）。個別設定していない商品は上のプルダウンの値がそのまま使われます。<br />
          <b className="text-slate-700">在庫品</b>＝営業所に在庫を置く商品（この必要在庫を目安に補充。全施設分の出荷実績を集計します）／<b className="text-slate-700">受注発注</b>＝注文が来てから仕入れる商品（初期値。月平均出荷・最大月は0のまま計算対象外）。商品全体の扱いは行の「扱い」ボタン、または絞り込み後の一括変更で切り替えられます。<br />
          商品名をタップして開くと、<b className="text-slate-700">施設ごとに個別の扱い</b>も設定できます（初期値は商品全体の扱いを引き継ぎ、例外にしたい施設だけ個別に切り替え可能です）。<br />
          <b className="text-violet-700">必要在庫が紫色</b>の表示は、右の鉛筆アイコンから<b className="text-slate-700">手動で数値を上書き</b>していることを示します（自動計算の結果を使わず、入力した数値が優先されます）。隣の<b className="text-slate-700">↻ボタン</b>で自動計算に戻せます。
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   画面6: データ取込（プレビュー確認 → 重複スキップして蓄積）
============================================================ */
const PREVIEW_COLS = [
  ['saleNo', '売上番号'], ['date', '売上日'], ['customer', 'お客様名'], ['product', '商品名'],
  ['qty', '数量'], ['unit', '単位'], ['amount', '金額'], ['gross', '粗利額'],
];
const PREVIEW_ARR_IDX = { saleNo: 0, date: 1, customer: 2, product: 3, qty: 4, unit: 5, amount: 7, gross: 8 };

// 取込の照合表示：CSVの金額合計 ＝ 新規追加 ＋ 重複スキップ。読み飛ばした行は合計に入らないので別に示す
function ImportReconcile({ log }) {
  if (!log || log.fileTotal == null) return null;
  const diff = log.fileTotal - log.addedTotal - log.skippedTotal;
  return (
    <div className="bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs text-slate-700 tabular-nums space-y-0.5">
      <div className="font-bold text-slate-800">金額の照合（税抜）</div>
      <div>CSVの金額合計（取り込める行） {yen(log.fileTotal)} ＝ 新規追加 {yen(log.addedTotal)} ＋ 重複スキップ {yen(log.skippedTotal)}
        {Math.abs(diff) >= 0.5
          ? <b className="text-rose-600">（差額 {yen(diff)}：要確認）</b>
          : <b className="text-emerald-700">（一致）</b>}
      </div>
      {log.bad > 0 && <div className="text-rose-700">読み飛ばした行 {num(log.bad)}行{log.badTotal ? '（金額が読めた分 ' + yen(log.badTotal) + '）' : ''}は上の合計に含まれていません</div>}
      {log.repFilled > 0 && <div>保存済みの明細 {num(log.repFilled)}行に、売上時点の担当者を補いました（金額は変えていません）</div>}
      {log.grossUnknown > 0 && <div>粗利額・仕入単価のない明細 {num(log.grossUnknown)}行は、粗利を「未確定」として扱います</div>}
    </div>
  );
}

// データ確認：売上の成果とは分けて、数字の確からしさに関わる件数を出す（点数にはまとめない）
function DataCheckCard({ rows, data, meta, goTab }) {
  const c = useMemo(() => {
    let grossNull = 0, grossNullSales = 0, retN = 0, retAmt = 0, discN = 0, discAmt = 0;
    const custs = data.custStats;
    for (const r of rows) {
      const amt = +r[7] || 0, qty = +r[4] || 0;
      if (r[8] === null || r[8] === undefined || r[8] === '') { grossNull++; grossNullSales += amt; }
      if (amt < 0) { if (qty < 0) { retN++; retAmt += amt; } else { discN++; discAmt += amt; } }
    }
    const other = data.products.filter(p => p.cat === 'その他' && p.winSales !== 0);
    const mixed = data.products.filter(p => p.mixedUnit);
    const unassigned = data.facilities.filter(f => !f.rep);
    // 取込済みの最初の月〜最後の月のうち、明細が1件もない月（取り込み漏れの可能性）
    const have = new Set(data.monthsAll);
    const gapMonths = [];
    for (let i = data.firstDate.idx; i <= data.latestDate.idx; i++) if (!have.has(i)) gapMonths.push(i);
    return {
      grossNull, grossNullSales, retN, retAmt, discN, discAmt, gapMonths,
      other, otherSales: other.reduce((t, p) => t + p.winSales, 0), mixed,
      unassigned, unassignedSales: unassigned.reduce((t, f) => t + f.winSum, 0),
      uncertain: custs.uncertain, noRepRows: data.facilities.reduce((t, f) => t + f.rows.length, 0) - data.repSaleRows,
    };
  }, [rows, data]);
  const last = meta && meta.imports && meta.imports.length ? meta.imports[meta.imports.length - 1] : null;
  const Row = ({ label, value, sub, warn, action }) => (
    <li className="flex items-start justify-between gap-3 py-2">
      <div className="min-w-0">
        <div className="text-xs font-bold text-slate-800">{label}</div>
        {sub && <div className="text-[11px] text-slate-600 leading-relaxed">{sub}</div>}
      </div>
      <div className="text-right shrink-0">
        <div className={"text-xs font-extrabold tabular-nums " + (warn ? 'text-amber-700' : 'text-slate-700')}>{value}</div>
        {action}
      </div>
    </li>
  );
  const toSettings = <button onClick={() => goTab('settings')} className="text-[11px] font-bold text-sky-700 hover:underline">設定で直す</button>;
  return (
    <Card className="p-5">
      <div className="font-bold text-sm text-slate-800 mb-0.5">データ確認</div>
      <div className="text-[11px] text-slate-600 mb-2">取込済みデータ {dataRangeLabel(data)}・明細 {num(rows.length)}行。売上の成果とは別に、数字の確からしさに関わる件数を示します。</div>
      <ul className="divide-y divide-slate-100">
        {data.thinLatest && (
          <Row label="一番新しい月の明細がわずか" value={num(data.thinLatest.rows) + '行'} warn
            sub={idxLabel(data.thinLatest.idx) + 'は ' + dateLabel(data.latestDate.idx, data.latestDate.d) + ' までで ' + num(data.thinLatest.rows) + '行（得意先' + num(data.thinLatest.customers) + '件）。この日までの目安は約' + num(data.thinLatest.expectedRows) + '行（ふだんの月は' + num(data.thinLatest.medianRows) + '行ほど）。基準月は自動で' + idxLabel(data.thinLatest.prevIdx) + 'にしています。最新のCSVを取り込むと解消します。'} />
        )}
        <Row label="明細が1件もない月（取り込み漏れの可能性）" value={num(c.gapMonths.length) + 'か月'} warn={c.gapMonths.length > 0}
          sub={c.gapMonths.length ? c.gapMonths.map(idxLabel).join('・') + '。この月を含む前年比較は「比較データ不足」になります。その月のCSVを取り込んでください。' : '取込済みの期間に、明細のない月はありません。'} />
        <Row label="粗利額・仕入単価のない明細（粗利が未確定）" value={num(c.grossNull) + '行'} warn={c.grossNull > 0}
          sub={c.grossNull ? '売上 ' + yen(c.grossNullSales) + ' 分。この明細を含む集計の粗利・粗利率は「未確定」と表示します。CSVに粗利額か仕入単価の列を含めて取り込み直してください。' : '以前の取込で粗利額列がなかった明細は0円として保存されているため、ここでは区別できません。'} />
        <Row label="分類「その他」の商品（直近12ヶ月に売上あり）" value={num(c.other.length) + '商品'} warn={c.other.length > 0}
          sub={c.other.length ? '売上 ' + yen(c.otherSales) + '。例：' + c.other.slice(0, 3).map(p => p.name).join('、') : ''} action={c.other.length > 0 && toSettings} />
        <Row label="担当未設定の施設" value={num(c.unassigned.length) + '施設'} warn={c.unassigned.length > 0}
          sub={c.unassigned.length ? '直近12ヶ月の売上 ' + yen(c.unassignedSales) + '。担当別では「未設定」の行に入ります（消さずに合計へ含めます）。' : ''} action={c.unassigned.length > 0 && toSettings} />
        <Row label="施設か個人か自動判定に自信がないお客様" value={num(c.uncertain) + '件'} warn={c.uncertain > 0} action={c.uncertain > 0 && toSettings} />
        <Row label="売上時点の担当者がない明細（施設分）" value={num(c.noRepRows) + '行'}
          sub="担当別の「売上時点の担当者」では「担当不明」の行に入ります。担当者列のあるCSVを取り込み直すと、金額を変えずに担当者だけ補います。" />
        <Row label="単位が2種類以上ある商品" value={num(c.mixed.length) + '商品'} warn={c.mixed.length > 0}
          sub={c.mixed.length ? '数量は合計せず「単位混在」と表示します。例：' + c.mixed.slice(0, 3).map(p => p.name + '（' + [...p.units].filter(Boolean).join('・') + '）').join('、') : ''} />
        <Row label="返品（数量マイナス）／値引き等（数量0以上で金額マイナス）" value={num(c.retN) + '行 ／ ' + num(c.discN) + '行'}
          sub={'返品 ' + yen(c.retAmt) + ' ／ 値引き等 ' + yen(c.discAmt) + '。CSVに区分列がないため数量の符号で分けています。取消・赤黒訂正は区別できません。'} />
      </ul>
      {last && (
        <div className="mt-3">
          <div className="text-[11px] font-bold text-slate-600 mb-1">直近の取込（{stampToLocalDate(last.at)}・{last.file}）</div>
          <ImportReconcile log={last} />
        </div>
      )}
    </Card>
  );
}

function ImportView({ rows, masters, setRows, setMasters, setMeta, docs, setDocs, showToast, data, meta, goTab }) {
  const [dragOver, setDragOver] = useState(false);
  const [preview, setPreview] = useState(null);
  const [result, setResult] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const fileRef = useRef(null);

  const doDeleteAll = () => {
    removeStorage([K.ROWS, K.MASTERS, K.META, K.DOCS]);
    setRows([]);
    setMasters(defaultMasters());
    setMeta({ schema: 1 });
    setDocs([]);
    setConfirmDelete(false);
    setResult(null);
    showToast('取り込んだデータを削除しました');
  };

  const runAnalyze = (text, fileName, encoding) => {
    setResult(null);
    const res = analyzeCsv(text, fileName, encoding);
    if (res.fatal) {
      setResult({ type: 'error', file: fileName, message: res.fatal, header: res.header });
      return;
    }
    if (res.rowsParsed.length === 0) {
      setResult({ type: 'error', file: fileName, message: '取り込める明細行がありません' + (res.badRows.length ? '（不正な行 ' + res.badRows.length + '行）' : '') });
      return;
    }
    setPreview(res);
  };

  const handleFile = (file) => {
    if (!file) return;
    file.arrayBuffer().then(buf => {
      const dec = decodeCsvBuffer(buf);
      runAnalyze(dec.text, file.name, dec.encoding);
    }).catch(() => setResult({ type: 'error', file: file.name, message: 'ファイルの読み込みに失敗しました' }));
  };

  const handlePaste = (e) => {
    e.preventDefault();
    const text = e.clipboardData.getData('text');
    if (!text.trim()) return;
    runAnalyze(text, 'クリップボードからの貼り付け', '貼り付け');
  };

  const doImport = () => {
    const p = preview;
    if (!p) return;
    const mg = mergeImportRows(rows, p.rowsParsed);
    const { added, skipped, addedTotal, skippedTotal } = mg;
    const changed = {};   // 新規・更新した顧客だけ
    const cur = masters.customers;
    for (let i = 0; i < p.rowsParsed.length; i++) {
      const pr = p.rowsParsed[i];
      const name = pr.arr[2];
      let c = changed[name] || cur[name];
      if (!c) {
        const cls = classifyCustomerName(name);
        c = { type: cls.type, rep: '', direct: false, uncertain: cls.uncertain };
        changed[name] = c;
      }
      if (pr.rep && !c.rep) changed[name] = { ...c, rep: pr.rep };  // CSVに担当者列があれば未設定のみ反映
    }
    if (mg.next !== rows) setRows(mg.next);
    if (Object.keys(changed).length) setMasters(prev => ({ ...prev, customers: { ...prev.customers, ...changed } }));
    // 取込ごとの照合記録（CSVの金額合計 ＝ 新規追加 ＋ 重複スキップ。読み飛ばした行は別に記録）
    const log = {
      at: new Date().toISOString(), file: p.fileName, period: p.period,
      rows: p.rowsParsed.length, bad: p.badRows.length, fileTotal: p.fileTotal, badTotal: p.badTotal,
      added: added.length, addedTotal, skipped, skippedTotal, repFilled: mg.repFilled,
      grossUnknown: p.grossUnknown, grossFromCost: p.grossFromCost,
    };
    setMeta(prev => ({ ...(prev || {}), schema: 1, lastImport: log.at, imports: [...(((prev || {}).imports) || []).slice(-19), log] }));

    const merged = { ...cur, ...changed };
    let fac = 0, per = 0, unc = 0, unas = 0;
    for (const n in merged) {
      const c = merged[n];
      if (c.type === 'facility') { fac++; if (!c.rep) unas++; } else per++;
      if (c.uncertain) unc++;
    }
    setResult({
      type: 'ok', file: p.fileName, encoding: p.encoding,
      rowsTotal: p.rowsParsed.length + p.badRows.length,
      added: added.length, skipped, bad: p.badRows, period: p.period,
      facilities: fac, persons: per, uncertain: unc, unassigned: unas, log,
    });
    setPreview(null);
    showToast(added.length ? num(added.length) + '行を取り込みました' : '新しい行はありませんでした（すべて重複スキップ）', added.length ? 'success' : 'info');
  };

  return (
    <div className="space-y-4 max-w-3xl">
      <div className="flex items-center justify-between gap-3 flex-wrap">
        <div className="text-xs text-slate-600 font-bold tabular-nums">現在の売上明細: {num(rows.length)}行</div>
        <button onClick={() => setConfirmDelete(true)} disabled={rows.length === 0}
          className={"px-3.5 py-2 rounded-xl shadow-sm text-xs font-bold transition inline-flex items-center gap-1.5 " +
            (rows.length === 0 ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-white border border-slate-200 text-rose-600 hover:border-rose-300 hover:bg-rose-50')}>
          <Trash2 size={13} /> 取り込んだデータを削除
        </button>
      </div>
      {rows.length > 0 && data && !data.empty && <DataCheckCard rows={rows} data={data} meta={meta} goTab={goTab} />}
      <div
        onDragOver={e => { e.preventDefault(); setDragOver(true); }}
        onDragLeave={() => setDragOver(false)}
        onDrop={e => { e.preventDefault(); setDragOver(false); handleFile(e.dataTransfer.files[0]); }}
        onClick={() => fileRef.current && fileRef.current.click()}
        className={"cursor-pointer rounded-3xl border-2 border-dashed px-6 py-14 text-center transition bg-white " +
          (dragOver ? 'border-emerald-400 bg-emerald-50/60 scale-[1.01]' : 'border-slate-200 hover:border-emerald-300 hover:bg-emerald-50/30')}>
        <span className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-50 text-emerald-500 mb-4">
          <FileUp size={28} />
        </span>
        <div className="font-extrabold text-slate-700">CSVファイルをここにドラッグ＆ドロップ</div>
        <div className="text-xs text-slate-600 mt-1.5">またはクリックしてファイルを選択 ・ 文字コードは自動判別（Shift-JIS / UTF-8）</div>
        <input ref={fileRef} type="file" accept=".csv,.txt" className="hidden"
          onChange={e => { handleFile(e.target.files[0]); e.target.value = ''; }} />
      </div>

      <div className="flex items-center gap-3 text-[11px] text-slate-600 font-bold">
        <div className="flex-1 border-t border-slate-200" />
        または
        <div className="flex-1 border-t border-slate-200" />
      </div>

      <Card className="p-5">
        <div className="text-sm font-bold text-slate-700 mb-2.5 inline-flex items-center gap-2">
          <span className="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-slate-100 text-slate-700"><ClipboardPaste size={14} /></span>
          Excelからコピーした表を貼り付け
        </div>
        <textarea rows={3} placeholder="ここにコピーした表を貼り付けてください（Ctrl+V）・1行目は列名（見出し）を含めてください" value="" onChange={() => {}}
          onPaste={handlePaste}
          className="w-full rounded-xl border border-slate-200 p-3 text-sm resize-y focus:border-blue-400 focus:outline-none transition" />
      </Card>

      {result && result.type === 'error' && (
        <Card className="overflow-hidden border-rose-200">
          <div className="bg-rose-50 px-5 py-3.5 border-b border-rose-100 flex items-center gap-2.5">
            <AlertTriangle size={18} className="text-rose-500" />
            <span className="font-bold text-sm text-rose-700">取込できませんでした</span>
          </div>
          <div className="p-5 space-y-2 text-sm text-slate-600">
            <div>📄 {result.file}</div>
            <div className="text-rose-600 font-bold">{result.message}</div>
            {result.header && (
              <div className="text-xs text-slate-600 leading-relaxed">読み取った列名: {result.header.join(' / ')}</div>
            )}
            <div className="text-xs text-slate-600">販売管理システムの「売上照会」画面からCSV出力したファイルをそのまま入れてください。</div>
          </div>
        </Card>
      )}

      {result && result.type === 'ok' && (
        <Card className="overflow-hidden border-emerald-200">
          <div className="bg-gradient-to-r from-emerald-50 to-teal-50 px-5 py-3.5 border-b border-emerald-100 flex items-center gap-2.5">
            <CheckCircle2 size={18} className="text-emerald-500" />
            <span className="font-bold text-sm text-emerald-800">取込が完了しました</span>
          </div>

  const p = data.prodByName.get(prodName);
  if (!p || !p.pairs || !p.pairs.length) return null;

  for (const pair of p.pairs) {

// 利益率(%) = (価格-仕入)/価格*100。仕入・利益率から価格を逆算する式も用意。
const marginPctOf = (price, cost) => (price > 0 ? Math.round((price - cost) / price * 1000) / 10 : 0);
const priceFromMargin = (marginPct, cost) => {
  const r = Number(marginPct) / 100;
  if (!(r < 1)) return Math.round(cost) || 0;
  return Math.max(0, Math.round((Number(cost) || 0) / (1 - r)));
};
// 数値<input>の先頭に余分な0が残る問題（controlled inputでReactが同値と判断しDOM表示を

};
