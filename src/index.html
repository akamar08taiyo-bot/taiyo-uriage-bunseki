/* ============================================================
   画面5: 適正在庫（必要在庫 = 月平均出荷 × 在庫回数。余剰在庫を持たない設計）
============================================================ */
const HANDLING_PILL = {
  stock: 'bg-sky-50 text-sky-600',
  order: 'bg-violet-50 text-violet-600',
  direct: 'bg-amber-50 text-amber-600',
};

function StockView({ data, masters, setMasters, showToast, openPrint }) {
  const [period, setPeriod] = useState(6);
  // 初期タブ: 在庫品がまだ1件も選ばれていなければ「受注発注」を開いて分類作業から始めてもらう
  const [handlingTab, setHandlingTab] = useState(() =>
    (Object.values(masters.itemHandling).some(v => v === 'stock') ? 'stock' : 'order'));
  const [catFilter, setCatFilter] = useState('all');
  const [search, setSearch] = useState('');
  const [openProd, setOpenProd] = useState(null);
  const months = Math.max(0.5, +masters.settings.stockMonths || 1);
  const setMonths = (v) => setMasters(prev => ({ ...prev, settings: { ...prev.settings, stockMonths: v } }));
  const setHandling = (name, h) => setMasters(prev => {
    const ih = { ...prev.itemHandling };
    if (h === HANDLING_DEFAULT) delete ih[name]; else ih[name] = h;
    return { ...prev, itemHandling: ih };
  });
  const setCat = (name, v) => setMasters(prev => {
    const co = { ...prev.catOverrides };
    if (v === resolveCategory(name, {}, prev.catRules).cat) delete co[name]; else co[name] = v;
    return { ...prev, catOverrides: co };
  });

  // 非直送施設への出荷実績から商品ごとの在庫指標を計算
  const stockAll = useMemo(() => {
    const start = 12 - period;
    const list = [];
    for (const p of data.products) {
      const slice = p.qtyND12.slice(start);
      let tot = 0;
      for (let i = 0; i < slice.length; i++) tot += slice[i];
      if (tot <= 0) continue;
      const avg = tot / period;
      const mx = Math.max(...slice);
      const cost = p.cost > 0 ? p.cost : 0;
      const breakdown = p.pairs.filter(x => !x.direct)
        .map(x => { const s2 = x.qty12.slice(start); let t = 0; for (let i = 0; i < s2.length; i++) t += s2[i]; return [x.fac, t / period]; })
        .filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, 6);
      list.push({
        name: p.name, cat: p.cat, catSrc: p.catSrc, unit: p.unit || '', supplier: p.supplier || '（仕入先未設定）',
        avg, max: mx, cost, breakdown, tot,
        handling: handlingOf(p.name, masters.itemHandling),
        classified: masters.itemHandling[p.name] !== undefined,
      });
    }
    list.sort((a, b) => b.tot - a.tot);
    return list;
  }, [data, masters, period]);

  const counts = useMemo(() => {
    const c = { stock: 0, order: 0, direct: 0, done: 0 };
    stockAll.forEach(p => { c[p.handling]++; if (p.classified) c.done++; });
    return c;
  }, [stockAll]);

  const filtered = useMemo(() => {
    let list = handlingTab === 'all' ? stockAll : stockAll.filter(p => p.handling === handlingTab);
    if (catFilter !== 'all') list = list.filter(p => p.cat === catFilter);
    const q = search.trim();
    if (q) list = list.filter(p => p.name.includes(q) || p.supplier.includes(q));
    return list;
  }, [stockAll, handlingTab, catFilter, search]);
  const visible = filtered.slice(0, 100);

  const calc = (p) => Math.max(0, Math.ceil(p.avg * months));

  // 絞り込み中の商品をまとめて分類（例:「部材」を全部 受注発注 にする）
  const bulkHandling = (h) => {
    if (filtered.length === 0) return;
    setMasters(prev => {
      const ih = { ...prev.itemHandling };
      filtered.forEach(p => { if (h === HANDLING_DEFAULT) delete ih[p.name]; else ih[p.name] = h; });
      return { ...prev, itemHandling: ih };
    });
    showToast(num(filtered.length) + '件を「' + HANDLING_LABELS[h] + '」にしました');
  };

  const handleCsv = () => {
    const head = ['商品名', '分類', '扱い', '仕入先', '単位', '月平均出荷', '最大月出荷', '必要在庫', '仕入単価'];
    const lines = filtered.map(p => [
      p.name, p.cat, HANDLING_LABELS[p.handling], p.supplier, p.unit,
      fmtQty(p.avg), fmtQty(p.max), calc(p), p.cost,
    ]);
    downloadText('適正在庫_' + todayCompact() + '.csv', buildCsv([head, ...lines]), 'text/csv');
    showToast('CSVを出力しました（Excelでそのまま開けます）');
  };

  return (
    <div className="space-y-4">
      <Card className="px-5 py-4 flex items-center gap-5 flex-wrap">
        <span className="text-sm font-bold text-slate-500">計算条件</span>
        <label className="inline-flex items-center gap-2 text-sm text-slate-600 font-bold">
          在庫回数
          <input type="number" min="0.5" max="12" step="0.5" value={months}
            onChange={e => setMonths(Math.max(0.5, parseFloat(e.target.value || '1')))}
            className="h-10 w-16 px-2 rounded-xl border border-amber-300 bg-amber-50 text-right tabular-nums font-bold text-amber-800 focus:outline-none focus:border-amber-400" />
          回分
        </label>
        <label className="inline-flex items-center gap-2 text-sm text-slate-600 font-bold">
          対象期間
          <select value={period} onChange={e => setPeriod(+e.target.value)}
            className="h-10 px-3 rounded-xl border border-slate-200 bg-white text-sm shadow-sm font-bold text-slate-600">
            <option value={6}>過去6ヶ月</option>
            <option value={12}>過去12ヶ月</option>
          </select>
        </label>
        <div className="ml-auto">
          <button onClick={handleCsv}
            className="bg-teal-600 hover:bg-teal-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-teal-200 text-sm font-bold transition inline-flex items-center gap-1.5">
            <FileSpreadsheet size={15} /> CSV出力
          </button>
        </div>
      </Card>

      {/* 分類作業のすすめ（在庫品がまだ選ばれていないときは強めに案内） */}
      <div className={"rounded-2xl px-5 py-4 flex gap-3 border " +
        (counts.stock === 0 ? 'bg-amber-50 border-amber-200' : 'bg-sky-50/70 border-sky-100')}>
        {counts.stock === 0
          ? <AlertTriangle size={18} className="text-amber-500 shrink-0 mt-0.5" />
          : <CheckCircle2 size={18} className="text-sky-500 shrink-0 mt-0.5" />}
        <div className="flex-1 text-xs leading-relaxed text-slate-600">
          <b className={counts.stock === 0 ? 'text-amber-800' : 'text-slate-700'}>
            {counts.stock === 0
              ? 'まず「営業所で在庫を持つ商品」を選んでください'
              : '在庫品 ' + num(counts.stock) + '件を登録済みです'}
          </b>
          <div className="mt-1">
            すべての商品は最初<b className="text-violet-700">受注発注（在庫を持たない）</b>から始まります。
            下の一覧で在庫を置く商品だけを<b className="text-sky-700">在庫品</b>に変えてください。必要在庫の計算対象は在庫品だけです。
          </div>
          <div className="mt-2 flex items-center gap-2 flex-wrap">
            <span className="text-[11px] text-slate-500 font-bold tabular-nums">分類済み {num(counts.done)} / {num(stockAll.length)}件</span>
            <div className="w-40 bg-white rounded-full h-1.5 overflow-hidden border border-slate-200">
              <div className="bg-sky-400 h-full rounded-full" style={{ width: (stockAll.length ? Math.round(counts.done / stockAll.length * 100) : 0) + '%' }} />
            </div>
            <span className="text-[11px] text-slate-400">在庫品 {num(counts.stock)} ／ 受注発注 {num(counts.order)} ／ 直送品 {num(counts.direct)}</span>
          </div>
        </div>
      </div>

      <div className="flex items-center gap-2.5 flex-wrap">
        <Segmented value={handlingTab} onChange={setHandlingTab}
          options={[['stock', '在庫品 ' + counts.stock], ['order', '受注発注 ' + counts.order], ['direct', '直送品 ' + counts.direct], ['all', 'すべて']]} />
        <select value={catFilter} onChange={e => setCatFilter(e.target.value)}
          className="h-10 px-3 rounded-xl border border-slate-200 bg-white text-sm shadow-sm font-bold text-slate-600">
          <option value="all">すべての分類</option>
          {CATEGORY_NAMES.map(c => <option key={c} value={c}>{c}</option>)}
        </select>
        <div className="relative">
          <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="商品名・仕入先で検索"
            className="h-10 pl-9 pr-3 rounded-xl border border-slate-200 text-sm w-52 bg-white shadow-sm focus:border-blue-400 focus:outline-none transition" />
        </div>
      </div>

      {(catFilter !== 'all' || search.trim()) && filtered.length > 0 && (
        <div className="flex items-center gap-2 bg-white border border-slate-200/70 rounded-2xl px-5 py-3 flex-wrap shadow-sm">
          <span className="text-xs font-bold text-slate-500 tabular-nums">絞り込み中の {num(filtered.length)}件をまとめて:</span>
          {['stock', 'order', 'direct'].map(h => (
            <button key={h} onClick={() => bulkHandling(h)}
              className={"text-xs font-bold px-3 py-1.5 rounded-full transition text-white " +
                (h === 'stock' ? 'bg-sky-600 hover:bg-sky-700' : h === 'order' ? 'bg-violet-600 hover:bg-violet-700' : 'bg-amber-600 hover:bg-amber-700')}>
              {HANDLING_LABELS[h]}にする
            </button>
          ))}
        </div>
      )}

      <Card className="overflow-x-auto">
        <table className="w-full text-sm min-w-[900px]">
          <thead>
            <tr className="text-[11px] uppercase tracking-wide text-slate-400 border-b border-slate-100">
              <th className="text-left font-bold px-5 py-3">商品名</th>
              <th className="text-left font-bold px-2 py-3 w-[190px]">扱い</th>
              <th className="text-right font-bold px-2 py-3 pr-4">月平均出荷</th>
              <th className="text-right font-bold px-2 py-3 pr-4">最大月</th>
              <th className="text-right font-bold px-2 py-3 pr-4">必要在庫</th>
              <th className="text-right font-bold px-2 py-3 pr-4">仕入単価</th>
              <th className="text-left font-bold px-2 py-3">単位</th>
              <th className="w-10"></th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-50">
            {visible.map(p => (
              <React.Fragment key={p.name}>
                <tr onClick={() => setOpenProd(openProd === p.name ? null : p.name)}
                  className={"cursor-pointer transition " + (openProd === p.name ? 'bg-sky-50/80' : 'hover:bg-slate-50')}>
                  <td className="px-5 py-3">
                    <div className="font-bold text-slate-700">{p.name}</div>
                    <div className="text-[10px] text-slate-400 flex items-center gap-1.5">
                      <span className="bg-slate-100 text-slate-600 font-bold px-1.5 py-0.5 rounded-md">{p.cat}</span>
                      <span className={"font-bold " + (p.catSrc === '手動' ? 'text-fuchsia-500' : p.catSrc === '学習' ? 'text-teal-500' : 'text-slate-300')}>{p.catSrc}</span>
                      {p.supplier}
                    </div>
                  </td>
                  <td className="px-2 py-3" onClick={e => e.stopPropagation()}>
                    <div className="inline-flex bg-slate-100 rounded-lg p-0.5 gap-0.5">
                      {['stock', 'order', 'direct'].map(h => (
                        <button key={h} onClick={() => setHandling(p.name, h)}
                          className={"text-[10px] font-bold px-2 py-1 rounded-md transition " +
                            (p.handling === h
                              ? (h === 'stock' ? 'bg-sky-500 text-white shadow-sm' : h === 'order' ? 'bg-violet-500 text-white shadow-sm' : 'bg-amber-500 text-white shadow-sm')
                              : 'text-slate-500 hover:text-slate-700')}>
                          {HANDLING_LABELS[h]}
                        </button>
                      ))}
                    </div>
                  </td>
                  <td className="px-2 py-3 pr-4 text-right tabular-nums text-slate-500">{fmtQty(p.avg)}</td>
                  <td className="px-2 py-3 pr-4 text-right tabular-nums text-slate-500">{fmtQty(p.max)}</td>
                  <td className="px-2 py-3 pr-4 text-right">
                    <span className="bg-sky-100 text-sky-700 font-extrabold tabular-nums px-2.5 py-1 rounded-lg">{calc(p)}</span>
                  </td>
                  <td className="px-2 py-3 pr-4 text-right tabular-nums text-slate-500">{p.cost > 0 ? yen(p.cost) : '—'}</td>
                  <td className="px-2 py-3 text-slate-400 text-xs font-bold">{p.unit}</td>
                  <td className="pr-4 text-slate-300">{openProd === p.name ? <ChevronDown size={16} /> : <ChevronRight size={16} />}</td>
                </tr>
                {openProd === p.name && (
                  <tr>
                    <td colSpan={8} className="bg-slate-50/70 px-6 py-3.5">
                      <div className="flex items-center gap-2 mb-3 flex-wrap" onClick={e => e.stopPropagation()}>
                        <span className="text-[11px] font-bold text-slate-400">分類:</span>
                        <select value={p.cat} onChange={e => setCat(p.name, e.target.value)}
                          className="h-9 px-2.5 rounded-lg border border-slate-200 bg-white text-xs shadow-sm font-bold text-slate-600">
                          {CATEGORY_NAMES.map(c => <option key={c} value={c}>{c}</option>)}
                        </select>
                        <span className={"text-[10px] font-bold px-2 py-1 rounded-full " +
                          (p.catSrc === '手動' ? 'bg-fuchsia-100 text-fuchsia-700' : p.catSrc === '学習' ? 'bg-teal-100 text-teal-700' : 'bg-slate-100 text-slate-400')}>
                          {p.catSrc === '手動' ? '手動で設定' : p.catSrc === '学習' ? '学習ルールで判定' : '商品名から自動判定'}
                        </span>
                        <span className="text-[10px] text-slate-400">同じ言葉を含む商品をまとめて分類したいときは 設定→商品分類 のキーワード学習ルールへ</span>
                      </div>
                      <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wide mb-2">内訳：非直送施設への月平均出荷</div>
                      <div className="flex gap-2 flex-wrap">
                        {p.breakdown.map(([f, q], i) => (
                          <span key={i} className="bg-white border border-slate-200/70 rounded-lg px-2.5 py-1 text-xs text-slate-600 shadow-sm">
                            {f} <span className="font-extrabold tabular-nums text-slate-800">{fmtQty(q)}{p.unit}</span>
                          </span>
                        ))}
                      </div>
                      <div className="text-[11px] text-slate-500 mt-2.5 tabular-nums">
                        計算: 月平均 {fmtQty(p.avg)}{p.unit} × {months}回分 = <b className="text-sky-700">{calc(p)}{p.unit}</b>（最大月 {fmtQty(p.max)}{p.unit} は参考値）
                      </div>
                      <div className="text-[10px] text-slate-400 mt-2">受注発注・直送品は在庫を持たない商品です（扱いの変更は行の「扱い」ボタンから）</div>
                    </td>
                  </tr>
                )}
              </React.Fragment>
            ))}
            {visible.length === 0 && (
              <tr><td colSpan={8} className="px-5 py-10 text-center text-sm text-slate-400">該当する商品がありません（施設直送分は在庫集計の対象外です）</td></tr>
            )}
          </tbody>
        </table>
        {filtered.length > visible.length && (
          <div className="px-5 py-2.5 text-[11px] text-slate-400 border-t border-slate-50">出荷量の多い順に{visible.length}件を表示中（全{num(filtered.length)}件）— 検索で絞り込めます。CSV出力は全件が対象です</div>
        )}
      </Card>

      <div className="bg-sky-50/70 border border-sky-100 rounded-2xl px-5 py-4 text-xs text-slate-600 flex gap-3">
        <Info size={16} className="text-sky-500 shrink-0 mt-0.5" />
        <div className="leading-relaxed">
          <b className="text-slate-700">必要在庫 = 月平均出荷 × 在庫回数（初期値は1回分＝1ヶ月分）</b> — 余剰在庫を持ちすぎないよう、直近実績の平均を基準にしています。数量は非直送施設への出荷実績のみで計算しています。<br />
          <b className="text-slate-700">在庫品</b>＝営業所に在庫を置く商品（この必要在庫を目安に補充）／<b className="text-slate-700">受注発注</b>＝注文が来てから仕入れる商品（初期値）／<b className="text-slate-700">直送品</b>＝仕入先から施設へ直接届く商品。分類は行の「扱い」ボタン、または絞り込み後の一括変更で切り替えられます。
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   画面6: データ取込（プレビュー確認 → 重複スキップして蓄積）
============================================================ */
const PREVIEW_COLS = [
  ['saleNo', '売上番号'], ['date', '売上日'], ['customer', 'お客様名'], ['product', '商品名'],
  ['qty', '数量'], ['unit', '単位'], ['amount', '金額'], ['gross', '粗利額'],
];
const PREVIEW_ARR_IDX = { saleNo: 0, date: 1, customer: 2, product: 3, qty: 4, unit: 5, amount: 7, gross: 8 };

function ImportView({ rows, masters, setRows, setMasters, setMeta, showToast }) {
  const [dragOver, setDragOver] = useState(false);
  const [preview, setPreview] = useState(null);
  const [result, setResult] = useState(null);
  const fileRef = useRef(null);

  const runAnalyze = (text, fileName, encoding) => {
    setResult(null);
    const res = analyzeCsv(text, fileName, encoding);
    if (res.fatal) {
      setResult({ type: 'error', file: fileName, message: res.fatal, header: res.header });
      return;
    }
    if (res.rowsParsed.length === 0) {
      setResult({ type: 'error', file: fileName, message: '取り込める明細行がありません' + (res.badRows.length ? '（不正な行 ' + res.badRows.length + '行）' : '') });
      return;
    }
    setPreview(res);
  };

  const handleFile = (file) => {
    if (!file) return;
    file.arrayBuffer().then(buf => {
      const dec = decodeCsvBuffer(buf);
      runAnalyze(dec.text, file.name, dec.encoding);
    }).catch(() => setResult({ type: 'error', file: file.name, message: 'ファイルの読み込みに失敗しました' }));
  };

  const handlePaste = (e) => {
    e.preventDefault();
    const text = e.clipboardData.getData('text');
    if (!text.trim()) return;
    runAnalyze(text, 'クリップボードからの貼り付け', '貼り付け');
  };

  const doImport = () => {
    const p = preview;
    if (!p) return;
    const remaining = rowKeyCounts(rows);
    const added = [];
    let skipped = 0;
    const changed = {};   // 新規・更新した顧客だけ
    const cur = masters.customers;
    for (let i = 0; i < p.rowsParsed.length; i++) {
      const pr = p.rowsParsed[i];
      const name = pr.arr[2];
      let c = changed[name] || cur[name];
      if (!c) {
        const cls = classifyCustomerName(name);
        c = { type: cls.type, rep: '', direct: false, uncertain: cls.uncertain };
        changed[name] = c;
      }
      if (pr.rep && !c.rep) changed[name] = { ...c, rep: pr.rep };  // CSVに担当者列があれば未設定のみ反映
      const k = rowKey(pr.arr);
      const rem = remaining.get(k) || 0;
      if (rem > 0) { remaining.set(k, rem - 1); skipped++; continue; }
      added.push(pr.arr);
    }
    if (added.length) setRows(prev => [...prev, ...added]);
    if (Object.keys(changed).length) setMasters(prev => ({ ...prev, customers: { ...prev.customers, ...changed } }));
    setMeta(prev => ({ ...(prev || {}), schema: 1, lastImport: new Date().toISOString() }));

    const merged = { ...cur, ...changed };
    let fac = 0, per = 0, unc = 0, unas = 0;
    for (const n in merged) {
      const c = merged[n];
      if (c.type === 'facility') { fac++; if (!c.rep) unas++; } else per++;
      if (c.uncertain) unc++;
    }
    setResult({
      type: 'ok', file: p.fileName, encoding: p.encoding,
      rowsTotal: p.rowsParsed.length + p.badRows.length,
      added: added.length, skipped, bad: p.badRows, period: p.period,
      facilities: fac, persons: per, uncertain: unc, unassigned: unas,
    });
    setPreview(null);
    showToast(added.length ? num(added.length) + '行を取り込みました' : '新しい行はありませんでした（すべて重複スキップ）', added.length ? 'success' : 'info');
  };

  return (
    <div className="space-y-4 max-w-3xl">
      <div
        onDragOver={e => { e.preventDefault(); setDragOver(true); }}
        onDragLeave={() => setDragOver(false)}
        onDrop={e => { e.preventDefault(); setDragOver(false); handleFile(e.dataTransfer.files[0]); }}
        onClick={() => fileRef.current && fileRef.current.click()}
        className={"cursor-pointer rounded-3xl border-2 border-dashed px-6 py-14 text-center transition bg-white " +
          (dragOver ? 'border-emerald-400 bg-emerald-50/60 scale-[1.01]' : 'border-slate-200 hover:border-emerald-300 hover:bg-emerald-50/30')}>
        <span className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-50 text-emerald-500 mb-4">
          <FileUp size={28} />
        </span>
        <div className="font-extrabold text-slate-700">CSVファイルをここにドラッグ＆ドロップ</div>
        <div className="text-xs text-slate-400 mt-1.5">またはクリックしてファイルを選択 ・ 文字コードは自動判別（Shift-JIS / UTF-8）</div>
        <input ref={fileRef} type="file" accept=".csv,.txt" className="hidden"
          onChange={e => { handleFile(e.target.files[0]); e.target.value = ''; }} />
      </div>

      <div className="flex items-center gap-3 text-[11px] text-slate-400 font-bold">
        <div className="flex-1 border-t border-slate-200" />
        または
        <div className="flex-1 border-t border-slate-200" />
      </div>

      <Card className="p-5">
        <div className="text-sm font-bold text-slate-700 mb-2.5 inline-flex items-center gap-2">
          <span className="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-slate-100 text-slate-500"><ClipboardPaste size={14} /></span>
          Excelからコピーした表を貼り付け
        </div>
        <textarea rows={3} placeholder="ここにコピーした表を貼り付けてください（Ctrl+V）・1行目は列名（見出し）を含めてください" value="" onChange={() => {}}
          onPaste={handlePaste}
          className="w-full rounded-xl border border-slate-200 p-3 text-sm resize-y focus:border-blue-400 focus:outline-none transition" />
      </Card>

      {result && result.type === 'error' && (
        <Card className="overflow-hidden border-rose-200">
          <div className="bg-rose-50 px-5 py-3.5 border-b border-rose-100 flex items-center gap-2.5">
            <AlertTriangle size={18} className="text-rose-500" />
            <span className="font-bold text-sm text-rose-700">取込できませんでした</span>
          </div>
          <div className="p-5 space-y-2 text-sm text-slate-600">
            <div>📄 {result.file}</div>
            <div className="text-rose-600 font-bold">{result.message}</div>
            {result.header && (
              <div className="text-xs text-slate-400 leading-relaxed">読み取った列名: {result.header.join(' / ')}</div>
            )}
            <div className="text-xs text-slate-400">販売管理システムの「売上照会」画面からCSV出力したファイルをそのまま入れてください。</div>
          </div>
        </Card>
      )}

      {result && result.type === 'ok' && (
        <Card className="overflow-hidden border-emerald-200">
          <div className="bg-gradient-to-r from-emerald-50 to-teal-50 px-5 py-3.5 border-b border-emerald-100 flex items-center gap-2.5">
            <CheckCircle2 size={18} className="text-emerald-500" />
            <span className="font-bold text-sm text-emerald-800">取込が完了しました</span>
          </div>
          <div className="p-5 space-y-2.5 text-sm text-slate-600">
            <div className="tabular-nums">📄 {result.file} — <b className="text-slate-800">{num(result.rowsTotal)}行</b>を読み込みました（{result.encoding}）</div>
            <div className="tabular-nums">新規追加: <b className="text-slate-800">{num(result.added)}行</b> ／ 重複スキップ: <b className="text-slate-800">{num(result.skipped)}行</b>（売上番号＋商品名＋数量＋金額で重複判定）</div>
            <div className="tabular-nums">期間: {result.period} ／ 施設: {num(result.facilities)}件 ／ 個人（集計対象外）: {num(result.persons)}件</div>
            {result.bad.length > 0 && (
              <div className="bg-rose-50 border border-rose-100 rounded-xl px-4 py-2.5 text-xs text-rose-700">
                <b>読み飛ばした行: {num(result.bad.length)}行</b>
                <ul className="mt-1 space-y-0.5">
                  {result.bad.slice(0, 5).map((b, i) => <li key={i} className="tabular-nums">{b.line}行目: {b.reason}</li>)}
                  {result.bad.length > 5 && <li>…他 {num(result.bad.length - 5)}行</li>}
                </ul>
              </div>
            )}
            {result.uncertain > 0 && (
              <div className="flex items-center gap-2.5 bg-sky-50 border border-sky-200 rounded-xl px-4 py-2.5 text-sky-800 text-xs font-bold">
                <Info size={15} className="shrink-0" />
                施設か個人か自動判定に自信がないお客様が {num(result.uncertain)}件 あります → 設定画面の「施設/個人判定」でご確認ください
              </div>
            )}
            {result.unassigned > 0 && (
              <div className="flex items-center gap-2.5 bg-amber-50 border border-amber-200 rounded-xl px-4 py-2.5 text-amber-800 text-xs font-bold">
                <AlertTriangle size={15} className="shrink-0" />
                担当者が未設定の施設が {num(result.unassigned)}件 あります → 設定画面の「担当者対応表」で設定してください
              </div>
            )}
          </div>
        </Card>
      )}

      <div className="bg-blue-50/70 border border-blue-100 rounded-2xl px-5 py-4 text-xs text-slate-600 flex gap-3">
        <Info size={16} className="text-blue-500 shrink-0 mt-0.5" />
        <div className="leading-relaxed">
          取込は<b className="text-slate-700">蓄積型</b>です。同じCSVを二度入れても、売上番号＋商品名＋数量＋金額で重複を自動スキップするので二重計上になりません。<br />
          取込前に先頭5行のプレビュー確認画面を挟みます。マイナスの行（返品・赤伝）はそのまま取り込むと自動で相殺されます。
        </div>
      </div>

      {/* 取込プレビュー確認モーダル */}
      {preview && (
        <div className="fixed inset-0 z-40 bg-slate-600/50 backdrop-blur-sm overflow-auto py-8 px-4 no-print">
          <div className="max-w-3xl mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden">
            <div className="px-6 py-4 border-b border-slate-100 flex items-center gap-3 bg-gradient-to-r from-emerald-50 to-teal-50">
              <span className="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-emerald-100 text-emerald-600"><FileSpreadsheet size={17} /></span>
              <div className="flex-1 min-w-0">
                <div className="font-extrabold text-slate-800">取込内容の確認</div>
                <div className="text-[11px] text-slate-400 truncate">{preview.fileName}（{preview.encoding}）</div>
              </div>
              <button onClick={() => setPreview(null)} className="text-slate-400 hover:text-slate-600 transition"><X size={20} /></button>
            </div>
            <div className="px-6 py-4 space-y-4 max-h-[55vh] overflow-y-auto">
              <div className="flex gap-2 flex-wrap text-xs">
                <span className="bg-slate-100 text-slate-600 font-bold px-2.5 py-1 rounded-full tabular-nums">明細 {num(preview.rowsParsed.length)}行</span>
                <span className="bg-slate-100 text-slate-600 font-bold px-2.5 py-1 rounded-full tabular-nums">期間 {preview.period}</span>
                {preview.badRows.length > 0 && (
                  <span className="bg-rose-50 text-rose-600 font-bold px-2.5 py-1 rounded-full tabular-nums">不正な行 {num(preview.badRows.length)}行（読み飛ばします）</span>
                )}
              </div>
              <div>
                <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wide mb-2">列の対応（列名で自動対応付け）</div>
                <div className="flex gap-1.5 flex-wrap">
                  {[...REQUIRED_COLS, ...OPTIONAL_COLS].map(([key, names]) => (
                    <span key={key} className={"text-[11px] font-bold px-2 py-1 rounded-lg border " +
                      (preview.found[key] ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : 'bg-slate-50 border-slate-200 text-slate-400')}>
                      {preview.found[key] ? '✓ ' : '— '}{colLabel(names)}
                    </span>
                  ))}
                </div>
              </div>
              <div>
                <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wide mb-2">先頭5行のプレビュー</div>
                <div className="overflow-x-auto rounded-xl border border-slate-100">
                  <table className="w-full text-xs min-w-[640px]">
                    <thead>
                      <tr className="text-[10px] uppercase tracking-wide text-slate-400 bg-slate-50/70">
                        {PREVIEW_COLS.map(([k, label]) => <th key={k} className="text-left font-bold px-2.5 py-2 whitespace-nowrap">{label}</th>)}
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-50">
                      {preview.rowsParsed.slice(0, 5).map((pr, i) => (
                        <tr key={i}>
                          {PREVIEW_COLS.map(([k]) => (
                            <td key={k} className="px-2.5 py-1.5 text-slate-600 whitespace-nowrap max-w-[180px] overflow-hidden text-ellipsis tabular-nums">
                              {String(pr.arr[PREVIEW_ARR_IDX[k]])}
                            </td>
                          ))}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
              {preview.badRows.length > 0 && (
                <div className="bg-rose-50 border border-rose-100 rounded-xl px-4 py-2.5 text-xs text-rose-700">
                  <b>読み飛ばす行の例:</b>
                  <ul className="mt-1 space-y-0.5">
                    {preview.badRows.slice(0, 3).map((b, i) => <li key={i} className="tabular-nums">{b.line}行目: {b.reason}</li>)}
                  </ul>
                </div>
              )}
            </div>
            <div className="px-6 py-3 bg-sky-50/70 text-[11px] text-slate-500 leading-relaxed border-t border-sky-100">
              「取り込む」を押すと、すでに保存済みの明細と重複する行は自動でスキップされ、新しい行だけが追加されます。
            </div>
            <div className="px-6 py-4 flex gap-2 justify-end border-t border-slate-100">
              <button onClick={doImport}
                className="bg-emerald-600 hover:bg-emerald-700 active:scale-[.98] text-white px-5 py-2.5 rounded-xl shadow-sm shadow-emerald-200 text-sm font-bold transition inline-flex items-center gap-1.5">
                <CheckCircle2 size={15} /> 取り込む（{num(preview.rowsParsed.length)}行）
              </button>
              <button onClick={() => setPreview(null)}
                className="bg-rose-600 hover:bg-rose-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-rose-200 text-sm font-bold transition inline-flex items-center gap-1.5">
                <X size={15} /> キャンセル
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   画面: 発注書作成 / 見積書作成（共通コンポーザー）
   - 商品マスタは販売履歴から自動生成。種別（分類）と検索で絞り込み
   - 施設は履歴から選ぶほか、新規施設名を直接入力できる
   - 直近の販売価格（この施設向け優先）を初期単価にする
   - 全項目（施設名・商品名・数量・単位・単価・日付・備考・表題）を編集できる
   - 保存すると次回そのまま呼び出して編集できる（印刷 / PDF保存の両方に対応）
============================================================ */
const DEFAULT_ORDER_NOTE = '・納品希望日：　　月　　日（ご記入ください）\n・数量欄にご記入のうえ、ご返送ください。\n・ご不明な点は担当までお問い合わせください。';
const DEFAULT_QUOTE_NOTE = '・納期：ご注文後、通常2〜3営業日\n・支払条件：月末締め翌月末払い\n・有効期限：お見積日より30日間\n・消費税は10%で計算しております。非課税商品が含まれる場合は担当までご確認ください。';
const newDocDraft = (type, facility) => ({
  id: null,
  facility: facility || '',
  title: type === 'quote' ? '御　見　積　書' : '発　注　書',
  issued: todayISO(),
  note: type === 'quote' ? DEFAULT_QUOTE_NOTE : DEFAULT_ORDER_NOTE,
  items: [],
  showPrices: type === 'quote',
});
const isoToJa = (iso) => {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
  return m ? +m[1] + '年' + +m[2] + '月' + +m[3] + '日' : todayLabel();
};

function DocComposer({ docType, data, masters, draft, setDraft, docs, setDocs, showToast, openPrint }) {
  const isQuote = docType === 'quote';
  const [source, setSource] = useState('fac');
  const [cat, setCat] = useState('all');
  const [search, setSearch] = useState('');
  const [showSaved, setShowSaved] = useState(false);
  const [busy, setBusy] = useState(false);
  const [facSuggestOpen, setFacSuggestOpen] = useState(false);
  const facBoxRef = useRef(null);

  const facNames = useMemo(() =>
    data.facilities.map(f => f.name).sort((a, b) => a.localeCompare(b, 'ja')), [data]);
  const facSuggests = useMemo(() => {
    const q = String(draft.facility || '').trim();
    if (!q) return facNames.slice(0, 8);
    return facNames.filter(n => n.includes(q)).slice(0, 8);
  }, [facNames, draft.facility]);
  // 候補リストの外側をクリックしたら閉じる（施設別検索と同じ自作ドロップダウン方式。
  // ブラウザ標準の<datalist>は表示位置が崩れることがあるため使わない）
  useEffect(() => {
    if (!facSuggestOpen) return;
    const h = (e) => { if (facBoxRef.current && !facBoxRef.current.contains(e.target)) setFacSuggestOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [facSuggestOpen]);
  const fac = draft.facility ? data.facByName.get(draft.facility) : null;
  const repName = fac ? fac.repName : '';
  const facPairs = useMemo(() => {
    const m = new Map();
    if (fac) fac.pairs.forEach(p => m.set(p.prod, p));
    return m;
  }, [fac]);
  const savedList = useMemo(() =>
    docs.filter(d => d.type === docType).sort((a, b) => (a.savedAt < b.savedAt ? 1 : -1)), [docs, docType]);

  // 商品マスタ（販売履歴から自動生成）
  const master = useMemo(() => {
    let list;
    const dstr = (d) => (d ? d.y + '/' + d.mo + '/' + d.d : null);
    if (source === 'fac' && fac) {
      list = fac.pairs.slice().sort((a, b) => sum12(b.sales12) - sum12(a.sales12)).map(p => {
        const prod = data.prodByName.get(p.prod);
        return {
          name: p.prod, cat: prod ? prod.cat : 'その他', unit: p.unit || (prod ? prod.unit : ''),
          price: p.lastPrice > 0 ? p.lastPrice : (prod ? prod.lastPrice : 0),
          priceSrc: p.lastPrice > 0 ? 'この施設' : '全体',
          last: dstr(p.lastDate),
        };
      });
    } else {
      list = data.products.slice().sort((a, b) => b.winSales - a.winSales).map(prod => {
        const pair = facPairs.get(prod.name);
        return {
          name: prod.name, cat: prod.cat, unit: prod.unit,
          price: pair && pair.lastPrice > 0 ? pair.lastPrice : prod.lastPrice,
          priceSrc: pair && pair.lastPrice > 0 ? 'この施設' : '全体',
          last: pair ? dstr(pair.lastDate) : null,
        };
      });
    }
    if (cat !== 'all') list = list.filter(x => x.cat === cat);
    const q = search.trim();
    if (q) list = list.filter(x => x.name.includes(q));
    return list;
  }, [data, fac, facPairs, source, cat, search]);
  const visibleMaster = master.slice(0, 40);
  const inItems = useMemo(() => new Set(draft.items.map(i => i.name)), [draft.items]);

  const patch = (p) => setDraft(prev => ({ ...prev, ...p }));
  const addItem = (m) => {
    if (inItems.has(m.name)) { showToast('「' + m.name + '」はすでに明細にあります', 'info'); return; }
    setDraft(prev => ({ ...prev, items: [...prev.items, { name: m.name, qty: isQuote ? 1 : '', unit: m.unit || '', price: Math.round(m.price) || 0 }] }));
  };
  const addBlank = () => setDraft(prev => ({ ...prev, items: [...prev.items, { name: '', qty: isQuote ? 1 : '', unit: '', price: 0 }] }));
  const setItem = (idx, p) => setDraft(prev => ({ ...prev, items: prev.items.map((it, i) => (i === idx ? { ...it, ...p } : it)) }));
  const delItem = (idx) => setDraft(prev => ({ ...prev, items: prev.items.filter((_, i) => i !== idx) }));
  const moveItem = (idx, dir) => setDraft(prev => {
    const j = idx + dir;
    if (j < 0 || j >= prev.items.length) return prev;
    const arr = prev.items.slice();
    const t = arr[idx]; arr[idx] = arr[j]; arr[j] = t;
    return { ...prev, items: arr };
  });
  const total = draft.items.reduce((s, it) => s + (Number(it.qty) || 0) * it.price, 0);

  const buildHtml = () => {
    const items = draft.items.filter(it => String(it.name).trim());
    const common = {
      facilityName: draft.facility, repName: repName || '未設定', items,
      showPrices: draft.showPrices, issued: isoToJa(draft.issued),
      note: draft.note, title: draft.title, office: masters.settings.office,
    };
    return isQuote
      ? buildQuoteHtml({ ...common, quoteNo: 'M-' + String(draft.issued || '').replace(/-/g, '') + '-01' })
      : buildFacilityOrderHtml(common);
  };
  const validate = () => {
    if (!String(draft.facility).trim()) { showToast('施設名を入力してください', 'error'); return false; }
    if (draft.items.filter(it => String(it.name).trim()).length === 0) { showToast('明細に商品を追加してください', 'error'); return false; }
    return true;
  };
  const handlePrint = () => { if (validate()) openPrint(buildHtml()); };
  const handlePdf = async () => {
    if (!validate()) return;
    setBusy(true);
    showToast('PDFを作成しています…', 'info');
    try {
      const fname = (isQuote ? '御見積書_' : '発注書_') + String(draft.facility).replace(/[\\/:*?"<>|]/g, '') + '_' + (draft.issued || todayISO()) + '.pdf';
      await exportPdf(buildHtml(), fname);
      showToast('PDFを保存しました');
    } catch (e) {
      showToast('PDFの作成に失敗しました。印刷ダイアログの「PDFとして保存」もお試しください', 'error', 7000);
    } finally {
      setBusy(false);
    }
  };
  const handleSave = () => {
    if (!String(draft.facility).trim()) { showToast('施設名を入力してください', 'error'); return; }
    const now = new Date().toISOString();
    const id = draft.id || (docType + '-' + Date.now());
    const rec = { ...draft, id, type: docType, savedAt: now };
    setDocs(prev => {
      const i = prev.findIndex(d => d.id === id);
      if (i >= 0) { const a = prev.slice(); a[i] = rec; return a; }
      return [...prev, rec];
    });
    setDraft(rec);
    showToast(draft.id ? '保存しました（上書き）' : '保存しました。次回この画面から呼び出して編集できます');
  };
  const loadDoc = (d) => { setDraft({ ...d }); setShowSaved(false); showToast('「' + d.facility + '」を読み込みました'); };
  const delDoc = (id) => setDocs(prev => prev.filter(d => d.id !== id));
  const newDoc = () => { setDraft(newDocDraft(docType, '')); showToast('新規作成にしました'); };

  const inputCls = 'h-10 px-3 rounded-xl border border-slate-200 bg-white text-sm shadow-sm focus:border-blue-400 focus:outline-none transition';

  return (
    <div className="space-y-4">
      <Card className="px-5 py-4 space-y-3">
        <div className="flex items-center gap-3 flex-wrap">
          <div className="flex items-center gap-2">
            <span className="text-sm text-slate-600 font-bold shrink-0">施設名</span>
            <div className="relative" ref={facBoxRef}>
              <input value={draft.facility}
                onChange={e => { patch({ facility: e.target.value }); setFacSuggestOpen(true); }}
                onFocus={() => setFacSuggestOpen(true)}
                onKeyDown={e => { if (e.key === 'Escape') setFacSuggestOpen(false); }}
                placeholder="選択、または新規の施設名を入力"
                className={inputCls + ' w-72 font-bold text-slate-700'} />
              {facSuggestOpen && facSuggests.length > 0 && (
                <div className="absolute z-30 top-full left-0 mt-1.5 w-72 bg-white rounded-xl border border-slate-200 shadow-xl overflow-hidden">
                  {facSuggests.map(n => (
                    <button key={n} type="button" onMouseDown={e => e.preventDefault()}
                      onClick={() => { patch({ facility: n }); setFacSuggestOpen(false); }}
                      className="w-full text-left px-4 py-2.5 hover:bg-sky-50 transition text-xs font-bold text-slate-700 truncate border-b border-slate-50 last:border-0">
                      {n}
                    </button>
                  ))}
                </div>
              )}
            </div>
          </div>
          {draft.facility && !data.facByName.has(draft.facility) && (
            <span className="bg-emerald-100 text-emerald-700 text-[11px] font-bold px-2.5 py-1 rounded-full">新規施設</span>
          )}
          {draft.id && <span className="bg-teal-100 text-teal-700 text-[11px] font-bold px-2.5 py-1 rounded-full">保存済みを編集中</span>}
          <label className="inline-flex items-center gap-2 text-sm text-slate-600 font-bold">
            {isQuote ? '発行日' : '発注日'}
            <input type="date" value={draft.issued} onChange={e => patch({ issued: e.target.value })}
              className={inputCls + ' tabular-nums'} />
          </label>
          <Toggle on={draft.showPrices} onChange={v => patch({ showPrices: v })}
            labelOn="金額を記載する" labelOff="金額なし（数量のみ）" />
        </div>
        <div className="flex items-center gap-2 flex-wrap">
          <label className="inline-flex items-center gap-2 text-sm text-slate-600 font-bold">
            表題
            <input value={draft.title} onChange={e => patch({ title: e.target.value })} className={inputCls + ' w-44'} />
          </label>
          <div className="ml-auto flex gap-2 flex-wrap">
            <button onClick={() => setShowSaved(s => !s)}
              className="bg-slate-500 hover:bg-slate-600 active:scale-[.98] text-white px-3.5 py-2.5 rounded-xl shadow-sm text-sm font-bold transition inline-flex items-center gap-1.5">
              <Database size={15} /> 保存済み（{savedList.length}）
            </button>
            <button onClick={newDoc}
              className="bg-white border border-slate-200 hover:border-slate-300 active:scale-[.98] text-slate-600 px-3.5 py-2.5 rounded-xl shadow-sm text-sm font-bold transition">新規</button>
            <button onClick={handleSave}
              className="bg-emerald-600 hover:bg-emerald-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-emerald-200 text-sm font-bold transition inline-flex items-center gap-1.5">
              <CheckCircle2 size={15} /> 保存
            </button>
            <button onClick={handlePdf} disabled={busy}
              className={"px-4 py-2.5 rounded-xl shadow-sm text-sm font-bold transition inline-flex items-center gap-1.5 text-white " +
                (busy ? 'bg-slate-300' : 'bg-indigo-600 hover:bg-indigo-700 active:scale-[.98] shadow-indigo-200')}>
              <Download size={15} /> {busy ? '作成中…' : 'PDF保存'}
            </button>
            <button onClick={handlePrint}
              className="bg-sky-600 hover:bg-sky-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-sky-200 text-sm font-bold transition inline-flex items-center gap-1.5">
              <Printer size={15} /> 印刷
            </button>
          </div>
        </div>

        {showSaved && (
          <div className="border-t border-slate-100 pt-3">
            <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wide mb-2">保存済みの{isQuote ? '見積書' : '発注書'}</div>
            <div className="divide-y divide-slate-50 max-h-56 overflow-y-auto">
              {savedList.map(d => (
                <div key={d.id} className="py-2 flex items-center gap-3">
                  <div className="flex-1 min-w-0">
                    <div className="font-bold text-xs text-slate-700 truncate">{d.facility}</div>
                    <div className="text-[10px] text-slate-400 tabular-nums">{d.issued} ・ {d.items.length}品目 ・ 保存 {String(d.savedAt).slice(0, 10)}</div>
                  </div>
                  <button onClick={() => loadDoc(d)}
                    className="bg-sky-600 hover:bg-sky-700 text-white text-[11px] font-bold px-3 py-1.5 rounded-full transition shrink-0">読み込む</button>
                  <button onClick={() => delDoc(d.id)} className="text-slate-300 hover:text-rose-500 transition shrink-0"><Trash2 size={15} /></button>
                </div>
              ))}
              {savedList.length === 0 && <div className="py-6 text-center text-xs text-slate-400">保存された{isQuote ? '見積書' : '発注書'}はまだありません</div>}
            </div>
          </div>
        )}
      </Card>

      {!String(draft.facility).trim() ? (
        <Card className="px-6 py-14 text-center">
          <span className="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-sky-50 text-sky-500 mb-3">
            {isQuote ? <FileSpreadsheet size={26} /> : <ClipboardList size={26} />}
          </span>
          <div className="font-extrabold text-slate-700">まず上で施設名を入れてください</div>
          <div className="text-xs text-slate-400 mt-1.5 leading-relaxed">
            既存の施設は入力欄をクリックすると一覧から選べます。<b className="text-slate-600">一覧にない新規の施設は、そのまま名前を入力</b>すれば作成できます。
          </div>
        </Card>
      ) : (
        <div className="grid lg:grid-cols-2 gap-4 items-start">
          {/* 商品マスタ */}
          <Card>
            <div className="px-5 py-3.5 border-b border-slate-100 flex items-center gap-2.5 flex-wrap">
              <div className="flex-1 min-w-[180px]">
                <div className="font-bold text-sm text-slate-800">商品マスタ</div>
                <div className="text-[11px] text-slate-400">販売履歴から自動生成 ・ クリックで明細に追加</div>
              </div>
              <Segmented value={source} onChange={setSource}
                options={[['fac', 'この施設の購入品'], ['all', '全商品']]} />
            </div>
            <div className="px-5 py-3 border-b border-slate-100 flex items-center gap-2.5 flex-wrap">
              <div className="relative">
                <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                <input value={search} onChange={e => setSearch(e.target.value)} placeholder="商品名で検索"
                  className="h-10 pl-9 pr-3 rounded-xl border border-slate-200 text-sm w-48 bg-white shadow-sm focus:border-blue-400 focus:outline-none transition" />
              </div>
              <select value={cat} onChange={e => setCat(e.target.value)}
                className="h-10 px-3 rounded-xl border border-slate-200 bg-white text-sm shadow-sm font-bold text-slate-600">
                <option value="all">すべての種別</option>
                {CATEGORY_NAMES.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div className="divide-y divide-slate-50 max-h-[26rem] overflow-y-auto">
              {visibleMaster.map(m => (
                <button key={m.name} onClick={() => addItem(m)} disabled={inItems.has(m.name)}
                  className={"w-full text-left px-5 py-2.5 flex items-center gap-3 transition " +
                    (inItems.has(m.name) ? 'opacity-40 cursor-default' : 'hover:bg-emerald-50/60')}>
                  <div className="flex-1 min-w-0">
                    <div className="font-bold text-xs text-slate-700 truncate">{m.name}</div>
                    <div className="text-[10px] text-slate-400 tabular-nums">
                      {m.cat}
                      {m.price > 0 && <> ・ 直近単価 <b className="text-slate-600">{yen(m.price)}</b>（{m.priceSrc}）</>}
                      {m.last && <> ・ 最終 {m.last}</>}
                    </div>
                  </div>
                  <span className={"text-[11px] font-bold px-2.5 py-1 rounded-full shrink-0 " +
                    (inItems.has(m.name) ? 'bg-slate-100 text-slate-400' : 'bg-emerald-500 text-white')}>

                    ? (fac ? '該当する商品がありません' : 'この施設の購入履歴がありません（「全商品」に切り替えてください）')

                </div>

              <div className="px-5 py-2.5 text-[11px] text-slate-400 border-t border-slate-50">売上の大きい順に40件を表示中（全{num(master.length)}件）— 検索・種別で絞り込めます</div>
            )}
          </Card>

          {/* 明細（すべて編集可） */}
          <Card>
            <div className="px-5 py-3.5 border-b border-slate-100 flex items-center gap-2.5">
              <div className="flex-1">
                <div className="font-bold text-sm text-slate-800">{isQuote ? '見積明細' : '発注明細'}<span className="text-slate-400 font-normal ml-1.5">{draft.items.length}品目</span></div>
                <div className="text-[11px] text-slate-400">{draft.facility} {isQuote ? '宛の御見積書' : '→ 当社宛の発注書'}</div>
              </div>
              {draft.showPrices && <span className="text-sm font-extrabold text-slate-800 tabular-nums">{yen(total)}<span className="text-[10px] text-slate-400 font-bold ml-1">税抜</span></span>}
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-sm min-w-[520px]">
                <thead>
                  <tr className="text-[10px] uppercase tracking-wide text-slate-400 border-b border-slate-100">
                    <th className="text-left font-bold px-4 py-2">商品名</th>
                    <th className="text-right font-bold px-1 py-2 w-20">数量</th>
                    <th className="text-left font-bold px-1 py-2 w-16">単位</th>
                    {draft.showPrices && <th className="text-right font-bold px-1 py-2 w-24">単価</th>}
                    {draft.showPrices && !isQuote ? null : draft.showPrices ? <th className="text-right font-bold px-1 py-2 w-24">金額</th> : null}
                    <th className="w-16"></th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-50">
                  {draft.items.map((it, i) => (
                    <tr key={i}>
                      <td className="px-4 py-2">
                        <input value={it.name} onChange={e => setItem(i, { name: e.target.value })}
                          placeholder="商品名"
                          className="h-10 w-full px-2 rounded-lg border border-slate-200 text-xs font-bold text-slate-700 focus:border-sky-400 focus:outline-none" />
                      </td>
                      <td className="px-1 py-2">
                        <input type="number" min="0" value={it.qty}
                          onChange={e => setItem(i, { qty: e.target.value === '' ? '' : Math.max(0, parseInt(e.target.value, 10) || 0) })}
                          placeholder={isQuote ? '' : '空欄'}
                          className="h-10 w-full px-2 rounded-lg border border-slate-200 text-right tabular-nums text-sm font-bold focus:border-sky-400 focus:outline-none" />
                      </td>
                      <td className="px-1 py-2">
                        <input value={it.unit} onChange={e => setItem(i, { unit: e.target.value })}
                          className="h-10 w-full px-2 rounded-lg border border-slate-200 text-xs text-slate-500 font-bold focus:border-sky-400 focus:outline-none" />
                      </td>
                      {draft.showPrices && (
                        <td className="px-1 py-2">
                          <input type="number" min="0" value={it.price}
                            onChange={e => setItem(i, { price: Math.max(0, parseInt(e.target.value || '0', 10)) })}
                            className="h-10 w-full px-2 rounded-lg border border-slate-200 text-right tabular-nums text-sm font-bold focus:border-sky-400 focus:outline-none" />
                        </td>
                      )}
                      {draft.showPrices && isQuote && (
                        <td className="px-1 py-2 text-right tabular-nums font-extrabold text-slate-800 text-xs">{yen((Number(it.qty) || 0) * it.price)}</td>
                      )}
                      <td className="pr-3 text-right whitespace-nowrap">
                        <button onClick={() => moveItem(i, -1)} className="text-slate-300 hover:text-sky-500 transition px-0.5" title="上へ">▲</button>
                        <button onClick={() => moveItem(i, 1)} className="text-slate-300 hover:text-sky-500 transition px-0.5" title="下へ">▼</button>
                        <button onClick={() => delItem(i)} className="text-slate-300 hover:text-rose-500 transition pl-1"><X size={15} /></button>
                      </td>
                    </tr>
                  ))}
                  {draft.items.length === 0 && (
                    <tr><td colSpan={6} className="px-5 py-10 text-center text-xs text-slate-400">左の商品マスタから「＋追加」で明細に入れてください</td></tr>
                  )}
                </tbody>
              </table>
            </div>
            <div className="px-4 py-2.5 border-t border-slate-100">
              <button onClick={addBlank}
                className="text-xs font-bold text-sky-600 hover:text-sky-800 transition">＋ 空の行を追加（履歴にない商品を手入力）</button>
            </div>
            <div className="px-4 py-3 border-t border-slate-100">
              <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wide mb-1.5">備考（そのまま帳票に印刷されます）</div>
              <textarea rows={4} value={draft.note} onChange={e => patch({ note: e.target.value })}
                className="w-full rounded-xl border border-slate-200 p-3 text-xs resize-y focus:border-blue-400 focus:outline-none transition leading-relaxed" />
            </div>
            <div className="px-5 py-3 bg-sky-50/70 text-[11px] text-slate-500 leading-relaxed border-t border-sky-100">
              {isQuote
                ? '単価はその施設への直近販売価格が自動で入ります。商品名・数量・単位・単価・備考はすべて直接編集できます。'
                : '数量は空欄のまま印刷し、施設側に記入していただく想定です。こちらで数量を入れておくこともできます。商品名・単位・単価・備考もすべて編集できます。'}
            </div>
          </Card>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   画面7: 設定
============================================================ */
function SettingsView({ rows, masters, setRows, setMasters, setOffice, meta, setMeta, docs, setDocs, data, showToast }) {
  const [sub, setSubRaw] = useState('rep');
  const [q, setQ] = useState('');
  const [newRep, setNewRep] = useState('');
  const [catLimit, setCatLimit] = useState(100);
  const [newRuleKw, setNewRuleKw] = useState('');
  const [newRuleCat, setNewRuleCat] = useState(CATEGORY_NAMES[0]);
  const [jsonImp, setJsonImp] = useState(null);
  const [delStep, setDelStep] = useState(0);
  const jsonRef = useRef(null);
  const setSub = (v) => { setSubRaw(v); setQ(''); setCatLimit(100); };

  const customers = masters.customers;
  const updateCustomer = (name, patch) => setMasters(prev => ({
    ...prev, customers: { ...prev.customers, [name]: { ...prev.customers[name], ...patch } },
  }));

  // 担当者リスト = 手動追加分 ∪ すでに割り当てられている名前
  const allReps = useMemo(() => {
    const s = new Set(masters.settings.reps || []);
    for (const n in customers) { const r = customers[n].rep; if (r) s.add(r); }
    return [...s].sort((a, b) => a.localeCompare(b, 'ja'));
  }, [masters]);
  const addRep = () => {
    const name = newRep.trim();
    if (!name) return;
    if (allReps.includes(name)) { showToast('「' + name + '」はすでに登録されています', 'info'); return; }
    setMasters(prev => ({ ...prev, settings: { ...prev.settings, reps: [...(prev.settings.reps || []), name] } }));
    setNewRep('');
    showToast('担当者「' + name + '」を追加しました');
  };

  const facNames = useMemo(() => {
    const list = Object.keys(customers).filter(n => customers[n].type === 'facility');
    list.sort((a, b) => {
      const ua = customers[a].rep ? 1 : 0, ub = customers[b].rep ? 1 : 0;
      if (ua !== ub) return ua - ub;   // 未設定を上に
      return a.localeCompare(b, 'ja');
    });
    return list;
  }, [masters]);
  const perNames = useMemo(() => {
    const list = Object.keys(customers).filter(n => customers[n].type === 'person');
    list.sort((a, b) => {
      const ua = customers[a].uncertain ? 0 : 1, ub = customers[b].uncertain ? 0 : 1;
      if (ua !== ub) return ua - ub;   // 要確認を上に
      return a.localeCompare(b, 'ja');
    });
    return list;
  }, [masters]);
  const facNamesPerson = useMemo(() => {
    const list = Object.keys(customers).filter(n => customers[n].type === 'facility');
    list.sort((a, b) => {
      const ua = customers[a].uncertain ? 0 : 1, ub = customers[b].uncertain ? 0 : 1;
      if (ua !== ub) return ua - ub;
      return a.localeCompare(b, 'ja');
    });
    return list;
  }, [masters]);
  const filterQ = (list) => (q.trim() ? list.filter(n => n.includes(q.trim())) : list);

  // 商品リスト（売上の大きい順）
  const prodNames = useMemo(() => {
    if (!data.empty) return data.products.slice().sort((a, b) => b.winSales - a.winSales).map(p => p.name);
    return [...new Set([...Object.keys(masters.catOverrides), ...Object.keys(masters.itemHandling)])];
  }, [data, masters]);
  const setCat = (name, v) => setMasters(prev => {
    const co = { ...prev.catOverrides };
    // 学習ルール・内蔵辞書と同じ分類に戻したときは手直しを消す（自動判定に任せる）
    if (v === resolveCategory(name, {}, prev.catRules).cat) delete co[name]; else co[name] = v;
    return { ...prev, catOverrides: co };
  });
  const setHandling = (name, v) => setMasters(prev => {
    const ih = { ...prev.itemHandling };
    if (v === HANDLING_DEFAULT) delete ih[name]; else ih[name] = v;
    return { ...prev, itemHandling: ih };
  });

  // ---- キーワード学習ルール ----
  const catOf = (name) => resolveCategory(name, masters.catOverrides, masters.catRules);
  const ruleMatchCount = (kw) => {
    const n = String(kw || '').normalize('NFKC');
    if (!n) return 0;
    return prodNames.reduce((s, p) => s + (String(p).normalize('NFKC').includes(n) ? 1 : 0), 0);
  };
  const addRule = () => {
    const kw = newRuleKw.trim();
    if (!kw) { showToast('キーワードを入力してください', 'error'); return; }
    if ((masters.catRules || []).some(r => r.kw === kw)) { showToast('「' + kw + '」はすでに登録されています', 'info'); return; }
    setMasters(prev => ({ ...prev, catRules: [...(prev.catRules || []), { kw, cat: newRuleCat }] }));
    const n = ruleMatchCount(kw);
    setNewRuleKw('');
    showToast('「' + kw + '」を含む商品を' + newRuleCat + 'に分類するルールを覚えました（該当 ' + n + '件）');
  };
  const delRule = (kw) => setMasters(prev => ({ ...prev, catRules: (prev.catRules || []).filter(r => r.kw !== kw) }));

  // ---- データ管理 ----
  const usage = storageUsage();
  const usagePct = Math.min(100, Math.round(usage / STORAGE_LIMIT * 100));

  const handleExport = () => {
    const payload = { app: 'taiyo-uriage-bunseki', schema: 1, exportedAt: new Date().toISOString(), rows, masters, meta, docs };
    downloadText('売上分析データ_' + todayISO() + '.json', JSON.stringify(payload), 'application/json');
    showToast('JSONエクスポートしました（バックアップ・PC間共有に使えます）');
  };
  const handleJsonFile = (file) => {
    if (!file) return;
    file.text().then(t => {
      let obj = null;
      try { obj = JSON.parse(t.replace(/^﻿/, '')); } catch {}
      if (!obj || !Array.isArray(obj.rows) || !obj.masters || typeof obj.masters !== 'object') {
        showToast('このファイルは売上分析アプリのバックアップではありません', 'error'); return;
      }
      if ((obj.schema || 1) > 1) { showToast('このファイルは新しいバージョンの形式です。アプリを最新版に更新してください', 'error'); return; }
      const valid = obj.rows.filter(r => Array.isArray(r) && r.length >= 11 && parseDateStr(r[1]));
      setJsonImp({ fileName: file.name, rows: valid, dropped: obj.rows.length - valid.length,
        masters: normalizeMasters(obj.masters), meta: (obj.meta && typeof obj.meta === 'object') ? obj.meta : { schema: 1 },
        docs: Array.isArray(obj.docs) ? obj.docs.filter(d => d && d.id && d.type) : [] });
    }).catch(() => showToast('ファイルの読み込みに失敗しました', 'error'));
  };
  const applyJson = (mode) => {
    const imp = jsonImp;
    if (!imp) return;
    if (mode === 'replace') {
      setRows(imp.rows);
      setMasters(imp.masters);
      setMeta(imp.meta);
      setDocs(imp.docs);
      showToast('データを置き換えました（明細 ' + num(imp.rows.length) + '行）');
    } else {
      const remaining = rowKeyCounts(rows);
      const add = [];
      imp.rows.forEach(r => {
        const k = rowKey(r);
        const rem = remaining.get(k) || 0;
        if (rem > 0) { remaining.set(k, rem - 1); return; }
        add.push(r);
      });
      if (add.length) setRows(prev => [...prev, ...add]);
      setMasters(prev => {
        const mc = { ...imp.masters.customers };
        for (const n in prev.customers) {
          const loc = prev.customers[n], im = imp.masters.customers[n];
          mc[n] = { ...(im || {}), ...loc, rep: loc.rep || ((im && im.rep) || '') };
        }
        return {
          customers: mc,
          catOverrides: { ...imp.masters.catOverrides, ...prev.catOverrides },
          priceOverrides: { ...imp.masters.priceOverrides, ...prev.priceOverrides },
          itemHandling: { ...imp.masters.itemHandling, ...prev.itemHandling },
          settings: { ...prev.settings, reps: [...new Set([...(prev.settings.reps || []), ...(imp.masters.settings.reps || [])])] },
        };
      });
      setDocs(prev => {
        const seenIds = new Set(prev.map(d => d.id));
        return [...prev, ...imp.docs.filter(d => !seenIds.has(d.id))];
      });
      showToast('データを統合しました（新しい明細 ' + num(add.length) + '行を追加）');
    }
    setJsonImp(null);
  };
  const doDelete = () => {
    removeStorage([K.ROWS, K.MASTERS, K.META, K.DOCS]);
    setRows([]);
    setMasters(defaultMasters());
    setMeta({ schema: 1 });
    setDocs([]);
    setDelStep(0);
    showToast('全データを削除しました');
  };

  const searchBox = (placeholder) => (
    <div className="relative">
      <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
      <input value={q} onChange={e => setQ(e.target.value)} placeholder={placeholder}
        className="h-10 pl-9 pr-3 rounded-xl border border-slate-200 text-sm w-56 bg-white shadow-sm focus:border-blue-400 focus:outline-none transition" />
    </div>
  );

  return (
    <div className="space-y-4">
      <Segmented value={sub} onChange={setSub}
        options={[['office', '営業所'], ['rep', '担当者対応表'], ['direct', '直送フラグ'], ['cat', '商品分類'], ['handling', '在庫扱い'], ['person', '施設/個人判定'], ['data', 'データ管理']]} />

      {sub === 'office' && (
        <Card className="p-5 max-w-2xl">
          <div className="font-bold text-sm text-slate-800 mb-1 inline-flex items-center gap-2">
            <span className="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-amber-50 text-amber-500"><Sun size={14} /></span>
            お使いの営業所
          </div>
          <div className="text-xs text-slate-400 leading-relaxed mb-3">
            見積書・発注書・レポートの発行元欄に、ここで選んだ営業所の名称・住所・電話番号が印刷されます。
          </div>
          <select value={masters.settings.office || ''} onChange={e => setOffice(e.target.value)}
            className="h-11 w-full max-w-sm px-3 rounded-xl border border-slate-200 bg-white text-sm shadow-sm font-bold text-slate-700 focus:border-blue-400 focus:outline-none">
            {OFFICE_MASTER.map(x => <option key={x.name} value={x.name}>{x.name}</option>)}
          </select>
          {officeByName(masters.settings.office) && (
            <div className="mt-3 bg-sky-50/70 border border-sky-100 rounded-xl px-4 py-3 text-xs text-slate-600 leading-relaxed max-w-sm">
              〒{officeByName(masters.settings.office).zip}　{officeByName(masters.settings.office).addr}<br />
              TEL：{officeByName(masters.settings.office).tel}　／　FAX：{officeByName(masters.settings.office).fax}<br />
              所長：{officeByName(masters.settings.office).chief}
            </div>
          )}
        </Card>
      )}

      {sub === 'rep' && (
        <Card>
          <div className="px-5 py-3 border-b border-slate-100 text-xs text-slate-400 leading-relaxed">
            施設ごとに担当者を設定します。<b className="text-amber-600">未設定の施設が上に表示されます。</b>一度設定すれば以後の取込で自動適用されます。
          </div>
          <div className="px-5 py-3 border-b border-slate-100 flex items-center gap-2.5 flex-wrap">
            {searchBox('施設名で検索')}
            <div className="flex items-center gap-2 ml-auto">
              <input value={newRep} onChange={e => setNewRep(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter') addRep(); }}
                placeholder="担当者名を追加（例: 田中）"
                className="h-10 px-3 rounded-xl border border-slate-200 text-sm w-48 bg-white shadow-sm focus:border-blue-400 focus:outline-none transition" />
              <button onClick={addRep}
                className="bg-sky-600 hover:bg-sky-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-sky-200 text-sm font-bold transition">追加</button>
            </div>
          </div>
          <div className="divide-y divide-slate-50 max-h-[28rem] overflow-y-auto">
            {filterQ(facNames).map(name => (
              <div key={name} className={"px-5 py-2.5 flex items-center justify-between gap-3 " + (!customers[name].rep ? 'bg-amber-50/60' : '')}>
                <div className="font-bold text-sm text-slate-700">
                  {name}
                  {!customers[name].rep && <span className="ml-2 bg-amber-400 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">未設定</span>}
                </div>
                <select value={customers[name].rep || ''} onChange={e => updateCustomer(name, { rep: e.target.value })}
                  className="h-10 px-3 rounded-xl border border-slate-200 bg-white text-sm w-36 shadow-sm font-bold text-slate-600">
                  <option value="">（未設定）</option>
                  {allReps.map(r => <option key={r} value={r}>{r}</option>)}
                </select>
              </div>
            ))}
            {filterQ(facNames).length === 0 && (
              <div className="px-5 py-10 text-center text-sm text-slate-400">{facNames.length === 0 ? 'まずデータ取込でCSVを取り込んでください' : '該当する施設がありません'}</div>
            )}
          </div>
          {allReps.length === 0 && facNames.length > 0 && (
            <div className="px-5 py-2.5 text-[11px] text-amber-600 border-t border-slate-50 font-bold">まず右上の入力欄で担当者名を追加してください（CSVに担当者列がある場合は自動で入ります）</div>
          )}
        </Card>
      )}

      {sub === 'direct' && (
        <Card>
          <div className="px-5 py-3 border-b border-slate-100 text-xs text-slate-400 leading-relaxed">
            <b className="text-slate-600">直送</b>＝仕入先からその施設へ直接納品（自社在庫を使わない）。適正在庫の計算は<b className="text-slate-600">非直送のみ</b>が対象です。商品単位の扱い（在庫品/受注発注/直送品）は「在庫扱い」タブで設定します。
          </div>
          <div className="px-5 py-3 border-b border-slate-100">{searchBox('施設名で検索')}</div>
          <div className="divide-y divide-slate-50 max-h-[28rem] overflow-y-auto">
            {filterQ(facNames).map(name => (
              <div key={name} className="px-5 py-3 flex items-center justify-between gap-3">
                <div className="font-bold text-sm text-slate-700">{name}</div>
                <Toggle on={!!customers[name].direct}
                  onChange={(v) => updateCustomer(name, { direct: v })}
                  labelOn="直送（在庫計算の対象外）" labelOff="非直送（在庫計算の対象）" />
              </div>
            ))}
            {filterQ(facNames).length === 0 && (
              <div className="px-5 py-10 text-center text-sm text-slate-400">{facNames.length === 0 ? 'まずデータ取込でCSVを取り込んでください' : '該当する施設がありません'}</div>
            )}
          </div>
        </Card>
      )}

      {sub === 'cat' && (
        <div className="space-y-4">
        <Card className="p-5">
          <div className="font-bold text-sm text-slate-800 mb-1 inline-flex items-center gap-2">
            <span className="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-teal-50 text-teal-600"><Package size={14} /></span>
            キーワード学習ルール
          </div>
          <div className="text-xs text-slate-400 leading-relaxed mb-3">
            商品名に含まれる言葉から、まとめて分類を決めるルールです。<b className="text-slate-600">一度覚えさせれば、次の取込で入ってきた新しい商品にも自動で適用されます。</b>
            （例：「ブラケット」→ 部材、「トイレット」→ 紙製品）
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            <input value={newRuleKw} onChange={e => setNewRuleKw(e.target.value)}

        </Card>

          </div>
          <div className="px-5 py-3 border-b border-slate-100">{searchBox('商品名で検索')}</div>

            {filterQ(prodNames).slice(0, catLimit).map(prod => (
              <div key={prod} className="px-5 py-2.5 flex items-center justify-between gap-3">
                <div className="font-bold text-sm text-slate-700 truncate">{prod}</div>
                <div className="flex items-center gap-2 shrink-0">
                  <span className={"text-[10px] font-bold px-2 py-0.5 rounded-full " +
                    (catOf(prod).src === '手動' ? 'bg-fuchsia-100 text-fuchsia-700'
                      : catOf(prod).src === '学習' ? 'bg-teal-100 text-teal-700' : 'bg-slate-100 text-slate-400')}

                    {catOf(prod).src}
                  </span>

                    {CATEGORY_NAMES.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
              </div>

            {filterQ(prodNames).length === 0 && (
              <div className="px-5 py-10 text-center text-sm text-slate-400">{prodNames.length === 0 ? 'まずデータ取込でCSVを取り込んでください' : '該当する商品がありません'}</div>
            )}
          </div>
          {filterQ(prodNames).length > catLimit && (
            <div className="px-5 py-2.5 border-t border-slate-50 flex items-center gap-3">
              <span className="text-[11px] text-slate-400">売上の大きい順に{catLimit}件を表示中（全{num(filterQ(prodNames).length)}件）</span>
              <button onClick={() => setCatLimit(c => c + 100)} className="text-[11px] text-sky-600 underline font-bold hover:text-sky-800">さらに100件表示</button>
            </div>

      )}

      {sub === 'handling' && (
        <Card>
          <div className="px-5 py-3 border-b border-slate-100 text-xs text-slate-400 leading-relaxed">

            <b className="text-violet-700">初期値は受注発注</b>で、在庫を置く商品だけを「在庫品」にしてください。適正在庫画面からも同じ設定ができます。
          </div>
          <div className="px-5 py-3 border-b border-slate-100">{searchBox('商品名で検索')}</div>
          <div className="divide-y divide-slate-50 max-h-[28rem] overflow-y-auto">
            {filterQ(prodNames).slice(0, catLimit).map(prod => (
              <div key={prod} className="px-5 py-2.5 flex items-center justify-between gap-3">
                <div className="font-bold text-sm text-slate-700 truncate">{prod}</div>
                <div className="flex items-center gap-1.5 shrink-0">
                  {['stock', 'order', 'direct'].map(h => (
                    <button key={h} onClick={() => setHandling(prod, h)}

                          ? (h === 'stock' ? 'bg-sky-500 text-white shadow-sm' : h === 'order' ? 'bg-violet-500 text-white shadow-sm' : 'bg-amber-500 text-white shadow-sm')

              <div className="px-5 py-10 text-center text-sm text-slate-400">{prodNames.length === 0 ? 'まずデータ取込でCSVを取り込んでください' : '該当する商品がありません'}</div>

          {filterQ(prodNames).length > catLimit && (
            <div className="px-5 py-2.5 border-t border-slate-50 flex items-center gap-3">
              <span className="text-[11px] text-slate-400">売上の大きい順に{catLimit}件を表示中（全{num(filterQ(prodNames).length)}件）</span>
              <button onClick={() => setCatLimit(c => c + 100)} className="text-[11px] text-sky-600 underline font-bold hover:text-sky-800">さらに100件表示</button>

      {sub === 'person' && (
        <div className="space-y-4">

              <div className="px-5 py-3.5 border-b border-slate-100 font-bold text-sm text-slate-800">🏢 施設（集計対象）<span className="text-slate-400 font-normal ml-1">{num(facNamesPerson.length)}件</span></div>

      {sub === 'data' && (
        <div className="space-y-4 max-w-2xl">

            </div>
            <div className="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
              <div className={"h-2.5 rounded-full " + (usagePct >= 80 ? 'bg-gradient-to-r from-amber-400 to-rose-400' : 'bg-gradient-to-r from-sky-400 to-teal-400')}
                style={{ width: Math.max(2, usagePct) + '%' }} />
            </div>
            <div className="text-xs text-slate-400 mt-2 tabular-nums font-bold">
              {(usage / 1048576).toFixed(1)} MB / 5.0 MB 使用中（約{usagePct}%）— 80%を超えると警告します
            </div>
            {usagePct >= 80 && (
              <div className="mt-2.5 flex items-center gap-2 bg-amber-50 border border-amber-200 rounded-xl px-4 py-2.5 text-amber-800 text-xs font-bold">

              </div>
            )}
            <div className="text-[11px] text-slate-400 mt-2 tabular-nums">

            </div>

            <div className="font-bold text-sm text-slate-800 inline-flex items-center gap-2">

            </div>
            <div className="flex gap-2.5 flex-wrap">
              <button onClick={handleExport}
                className="bg-fuchsia-600 hover:bg-fuchsia-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-fuchsia-200 text-sm font-bold transition inline-flex items-center gap-1.5">
                <Download size={15} /> JSONエクスポート
              </button>
