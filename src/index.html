  const facNames = useMemo(() =>
    data.facilities.slice().sort((a, b) => (b.sales || 0) - (a.sales || 0)).map(f => f.name), [data]);
  const facSuggests = useMemo(() => {
    const q = normalizeSearchText(String(draft.facility || '').trim());
    if (!q) return [];
    return facNames.filter(n => normalizeSearchText(n).includes(q)).slice(0, 8);
  }, [facNames, draft.facility]);
  useEffect(() => {
    if (!facSuggestOpen) return;
    const h = (e) => { if (facBoxRef.current && !facBoxRef.current.contains(e.target)) setFacSuggestOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [facSuggestOpen]);
  const savedList = useMemo(() =>
    docs.filter(d => d.type === 'pricerevision').sort((a, b) => (a.savedAt < b.savedAt ? 1 : -1)), [docs]);

  const master = useMemo(() => {
    let list = data.products.slice().sort((a, b) => b.winSales - a.winSales);
    if (cat !== 'all') list = list.filter(x => x.cat === cat);
    const q = normalizeSearchText(search.trim());
    if (q) list = list.filter(x => normalizeSearchText(x.name).includes(q));
    return list;
  }, [data, cat, search]);
  const visibleMaster = master.slice(0, 40);
  const inItems = useMemo(() => new Set(draft.items.map(i => i.name)), [draft.items]);

  // 過去に保存した価格改定から、商品ごとに最後に使った新仕入を記憶しておく（新しい保存ほど優先）
  const lastNewCostByProduct = useMemo(() => {
    const map = new Map();
    docs.filter(d => d.type === 'pricerevision').slice().sort((a, b) => (a.savedAt < b.savedAt ? 1 : -1))
      .forEach(d => {
        (d.items || []).forEach(it => {
          if (!map.has(it.name) && it.newCost !== '' && it.newCost != null) map.set(it.name, it.newCost);
        });
      });
    return map;
  }, [docs]);

  const patch = (p) => setDraft(prev => ({ ...prev, ...p }));
  const addItem = (m) => {
    if (inItems.has(m.name)) { showToast('「' + m.name + '」はすでに明細にあります', 'info'); return; }
    const cur = Math.round(m.lastPrice) || 0;
    const rememberedCost = lastNewCostByProduct.has(m.name) ? lastNewCostByProduct.get(m.name) : '';
    setDraft(prev => ({ ...prev, items: [...prev.items, { rid: newRowId(), name: m.name, cat: m.cat || '', unit: m.unit || '', caseSize: '', cost: Math.round(m.cost) || 0, currentPrice: cur, newPrice: cur, newCost: rememberedCost, newMarginPct: '' }] }));
    if (rememberedCost !== '') showToast('前回の新仕入（' + yen(rememberedCost) + '）を自動入力しました', 'info', 2500);
  };
  // 新仕入・新利益率が両方入力されたら改定価格を自動算出（新仕入 ÷ (1 - 新利益率)）。
  // 逆に改定価格を直接編集したときは、新仕入（未入力なら現行仕入）を基準に利益率を逆算する。
  const setItem = (idx, p) => setDraft(prev => ({
    ...prev,
    items: prev.items.map((it, i) => {
      if (i !== idx) return it;
      const merged = { ...it, ...p };
      const hasNewCost = merged.newCost !== '' && merged.newCost != null;
      const hasNewMargin = merged.newMarginPct !== '' && merged.newMarginPct != null;
      if ('newPrice' in p) {
        const costBasis = hasNewCost ? Number(merged.newCost) : Number(merged.cost) || 0;
        if (costBasis > 0) merged.newMarginPct = marginPctOf(merged.newPrice, costBasis);
      } else if (hasNewMargin) {
        // 新仕入が空欄でも現行の仕入を基準に改定価格を出す。
        // 両方揃うまで動かない作りだと、利益率だけ打った人には何も起きず、
        // 計算されたと思い込んで古い価格のまま印刷してしまう。
        const costBasis = hasNewCost ? Number(merged.newCost) : Number(merged.cost) || 0;
        merged.newPrice = priceFromMargin(merged.newMarginPct, costBasis);
        // 円単位に丸めた結果の実際の利益率を書き戻す。書き戻さないと画面は入力値
        // (例 25%)、社内用印刷は価格から再計算した値(24.9%)となり食い違う。
        if (costBasis > 0) merged.newMarginPct = marginPctOf(merged.newPrice, costBasis);
      }
      return merged;
    }),
  }));
  const delItem = (idx) => setDraft(prev => ({ ...prev, items: prev.items.filter((_, i) => i !== idx) }));
  const moveItem = (idx, dir) => setDraft(prev => {
    const to = idx + dir;
    if (to < 0 || to >= prev.items.length) return prev;
    const items = prev.items.slice();
    const [row] = items.splice(idx, 1);
    items.splice(to, 0, row);
    return { ...prev, items };
  });

  // 適用開始日を選ぶと、備考欄の先頭に「YYYY年M月D日〜の改定価格となります。」を自動で挿入・更新する
  const EFFECTIVE_NOTE_RE = /^\d{4}年\d{1,2}月\d{1,2}日〜の改定価格となります。\n?/;
  const setEffectiveDate = (dateStr) => {
    setDraft(prev => {
      const base = (prev.note || '').replace(EFFECTIVE_NOTE_RE, '');
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr);
      const note = m ? (+m[1] + '年' + +m[2] + '月' + +m[3] + '日〜の改定価格となります。' + (base ? '\n' + base : '')) : base;
      return { ...prev, effectiveDate: dateStr, note };
    });
  };

  const buildHtml = () => buildPriceRevisionHtml({
    facilityName: draft.facility, title: draft.title, issued: isoToJa(draft.issued),
    note: draft.note, items: draft.items, office: masters.settings.office, repName: draft.rep || '未設定',
    showCaseSize: !!draft.showCaseSize, showAmounts: draft.showAmounts !== false, showRate: draft.showRate !== false,
    showCat: draft.showCat !== false, showDiff: draft.showDiff !== false,
  });
  const validate = () => {
    if (draft.items.length === 0) { showToast('価格改定表に商品を追加してください', 'error'); return false; }
    return true;
  };
  const handlePrint = () => { if (validate()) openPrint(buildHtml()); };
  const handleInternalPrint = () => {
    if (!validate()) return;
    openPrint(buildPriceRevisionInternalHtml({
      facilityName: draft.facility, issued: isoToJa(draft.issued),
      note: draft.note, items: draft.items, office: masters.settings.office, repName: draft.rep || '未設定',
    }));
  };
  const handlePdf = async () => {
    if (!validate()) return;
    setBusy(true);
    showToast('PDFを作成しています…', 'info');
    try {
      const fname = '価格改定_' + (draft.facility ? String(draft.facility).replace(/[\\/:*?"<>|]/g, '') + '_' : '') + (draft.issued || todayISO()) + '.pdf';
      await exportPdf(buildHtml(), fname);
      showToast('PDFを保存しました');
    } catch (e) {
      showToast('PDFの作成に失敗しました。印刷ダイアログの「PDFとして保存」もお試しください', 'error', 7000);
    } finally {
      setBusy(false);
    }
  };
  const handleSave = () => {
    if (draft.items.length === 0) { showToast('価格改定表に商品を追加してください', 'error'); return; }
    const now = new Date().toISOString();
    const id = draft.id || ('pricerevision-' + Date.now());
    const rec = { ...draft, id, type: 'pricerevision', facility: draft.facility || '（宛先未設定）', savedAt: now };
    setDocs(prev => {
      const i = prev.findIndex(d => d.id === id);
      if (i >= 0) { const a = prev.slice(); a[i] = rec; return a; }
      return [...prev, rec];
    });
    setDraft(rec);
    showToast(draft.id ? '保存しました（上書き）' : '保存しました。次回この画面から呼び出して編集できます');
  };
  // 保存済みを読み込むときは、後から追加された表示フラグ(showCat/showAmounts等)が
  // 欠けている旧レコードを既定値で補完する。補完しないと「画面では非表示なのに
  // 印刷には出る」といった食い違いが起きる（画面と印刷で既定値の解釈が異なるため）。
  const normalizeDoc = (d) => ({ ...newPriceRevisionDraft(), ...d });
  const loadDoc = (d) => { setDraft(normalizeDoc(d)); setShowSaved(false); showToast('「' + d.facility + '」を読み込みました'); };
  const delDoc = (id) => setDocs(prev => prev.filter(d => d.id !== id));
  const newDoc = () => { setDraft(newPriceRevisionDraft()); showToast('新規作成にしました'); };
  const handleCancel = () => {
    if (draft.id) {
      const saved = docs.find(d => d.id === draft.id);
      if (saved) { setDraft(normalizeDoc(saved)); showToast('保存済みの内容に戻しました'); return; }
    }
    setDraft(newPriceRevisionDraft());
    showToast('入力内容を取り消しました');
  };
  const inputCls = 'h-10 px-3 rounded-lg border border-slate-200 bg-white text-sm shadow-sm font-bold text-slate-700 focus:border-sky-400 focus:outline-none';

  return (
    <div className="space-y-4">
      <Card className="px-5 py-4 space-y-3">
        <div className="flex items-center gap-3 flex-wrap">
          <div className="inline-flex items-center gap-2 max-w-full">
            <span className="text-sm text-slate-600 font-bold shrink-0">宛先（任意）</span>
            <div className="relative flex-1 min-w-0 sm:flex-none" ref={facBoxRef}>
              <input value={draft.facility} onChange={e => { patch({ facility: e.target.value }); setFacSuggestOpen(true); }}
                onFocus={() => setFacSuggestOpen(true)}
                onKeyDown={e => { if (e.key === 'Escape') setFacSuggestOpen(false); }}
                placeholder="施設名など（空欄可）" className={inputCls + ' w-full sm:w-56'} />
              {facSuggestOpen && facSuggests.length > 0 && (
                <div className="absolute z-30 top-full left-0 mt-1.5 w-full sm:w-56 bg-white rounded-xl border border-slate-200 shadow-xl overflow-hidden">
                  {facSuggests.map(n => (
                    <button key={n} type="button" onMouseDown={e => e.preventDefault()}
                      onClick={() => { patch({ facility: n }); setFacSuggestOpen(false); }}
                      className="w-full text-left px-4 py-2.5 hover:bg-sky-50 transition text-xs font-bold text-slate-700 truncate border-b border-slate-50 last:border-0">
                      {n}
                    </button>
                  ))}
                </div>
              )}
            </div>
            <button type="button" onClick={() => { setFacPickerOpen(true); setFacPickerQuery(''); }}
              title="既存施設の一覧から選ぶ"
              className="h-10 px-3 rounded-lg border border-slate-200 bg-white hover:bg-sky-50 hover:border-sky-300 active:scale-[.98] text-slate-600 hover:text-sky-700 text-xs font-bold shadow-sm transition inline-flex items-center gap-1.5 shrink-0">
              <Search size={14} /> 一覧から選ぶ
            </button>
          </div>
          {draft.id && <span className="bg-teal-100 text-teal-700 text-[11px] font-bold px-2.5 py-1 rounded-full">保存済みを編集中</span>}
          <label className="inline-flex items-center gap-2 text-sm text-slate-600 font-bold">
            担当
            <input value={draft.rep || ''} list="pricerevision-rep-list"
              onChange={e => {
                patch({ rep: e.target.value });
                saveStorage(K.LAST_PRICE_REV_REP, e.target.value);
              }}
              placeholder="担当者名" className={inputCls + ' w-36'} />
            <datalist id="pricerevision-rep-list">
              {(masters.settings.reps || []).map(r => <option key={r} value={r} />)}
            </datalist>
          </label>
          <label className="inline-flex items-center gap-2 text-sm text-slate-600 font-bold">
            発行日
            <input type="date" value={draft.issued} onChange={e => patch({ issued: e.target.value })} className={inputCls + ' tabular-nums'} />
          </label>
          <label className="inline-flex items-center gap-2 text-sm text-slate-600 font-bold">
            適用開始日
            <input type="date" value={draft.effectiveDate || ''} onChange={e => setEffectiveDate(e.target.value)}
              title="選ぶと備考欄に「〇月〇日〜の改定価格となります。」を自動で入れます"
              className={inputCls + ' tabular-nums'} />
          </label>
        </div>
        <div className="flex items-center gap-2 flex-wrap">
          <label className="inline-flex items-center gap-2 text-sm text-slate-600 font-bold">
            表題
            <input value={draft.title} onChange={e => patch({ title: e.target.value })} className={inputCls + ' w-44'} />
          </label>
        </div>
        <div className="flex items-center gap-2 flex-wrap">
          <button onClick={() => setShowSaved(s => !s)}
            className="bg-slate-500 hover:bg-slate-600 active:scale-[.98] text-white px-3.5 py-2.5 rounded-xl shadow-sm text-sm font-bold transition inline-flex items-center gap-1.5">
            <Database size={15} /> 保存済み（{savedList.length}）
          </button>
          <button onClick={handleCancel}
            className="bg-white border border-slate-200 hover:border-rose-300 hover:text-rose-600 active:scale-[.98] text-slate-600 px-3.5 py-2.5 rounded-xl shadow-sm text-sm font-bold transition inline-flex items-center gap-1.5">
            <RotateCcw size={14} /> 取り消し
          </button>
          <button onClick={newDoc}
            className="bg-white border border-slate-200 hover:border-slate-300 active:scale-[.98] text-slate-600 px-3.5 py-2.5 rounded-xl shadow-sm text-sm font-bold transition">新規</button>
          <button onClick={handleSave}
            className="bg-emerald-600 hover:bg-emerald-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-emerald-200 text-sm font-bold transition inline-flex items-center gap-1.5">
            <CheckCircle2 size={15} /> 保存
          </button>
          <button onClick={handlePdf} disabled={busy} className="bg-sky-600 hover:bg-sky-700 disabled:opacity-60 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-sky-200 text-sm font-bold transition inline-flex items-center gap-1.5">
            <Download size={15} /> PDF保存
          </button>
          <button onClick={handlePrint} className="bg-white hover:bg-slate-50 active:scale-[.98] text-slate-700 border border-slate-200 px-4 py-2.5 rounded-xl shadow-sm text-sm font-bold transition inline-flex items-center gap-1.5">
            <Printer size={15} /> 印刷
          </button>
          <button onClick={handleInternalPrint} title="仕入価格・利益率を含む社内確認用の資料を印刷します（社外秘）"
            className="bg-amber-50 hover:bg-amber-100 active:scale-[.98] text-amber-800 border border-amber-300 px-4 py-2.5 rounded-xl shadow-sm text-sm font-bold transition inline-flex items-center gap-1.5">
            <Printer size={15} /> 社内用印刷
          </button>
        </div>

        {showSaved && (
          <div className="border-t border-slate-100 pt-3">
            <div className="text-sm font-bold text-slate-800 uppercase tracking-wide mb-2.5">保存済みの価格改定（{savedList.length}件・施設フォルダ別）</div>
            <div className="max-h-96 overflow-y-auto pr-0.5">
              <SavedDocFolders savedList={savedList} onLoad={loadDoc} onDelete={delDoc} emptyLabel="保存された価格改定" />
            </div>
          </div>
        )}
      </Card>

      <div className="grid xl:grid-cols-[minmax(260px,0.75fr)_minmax(420px,1.6fr)_minmax(170px,0.5fr)] gap-5 items-start [&>*]:min-w-0">
        <Card>
          <div className="px-5 py-3.5 border-b border-slate-100 flex items-center gap-2.5 flex-wrap">
            <span className="font-bold text-sm text-slate-700">商品を選ぶ</span>
            <select value={cat} onChange={e => setCat(e.target.value)} className="h-9 px-2.5 rounded-lg border border-slate-200 bg-white text-xs shadow-sm font-bold text-slate-600 ml-auto">
              <option value="all">全分類</option>
              {data.categories.map(c => <option key={c.name} value={c.name}>{c.name}</option>)}
            </select>
            <div className="relative w-full">
              <Search size={14} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-500" />
              <input value={search} onChange={e => setSearch(e.target.value)} placeholder="商品名で絞り込み"
                className="h-9 pl-8 pr-2.5 w-full rounded-lg border border-slate-200 text-xs shadow-sm font-bold text-slate-700 focus:border-sky-400 focus:outline-none" />
            </div>
          </div>
          <div className="divide-y divide-slate-50 max-h-[32rem] overflow-y-auto">
            {visibleMaster.map(m => {
              const ls = productLastSaleInfo(data, m.name);
              return (
              <div key={m.name} role="button" tabIndex={0}
                onClick={() => { if (!inItems.has(m.name)) addItem(m); }}
                onKeyDown={e => { if (e.key === 'Enter' && !inItems.has(m.name)) addItem(m); }}
                className={"w-full text-left px-5 py-3.5 flex items-center gap-3 transition " +
                  (inItems.has(m.name) ? 'opacity-40 cursor-default' : 'cursor-pointer hover:bg-sky-50/60')}>
                <div className="flex-1 min-w-0">
                  <div className="font-bold text-sm text-slate-800 truncate">{m.name}</div>
                  <div className="text-xs text-slate-600 tabular-nums mt-0.5">
                    {m.cat}{m.lastPrice > 0 && <> ・ 現状価格 <b className="text-slate-700">{yen(m.lastPrice)}</b></>}
                    {m.cost > 0 && <> ・ 仕入 <b className="text-amber-700">{yen(m.cost)}</b></>}
                  </div>
                  {ls && (
                    <div className="mt-1 text-[11px] text-sky-600 font-bold underline decoration-dotted underline-offset-2 hover:text-sky-800"
                      onClick={e => { e.stopPropagation(); setSalesModalProd(m.name); }}>
                      最終売上 {ls.date}・{ls.facility}（クリックで一覧）
                    </div>
                  )}
                </div>
                <span className={"text-xs font-bold px-2.5 py-1 rounded-full shrink-0 " +
                  (inItems.has(m.name) ? 'bg-slate-100 text-slate-600' : 'bg-sky-500 text-white')}>
                  {inItems.has(m.name) ? '追加済' : '＋追加'}
                </span>
              </div>
              );
            })}
            {visibleMaster.length === 0 && <div className="px-5 py-8 text-center text-xs text-slate-600">該当する商品がありません</div>}
          </div>
        </Card>

        <Card>
          <div className="px-5 py-3.5 border-b border-slate-100">
            <div className="font-bold text-sm text-slate-700">価格改定表 {draft.items.length}品目</div>
            <div className="flex items-center gap-2 flex-wrap mt-2.5">
              <button onClick={() => patch({ showCat: !(draft.showCat !== false) })}
                title={draft.showCat !== false ? 'カテゴリを非表示にする' : 'カテゴリを表示する'}
                className={"inline-flex items-center gap-1.5 text-xs font-bold px-3 py-2 rounded-lg border transition shrink-0 " +
                  (draft.showCat !== false ? 'border-sky-300 bg-sky-50 text-sky-700' : 'border-slate-200 text-slate-600 hover:bg-slate-100')}>
                {draft.showCat !== false ? <Eye size={15} /> : <EyeOff size={15} />}
                カテゴリ{draft.showCat !== false ? '表示中' : '非表示中'}
              </button>
              <button onClick={() => patch({ showCaseSize: !draft.showCaseSize })}
                title={draft.showCaseSize ? '入数を非表示にする' : '入数を表示する'}
                className={"inline-flex items-center gap-1.5 text-xs font-bold px-3 py-2 rounded-lg border transition shrink-0 " +
                  (draft.showCaseSize ? 'border-sky-300 bg-sky-50 text-sky-700' : 'border-slate-200 text-slate-600 hover:bg-slate-100')}>
                {draft.showCaseSize ? <Eye size={15} /> : <EyeOff size={15} />}
                入数{draft.showCaseSize ? '表示中' : '非表示中'}
              </button>
              <button onClick={() => patch({ showAmounts: !draft.showAmounts })}
                title={draft.showAmounts ? '金額を非表示にする' : '金額を表示する'}
                className={"inline-flex items-center gap-1.5 text-xs font-bold px-3 py-2 rounded-lg border transition shrink-0 " +
                  (draft.showAmounts ? 'border-sky-300 bg-sky-50 text-sky-700' : 'border-slate-200 text-slate-600 hover:bg-slate-100')}>
                {draft.showAmounts ? <Eye size={15} /> : <EyeOff size={15} />}
                金額{draft.showAmounts ? '表示中' : '非表示中'}
              </button>
              {draft.showAmounts && (
                <button onClick={() => patch({ showDiff: !(draft.showDiff !== false) })}
                  title={draft.showDiff !== false ? '価格差を非表示にする' : '価格差を表示する'}
                  className={"inline-flex items-center gap-1.5 text-xs font-bold px-3 py-2 rounded-lg border transition shrink-0 " +
                    (draft.showDiff !== false ? 'border-sky-300 bg-sky-50 text-sky-700' : 'border-slate-200 text-slate-600 hover:bg-slate-100')}>
                  {draft.showDiff !== false ? <Eye size={15} /> : <EyeOff size={15} />}
                  価格差{draft.showDiff !== false ? '表示中' : '非表示中'}
                </button>
              )}
              {draft.showAmounts && (
                <button onClick={() => patch({ showRate: !(draft.showRate !== false) })}
                  title={draft.showRate !== false ? '変動率を非表示にする' : '変動率を表示する'}
                  className={"inline-flex items-center gap-1.5 text-xs font-bold px-3 py-2 rounded-lg border transition shrink-0 " +
                    (draft.showRate !== false ? 'border-sky-300 bg-sky-50 text-sky-700' : 'border-slate-200 text-slate-600 hover:bg-slate-100')}>
                  {draft.showRate !== false ? <Eye size={15} /> : <EyeOff size={15} />}
                  変動率{draft.showRate !== false ? '表示中' : '非表示中'}
                </button>
              )}
            </div>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-sm min-w-[420px]">
              <thead>
                <tr className="text-xs uppercase tracking-wide text-slate-600 border-b border-slate-100">
                  <th className="text-left font-bold px-4 py-2.5 min-w-[260px] whitespace-nowrap">商品名</th>
                  {draft.showCaseSize && <th className="text-center font-bold px-1 py-2.5 w-12 whitespace-nowrap">入数</th>}
                  {draft.showAmounts && <th className="text-right font-bold px-1 py-2.5 w-20 whitespace-nowrap">現状価格</th>}
                  {draft.showAmounts && <th className="text-right font-bold px-1 py-2.5 w-20 whitespace-nowrap">改定価格</th>}
                  {draft.showAmounts && draft.showDiff !== false && <th className="text-right font-bold px-1 py-2.5 w-24 whitespace-nowrap">価格差</th>}
                  {draft.showAmounts && draft.showRate !== false && <th className="text-right font-bold px-1 py-2.5 w-16 whitespace-nowrap">変動率</th>}
                  <th className="w-16"></th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-50">
                {draft.items.map((it, i) => {
                  const diff = it.newPrice - it.currentPrice;
                  // 現状価格0では変動率を出せない（印刷側と同じ扱いにして画面と食い違わせない）
                  const rate = it.currentPrice > 0 ? Math.round(diff / it.currentPrice * 1000) / 10 : null;
                  return (
                    // key は行ごとに不変の rid（無い古いドラフトは index にフォールバック）
                    <tr key={it.rid || i}>
                      <td className="px-4 py-2.5 max-w-0">
                        <div className="flex items-center gap-1 mb-0.5">
                          <input value={it.cat || ''} onChange={e => setItem(i, { cat: e.target.value })}
                            placeholder="分類名（商品名の上に印刷。空欄で非表示）"
                            className="h-5 flex-1 min-w-0 px-1.5 rounded border border-slate-100 bg-sky-50/50 text-[9px] text-sky-700 font-bold focus:border-sky-400 focus:outline-none placeholder:font-normal placeholder:text-slate-400" />
                          {it.cat && (
                            <button type="button" onClick={() => setItem(i, { cat: '' })} title="分類名を削除"
                              className="text-slate-400 hover:text-rose-500 transition shrink-0"><X size={11} /></button>
                          )}
                        </div>
                        <div className="font-bold text-base text-slate-800 truncate" title={it.name}>{it.name}</div>
                        <div className="text-xs text-slate-500 truncate">{it.unit}</div>
                        {(() => { const ls = productLastSaleInfo(data, it.name); return ls && (
                          <div className="text-[11px] text-sky-600 font-bold underline decoration-dotted underline-offset-2 hover:text-sky-800 cursor-pointer"
                            onClick={() => setSalesModalProd(it.name)}>
                            最終売上 {ls.date}・{ls.facility}
                          </div>
                        ); })()}
                      </td>
                      {draft.showCaseSize && (
                        <td className="px-1 py-2.5">
                          <input value={it.caseSize || ''} onChange={e => setItem(i, { caseSize: e.target.value })}
                            className="h-11 w-full px-2 rounded-lg border border-slate-200 text-sm text-slate-700 font-bold text-center placeholder:font-normal placeholder:text-slate-400 focus:border-sky-400 focus:outline-none" />
                        </td>
                      )}
                      {draft.showAmounts && (
                        <td className="px-1 py-2.5 text-right">
                          <input type="number" min="0" value={it.currentPrice}
                            onChange={e => setItem(i, { currentPrice: Math.max(0, parseInt(sanitizeNumInput(e) || '0', 10)) })}
                            onFocus={e => e.target.select()}
                            className="h-11 w-full px-2 rounded-lg border border-slate-200 text-right tabular-nums text-sm font-bold focus:border-sky-400 focus:outline-none" />
                          {it.cost > 0 && (
                            <div className="mt-1 text-sm text-amber-700 font-bold text-right whitespace-nowrap">仕入 {yen(it.cost)}・利益率 {marginPctOf(it.currentPrice, it.cost)}%</div>
                          )}
                        </td>
                      )}
                      {draft.showAmounts && (
                        <td className="px-1 py-2.5 text-right">
                          <input type="number" min="0" value={it.newPrice}
                            onChange={e => setItem(i, { newPrice: Math.max(0, parseInt(sanitizeNumInput(e) || '0', 10)) })}
                            onFocus={e => e.target.select()}
                            className="h-11 w-full px-2 rounded-lg border border-amber-200 bg-amber-50/50 text-right tabular-nums text-sm font-bold focus:border-amber-400 focus:outline-none" />
                          <div className="flex items-start gap-1 mt-1 justify-end">
                            <div className="flex flex-col items-end">
                              <span className="text-[9px] font-bold text-emerald-700 mb-0.5">新仕入</span>
                              <input type="number" min="0" value={it.newCost ?? ''}
                                onChange={e => { const v = sanitizeNumInput(e); setItem(i, { newCost: v === '' ? '' : Math.max(0, parseInt(v, 10) || 0) }); }}
                                onFocus={e => e.target.select()}
                                placeholder="未入力"
                                className="h-8 w-20 px-1.5 rounded-lg border border-emerald-200 bg-emerald-50/40 text-sm font-bold text-slate-700 text-right focus:border-emerald-400 focus:outline-none placeholder:font-normal placeholder:text-xs" />
                            </div>
                            <div className="flex flex-col items-end">
                              <span className="text-[9px] font-bold text-emerald-700 mb-0.5">新利益率%</span>
                              <input type="number" value={it.newMarginPct ?? ''}
                                onChange={e => { const v = sanitizeNumInput(e); setItem(i, { newMarginPct: v === '' ? '' : Math.max(0, Math.min(99, parseFloat(v) || 0)) }); }}
                                onFocus={e => e.target.select()}
                                placeholder="未入力"
                                className="h-8 w-20 px-1.5 rounded-lg border border-emerald-200 bg-emerald-50/40 text-sm font-bold text-slate-700 text-right focus:border-emerald-400 focus:outline-none placeholder:font-normal placeholder:text-xs" />
                            </div>
                          </div>
                        </td>
                      )}
                      {draft.showAmounts && draft.showDiff !== false && (
                        <td className="px-1 py-2.5 text-right tabular-nums font-extrabold text-sm text-slate-800">
                          {diff === 0 ? '―' : (diff > 0 ? '+' : '−') + num(Math.abs(diff))}
                        </td>
                      )}
                      {draft.showAmounts && draft.showRate !== false && <td className="px-1 py-2.5 text-right tabular-nums font-extrabold text-sm text-slate-800">{diff === 0 || rate === null ? '―' : (diff > 0 ? '+' : '−') + Math.abs(rate) + '%'}</td>}
                      <td className="pr-3 text-right whitespace-nowrap">
                        <button onClick={() => moveItem(i, -1)} disabled={i === 0} className="text-slate-400 hover:text-sky-500 disabled:opacity-30 transition px-0.5" title="上へ">▲</button>
                        <button onClick={() => moveItem(i, 1)} disabled={i === draft.items.length - 1} className="text-slate-400 hover:text-sky-500 disabled:opacity-30 transition px-0.5" title="下へ">▼</button>
                        <button onClick={() => delItem(i)} className="text-slate-400 hover:text-rose-500 transition pl-1"><X size={15} /></button>
                      </td>
                    </tr>
                  );
                })}
                {draft.items.length === 0 && (
                  <tr><td colSpan={2 + (draft.showCaseSize ? 1 : 0) + (draft.showAmounts ? 2 : 0) + (draft.showAmounts && draft.showDiff !== false ? 1 : 0) + (draft.showAmounts && draft.showRate !== false ? 1 : 0)} className="px-5 py-10 text-center text-xs text-slate-600">左の商品一覧から「＋追加」で価格改定表に入れてください</td></tr>
                )}
              </tbody>
            </table>
          </div>
          <div className="px-4 py-3 border-t border-slate-100">
            <div className="text-[11px] font-bold text-slate-600 uppercase tracking-wide mb-1.5">備考（そのまま帳票に印刷されます）</div>
            <textarea rows={3} value={draft.note} onChange={e => patch({ note: e.target.value })}
              className="w-full rounded-xl border border-slate-200 p-3 text-xs resize-y focus:border-blue-400 focus:outline-none transition leading-relaxed" />
          </div>
          <div className="px-5 py-3 bg-sky-50/70 text-[11px] text-slate-700 leading-relaxed border-t border-sky-100">
            商品を選ぶと現状価格（直近の販売価格）が自動で入ります。改定価格を入力すると増加額・増加率が自動計算されます。合計金額は表示されません。
          </div>
        </Card>

        <CalcPad />
      </div>

      {facPickerOpen && (
        <div className="fixed inset-0 z-40 bg-slate-600/50 backdrop-blur-sm overflow-auto py-8 px-4 no-print"
          onClick={() => setFacPickerOpen(false)}>
          <div className="max-w-lg mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden" onClick={e => e.stopPropagation()}>
            <div className="px-6 py-4 border-b border-slate-100 flex items-center gap-3 bg-gradient-to-r from-sky-50 to-blue-50">
              <span className="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-sky-100 text-sky-600"><Search size={17} /></span>
              <div className="flex-1">
                <div className="font-bold text-slate-800 text-sm">既存施設から選ぶ</div>
                <div className="text-[11px] text-slate-600">施設名を検索して選んでください</div>
              </div>
              <button onClick={() => setFacPickerOpen(false)} className="text-slate-400 hover:text-slate-600 transition"><X size={18} /></button>
            </div>
            <div className="px-6 py-4">
              <div className="relative">
                <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-600" />
                <input autoFocus value={facPickerQuery} onChange={e => setFacPickerQuery(e.target.value)}
                  placeholder="施設名で検索"
                  className="h-11 pl-9 pr-3 w-full rounded-xl border border-slate-200 text-sm bg-white shadow-sm focus:border-blue-400 focus:outline-none transition" />
              </div>
              <div className="mt-3 max-h-80 overflow-y-auto divide-y divide-slate-50 border border-slate-100 rounded-xl">
                {facNames.filter(n => normalizeSearchText(n).includes(normalizeSearchText(facPickerQuery.trim()))).slice(0, 200).map(n => (
                  <button key={n} type="button"
                    onClick={() => { patch({ facility: n }); setFacPickerOpen(false); setFacPickerQuery(''); }}
                    className="w-full text-left px-4 py-2.5 hover:bg-sky-50 transition text-xs font-bold text-slate-700 truncate">
                    {n}
                  </button>
                ))}
                {facNames.filter(n => normalizeSearchText(n).includes(normalizeSearchText(facPickerQuery.trim()))).length === 0 && (
                  <div className="px-4 py-8 text-center text-xs text-slate-600">該当する施設がありません</div>
                )}
              </div>
            </div>
          </div>
        </div>
      )}
      {salesModalProd && <ProductSalesModal data={data} name={salesModalProd} onClose={() => setSalesModalProd(null)} />}
    </div>
  );
}

/* ============================================================
   画面: 価格確認リスト
   - 商品にチェックを入れると右側に集まる。直近販売単価・仕入単価・粗利を並べて印刷するだけの一覧（改定価格の入力はしない）
============================================================ */
function PriceCheckListPanel({ data, showToast, openPrint }) {
  const [cat, setCat] = useState('all');
  const [search, setSearch] = useState('');
  const [checked, setChecked] = useState(() => new Set());
  const [sortKey, setSortKey] = useState('name');
  const [sortDir, setSortDir] = useState(1);
  const [salesModalProd, setSalesModalProd] = useState(null);
  const [busy, setBusy] = useState(false);

  const master = useMemo(() => {
    let list = data.products.slice().sort((a, b) => b.winSales - a.winSales);
    if (cat !== 'all') list = list.filter(x => x.cat === cat);
    const q = normalizeSearchText(search.trim());
    if (q) list = list.filter(x => normalizeSearchText(x.name).includes(q));
    return list;
  }, [data, cat, search]);
  const visibleMaster = master.slice(0, 60);

  const toggleCheck = (name) => setChecked(prev => {
    const n = new Set(prev);
    if (n.has(name)) n.delete(name); else n.add(name);
    return n;
  });
  const removeCheck = (name) => setChecked(prev => { const n = new Set(prev); n.delete(name); return n; });
  const clearAll = () => setChecked(new Set());

  const toggleSort = (k) => { if (sortKey === k) setSortDir(d => -d); else { setSortKey(k); setSortDir(1); } };
  const selected = useMemo(() => {
    const list = data.products.filter(p => checked.has(p.name));
    list.sort((a, b) => {
      let va, vb;
      switch (sortKey) {
        case 'cat': va = a.cat || ''; vb = b.cat || ''; break;
        case 'price': va = a.lastPrice || 0; vb = b.lastPrice || 0; break;
        case 'cost': va = a.cost || 0; vb = b.cost || 0; break;
        default: va = a.name || ''; vb = b.name || '';
      }
      const cmp = typeof va === 'string' ? va.localeCompare(vb, 'ja') : va - vb;
      return cmp * sortDir;
    });
    return list;
  }, [data.products, checked, sortKey, sortDir]);

  const buildHtml = () => buildPriceCheckListHtml({
    issued: isoToJa(todayISO()),
    items: selected.map(p => ({ name: p.name, cat: p.cat, unit: p.unit, price: p.lastPrice, cost: p.cost })),
  });
  const handlePrint = () => {
    if (selected.length === 0) { showToast('商品を選択してください', 'error'); return; }
    openPrint(buildHtml());
  };
  const handlePdf = async () => {
    if (selected.length === 0) { showToast('商品を選択してください', 'error'); return; }
    setBusy(true);
    showToast('PDFを作成しています…', 'info');
    try {
      await exportPdf(buildHtml(), '価格確認リスト_' + todayCompact() + '.pdf');
      showToast('PDFを保存しました');
    } catch (e) {
      showToast('PDFの作成に失敗しました。印刷ダイアログの「PDFとして保存」もお試しください', 'error', 7000);
    } finally {
      setBusy(false);
    }
  };
  const handleCsv = () => {
    if (selected.length === 0) { showToast('商品を選択してください', 'error'); return; }
    const head = ['商品名', '分類', '単位', '直近販売単価', '仕入単価', '粗利額', '粗利率'];
    const lines = selected.map(p => {
      const gross = p.lastPrice - p.cost;
      const rate = p.lastPrice > 0 ? Math.round(gross / p.lastPrice * 1000) / 10 : '';
      return [p.name, p.cat || '', p.unit || '', p.lastPrice || '', p.cost || '', p.lastPrice > 0 && p.cost > 0 ? gross : '', p.lastPrice > 0 && p.cost > 0 ? rate : ''];
    });
    downloadText('価格確認リスト_' + todayCompact() + '.csv', buildCsv([head, ...lines]), 'text/csv');
  };

  const Th = ({ k, children, className }) => (
    <th className={"cursor-pointer select-none " + (className || '')} onClick={() => toggleSort(k)}>
      <span className="inline-flex items-center gap-0.5">{children}{sortKey === k && (sortDir === 1 ? <ChevronUp size={11} /> : <ChevronDown size={11} />)}</span>
    </th>
  );

  return (
    <div className="grid lg:grid-cols-[minmax(300px,1fr)_minmax(380px,1.3fr)] gap-5 items-start [&>*]:min-w-0">
      <Card>
        <div className="px-5 py-3.5 border-b border-slate-100 flex items-center gap-2.5 flex-wrap">
          <span className="font-bold text-sm text-slate-700">商品を選ぶ</span>
          <select value={cat} onChange={e => setCat(e.target.value)} className="h-9 px-2.5 rounded-lg border border-slate-200 bg-white text-xs shadow-sm font-bold text-slate-600 ml-auto">
            <option value="all">全分類</option>
            {data.categories.map(c => <option key={c.name} value={c.name}>{c.name}</option>)}
          </select>
          <div className="relative w-full">
            <Search size={14} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-500" />
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="商品名で絞り込み"
              className="h-9 pl-8 pr-2.5 w-full rounded-lg border border-slate-200 text-xs shadow-sm font-bold text-slate-700 focus:border-sky-400 focus:outline-none" />
          </div>
        </div>
        <div className="divide-y divide-slate-50 max-h-[32rem] overflow-y-auto">
          {visibleMaster.map(m => {
            const on = checked.has(m.name);
            const ls = productLastSaleInfo(data, m.name);
            return (
              <label key={m.name} className={"w-full text-left px-5 py-3.5 flex items-center gap-3 transition cursor-pointer " + (on ? 'bg-sky-50/60' : 'hover:bg-sky-50/30')}>
                <input type="checkbox" checked={on} onChange={() => toggleCheck(m.name)}
                  className="w-4 h-4 rounded border-slate-300 text-sky-600 focus:ring-sky-400 shrink-0" />
                <div className="flex-1 min-w-0">
                  <div className="font-bold text-sm text-slate-800 truncate">{m.name}</div>
                  <div className="text-xs text-slate-600 tabular-nums mt-0.5">
                    {m.cat}{m.lastPrice > 0 && <> ・ 現状価格 <b className="text-slate-700">{yen(m.lastPrice)}</b></>}
                    {m.cost > 0 && <> ・ 仕入 <b className="text-amber-700">{yen(m.cost)}</b></>}
                  </div>
                  {ls && (
                    <div className="mt-1 text-[11px] text-sky-600 font-bold underline decoration-dotted underline-offset-2 hover:text-sky-800"
                      onClick={e => { e.preventDefault(); e.stopPropagation(); setSalesModalProd(m.name); }}>
                      最終売上 {ls.date}・{ls.facility}（クリックで一覧）
                    </div>
                  )}
                </div>
              </label>
            );
          })}
          {visibleMaster.length === 0 && <div className="px-5 py-8 text-center text-xs text-slate-600">該当する商品がありません</div>}
        </div>
      </Card>

      <Card>
        <div className="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between gap-2">
          <span className="font-bold text-sm text-slate-700">価格確認リスト {selected.length}品目</span>
          <div className="flex items-center gap-2">
            <button onClick={clearAll} disabled={selected.length === 0}
              className="text-xs font-bold text-slate-500 hover:text-rose-500 disabled:opacity-40 transition">全て外す</button>
            <button onClick={handleCsv} disabled={selected.length === 0}
              className="bg-white hover:bg-slate-50 active:scale-[.98] text-slate-700 border border-slate-200 px-3.5 py-2 rounded-xl shadow-sm text-xs font-bold transition inline-flex items-center gap-1.5 disabled:opacity-40">
              <FileSpreadsheet size={14} /> CSV出力
            </button>
            <button onClick={handlePdf} disabled={selected.length === 0 || busy}
              className="bg-white hover:bg-slate-50 active:scale-[.98] text-slate-700 border border-slate-200 px-3.5 py-2 rounded-xl shadow-sm text-xs font-bold transition inline-flex items-center gap-1.5 disabled:opacity-40">
              <Download size={14} /> {busy ? '作成中…' : 'PDF保存'}
            </button>
            <button onClick={handlePrint}
              className="bg-white hover:bg-slate-50 active:scale-[.98] text-slate-700 border border-slate-200 px-3.5 py-2 rounded-xl shadow-sm text-xs font-bold transition inline-flex items-center gap-1.5">
              <Printer size={14} /> 印刷
            </button>
          </div>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-sm min-w-[520px]">
            <thead>
              <tr className="text-xs uppercase tracking-wide text-slate-600 border-b border-slate-100">
                <Th k="name" className="text-left font-bold px-4 py-2.5">商品名</Th>
                <Th k="cat" className="text-left font-bold px-2 py-2.5">分類</Th>
                <Th k="price" className="text-right font-bold px-1 py-2.5 w-28">直近販売単価</Th>
                <Th k="cost" className="text-right font-bold px-1 py-2.5 w-28">仕入単価</Th>
                <th className="w-10"></th>
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-50">
              {selected.map(p => (
                <tr key={p.name}>
                  <td className="px-4 py-2.5 font-bold text-sm text-slate-800">{p.name}</td>
                  <td className="px-2 py-2.5 text-xs text-slate-600">{p.cat}</td>
                  <td className="px-1 py-2.5 text-right tabular-nums text-sm text-slate-700">{p.lastPrice > 0 ? yen(p.lastPrice) : '—'}</td>
                  <td className="px-1 py-2.5 text-right tabular-nums text-sm text-amber-700">{p.cost > 0 ? yen(p.cost) : '—'}</td>
                  <td className="pr-3 text-right">
                    <button onClick={() => removeCheck(p.name)} className="text-slate-400 hover:text-rose-500 transition"><X size={15} /></button>
                  </td>
                </tr>
              ))}
              {selected.length === 0 && (
                <tr><td colSpan={5} className="px-5 py-10 text-center text-xs text-slate-600">左の商品一覧からチェックを入れると、ここに追加されます</td></tr>
              )}
            </tbody>
          </table>
        </div>
        <div className="px-5 py-3 bg-sky-50/70 text-[11px] text-slate-700 leading-relaxed border-t border-sky-100">
          チェックした商品の直近販売単価・仕入単価・粗利額を一覧にして印刷できます（改定価格の入力はありません）。列見出しをクリックすると並び替えできます。
        </div>
      </Card>
      {salesModalProd && <ProductSalesModal data={data} name={salesModalProd} onClose={() => setSalesModalProd(null)} />}
    </div>
  );
}

function DocComposer({ docType, data, masters, draft, setDraft, docs, setDocs, showToast, openPrint, goImport }) {
  const isQuote = docType === 'quote';
  // 見積書は金額を常時表示する（発注書は従来通りトグルで切替）。
  const priceOn = isQuote ? true : draft.showPrices;
  const [source, setSource] = useState(docType === 'order' ? 'all' : 'fac');
  const [cat, setCat] = useState('all');
  const [search, setSearch] = useState('');
  const [showSaved, setShowSaved] = useState(false);
  const [busy, setBusy] = useState(false);
  const [facSuggestOpen, setFacSuggestOpen] = useState(false);
  const [facPickerOpen, setFacPickerOpen] = useState(false);
  const [facPickerQuery, setFacPickerQuery] = useState('');
  const [salesModalProd, setSalesModalProd] = useState(null);
  const facBoxRef = useRef(null);
  const facInputRef = useRef(null);

  const facNames = useMemo(() =>
    data.facilities.slice().sort((a, b) => (b.sales || 0) - (a.sales || 0)).map(f => f.name), [data]);
  // 未入力（新規作成の初期状態）では候補を出さない。文字を入力し始めたときだけ
  // 部分一致でフィルタして表示する（既存施設の絞り込み）。
  const facSuggests = useMemo(() => {
    const q = normalizeSearchText(String(draft.facility || '').trim());
    if (!q) return [];
    return facNames.filter(n => normalizeSearchText(n).includes(q)).slice(0, 8);
  }, [facNames, draft.facility]);
  // 候補リストの外側をクリックしたら閉じる（施設別検索と同じ自作ドロップダウン方式。
  // ブラウザ標準の<datalist>は表示位置が崩れることがあるため使わない）
  useEffect(() => {
    if (!facSuggestOpen) return;
    const h = (e) => { if (facBoxRef.current && !facBoxRef.current.contains(e.target)) setFacSuggestOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [facSuggestOpen]);
  const fac = draft.facility ? data.facByName.get(draft.facility) : null;
  // 担当は手入力が優先。未入力のときだけ施設の履歴担当を表示・印刷に使う
  const repName = (draft.rep || '').trim() || (fac ? fac.repName : '');
  const facPairs = useMemo(() => {
    const m = new Map();
    if (fac) fac.pairs.forEach(p => m.set(p.prod, p));
    return m;
  }, [fac]);
  const savedList = useMemo(() =>
    docs.filter(d => d.type === docType).sort((a, b) => (a.savedAt < b.savedAt ? 1 : -1)), [docs, docType]);

  // 商品マスタ（販売履歴から自動生成）
  const master = useMemo(() => {
    let list;
    const dstr = (d) => (d ? d.y + '/' + d.mo + '/' + d.d : null);
    if (source === 'fac' && fac) {
      list = fac.pairs.slice().sort((a, b) => sum12(b.sales12) - sum12(a.sales12)).map(p => {
        const prod = data.prodByName.get(p.prod);
        return {
          name: p.prod, cat: prod ? prod.cat : 'その他', unit: p.unit || (prod ? prod.unit : ''),
          price: p.lastPrice > 0 ? p.lastPrice : (prod ? prod.lastPrice : 0),
          priceSrc: p.lastPrice > 0 ? 'この施設' : '全体',
          cost: prod ? prod.cost : 0,
          last: dstr(p.lastDate),
        };
      });
    } else {
      list = data.products.slice().sort((a, b) => b.winSales - a.winSales).map(prod => {
        const pair = facPairs.get(prod.name);
        return {
          name: prod.name, cat: prod.cat, unit: prod.unit,
          price: pair && pair.lastPrice > 0 ? pair.lastPrice : prod.lastPrice,
          priceSrc: pair && pair.lastPrice > 0 ? 'この施設' : '全体',
          cost: prod.cost,
          last: pair ? dstr(pair.lastDate) : null,
        };
      });
    }
    if (cat !== 'all') list = list.filter(x => x.cat === cat);
    const q = normalizeSearchText(search.trim());
    if (q) list = list.filter(x => normalizeSearchText(x.name).includes(q));
    return list;
  }, [data, fac, facPairs, source, cat, search]);
  const visibleMaster = master.slice(0, 40);
  const inItems = useMemo(() => new Set(draft.items.map(i => i.name)), [draft.items]);

  const patch = (p) => setDraft(prev => ({ ...prev, ...p }));
  const addItem = (m) => {
    if (inItems.has(m.name)) { showToast('「' + m.name + '」はすでに明細にあります', 'info'); return; }
    setDraft(prev => ({ ...prev, items: [...prev.items, { rid: newRowId(), name: m.name, cat: m.cat || '', note: '', qty: isQuote ? 1 : '', unit: m.unit || '', caseSize: '', price: Math.round(m.price) || 0, cost: Math.round(m.cost) || 0 }] }));
  };
  const addBlank = () => setDraft(prev => ({ ...prev, items: [...prev.items, { rid: newRowId(), name: '', cat: '', note: '', qty: isQuote ? 1 : '', unit: '', caseSize: '', price: 0 }] }));
  // 行と行の間に空白（見た目の区切り）を挿入する。商品ではないので集計・印刷では番号を振らない
  const addSpacer = (afterIdx) => setDraft(prev => {
    const items = prev.items.slice();
    items.splice(afterIdx + 1, 0, { rid: newRowId(), isSpacer: true });
    return { ...prev, items };
  });
  const setItem = (idx, p) => setDraft(prev => ({ ...prev, items: prev.items.map((it, i) => (i === idx ? { ...it, ...p } : it)) }));
  const delItem = (idx) => setDraft(prev => ({ ...prev, items: prev.items.filter((_, i) => i !== idx) }));
  const moveItem = (idx, dir) => setDraft(prev => {
    const to = idx + dir;
    if (to < 0 || to >= prev.items.length) return prev;
    const items = prev.items.slice();
    const [row] = items.splice(idx, 1);
    items.splice(to, 0, row);
    return { ...prev, items };
  });
  const total = draft.items.reduce((s, it) => it.isSpacer ? s : s + (Number(it.qty) || 0) * (it.price || 0), 0);

  // 帳票の中身。印刷・PDF・Excel で同じものを使う
  const docModel = () => {
    // 商品名が空欄の行も、施設側が手書きで記入できるようそのまま印刷に含める。
    const items = draft.items;
    const common = {
      facilityName: draft.facility, facilityAddress: draft.facilityAddress || '',
      facilityTel: draft.facilityTel || '', facilityFax: draft.facilityFax || '', repName: repName || '未設定', items,
      showPrices: priceOn, showCaseSize: !!draft.showCaseSize, issued: isoToJa(draft.issued),
      note: draft.note, title: draft.title, office: masters.settings.office,
      showCat: draft.showCat !== false, showItemNote: !!draft.showItemNote,
    };
    return isQuote
      ? { ...common, taxIncluded: !!draft.taxIncluded, showTotal: !!draft.showTotal, quoteNo: 'M-' + String(draft.issued || '').replace(/-/g, '') + '-01' }
      : common;
  };
  const buildHtml = () => (isQuote ? buildQuoteHtml(docModel()) : buildFacilityOrderHtml(docModel()));
  const docFileName = (ext) => (isQuote ? '御見積書_' : '発注書_') + String(draft.facility).replace(/[\\/:*?"<>|]/g, '') + '_' + (draft.issued || todayISO()) + ext;
  const validate = () => {
    if (!String(draft.facility).trim()) { showToast('施設名を入力してください', 'error'); return false; }
    if (draft.items.filter(it => String(it.name).trim()).length === 0) { showToast('明細に商品を追加してください', 'error'); return false; }
    return true;
  };
  const handlePrint = () => { if (validate()) openPrint(buildHtml()); };
  const handleInternalPrint = () => {
    if (!validate()) return;
    openPrint(buildDocInternalHtml({
      isQuote, title: draft.title, facilityName: draft.facility, issued: isoToJa(draft.issued),
      note: draft.note, items: draft.items, office: masters.settings.office, repName: repName || '未設定',
    }));
  };
  const handlePdf = async () => {
    if (!validate()) return;
    setBusy(true);
    showToast('PDFを作成しています…', 'info');
    try {
      await exportPdf(buildHtml(), docFileName('.pdf'));
      showToast('PDFを保存しました');
    } catch (e) {
      showToast('PDFの作成に失敗しました。印刷ダイアログの「PDFとして保存」もお試しください', 'error', 7000);
    } finally {
      setBusy(false);
    }
  };
  // 印刷と同じ形の Excel。金額・小計・合計は Excel の式なので、Excel で数量や単価を直しても計算し直される
  const handleExcel = () => {
    if (!validate()) return;
    try {
      downloadText(docFileName('.xlsx'), buildDocXlsx(docType, docModel()), XL_MIME);
      showToast('Excelを保存しました');
    } catch (e) {
      showToast('Excelの作成に失敗しました', 'error', 7000);
    }
  };
  const handleSave = () => {
    if (!String(draft.facility).trim()) { showToast('施設名を入力してください', 'error'); return; }
    const now = new Date().toISOString();
    const id = draft.id || (docType + '-' + Date.now());
    const rec = { ...draft, id, type: docType, savedAt: now };
    setDocs(prev => {
      const i = prev.findIndex(d => d.id === id);
      if (i >= 0) { const a = prev.slice(); a[i] = rec; return a; }
      return [...prev, rec];
    });
    setDraft(rec);
    showToast(draft.id ? '保存しました（上書き）' : '保存しました。次回この画面から呼び出して編集できます');
  };
  // 保存済みを読み込むときは、後から追加された表示フラグ(showCat/showTotal等)が
  // 欠けている旧レコードを既定値で補完する。補完しないと「画面では合計表示中なのに
  // 印刷には合計が出ない」といった食い違いが起きる（画面と印刷で既定値の解釈が異なるため）。
  const normalizeDoc = (d) => ({ ...newDocDraft(docType, d.facility || ''), ...d });
  const loadDoc = (d) => { setDraft(normalizeDoc(d)); setShowSaved(false); showToast('「' + d.facility + '」を読み込みました'); };
  const delDoc = (id) => setDocs(prev => prev.filter(d => d.id !== id));
  const newDoc = () => { setDraft(newDocDraft(docType, '')); showToast('新規作成にしました'); };
  // 取り消し: 未保存の編集を破棄。保存済みを編集中ならその内容に戻し、未保存なら空に戻す
  const handleCancel = () => {
    if (draft.id) {
      const saved = docs.find(d => d.id === draft.id);
      if (saved) { setDraft(normalizeDoc(saved)); showToast('保存済みの内容に戻しました'); return; }
    }
    setDraft(newDocDraft(docType, ''));
    showToast('入力内容を取り消しました');
  };

  const inputCls = 'h-10 px-3 rounded-xl border border-slate-200 bg-white text-sm shadow-sm focus:border-blue-400 focus:outline-none transition';

  return (
    <div className="space-y-4">
      <Card className="px-5 py-4 space-y-3">
        <div className="flex items-center gap-3 flex-wrap">
          {/* スマホ幅では施設名の入力欄を残りの幅に縮める（固定幅だと「一覧から選ぶ」と並んで横にはみ出す） */}
          <div className="flex items-center gap-2 max-w-full">
            <span className="text-sm text-slate-600 font-bold shrink-0">施設名</span>
            <div className="relative flex-1 min-w-0 sm:flex-none" ref={facBoxRef}>
              <textarea ref={facInputRef} value={draft.facility}
                onChange={e => { patch({ facility: e.target.value }); setFacSuggestOpen(true); }}
                onFocus={() => setFacSuggestOpen(true)}
                onKeyDown={e => { if (e.key === 'Escape') setFacSuggestOpen(false); }}
                placeholder="選択、または新規の施設名を入力"
                rows={1}
                className="w-full sm:w-72 min-h-[40px] max-h-20 px-3 py-2 rounded-xl border border-slate-200 bg-white text-sm shadow-sm focus:border-blue-400 focus:outline-none transition font-bold text-slate-700 leading-snug resize-y" />
              {facSuggestOpen && facSuggests.length > 0 && (
                <div className="absolute z-30 top-full left-0 mt-1.5 w-full sm:w-72 bg-white rounded-xl border border-slate-200 shadow-xl overflow-hidden">
                  {facSuggests.map(n => (
                    <button key={n} type="button" onMouseDown={e => e.preventDefault()}
                      onClick={() => { patch({ facility: n }); setFacSuggestOpen(false); }}
                      className="w-full text-left px-4 py-2.5 hover:bg-sky-50 transition text-xs font-bold text-slate-700 truncate border-b border-slate-50 last:border-0">
                      {n}
                    </button>
                  ))}
                </div>
              )}
            </div>
            <button type="button" onClick={() => { setFacPickerOpen(true); setFacPickerQuery(''); }}
              title="既存施設の一覧から選ぶ"
              className="h-10 px-3 rounded-xl border border-slate-200 bg-white hover:bg-sky-50 hover:border-sky-300 active:scale-[.98] text-slate-600 hover:text-sky-700 text-xs font-bold shadow-sm transition inline-flex items-center gap-1.5 shrink-0">
              <Search size={14} /> 一覧から選ぶ
            </button>
          </div>
          {draft.facility && !data.facByName.has(draft.facility) && (
            <span className="bg-emerald-100 text-emerald-700 text-[11px] font-bold px-2.5 py-1 rounded-full">新規施設</span>
          )}
          {draft.id && <span className="bg-teal-100 text-teal-700 text-[11px] font-bold px-2.5 py-1 rounded-full">保存済みを編集中</span>}
          <label className="inline-flex items-center gap-2 text-sm text-slate-600 font-bold">
            {isQuote ? '発行日' : '発注日'}
            <input type="date" value={draft.issued} onChange={e => patch({ issued: e.target.value })}
              className={inputCls + ' tabular-nums'} />
          </label>
          <label className="inline-flex items-center gap-2 text-sm text-slate-600 font-bold">
            担当
            <input value={draft.rep || ''} list={'doc-rep-list-' + docType}
              onChange={e => patch({ rep: e.target.value })}
              placeholder={fac ? fac.repName : '担当者名'}
              title="未入力の場合、この施設の履歴担当（あれば）を印刷に使います"
              className={inputCls + ' w-32'} />
            <datalist id={'doc-rep-list-' + docType}>
              {(masters.settings.reps || []).map(r => <option key={r} value={r} />)}
            </datalist>
          </label>
          {/* 住所・TEL・FAXは発注書の「発注元」欄にしか印刷されない。
              見積書で入力させると、入力したのに帳票に出ないという食い違いになるため出さない。 */}
          {!isQuote && (draft.facilityAddress === undefined || draft.facilityAddress === '') ? (
            <button type="button" onClick={() => patch({ facilityAddress: ' ' })}
              className="text-xs font-bold text-sky-600 hover:text-sky-800 transition">＋住所を追加</button>
          ) : null}
          {!isQuote && (draft.facilityTel === undefined || draft.facilityTel === '') ? (
            <button type="button" onClick={() => patch({ facilityTel: ' ' })}
              className="text-xs font-bold text-sky-600 hover:text-sky-800 transition">＋電話番号を追加</button>
          ) : null}
          {!isQuote && (draft.facilityFax === undefined || draft.facilityFax === '') ? (
            <button type="button" onClick={() => patch({ facilityFax: ' ' })}
              className="text-xs font-bold text-sky-600 hover:text-sky-800 transition">＋FAX番号を追加</button>
          ) : null}
        </div>
        {draft.facilityAddress !== undefined && draft.facilityAddress !== '' && (
          <div className="flex items-center gap-2">
            <span className="text-sm text-slate-600 font-bold shrink-0">住所</span>
            <input value={draft.facilityAddress.trim() === '' ? '' : draft.facilityAddress}
              onChange={e => patch({ facilityAddress: e.target.value })}
              placeholder="発注元の住所（帳票に印刷されます）"
              className={inputCls + ' w-96'} />
            <button type="button" onClick={() => patch({ facilityAddress: '' })}
              className="text-slate-400 hover:text-rose-500 transition"><X size={15} /></button>
          </div>
        )}
        {draft.facilityTel !== undefined && draft.facilityTel !== '' && (
          <div className="flex items-center gap-2">
            <span className="text-sm text-slate-600 font-bold shrink-0">電話番号</span>
            <input value={draft.facilityTel.trim() === '' ? '' : draft.facilityTel}
              onChange={e => patch({ facilityTel: e.target.value })}
              placeholder="発注元の電話番号（帳票に印刷されます）"
              className={inputCls + ' w-64'} />
            <button type="button" onClick={() => patch({ facilityTel: '' })}
              className="text-slate-400 hover:text-rose-500 transition"><X size={15} /></button>
          </div>
        )}
        {draft.facilityFax !== undefined && draft.facilityFax !== '' && (
          <div className="flex items-center gap-2">
            <span className="text-sm text-slate-600 font-bold shrink-0">FAX番号</span>
            <input value={draft.facilityFax.trim() === '' ? '' : draft.facilityFax}
              onChange={e => patch({ facilityFax: e.target.value })}
              placeholder="発注元のFAX番号（帳票に印刷されます）"
              className={inputCls + ' w-64'} />
            <button type="button" onClick={() => patch({ facilityFax: '' })}
              className="text-slate-400 hover:text-rose-500 transition"><X size={15} /></button>
          </div>
        )}
        <div className="flex items-center gap-2 flex-wrap">
          <label className="inline-flex items-center gap-2 text-sm text-slate-600 font-bold">
            表題
            <input value={draft.title} onChange={e => patch({ title: e.target.value })} className={inputCls + ' w-44'} />
          </label>
        </div>
        <div className="flex items-center gap-2 flex-wrap">
          <button onClick={() => setShowSaved(s => !s)}
            className="bg-slate-500 hover:bg-slate-600 active:scale-[.98] text-white px-3.5 py-2.5 rounded-xl shadow-sm text-sm font-bold transition inline-flex items-center gap-1.5">
            <Database size={15} /> 保存済み（{savedList.length}）
          </button>
          <button onClick={handleCancel}
            className="bg-white border border-slate-200 hover:border-rose-300 hover:text-rose-600 active:scale-[.98] text-slate-600 px-3.5 py-2.5 rounded-xl shadow-sm text-sm font-bold transition inline-flex items-center gap-1.5">
            <RotateCcw size={14} /> 取り消し
          </button>
          <button onClick={newDoc}
            className="bg-white border border-slate-200 hover:border-slate-300 active:scale-[.98] text-slate-600 px-3.5 py-2.5 rounded-xl shadow-sm text-sm font-bold transition">新規</button>
          <button onClick={handleSave}
            className="bg-emerald-600 hover:bg-emerald-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-emerald-200 text-sm font-bold transition inline-flex items-center gap-1.5">
            <CheckCircle2 size={15} /> 保存
          </button>
          <button onClick={handlePdf} disabled={busy}
            className={"px-4 py-2.5 rounded-xl shadow-sm text-sm font-bold transition inline-flex items-center gap-1.5 text-white " +
              (busy ? 'bg-slate-300' : 'bg-indigo-600 hover:bg-indigo-700 active:scale-[.98] shadow-indigo-200')}>
            <Download size={15} /> {busy ? '作成中…' : 'PDF保存'}
          </button>
          <button onClick={handleExcel} title="印刷と同じ形の Excel ファイル（.xlsx）で保存します"
            className="bg-white border border-emerald-300 hover:bg-emerald-50 hover:border-emerald-400 active:scale-[.98] text-emerald-700 px-4 py-2.5 rounded-xl shadow-sm text-sm font-bold transition inline-flex items-center gap-1.5">
            <FileSpreadsheet size={15} /> Excel保存
          </button>
          <button onClick={handlePrint}
            className="bg-sky-600 hover:bg-sky-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-sky-200 text-sm font-bold transition inline-flex items-center gap-1.5">
            <Printer size={15} /> 印刷
          </button>
          <button onClick={handleInternalPrint} title="仕入価格・利益率を含む社内確認用の資料を印刷します（社外秘）"
            className="bg-amber-50 hover:bg-amber-100 active:scale-[.98] text-amber-800 border border-amber-300 px-4 py-2.5 rounded-xl shadow-sm text-sm font-bold transition inline-flex items-center gap-1.5">
            <Printer size={15} /> 社内用印刷
          </button>
        </div>

        {showSaved && (
          <div className="border-t border-slate-100 pt-3">
            <div className="text-sm font-bold text-slate-800 uppercase tracking-wide mb-2.5">保存済みの{isQuote ? '見積書' : '発注書'}（{savedList.length}件・施設フォルダ別）</div>
            <div className="max-h-96 overflow-y-auto pr-0.5">
              <SavedDocFolders savedList={savedList} onLoad={loadDoc} onDelete={delDoc} emptyLabel={'保存された' + (isQuote ? '見積書' : '発注書')}
                renderExtra={d => {
                  const dTotal = d.items.reduce((s, it) => it.isSpacer ? s : s + (Number(it.qty) || 0) * (it.price || 0), 0);
                  return (
                    <div className="text-right shrink-0 w-28">
                      {(isQuote || d.showPrices) && dTotal > 0
                        ? <div className="font-extrabold text-sm text-slate-900 tabular-nums">{yen(dTotal)}</div>
                        : <div className="text-[11px] text-slate-500 font-bold">金額なし</div>}
                    </div>
                  );
                }} />
            </div>
          </div>
        )}
      </Card>

      {(
        <div className="grid xl:grid-cols-[minmax(260px,0.75fr)_minmax(420px,1.6fr)_minmax(170px,0.5fr)] gap-5 items-start [&>*]:min-w-0">
          {/* 商品マスタ */}
          <Card>
            <div className="px-5 py-3.5 border-b border-slate-100 flex items-center gap-2.5 flex-wrap">
              <div className="flex-1 min-w-[180px]">
                <div className="font-bold text-sm text-slate-800">商品マスタ</div>
                <div className="text-[11px] text-slate-600">販売履歴から自動生成 ・ クリックで明細に追加</div>
              </div>
              <Segmented value={source} onChange={setSource}
                options={[['fac', 'この施設の購入品'], ['all', '全商品']]} />
            </div>
            <div className="px-5 py-3 border-b border-slate-100 flex items-center gap-2.5 flex-wrap">
              <div className="relative">
                <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-600" />
                <input value={search} onChange={e => setSearch(e.target.value)} placeholder="商品名で検索"
                  className="h-10 pl-9 pr-3 rounded-xl border border-slate-200 text-sm w-48 bg-white shadow-sm focus:border-blue-400 focus:outline-none transition" />
              </div>
              <select value={cat} onChange={e => setCat(e.target.value)}
                className="h-10 px-3 rounded-xl border border-slate-200 bg-white text-sm shadow-sm font-bold text-slate-600">
                <option value="all">すべての種別</option>
                {CATEGORY_NAMES.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div className="divide-y divide-slate-50 max-h-[32rem] overflow-y-auto">
              {visibleMaster.map(m => {
                const ls = productLastSaleInfo(data, m.name);
                return (
                <div key={m.name} role="button" tabIndex={0}
                  onClick={() => { if (!inItems.has(m.name)) addItem(m); }}
                  onKeyDown={e => { if (e.key === 'Enter' && !inItems.has(m.name)) addItem(m); }}
                  className={"w-full text-left px-5 py-3.5 flex items-center gap-3 transition " +
                    (inItems.has(m.name) ? 'opacity-40 cursor-default' : 'cursor-pointer hover:bg-emerald-50/60')}>
                  <div className="flex-1 min-w-0">
                    <div className="font-bold text-sm text-slate-800 truncate">{m.name}</div>
                    <div className="text-xs text-slate-600 tabular-nums mt-0.5">
                      {m.cat}
                      {m.price > 0 && <> ・ 直近単価 <b className="text-slate-700">{yen(m.price)}</b>（{m.priceSrc}）</>}
                      {m.cost > 0 && <> ・ 仕入 <b className="text-amber-700">{yen(m.cost)}</b></>}
                      {m.last && <> ・ 最終 {m.last}</>}
                    </div>
                    {ls && (
                      <div className="mt-1 text-[11px] text-sky-600 font-bold underline decoration-dotted underline-offset-2 hover:text-sky-800"
                        onClick={e => { e.stopPropagation(); setSalesModalProd(m.name); }}>
                        最終売上 {ls.date}・{ls.facility}（クリックで一覧）
                      </div>
                    )}
                  </div>
                  <span className={"text-xs font-bold px-2.5 py-1 rounded-full shrink-0 " +
                    (inItems.has(m.name) ? 'bg-slate-100 text-slate-600' : 'bg-emerald-500 text-white')}>
                    {inItems.has(m.name) ? '追加済' : '＋追加'}
                  </span>
                </div>
                );
              })}
              {visibleMaster.length === 0 && (
                <div className="px-5 py-10 text-center text-xs text-slate-600">
                  {source === 'fac'
                    ? (fac ? '該当する商品がありません' : 'この施設の購入履歴がありません（「全商品」に切り替えてください）')
                    : '該当する商品がありません'}
                </div>
              )}
            </div>
            {master.length > visibleMaster.length && (

/* ============================================================
   画面7: 設定
============================================================ */
function SettingsView({ rows, masters, setRows, setMasters, setOffice, meta, setMeta, docs, setDocs, targets, setTargets, data, showToast }) {
  const [sub, setSubRaw] = useState('rep');
  const [q, setQ] = useState('');
  const [newRep, setNewRep] = useState('');
  const [catLimit, setCatLimit] = useState(100);
  const [newRuleKw, setNewRuleKw] = useState('');
  const [newRuleCat, setNewRuleCat] = useState(CATEGORY_NAMES[0]);
  const [jsonImp, setJsonImp] = useState(null);
  const [delStep, setDelStep] = useState(0);
  const jsonRef = useRef(null);
  const setSub = (v) => { setSubRaw(v); setQ(''); setCatLimit(100); };

  const customers = masters.customers;
  const updateCustomer = (name, patch) => setMasters(prev => ({
    ...prev, customers: { ...prev.customers, [name]: { ...prev.customers[name], ...patch } },
  }));

  // 担当者リスト = 手動追加分 ∪ すでに割り当てられている名前
  const allReps = useMemo(() => {
    const s = new Set(masters.settings.reps || []);
    for (const n in customers) { const r = customers[n].rep; if (r) s.add(r); }
    return [...s].sort((a, b) => a.localeCompare(b, 'ja'));
  }, [masters]);
  const addRep = () => {
    const name = newRep.trim();
    if (!name) return;
    if (allReps.includes(name)) { showToast('「' + name + '」はすでに登録されています', 'info'); return; }
    setMasters(prev => ({ ...prev, settings: { ...prev.settings, reps: [...(prev.settings.reps || []), name] } }));
    setNewRep('');
    showToast('担当者「' + name + '」を追加しました');
  };

  const facNames = useMemo(() => {
    const list = Object.keys(customers).filter(n => customers[n].type === 'facility');
    list.sort((a, b) => {
      const ua = customers[a].rep ? 1 : 0, ub = customers[b].rep ? 1 : 0;
      if (ua !== ub) return ua - ub;   // 未設定を上に
      return a.localeCompare(b, 'ja');
    });
    return list;
  }, [masters]);
  const perNames = useMemo(() => {
    const list = Object.keys(customers).filter(n => customers[n].type === 'person');
    list.sort((a, b) => {
      const ua = customers[a].uncertain ? 0 : 1, ub = customers[b].uncertain ? 0 : 1;
      if (ua !== ub) return ua - ub;   // 要確認を上に
      return a.localeCompare(b, 'ja');
    });
    return list;
  }, [masters]);
  const facNamesPerson = useMemo(() => {
    const list = Object.keys(customers).filter(n => customers[n].type === 'facility');
    list.sort((a, b) => {
      const ua = customers[a].uncertain ? 0 : 1, ub = customers[b].uncertain ? 0 : 1;
      if (ua !== ub) return ua - ub;
      return a.localeCompare(b, 'ja');
    });
    return list;
  }, [masters]);
  const filterQ = (list) => (q.trim() ? list.filter(n => n.includes(q.trim())) : list);

  // 商品リスト（売上の大きい順）
  const prodNames = useMemo(() => {
    if (!data.empty) return data.products.slice().sort((a, b) => b.winSales - a.winSales).map(p => p.name);
    return [...new Set([...Object.keys(masters.catOverrides), ...Object.keys(masters.itemHandling)])];
  }, [data, masters]);
  const setCat = (name, v) => setMasters(prev => {
    const co = { ...prev.catOverrides };
    // 学習ルール・内蔵辞書と同じ分類に戻したときは手直しを消す（自動判定に任せる）
    if (v === resolveCategory(name, {}, prev.catRules).cat) delete co[name]; else co[name] = v;
    return { ...prev, catOverrides: co };
  });
  const setHandling = (name, v) => setMasters(prev => {
    const ih = { ...prev.itemHandling };
    if (v === HANDLING_DEFAULT) delete ih[name]; else ih[name] = v;
    return { ...prev, itemHandling: ih };
  });

  // ---- キーワード学習ルール ----
  const catOf = (name) => resolveCategory(name, masters.catOverrides, masters.catRules);
  const ruleMatchCount = (kw) => {
    const n = String(kw || '').normalize('NFKC');
    if (!n) return 0;
    return prodNames.reduce((s, p) => s + (String(p).normalize('NFKC').includes(n) ? 1 : 0), 0);
  };
  const addRule = () => {
    const kw = newRuleKw.trim();
    if (!kw) { showToast('キーワードを入力してください', 'error'); return; }
    if ((masters.catRules || []).some(r => r.kw === kw)) { showToast('「' + kw + '」はすでに登録されています', 'info'); return; }
    setMasters(prev => ({ ...prev, catRules: [...(prev.catRules || []), { kw, cat: newRuleCat }] }));
    const n = ruleMatchCount(kw);
    setNewRuleKw('');
    showToast('「' + kw + '」を含む商品を' + newRuleCat + 'に分類するルールを覚えました（該当 ' + n + '件）');
  };
  const delRule = (kw) => setMasters(prev => ({ ...prev, catRules: (prev.catRules || []).filter(r => r.kw !== kw) }));

  // ---- データ管理 ----
  const usage = storageUsage();
  const usagePct = Math.min(100, Math.round(usage / STORAGE_LIMIT * 100));

  const handleExport = () => {
    // targets(ターゲット先進捗)も必ず含める。これが漏れているとPC移行や
    // 復元のたびにターゲット先の登録が丸ごと消える。
    const payload = { app: 'taiyo-uriage-bunseki', schema: 1, exportedAt: new Date().toISOString(), rows, masters, meta, docs, targets };
    downloadText('売上分析データ_' + todayISO() + '.json', JSON.stringify(payload), 'application/json');
    showToast('JSONエクスポートしました（バックアップ・PC間共有に使えます）');
  };
  const handleJsonFile = (file) => {
    if (!file) return;
    file.text().then(t => {
      let obj = null;
      try { obj = JSON.parse(t.replace(/^﻿/, '')); } catch {}
      if (!obj || !Array.isArray(obj.rows) || !obj.masters || typeof obj.masters !== 'object') {
        showToast('このファイルは売上分析アプリのバックアップではありません', 'error'); return;
      }
      if ((obj.schema || 1) > 1) { showToast('このファイルは新しいバージョンの形式です。アプリを最新版に更新してください', 'error'); return; }
      const valid = obj.rows.filter(r => Array.isArray(r) && r.length >= 11 && parseDateStr(r[1]));
      setJsonImp({ fileName: file.name, rows: valid, dropped: obj.rows.length - valid.length,
        masters: normalizeMasters(obj.masters), meta: (obj.meta && typeof obj.meta === 'object') ? obj.meta : { schema: 1 },
        docs: Array.isArray(obj.docs) ? obj.docs.filter(d => d && d.id && d.type) : [],
        targets: Array.isArray(obj.targets) ? obj.targets.filter(t => t && t.id) : [] });
    }).catch(() => showToast('ファイルの読み込みに失敗しました', 'error'));

    if (!imp) return;

      setMasters(imp.masters);

      setDocs(imp.docs);
      setTargets(imp.targets);
      showToast('データを置き換えました（明細 ' + num(imp.rows.length) + '行）');
    } else {
      const remaining = rowKeyCounts(rows);
      const add = [];
      imp.rows.forEach(r => {
        const k = rowKey(r);
        const rem = remaining.get(k) || 0;
        if (rem > 0) { remaining.set(k, rem - 1); return; }
        add.push(r);
      });
      if (add.length) setRows(prev => [...prev, ...add]);
      setMasters(prev => {
        const mc = { ...imp.masters.customers };
        for (const n in prev.customers) {
          const loc = prev.customers[n], im = imp.masters.customers[n];
          mc[n] = { ...(im || {}), ...loc, rep: loc.rep || ((im && im.rep) || '') };
        }
        return {
          customers: mc,
          catOverrides: { ...imp.masters.catOverrides, ...prev.catOverrides },
          priceOverrides: { ...imp.masters.priceOverrides, ...prev.priceOverrides },
          itemHandling: { ...imp.masters.itemHandling, ...prev.itemHandling },
          itemFacilityHandling: { ...imp.masters.itemFacilityHandling, ...prev.itemFacilityHandling },
          stockQtyOverrides: { ...imp.masters.stockQtyOverrides, ...prev.stockQtyOverrides },
          stockMonthOverrides: { ...imp.masters.stockMonthOverrides, ...prev.stockMonthOverrides },
          referralOverrides: { ...imp.masters.referralOverrides, ...prev.referralOverrides },
          settings: { ...prev.settings, reps: [...new Set([...(prev.settings.reps || []), ...(imp.masters.settings.reps || [])])] },
        };
      });
      setDocs(prev => {
        const seenIds = new Set(prev.map(d => d.id));
        return [...prev, ...imp.docs.filter(d => !seenIds.has(d.id))];
      });
      setTargets(prev => {
        const seenIds = new Set(prev.map(t => t.id));
        return [...prev, ...imp.targets.filter(t => !seenIds.has(t.id))];
      });
      showToast('データを統合しました（新しい明細 ' + num(add.length) + '行を追加）');
    }
    setJsonImp(null);
  };
