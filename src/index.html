            <div className="font-bold text-sm text-slate-800 inline-flex items-center gap-2">
              <span className="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-fuchsia-50 text-fuchsia-500"><Database size={14} /></span>
              バックアップ・共有
            </div>
            <div className="flex gap-2.5 flex-wrap">
              <button onClick={handleExport}
                className="bg-fuchsia-600 hover:bg-fuchsia-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-fuchsia-200 text-sm font-bold transition inline-flex items-center gap-1.5">
                <Download size={15} /> JSONエクスポート
              </button>
              <button onClick={() => jsonRef.current && jsonRef.current.click()}
                className="bg-blue-600 hover:bg-blue-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-blue-200 text-sm font-bold transition inline-flex items-center gap-1.5">
                <Upload size={15} /> JSONインポート
              </button>
              <input ref={jsonRef} type="file" accept=".json" className="hidden"
                onChange={e => { handleJsonFile(e.target.files[0]); e.target.value = ''; }} />
            </div>
            <div className="text-xs text-slate-600 leading-relaxed">別のPCとデータを共有するときは、エクスポート→ファイルを渡す→インポートの順で行います。インポート時に「置き換え」か「統合」を選べます。</div>
          </Card>
          <Card className="p-5 border-rose-200">
            <div className="font-bold text-sm text-rose-600 mb-3 inline-flex items-center gap-2">
              <span className="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-rose-50 text-rose-500"><Trash2 size={14} /></span>
              危険な操作
            </div>
            <button onClick={() => setDelStep(1)}
              className="bg-rose-600 hover:bg-rose-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-rose-200 text-sm font-bold transition">
              全データを削除
            </button>
            <div className="text-xs text-slate-600 mt-2.5 leading-relaxed">売上データ・設定のすべてが消えます。実行前に二重確認とバックアップ案内を表示します。</div>
          </Card>
        </div>
      )}

      {/* JSONインポート: 置き換え / 統合 の選択モーダル */}
      {jsonImp && (
        <div className="fixed inset-0 z-40 bg-slate-600/50 backdrop-blur-sm overflow-auto py-8 px-4 no-print">
          <div className="max-w-lg mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden">
            <div className="px-6 py-4 border-b border-slate-100 flex items-center gap-3 bg-gradient-to-r from-blue-50 to-sky-50">
              <span className="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-blue-100 text-blue-600"><Database size={17} /></span>
              <div className="flex-1 min-w-0">
                <div className="font-extrabold text-slate-800">JSONインポート</div>
                <div className="text-[11px] text-slate-600 truncate">{jsonImp.fileName}</div>
              </div>
              <button onClick={() => setJsonImp(null)} className="text-slate-600 hover:text-slate-600 transition"><X size={20} /></button>
            </div>
            <div className="px-6 py-4 text-sm text-slate-600 space-y-2">
              <div className="tabular-nums">ファイルの中身: 明細 <b className="text-slate-800">{num(jsonImp.rows.length)}行</b>
                {jsonImp.dropped > 0 && <span className="text-rose-500">（不正な行 {num(jsonImp.dropped)}行は除外）</span>}
              </div>
              <div className="tabular-nums">いまアプリにあるデータ: 明細 <b className="text-slate-800">{num(rows.length)}行</b></div>
              <div className="text-xs text-slate-600 leading-relaxed">
                <b className="text-slate-600">置き換え</b>: 今のデータを消してファイルの内容だけにします（別PCの控えを丸ごと復元するとき）<br />
                <b className="text-slate-600">統合</b>: 今のデータに、ファイルの新しい明細と設定を足します（重複は自動スキップ・自分の設定が優先）
              </div>
            </div>
            <div className="px-6 py-4 flex gap-2 justify-end border-t border-slate-100">
              <button onClick={() => applyJson('replace')}
                className="bg-blue-600 hover:bg-blue-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-blue-200 text-sm font-bold transition">置き換え</button>
              <button onClick={() => applyJson('merge')}
                className="bg-emerald-600 hover:bg-emerald-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-emerald-200 text-sm font-bold transition">統合</button>
              <button onClick={() => setJsonImp(null)}
                className="bg-rose-600 hover:bg-rose-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-rose-200 text-sm font-bold transition">キャンセル</button>
            </div>
          </div>
        </div>
      )}

      {/* 全データ削除: 二段階確認モーダル */}
      {delStep > 0 && (
        <div className="fixed inset-0 z-40 bg-slate-600/50 backdrop-blur-sm overflow-auto py-8 px-4 no-print">
          <div className="max-w-lg mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden">
            <div className="px-6 py-4 border-b border-slate-100 flex items-center gap-3 bg-rose-50">
              <span className="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-rose-100 text-rose-600"><Trash2 size={17} /></span>
              <div className="flex-1">
                <div className="font-extrabold text-slate-800">{delStep === 1 ? '全データを削除しますか？' : '最終確認'}</div>
                <div className="text-[11px] text-slate-600">{delStep === 1 ? '確認 1/2' : '確認 2/2 — この操作は取り消せません'}</div>
              </div>
              <button onClick={() => setDelStep(0)} className="text-slate-600 hover:text-slate-600 transition"><X size={20} /></button>
            </div>
            {delStep === 1 ? (
              <div className="px-6 py-4 text-sm text-slate-600 space-y-2">
                <div>次のデータが<b className="text-rose-600">すべて</b>消えます:</div>
                <ul className="text-xs text-slate-700 leading-relaxed list-disc pl-5">
                  <li>売上明細 {num(rows.length)}行</li>
                  <li>施設/個人の判定・担当者・直送フラグの設定</li>
                  <li>商品分類・在庫扱いの手直し、キーワード学習ルール</li>
                  <li>保存した発注書・見積書・価格改定 {num(docs.length)}件</li>
                </ul>
                <div className="text-xs text-slate-600">※ ターゲット先進捗と営業所の設定は残ります。</div>
                <div className="flex items-center gap-2 bg-amber-50 border border-amber-200 rounded-xl px-4 py-2.5 text-amber-800 text-xs font-bold">
                  <AlertTriangle size={15} className="shrink-0" />
                  削除の前に JSONエクスポート で控えを取っておくことを強くおすすめします
                </div>
              </div>
            ) : (
              <div className="px-6 py-4 text-sm text-slate-600">
                本当に削除してよければ「完全に削除する」を押してください。削除後は、控えのJSONか売上CSVを取り込み直すまでアプリは空になります。
              </div>
            )}
            <div className="px-6 py-4 flex gap-2 justify-end border-t border-slate-100 flex-wrap">
              {delStep === 1 ? (
                <>
                  <button onClick={handleExport}
                    className="bg-fuchsia-600 hover:bg-fuchsia-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-fuchsia-200 text-sm font-bold transition inline-flex items-center gap-1.5">
                    <Download size={15} /> 先にエクスポート
                  </button>
                  <button onClick={() => setDelStep(2)}
                    className="bg-rose-600 hover:bg-rose-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-rose-200 text-sm font-bold transition">削除に進む</button>
                </>
              ) : (
                <button onClick={doDelete}
                  className="bg-rose-600 hover:bg-rose-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-rose-200 text-sm font-bold transition">完全に削除する</button>
              )}
              <button onClick={() => setDelStep(0)}
                className="bg-slate-500 hover:bg-slate-600 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm text-sm font-bold transition">キャンセル</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   アプリ本体（ダークサイドバー＋ヘッダーのモダンレイアウト）
============================================================ */
/* ============================================================
   画面: 売上管理（商品名・施設名・仕入先で全取引を横断検索）
   - 他画面は施設のみを集計対象にしているが、ここは施設・個人を問わずCSVの全行が対象
============================================================ */
function SalesSearchPanel({ rows, masters, showToast, openPrint }) {
  const [q, setQ] = useState('');
  const [fromIdx, setFromIdx] = useState('');
  const [toIdx, setToIdx] = useState('');
  const [sortKey, setSortKey] = useState('date');
  const [sortDir, setSortDir] = useState(-1);

  const monthsAll = useMemo(() => {
    const s = new Set();
    for (const r of rows) { const d = parseDateStr(r[1]); if (d) s.add(d.idx); }
    return [...s].sort((a, b) => a - b);
  }, [rows]);

  const custType = (name) => {
    const c = masters.customers[name];
    if (!c) return '';
    return c.type === 'facility' ? '施設' : '個人';
  };
  const repOf = (name) => {
    const c = masters.customers[name];
    return (c && c.rep) || '';
  };

  const matched = useMemo(() => {
    const query = normalizeSearchText(q.trim());
    if (!query) return [];
    const lo = fromIdx === '' ? -Infinity : +fromIdx;
    const hi = toIdx === '' ? Infinity : +toIdx;
    const list = [];
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      if (!(normalizeSearchText(r[2]).includes(query) || normalizeSearchText(r[3]).includes(query) || (r[9] && normalizeSearchText(r[9]).includes(query)))) continue;
      const d = parseDateStr(r[1]);
      if (!d || d.idx < lo || d.idx > hi) continue;
      list.push(r);
    }
    return list;
  }, [rows, q, fromIdx, toIdx]);

  const sortVal = (r, key) => {
    switch (key) {
      case 'date': return (parseDateStr(r[1]) || {}).sort || 0;
      case 'customer': return r[2] || '';
      case 'rep': return repOf(r[2]) || '';
      case 'product': return r[3] || '';
      case 'qty': return +r[4] || 0;
      case 'price': return +r[6] || 0;
      case 'amount': return +r[7] || 0;
      case 'costPrice': return +r[10] || 0;
      case 'cost': return (+r[4] || 0) * (+r[10] || 0);
      case 'gross': return +r[8] || 0;
      case 'marginPct': return (+r[7] || 0) > 0 ? (+r[8] || 0) / (+r[7] || 0) : 0;
      default: return 0;
    }
  };
  const sorted = useMemo(() => {
    const arr = matched.slice();
    arr.sort((a, b) => {
      const va = sortVal(a, sortKey), vb = sortVal(b, sortKey);
      if (typeof va === 'string') return va.localeCompare(vb, 'ja') * sortDir;
      return (va - vb) * sortDir;
    });
    return arr;
  }, [matched, sortKey, sortDir]);

  const summary = useMemo(() => {
    let qty = 0, sales = 0, cost = 0, gross = 0, grossUnknown = 0;
    for (const r of matched) {
      qty += (+r[4] || 0); sales += (+r[7] || 0); gross += (+r[8] || 0);
      if (r[8] === null || r[8] === undefined || r[8] === '') grossUnknown++;
      cost += (+r[4] || 0) * (+r[10] || 0);
    }
    // 数量は単位が違っても足してしまうため、単位が混在するときは表示側で注意を出す
    const units = new Set(matched.map(r => r[5] || ''));
    return { qty, sales, cost, gross, grossUnknown, mixedUnit: units.size > 1,
      rate: sales !== 0 ? Math.round(gross / sales * 1000) / 10 : 0, count: matched.length };
  }, [matched]);

  const visible = sorted.slice(0, 200);
  const periodLabel = fromIdx === '' && toIdx === '' ? '全期間'
    : (fromIdx === '' ? '〜' + idxLabel(+toIdx) : toIdx === '' ? idxLabel(+fromIdx) + '〜' : idxLabel(+fromIdx) + '〜' + idxLabel(+toIdx));

  const toggleSort = (key) => {
    if (sortKey === key) setSortDir(d => -d);
    else { setSortKey(key); setSortDir(key === 'date' ? -1 : -1); }
  };
  const Th = ({ k, children, className }) => (
    <th className={"cursor-pointer select-none " + (className || '')} onClick={() => toggleSort(k)}>
      <span className="inline-flex items-center gap-0.5">{children}{sortKey === k && (sortDir === 1 ? <ChevronUp size={11} /> : <ChevronDown size={11} />)}</span>
    </th>
  );

  const handleCsv = () => {
    // 先頭に売上番号を入れておくと、このCSVをそのまま取込画面に戻せる
    // （取込は売上番号を必須列にしているため。他の列名も別名として認識される）
    const head = ['売上番号', '売上日', 'お客様名', '種別', '担当', '商品名', '数量', '単位', '販売単価', '金額', '仕入単価', '仕入金額', '粗利額', '利益率%'];
    const lines = sorted.map(r => {
      const amount = +r[7] || 0, gross = +r[8] || 0;
      return [
        r[0], r[1], r[2], custType(r[2]) || '不明', repOf(r[2]), r[3], r[4], r[5], r[6], r[7], r[10],
        r[10] === null || r[10] === undefined ? '' : (+r[4] || 0) * (+r[10] || 0), r[8],
        amount > 0 && r[8] !== null && r[8] !== undefined ? Math.round(gross / amount * 1000) / 10 : '',
      ];
    });
    downloadText('売上管理_' + q.replace(/[\\/:*?"<>|]/g, '') + '_' + todayCompact() + '.csv', buildCsv([head, ...lines]), 'text/csv');
    showToast('CSVを出力しました（Excelでそのまま開けます）');
  };
  const handlePrint = () => {
    openPrint(buildSalesSearchHtml({ query: q, periodLabel, summary, rows: sorted.map(r => ({
      date: r[1], customer: r[2], custType: custType(r[2]) || '', product: r[3], qty: +r[4] || 0, unit: r[5] || '',
      price: +r[6] || 0, amount: +r[7] || 0, costPrice: +r[10] || 0, gross: r[8] === null || r[8] === undefined ? null : (+r[8] || 0),
    })) }));
  };

  return (
    <div className="space-y-4">
      <Card className="px-5 py-4">
        <div className="text-[11px] font-bold text-slate-500 mb-1.5">商品名・施設名（お客様名）・仕入先名で検索</div>
        <div className="flex items-center gap-2.5 flex-wrap">
          <div className="relative flex-1 min-w-[240px]">
            <Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" />
            <input value={q} onChange={e => setQ(e.target.value)} placeholder="例: リハビリパンツ／陽明会／白十字"
              className="h-11 pl-10 pr-3 rounded-xl border-2 border-sky-200 text-sm w-full bg-white shadow-sm focus:border-sky-400 focus:outline-none transition font-bold text-slate-700 placeholder:font-normal placeholder:text-slate-400" />
          </div>
          <div className="flex items-center gap-1.5">
            <select value={fromIdx} onChange={e => setFromIdx(e.target.value)}
              className="h-11 px-2.5 rounded-xl border border-slate-200 bg-white text-xs shadow-sm font-bold text-slate-600">
              <option value="">期間：全て</option>
              {monthsAll.map(i => <option key={i} value={i}>{idxLabel(i)}〜</option>)}
            </select>
            <span className="text-xs text-slate-500 font-bold">〜</span>
            <select value={toIdx} onChange={e => setToIdx(e.target.value)}
              className="h-11 px-2.5 rounded-xl border border-slate-200 bg-white text-xs shadow-sm font-bold text-slate-600">
              <option value="">最新まで</option>
              {monthsAll.map(i => <option key={i} value={i}>{idxLabel(i)}</option>)}
            </select>
          </div>
          {q.trim() && (
            <>
              <button onClick={handlePrint}
                className="bg-white hover:bg-slate-50 active:scale-[.98] text-slate-700 border border-slate-200 px-4 py-2.5 rounded-xl shadow-sm text-sm font-bold transition inline-flex items-center gap-1.5">
                <Printer size={15} /> 印刷
              </button>
              <button onClick={handleCsv}
                className="bg-teal-600 hover:bg-teal-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-sm shadow-teal-200 text-sm font-bold transition inline-flex items-center gap-1.5">
                <FileSpreadsheet size={15} /> CSV出力
              </button>
            </>
          )}
        </div>
        <div className="text-[10px] text-slate-500 mt-2">施設・個人を問わず、取り込んだCSVの全取引が検索対象です。列見出しをクリックすると並び替えできます</div>
      </Card>

      {!q.trim() ? (
        <Card className="px-6 py-14 text-center">
          <span className="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-sky-50 text-sky-500 mb-3"><Search size={26} /></span>
          <div className="font-extrabold text-slate-700">商品名・施設名・仕入先名で検索してください</div>
          <div className="text-xs text-slate-500 mt-1.5 leading-relaxed">
            商品名で検索すると、その商品のすべての販売履歴と仕入・販売金額の集計が確認できます。
          </div>
        </Card>
      ) : (
        <>
          <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
            <KpiCard icon={Package} tint="bg-sky-50 text-sky-600" label="該当件数" value={num(summary.count) + '件'} />
            <KpiCard icon={ClipboardList} tint="bg-slate-100 text-slate-600" label="数量合計" value={summary.mixedUnit ? '単位混在' : num(summary.qty)}
              note={summary.mixedUnit ? '単位の違う明細は合計しません' : undefined} />
            <KpiCard icon={JapaneseYen} tint="bg-blue-50 text-blue-600" label="販売金額合計" value={yen(summary.sales)} />
            <KpiCard icon={Coins} tint="bg-amber-50 text-amber-600" label="仕入金額合計" value={yen(summary.cost)} />
            <KpiCard icon={Percent} tint="bg-emerald-50 text-emerald-600" label="粗利額（粗利率）" value={summary.grossUnknown ? '未確定' : yen(summary.gross)}
              note={summary.grossUnknown ? '粗利額のない明細 ' + num(summary.grossUnknown) + '件' : summary.rate + '%'} />
          </div>

          <Card className="overflow-x-auto">
            <table className="w-full text-sm min-w-[960px]">
              <thead>
                <tr className="text-[11px] uppercase tracking-wide text-slate-500 border-b border-slate-100">
                  <Th k="date" className="text-left font-bold px-5 py-3">日付</Th>
                  <Th k="customer" className="text-left font-bold px-2 py-3">お客様名</Th>
                  <Th k="rep" className="text-left font-bold px-2 py-3">担当</Th>
                  <Th k="product" className="text-left font-bold px-2 py-3">商品名</Th>
                  <Th k="qty" className="text-right font-bold px-2 py-3 pr-4">数量</Th>
                  <Th k="price" className="text-right font-bold px-2 py-3 pr-4">販売単価</Th>
                  <Th k="amount" className="text-right font-bold px-2 py-3 pr-4">金額</Th>
                  <Th k="costPrice" className="text-right font-bold px-2 py-3 pr-4">仕入単価</Th>
                  <Th k="cost" className="text-right font-bold px-2 py-3 pr-4">仕入金額</Th>
                  <Th k="gross" className="text-right font-bold px-2 py-3 pr-4">粗利額</Th>
                  <Th k="marginPct" className="text-right font-bold px-5 py-3">利益率</Th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-50">
                {visible.map((r, i) => {
                  const amount = +r[7] || 0, gross = +r[8] || 0;
                  const grossNull = r[8] === null || r[8] === undefined;
                  const marginPct = amount > 0 && !grossNull ? Math.round(gross / amount * 1000) / 10 : null;
                  return (
                  <tr key={i} className="hover:bg-sky-50/50 transition">
                    <td className="px-5 py-2.5 text-slate-600 tabular-nums whitespace-nowrap">{r[1]}</td>
                    <td className="px-2 py-2.5 text-slate-700 font-bold">
                      {r[2]}
                      {custType(r[2]) && (
                        <span className={"ml-1.5 text-[9px] font-bold px-1.5 py-0.5 rounded-full " +
                          (custType(r[2]) === '施設' ? 'bg-sky-100 text-sky-700' : 'bg-slate-100 text-slate-600')}>{custType(r[2])}</span>
                      )}
                    </td>
                    <td className="px-2 py-2.5 text-xs text-slate-600">{repOf(r[2]) || '—'}</td>
                    <td className="px-2 py-2.5 text-slate-700">{r[3]}</td>
                    <td className="px-2 py-2.5 pr-4 text-right tabular-nums text-slate-700">{num(r[4])}<span className="text-[10px] text-slate-500 ml-0.5">{r[5]}</span></td>
                    <td className="px-2 py-2.5 pr-4 text-right tabular-nums text-slate-700">{yen(r[6])}</td>
                    <td className="px-2 py-2.5 pr-4 text-right tabular-nums font-bold text-slate-800">{yen(r[7])}</td>
                    <td className="px-2 py-2.5 pr-4 text-right tabular-nums text-slate-600">{(+r[10] || 0) > 0 ? yen(r[10]) : '—'}</td>
                    <td className="px-2 py-2.5 pr-4 text-right tabular-nums text-slate-600">{(+r[10] || 0) > 0 ? yen((+r[4] || 0) * (+r[10] || 0)) : '—'}</td>
                    <td className="px-2 py-2.5 pr-4 text-right tabular-nums font-bold text-slate-700">{grossNull ? <span className="text-amber-700 text-xs">未取得</span> : yen(r[8])}</td>
                    <td className={"px-5 py-2.5 text-right tabular-nums font-bold " + (marginPct === null ? 'text-slate-400' : marginPct < 0 ? 'text-rose-600' : 'text-emerald-600')}>{marginPct === null ? '—' : marginPct + '%'}</td>
                  </tr>
                  );
                })}
                {visible.length === 0 && (
                  <tr><td colSpan={11} className="px-5 py-10 text-center text-sm text-slate-500">「{q}」に一致する取引はありません</td></tr>
                )}
              </tbody>
            </table>
            {matched.length > visible.length && (
              <div className="px-5 py-2.5 text-[11px] text-slate-500 border-t border-slate-50">並び替え済み{num(visible.length)}件を表示中（全{num(matched.length)}件）— 印刷・CSV出力は全件が対象です</div>
            )}
          </Card>
        </>
      )}
    </div>
  );
}

/* ============================================================
   画面: ターゲット先進捗確認
   - 担当ごとにターゲット施設（新規開拓・深耕したい先）を登録し、
     提案商品（既存の売上商品マスタから選択）・進捗ステータス・次のアクションを管理する
============================================================ */
const TARGET_STATUSES = ['未着手', 'アプローチ中', '提案済み', '商談中', '成約', '見送り'];
const TARGET_STATUS_STYLE = {
  '未着手': 'bg-slate-100 text-slate-600',
  'アプローチ中': 'bg-sky-100 text-sky-700',
  '提案済み': 'bg-amber-100 text-amber-700',
  '商談中': 'bg-indigo-100 text-indigo-700',
  '成約': 'bg-emerald-100 text-emerald-700',
  '見送り': 'bg-rose-100 text-rose-700',
};

function TargetsView({ data, masters, targets, setTargets, showToast, jumpToFacility }) {
  const reps = masters.settings.reps || [];
  // 絞り込み用の担当一覧：マスタ登録済みの担当に加え、自由入力で登録されたターゲット先の担当名も含める
  const filterReps = useMemo(() =>
    [...new Set([...reps, ...targets.map(t => t.rep).filter(Boolean)])].sort((a, b) => a.localeCompare(b, 'ja')),
    [reps, targets]);
  const [repFilter, setRepFilter] = useState(() => loadStorage(K.LAST_TARGET_REP, ''));
  useDebouncedSave(K.LAST_TARGET_REP, repFilter, null);

  const [newFacility, setNewFacility] = useState('');
  const [newRep, setNewRep] = useState('');
  useEffect(() => { setNewRep(prev => prev || repFilter || reps[0] || ''); }, [repFilter, reps]);
  const [facSuggestOpen, setFacSuggestOpen] = useState(false);
  const [facPickerOpen, setFacPickerOpen] = useState(false);
  const [facPickerQuery, setFacPickerQuery] = useState('');
  const facBoxRef = useRef(null);
  const facNames = useMemo(() =>
    data.facilities.slice().sort((a, b) => (b.sales || 0) - (a.sales || 0)).map(f => f.name), [data]);
  const facSuggests = useMemo(() => {
    const q = normalizeSearchText(newFacility.trim());
    if (!q) return [];
    return facNames.filter(n => normalizeSearchText(n).includes(q)).slice(0, 8);
  }, [facNames, newFacility]);
  const facPickerResults = useMemo(() =>
    facNames.filter(n => normalizeSearchText(n).includes(normalizeSearchText(facPickerQuery.trim()))).slice(0, 200),
    [facNames, facPickerQuery]);
  useEffect(() => {
    if (!facSuggestOpen) return;
    const h = (e) => { if (facBoxRef.current && !facBoxRef.current.contains(e.target)) setFacSuggestOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [facSuggestOpen]);

  // 並び順は登録日(createdAt)の新しい順。updatedAt順にすると、メモを1文字打つたびに
  // updatedAtが更新されてカードが先頭へ飛び、入力欄からフォーカスが外れて続きが打てなくなる。
  const visibleTargets = useMemo(() => {
    let list = targets.slice();
    if (repFilter) list = list.filter(t => t.rep === repFilter);
    return list.sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
  }, [targets, repFilter]);

  const addTarget = () => {
    const name = newFacility.trim();
    if (!name) { showToast('施設名を入力してください', 'error'); return; }
    if (!newRep.trim()) { showToast('担当者を選択してください', 'error'); return; }
    if (targets.some(t => t.rep === newRep && t.facility === name)) { showToast('すでに登録されているターゲット先です', 'error'); return; }
    const now = new Date().toISOString();
    const rec = { id: 'target-' + Date.now(), rep: newRep, facility: name, status: '未着手', proposedProducts: [], memo: '', nextAction: '', nextActionDate: '', createdAt: now, updatedAt: now };
    setTargets(prev => [...prev, rec]);
    setNewFacility('');
    setFacSuggestOpen(false);
    showToast('「' + name + '」をターゲット先に追加しました');
  };
  const patchTarget = (id, patch) => setTargets(prev => prev.map(t => t.id === id ? { ...t, ...patch, updatedAt: new Date().toISOString() } : t));
  const removeTarget = (id) => { if (!window.confirm('このターゲット先を削除しますか？')) return; setTargets(prev => prev.filter(t => t.id !== id)); showToast('削除しました'); };

  return (
    <div className="space-y-4">
      <Card className="px-5 py-4 space-y-3">
        <div className="text-sm font-bold text-slate-800">ターゲット先を追加</div>
        <div className="flex items-end gap-2 flex-wrap">
          <label className="flex flex-col gap-1 text-xs font-bold text-slate-600">
            担当
            <input value={newRep} onChange={e => setNewRep(e.target.value)} list="target-rep-list"
              placeholder="担当者名"
              className="h-10 px-3 rounded-lg border border-slate-200 bg-white text-sm shadow-sm font-bold text-slate-700 focus:border-sky-400 focus:outline-none w-36" />
            <datalist id="target-rep-list">
              {reps.map(r => <option key={r} value={r} />)}
            </datalist>
          </label>
          <div className="relative flex flex-col gap-1 text-xs font-bold text-slate-600" ref={facBoxRef}>
            施設名
            <input value={newFacility} onChange={e => { setNewFacility(e.target.value); setFacSuggestOpen(true); }}
              onFocus={() => setFacSuggestOpen(true)}
              onKeyDown={e => { if (e.key === 'Enter') addTarget(); if (e.key === 'Escape') setFacSuggestOpen(false); }}
              placeholder="施設名を入力（新規施設も可）"
              className="h-10 px-3 rounded-lg border border-slate-200 bg-white text-sm shadow-sm font-bold text-slate-700 focus:border-sky-400 focus:outline-none w-64" />
            {facSuggestOpen && facSuggests.length > 0 && (
              <div className="absolute z-30 top-full left-0 mt-1.5 w-64 bg-white rounded-xl border border-slate-200 shadow-xl overflow-hidden">
                {facSuggests.map(n => (
                  <button key={n} type="button" onMouseDown={e => e.preventDefault()}
                    onClick={() => { setNewFacility(n); setFacSuggestOpen(false); }}
                    className="w-full text-left px-4 py-2.5 hover:bg-sky-50 transition text-xs font-bold text-slate-700 truncate border-b border-slate-50 last:border-0">
                    {n}
                  </button>
                ))}
              </div>
            )}
          </div>
          <button type="button" onClick={() => { setFacPickerOpen(true); setFacPickerQuery(''); }}
            title="既存施設の一覧から選ぶ"
            className="h-10 px-3 rounded-lg border border-slate-200 bg-white hover:bg-sky-50 hover:border-sky-300 active:scale-[.98] text-slate-600 hover:text-sky-700 text-xs font-bold shadow-sm transition inline-flex items-center gap-1.5">
            <Search size={14} /> 一覧から選ぶ
          </button>
          <button onClick={addTarget}
            className="h-10 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:scale-[.98] text-white text-sm font-bold shadow-sm shadow-emerald-200 transition inline-flex items-center gap-1.5">
            <Plus size={15} /> 追加
          </button>
        </div>
      </Card>

      {facPickerOpen && (
        <div className="fixed inset-0 z-40 bg-slate-600/50 backdrop-blur-sm overflow-auto py-8 px-4 no-print"
          onClick={() => setFacPickerOpen(false)}>
          <div className="max-w-lg mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden" onClick={e => e.stopPropagation()}>
            <div className="px-6 py-4 border-b border-slate-100 flex items-center gap-3 bg-gradient-to-r from-sky-50 to-blue-50">
              <span className="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-sky-100 text-sky-600"><Search size={17} /></span>
              <div className="flex-1">
                <div className="font-bold text-slate-800 text-sm">既存施設から選ぶ</div>
                <div className="text-[11px] text-slate-600">施設名を検索して選んでください</div>
              </div>
              <button onClick={() => setFacPickerOpen(false)} className="text-slate-400 hover:text-slate-600 transition"><X size={18} /></button>
            </div>
            <div className="px-6 py-4">
              <div className="relative">
                <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-600" />
                <input autoFocus value={facPickerQuery} onChange={e => setFacPickerQuery(e.target.value)}
                  placeholder="施設名で検索"
                  className="h-11 pl-9 pr-3 w-full rounded-xl border border-slate-200 text-sm bg-white shadow-sm focus:border-blue-400 focus:outline-none transition" />
              </div>
              <div className="mt-3 max-h-80 overflow-y-auto divide-y divide-slate-50 border border-slate-100 rounded-xl">
                {facPickerResults.map(n => (
                  <button key={n} type="button"
                    onClick={() => { setNewFacility(n); setFacPickerOpen(false); setFacPickerQuery(''); }}
                    className="w-full text-left px-4 py-2.5 hover:bg-sky-50 transition text-xs font-bold text-slate-700 truncate">
                    {n}
                  </button>
                ))}
                {facPickerResults.length === 0 && (
                  <div className="px-4 py-8 text-center text-xs text-slate-600">該当する施設がありません</div>
                )}
              </div>
            </div>
          </div>
        </div>
      )}

      <Card className="px-5 py-4 space-y-3">
        <div className="flex items-center gap-3 flex-wrap">
          <div className="text-sm font-bold text-slate-800">ターゲット先一覧（{visibleTargets.length}件）</div>
          <div className="ml-auto flex items-center gap-2">
            <span className="text-xs font-bold text-slate-600">担当で絞り込み</span>
            <select value={repFilter} onChange={e => setRepFilter(e.target.value)}
              className="h-9 px-3 rounded-lg border border-slate-200 bg-white text-xs font-bold text-slate-700 focus:border-sky-400 focus:outline-none">
              <option value="">すべての担当</option>
              {filterReps.map(r => <option key={r} value={r}>{r}</option>)}
            </select>
          </div>
        </div>

        {visibleTargets.length === 0 && (
          <div className="text-center text-xs text-slate-600 py-10">
            {repFilter ? `「${repFilter}」のターゲット先はまだ登録されていません。` : '上の欄からターゲット先を追加してください。'}
          </div>
        )}

        <div className="space-y-3">
          {visibleTargets.map(t => (
            <TargetCard key={t.id} target={t} data={data} jumpToFacility={jumpToFacility}
              onPatch={patch => patchTarget(t.id, patch)} onRemove={() => removeTarget(t.id)} />
          ))}
        </div>
      </Card>
    </div>
  );
}

function TargetCard({ target, data, jumpToFacility, onPatch, onRemove }) {
  const [prodQuery, setProdQuery] = useState('');
  const [prodCat, setProdCat] = useState('all');
  const [prodPickerOpen, setProdPickerOpen] = useState(false);
  const prodBoxRef = useRef(null);
  useEffect(() => {
    if (!prodPickerOpen) return;
    const h = (e) => { if (prodBoxRef.current && !prodBoxRef.current.contains(e.target)) setProdPickerOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [prodPickerOpen]);
  const already = useMemo(() => new Set((target.proposedProducts || []).map(p => p.name)), [target.proposedProducts]);
  const prodResults = useMemo(() => {
    const q = normalizeSearchText(prodQuery.trim());
    let list = data.products.filter(p => !already.has(p.name));
    if (prodCat !== 'all') list = list.filter(p => p.cat === prodCat);
    if (q) list = list.filter(p => normalizeSearchText(p.name).includes(q));
    return list.slice().sort((a, b) => (b.winSales || 0) - (a.winSales || 0)).slice(0, 50);
  }, [data, prodQuery, prodCat, already]);
  const isExistingFacility = data.facByName.has(target.facility);

  const addProduct = (p) => {
    onPatch({ proposedProducts: [...(target.proposedProducts || []), { name: p.name, cat: p.cat }] });
    setProdQuery('');
    setProdPickerOpen(false);
  };
  const removeProduct = (name) => onPatch({ proposedProducts: (target.proposedProducts || []).filter(p => p.name !== name) });

  return (
    <div className="border border-slate-100 rounded-2xl p-4 bg-slate-50/50">
      <div className="flex items-start gap-3 flex-wrap">
        <div className="flex-1 min-w-[220px]">
          {isExistingFacility ? (
            <button type="button" onClick={() => jumpToFacility && jumpToFacility(target.facility)}
              title="施設情報を開く"
              className="font-extrabold text-base text-sky-700 hover:text-sky-900 hover:underline decoration-2 underline-offset-2 transition text-left">
              {target.facility}
            </button>
          ) : (
            <div className="font-extrabold text-base text-slate-900">
              {target.facility}
              <span className="ml-1.5 align-middle bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2 py-0.5 rounded-full">新規</span>
            </div>
          )}
          <div className="text-xs font-bold text-slate-500 mt-0.5">担当：{target.rep || '未設定'}　登録日：{stampToLocalDate(target.createdAt)}</div>
        </div>
        <select value={target.status} onChange={e => onPatch({ status: e.target.value })}
          className={`text-xs font-bold px-3 py-1.5 rounded-full border-0 outline-none ${TARGET_STATUS_STYLE[target.status] || 'bg-slate-100 text-slate-600'}`}>
          {TARGET_STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
        </select>
        <button onClick={onRemove} className="text-slate-400 hover:text-rose-500 transition"><Trash2 size={16} /></button>
      </div>

      <div className="mt-3">
        <div className="text-xs font-bold text-slate-600 mb-1.5">提案商品</div>
        <div className="flex items-center gap-1.5 flex-wrap">
          {(target.proposedProducts || []).map(p => (
            <span key={p.name} className="inline-flex items-center gap-1.5 bg-sky-100 text-sky-700 text-xs font-bold px-2.5 py-1 rounded-full">
              {p.name}
              <button onClick={() => removeProduct(p.name)} className="hover:text-rose-600 transition"><X size={12} /></button>
            </span>
          ))}
          <div className="relative" ref={prodBoxRef}>
            <button type="button" onClick={() => setProdPickerOpen(o => !o)}
              className="inline-flex items-center gap-1 text-xs font-bold text-sky-600 hover:text-sky-800 border border-dashed border-sky-300 rounded-full px-2.5 py-1 transition">
              <Plus size={12} /> 商品を追加
            </button>
            {prodPickerOpen && (
              <div className="absolute z-30 top-full left-0 mt-1.5 w-80 bg-white rounded-xl border border-slate-200 shadow-xl overflow-hidden">
                <div className="p-2 border-b border-slate-100 space-y-1.5">
                  <input autoFocus value={prodQuery} onChange={e => setProdQuery(e.target.value)} placeholder="商品名で検索"
                    className="w-full h-9 px-2.5 rounded-lg border border-slate-200 text-xs outline-none focus:border-sky-400" />
                  <select value={prodCat} onChange={e => setProdCat(e.target.value)}
                    className="w-full h-9 px-2 rounded-lg border border-slate-200 bg-white text-xs font-bold text-slate-600 outline-none focus:border-sky-400">
                    <option value="all">すべての分類</option>
                    {CATEGORY_NAMES.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                <div className="max-h-56 overflow-y-auto">
                  {prodResults.map(p => (
                    <button key={p.name} type="button" onClick={() => addProduct(p)}
                      className="w-full text-left px-3 py-2 hover:bg-sky-50 transition text-xs font-bold text-slate-700 truncate border-b border-slate-50 last:border-0">
                      {p.name}<span className="text-slate-400 font-normal ml-1.5">{p.cat}</span>
                    </button>
                  ))}
                  {prodResults.length === 0 && <div className="px-3 py-6 text-center text-xs text-slate-500">該当する商品がありません</div>}
                </div>
              </div>
            )}
          </div>
        </div>
      </div>

      <div className="mt-3 grid md:grid-cols-2 gap-3">
        <label className="flex flex-col gap-1 text-xs font-bold text-slate-600">
          メモ
          <textarea value={target.memo || ''} onChange={e => onPatch({ memo: e.target.value })} rows={2}
            placeholder="商談の状況・課題など"
            className="w-full rounded-lg border border-slate-200 p-2.5 text-xs resize-y focus:border-sky-400 focus:outline-none transition leading-relaxed bg-white" />
        </label>
        <div className="flex flex-col gap-1 text-xs font-bold text-slate-600">
          次のアクション
          <div className="flex items-center gap-2">
            <input value={target.nextAction || ''} onChange={e => onPatch({ nextAction: e.target.value })}
              placeholder="例：サンプル提案、再訪問"
              className="flex-1 h-9 px-2.5 rounded-lg border border-slate-200 text-xs font-bold text-slate-700 outline-none focus:border-sky-400 bg-white" />
            <input type="date" value={target.nextActionDate || ''} onChange={e => onPatch({ nextActionDate: e.target.value })}
              className="h-9 px-2.5 rounded-lg border border-slate-200 text-xs font-bold text-slate-700 outline-none focus:border-sky-400 tabular-nums bg-white" />
          </div>
        </div>
      </div>
    </div>
  );
}

  { id: 'rep', label: '担当別', icon: Users, sub: '担当者ごとの数字とアラート' },

  { id: 'prod', label: '売上管理・商品検索', icon: Package, sub: '商品名・施設名・仕入先の横断検索と、分類別の動き・粗利率チェック' },

function App() {
  const [tab, setTab] = useState('dash');
  const [rows, setRows] = useState(() => loadStorage(K.ROWS, []));
  const [masters, setMasters] = useState(() => {
    const loaded = normalizeMasters(loadStorage(K.MASTERS, null));
    if (!loaded.settings.office) {
      const portalOffice = portalSessionOffice();
      if (portalOffice) loaded.settings.office = portalOffice;
    }
    return loaded;
  });
  const [meta, setMeta] = useState(() => loadStorage(K.META, { schema: 1 }));
  const [docs, setDocs] = useState(() => {
    const v = loadStorage(K.DOCS, []);
    return Array.isArray(v) ? v : [];
  });
  const [targets, setTargets] = useState(() => {
    const v = loadStorage(K.TARGETS, []);
    return Array.isArray(v) ? v : [];
  });
  const [baseSel, setBaseSel] = useState(null);
  const [openFacId, setOpenFacId] = useState(null);
  const [repFilter, setRepFilter] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [printHtml, setPrintHtml] = useState(null);
  // 発注書 / 見積書 / 価格改定 の作成中ドラフト。
  // タブ移動だけでなくリロードでも消えないよう localStorage に保持する
  // （20品目入力した状態で誤ってF5を押しても失わないため）。
  // 既定値を先に展開しているのは、後から増えた表示フラグが欠けた古いドラフトを補完するため。
  const restoreDraft = (key, make) => {
    const base = make();
    const saved = loadStorage(key, null);
    return (saved && typeof saved === 'object' && Array.isArray(saved.items)) ? { ...base, ...saved } : base;
  };
  const [orderDraft, setOrderDraft] = useState(() => restoreDraft(K.DRAFT_ORDER, () => newDocDraft('order', '')));
  const [quoteDraft, setQuoteDraft] = useState(() => restoreDraft(K.DRAFT_QUOTE, () => newDocDraft('quote', '')));
  const [priceRevisionDraft, setPriceRevisionDraft] = useState(() => restoreDraft(K.DRAFT_PRICEREV, newPriceRevisionDraft));
  const toastId = useRef(0);

  const showToast = useCallback((msg, type, dur) => {
    const id = ++toastId.current;
    // 同じ文言のトーストが残っていれば積み上げずに置き換える（連打対策）
    setToasts(t => [...t.filter(x => x.msg !== msg), { id, msg, type: type || 'success' }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), dur || 3500);
  }, []);

  // 保存は500msのデバウンス付き。メモ欄などは1文字打つたびに状態が変わるので、
  // 即時保存だと打鍵ごとに JSON.stringify + localStorage.setItem が走る（明細が数MBあると重い）。
  // 入力が止まってからまとめて書く。失敗（容量超過）は案内を出す。
  useDebouncedSave(K.ROWS, rows, showToast);
  useDebouncedSave(K.MASTERS, masters, showToast);
  useDebouncedSave(K.META, meta, null);
  useDebouncedSave(K.DOCS, docs, showToast);
  useDebouncedSave(K.TARGETS, targets, showToast);
  // 作成中ドラフトも保存。容量超過の案内はここでは出さない（明細本体の保存で案内済み）
  useDebouncedSave(K.DRAFT_ORDER, orderDraft, null);
  useDebouncedSave(K.DRAFT_QUOTE, quoteDraft, null);
  useDebouncedSave(K.DRAFT_PRICEREV, priceRevisionDraft, null);

  // 集計索引（基準月 = データ内最新月。ヘッダーで変更可）
  const data = useMemo(() => buildAnalytics(rows, masters, baseSel), [rows, masters, baseSel]);
  const monthsDesc = useMemo(() => data.monthsAll.slice().reverse(), [data]);

  const jumpToFacility = useCallback((name) => {
    setRepFilter(null);
    setOpenFacId(name);
    setTab('fac');
  }, []);
  const goFacilities = useCallback((rep) => {
    setRepFilter(rep);
    setOpenFacId(null);
    setTab('fac');
  }, []);
  // 施設別画面から発注書/見積書の作成へ（施設をセットして移動）
  // 施設別画面の「発注書を作成 / 見積書を作成」から呼ばれる。
  // 別の施設に切り替えるときは下書きを作り直すことになるが、未保存の明細が入っていたら
  // 黙って捨てず確認する（20品目入力したあと別施設を開いて全部消える事故を防ぐ）。
  const startDoc = useCallback((type, facName) => {
    const draft = type === 'quote' ? quoteDraft : orderDraft;
    const setter = type === 'quote' ? setQuoteDraft : setOrderDraft;
    if (draft.facility !== facName) {
      const n = draft.items.filter(it => !it.isSpacer).length;
      if (!draft.id && n > 0 &&
          !window.confirm('作成中の「' + (draft.facility || '未入力') + '」の明細 ' + n + '品目が破棄されます。よろしいですか？')) return;
      setter(newDocDraft(type, facName));
    }
    setTab(type);
  }, [orderDraft, quoteDraft]);
  const setOffice = useCallback((name) => {
    setMasters(prev => ({ ...prev, settings: { ...prev.settings, office: name } }));
  }, []);

  // 画面のプレビューは contenteditable で直接手直しできる。実際に印刷されるのは
  // #print-content-holder 側の別コピーなので、印刷直前にプレビューの現在のDOMを
  // そのまま写し取る。これをしないと手直しが黙って捨てられて元の文面が印刷される。
  // あわせて、行数が多い帳票（data-fit-page付き）をA4 1ページに収まるよう自動縮小する。
  const syncPrintHolder = useCallback(() => {
    const holder = document.getElementById('print-content-holder');
    const preview = document.querySelector('.print-preview-doc');
    if (!holder || !preview) return;
    holder.innerHTML = preview.innerHTML;
    const holderDoc = holder.querySelector('[data-fit-page="1"]');
    if (!holderDoc) return;
    holderDoc.style.zoom = '';
    // 高さは可視のプレビュー側で測る（holder側は display:none で測れないため）
    const previewDoc = preview.querySelector('[data-fit-page="1"]');
    const naturalH = (previewDoc || holderDoc).getBoundingClientRect().height;
    const pageH = 297 * (96 / 25.4);
    if (naturalH - pageH > 4) {
      // 何ページ分あっても必ず1ページに収める（下限は極端な事故防止のみ）
      holderDoc.style.zoom = String(Math.max(0.25, pageH / naturalH));
    }
  }, []);

  useEffect(() => {
    const holder = document.getElementById('print-content-holder');
    if (!printHtml) { holder.innerHTML = ''; return; }
    holder.innerHTML = printHtml;   // 保険。実際の印刷前に syncPrintHolder で上書きされる
    return () => { holder.innerHTML = ''; };
  }, [printHtml]);

  const current = TABS.find(t => t.id === tab);
  const labelOf = (t) => (masters.settings.tabLabels && masters.settings.tabLabels[t.id]) || t.label;
  const needData = data.empty && ['dash', 'fac', 'rep', 'reform', 'prod', 'stock', 'lookup'].includes(tab);
  const office = officeByName(masters.settings.office);

  // 営業所が未選択なら、まず選んでもらう（初回のみ）
  if (!office) return <OfficePicker onPick={setOffice} />;

  return (
    <div className="min-h-screen">
      {/* サイドバー（md以上）: 白×空色のさわやか配色 */}
      <aside className="hidden md:flex w-56 bg-gradient-to-b from-cyan-50 via-sky-50 to-white border-r border-sky-100 flex-col fixed inset-y-0 left-0 z-30">
        {/* 業務アプリポータルへ戻るボタンは左上（広い画面は左の列のいちばん上、スマホは見出しのいちばん上。全アプリ共通の形 .taiyo-portal-back。
            ユーザーの指示「太陽ポータルに戻るボタンは左上に設置。太陽ポータル全アプリ共通にする。色や大きさも含めて統一する」2026-10-28。前は見出しの上の小さな灰色の文字） */}
        <div className="px-2.5 pt-4">{/* 左の列の幅（224px）にボタン（201px）が収まるよう、左右の余白は少なめ */}
          <a href="https://akamar08taiyo-bot.github.io/taiyo-portal/" className="taiyo-portal-back">← 業務アプリポータルへ戻る</a>
        </div>
        <div className="px-4 py-5 flex items-center gap-2.5">
          <span className="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-gradient-to-br from-amber-300 to-orange-400 shadow-lg shadow-amber-200">
            <Sun size={18} className="text-white" />
          </span>
          <div className="min-w-0">
            <div className="text-slate-800 font-extrabold text-sm leading-tight">売上分析</div>
            <div className="text-sky-500/80 text-[10px] font-bold truncate">{office.name}</div>
          </div>
        </div>
        <nav className="flex-1 px-3 mt-2 space-y-1">
          {TABS.map(t => {
            const Icon = t.icon;
            const active = tab === t.id;
            return (
              <button key={t.id} onClick={() => setTab(t.id)}
                className={"w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm font-bold transition " +
                  (active ? 'bg-sky-500 text-white shadow-lg shadow-sky-200' : 'text-slate-700 hover:bg-sky-100/70 hover:text-sky-800')}>
                <Icon size={16} className="shrink-0" />
                <span className="flex-1 text-left">{labelOf(t)}</span>
              </button>
            );
          })}
        </nav>
      </aside>

      {/* メイン */}
      <div className="md:pl-56">
        {/* ヘッダー */}
        <header className="bg-white/80 backdrop-blur-md border-b border-slate-200/70 sticky top-0 z-20">
          <div className="md:hidden px-5 pt-3">
            <a href="https://akamar08taiyo-bot.github.io/taiyo-portal/" className="taiyo-portal-back">← 業務アプリポータルへ戻る</a>
          </div>
          {/* 取込ボタンと基準月は画面上部の中央に大きく出す。
              横幅1280px以上は「ページ名｜ボタンと基準月｜空き」の3列で、ボタンと基準月をちょうど真ん中に置く。
              それより狭い画面ではページ名の下の行に中央そろえで並べる（1024px前後で3列にするとページ名が切れる。
              スマホでは2つを横幅いっぱいに） */}
          {/* 中央の基準は、下の中身（main）と同じ最大幅の中の真ん中。広い画面でも中身のカードの真上に来る */}
          <div className={"px-5 md:px-8 py-4 flex flex-wrap items-center gap-3 xl:grid xl:grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)] xl:gap-6 " +
            (['order', 'quote', 'pricerevision'].includes(tab) ? 'max-w-[100rem]' : 'max-w-6xl')}>
            <div className="flex items-center gap-3 min-w-0 flex-1">
              <div className="md:hidden inline-flex items-center justify-center w-8 h-8 rounded-lg bg-gradient-to-br from-amber-400 to-orange-500 shrink-0">
                <Sun size={16} className="text-white" />
              </div>
              <div className="min-w-0">
                <h1 className="font-extrabold text-slate-800 text-lg leading-tight truncate">{labelOf(current)}</h1>
                <div className="text-[11px] text-slate-600 truncate">{current.sub}</div>
              </div>
            </div>
            <div className="flex gap-3 w-full xl:w-auto justify-center">
            {tab !== 'import' && (
              <button onClick={() => setTab('import')}
                className="h-12 px-4 sm:px-6 rounded-2xl border-2 border-emerald-400 bg-white hover:bg-emerald-50 hover:border-emerald-500 active:scale-[.98] text-emerald-700 text-base shadow-md font-extrabold shrink-0 justify-center transition inline-flex items-center gap-2 whitespace-nowrap">
                <FileUp size={18} /> <span><span className="hidden sm:inline">最新データを</span>取り込む</span>
              </button>
            )}
            {monthsDesc.length > 0 && (
              // 「基準月」は選択欄の外の見出しにする（中に入れるとスマホ幅で月の部分が切れる）。スマホ幅では見出しを省く
              <label className="flex items-center gap-2 flex-1 min-w-0 sm:flex-none">
                <span className="hidden sm:inline text-base font-extrabold text-slate-600 whitespace-nowrap">基準月</span>
                <select value={data.baseIdx} onChange={e => setBaseSel(+e.target.value)} aria-label="基準月"
                  className="h-12 px-4 rounded-2xl border-2 border-slate-300 bg-white text-base shadow-md font-extrabold text-slate-700 w-full min-w-0 sm:w-auto">
                  {monthsDesc.map(idx => (
                    <option key={idx} value={idx}>{idxLabel(idx)}{data.thinLatest && idx === data.thinLatest.idx ? '（明細わずか）' : idx === data.maxIdx ? '（最新）' : ''}</option>
                  ))}
                </select>
              </label>
            )}
            </div>
            <div className="hidden xl:block" />
          </div>
          {/* モバイル用タブ */}
          <nav className="md:hidden px-3 pb-2 flex gap-1 overflow-x-auto">
            {TABS.map(t => {
              const Icon = t.icon;
              const active = tab === t.id;
              return (
                <button key={t.id} onClick={() => setTab(t.id)}
                  className={"inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition " +
                    (active ? 'bg-sky-500 text-white shadow-sm' : 'text-slate-700 bg-white border border-sky-100')}>
                  <Icon size={13} /> {labelOf(t)}
                </button>
              );
            })}
          </nav>
        </header>

        <main className={"px-5 md:px-8 py-6 " + (['order', 'quote', 'pricerevision'].includes(tab) ? 'max-w-[100rem]' : 'max-w-6xl')}>
          {needData ? <EmptyState goImport={() => setTab('import')} /> : (
            <>
              {['dash', 'fac', 'factrend', 'rep', 'prod', 'stock'].includes(tab) && <ThinMonthNote data={data} className="mb-4" />}
              {tab === 'dash' && <DashboardView data={data} rows={rows} masters={masters} meta={meta} jumpToFacility={jumpToFacility} openPrint={setPrintHtml} office={masters.settings.office} showToast={showToast} goTab={setTab} />}
              {tab === 'fac' && <FacilitiesView data={data} openId={openFacId} setOpenId={setOpenFacId} repFilter={repFilter} setRepFilter={setRepFilter} showToast={showToast} openPrint={setPrintHtml} startDoc={startDoc} office={masters.settings.office} />}
              {tab === 'factrend' && <FacilityTrendView data={data} jumpToFacility={jumpToFacility} showToast={showToast} />}
              {tab === 'rep' && <RepsView data={data} goFacilities={goFacilities} />}
              {tab === 'reform' && <ReformView data={data} rows={rows} masters={masters} setMasters={setMasters} showToast={showToast} />}
              {tab === 'prod' && <ProductsView data={data} rows={rows} masters={masters} setMasters={setMasters} showToast={showToast} openPrint={setPrintHtml} />}
              {tab === 'stock' && <StockView data={data} masters={masters} setMasters={setMasters} showToast={showToast} openPrint={setPrintHtml} />}
              {tab === 'order' && <DocComposer docType="order" data={data} masters={masters} draft={orderDraft} setDraft={setOrderDraft} docs={docs} setDocs={setDocs} showToast={showToast} openPrint={setPrintHtml} goImport={() => setTab('import')} />}
              {tab === 'quote' && <DocComposer docType="quote" data={data} masters={masters} draft={quoteDraft} setDraft={setQuoteDraft} docs={docs} setDocs={setDocs} showToast={showToast} openPrint={setPrintHtml} goImport={() => setTab('import')} />}
              {tab === 'pricerevision' && <PriceRevisionView data={data} masters={masters} draft={priceRevisionDraft} setDraft={setPriceRevisionDraft} docs={docs} setDocs={setDocs} showToast={showToast} openPrint={setPrintHtml} />}
              {tab === 'targets' && <TargetsView data={data} masters={masters} targets={targets} setTargets={setTargets} showToast={showToast} jumpToFacility={jumpToFacility} />}
              {tab === 'import' && <ImportView rows={rows} masters={masters} setRows={setRows} setMasters={setMasters} setMeta={setMeta} docs={docs} setDocs={setDocs} showToast={showToast} data={data} meta={meta} goTab={setTab} />}
              {tab === 'settings' && <SettingsView rows={rows} masters={masters} setRows={setRows} setMasters={setMasters} setOffice={setOffice} meta={meta} setMeta={setMeta} docs={docs} setDocs={setDocs} targets={targets} setTargets={setTargets} data={data} showToast={showToast} />}
            </>
          )}
        </main>
      </div>

      {/* 印刷プレビュー */}
      {printHtml && (
        <div className="fixed inset-0 z-50 bg-slate-600/50 backdrop-blur-sm overflow-auto py-8 no-print">
          <div className="mx-auto" style={{ width: '210mm' }}>
            <div className="flex justify-end gap-2 mb-3 no-print">
              <button onClick={() => { syncPrintHolder(); window.print(); }}
                className="bg-sky-600 hover:bg-sky-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-xl text-sm font-bold transition inline-flex items-center gap-1.5">
                <Printer size={15} /> 印刷する
              </button>
              <button onClick={() => setPrintHtml(null)}
                className="bg-rose-600 hover:bg-rose-700 active:scale-[.98] text-white px-4 py-2.5 rounded-xl shadow-xl text-sm font-bold transition inline-flex items-center gap-1.5">
                <X size={15} /> 閉じる
              </button>
            </div>
            <div className="bg-white shadow-2xl rounded-sm print-preview-doc"
              dangerouslySetInnerHTML={{ __html: printHtml }} />
          </div>
        </div>
      )}

      {/* トースト */}
      <div className="fixed bottom-5 right-5 z-50 space-y-2">
        {toasts.map(t => (
          <div key={t.id} className={"px-4 py-3 rounded-xl shadow-xl text-sm font-bold text-white flex items-center gap-2 max-w-md " +
            (t.type === 'info' ? 'bg-sky-700' : t.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600')}>
            {t.type === 'info' ? <Info size={15} /> : t.type === 'error' ? <AlertTriangle size={15} /> : <CheckCircle2 size={15} />}
            {t.msg}
          </div>
        ))}
      </div>
    </div>
  );
}

/* 初回起動時だけ出る営業所の選択画面（選んだら記憶し、次回以降は出ない） */
function OfficePicker({ onPick }) {
  const [sel, setSel] = useState('');
  const o = officeByName(sel);
  return (
    <div className="min-h-screen flex items-center justify-center p-6 bg-gradient-to-br from-cyan-50 via-sky-50 to-white">
      <div className="bg-white rounded-2xl shadow-xl border border-sky-100 p-7 max-w-lg w-full">
        <div className="flex items-center gap-2.5 mb-1">
          <span className="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-gradient-to-br from-amber-300 to-orange-400 shadow-lg shadow-amber-200">
            <Sun size={20} className="text-white" />
          </span>
          <div>
            <div className="font-extrabold text-slate-800">売上分析ダッシュボード</div>
            <div className="text-[11px] text-sky-500/80 font-bold">太陽シルバーサービス株式会社</div>
          </div>
        </div>
        <div className="mt-5 font-bold text-sm text-slate-700">はじめに、お使いの営業所を選んでください</div>
        <div className="text-xs text-slate-600 mt-1 leading-relaxed">
          見積書・発注書などの帳票に、営業所名・住所・電話番号が自動で入ります。<b className="text-slate-600">次回からこの画面は出ません</b>（設定でいつでも変更できます）。
        </div>
        <select value={sel} onChange={e => setSel(e.target.value)}
          className="mt-4 h-12 w-full px-3 rounded-xl border border-slate-200 bg-white text-sm shadow-sm font-bold text-slate-700 focus:border-blue-400 focus:outline-none">
          <option value="">（営業所を選択してください）</option>
          {OFFICE_MASTER.map(x => <option key={x.name} value={x.name}>{x.name}</option>)}
        </select>
        {o && (
          <div className="mt-3 bg-sky-50/70 border border-sky-100 rounded-xl px-4 py-3 text-xs text-slate-600 leading-relaxed">
            〒{o.zip}　{o.addr}<br />
            TEL：{o.tel}　／　FAX：{o.fax}<br />
            所長：{o.chief}
          </div>
        )}
        <button onClick={() => onPick(sel)} disabled={!o}
          className={"mt-5 w-full px-5 py-3 rounded-xl text-sm font-bold text-white transition " +
            (o ? 'bg-sky-600 hover:bg-sky-700 active:scale-[.98] shadow-sm shadow-sky-200' : 'bg-slate-300 cursor-not-allowed')}>
          この営業所ではじめる
        </button>
      </div>
    </div>
  );
}

/* エラー境界: 万一のエラーでも「データは消えていない」ことを伝える */
class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  render() {
    if (this.state.err) {
      return (
        <div className="min-h-screen flex items-center justify-center p-6">
          <div className="bg-white rounded-2xl shadow-xl border border-rose-100 p-7 max-w-md text-center">
            <AlertTriangle size={32} className="text-rose-500 mx-auto mb-3" />
            <div className="font-bold text-slate-800 mb-2">画面の表示中にエラーが発生しました</div>
            <div className="text-sm text-slate-700 mb-5">保存済みのデータは消えていません。ページを再読み込みしてください。</div>
            <button onClick={() => location.reload()} className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold">再読み込み</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
